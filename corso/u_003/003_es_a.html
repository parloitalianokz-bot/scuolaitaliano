<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lettura e comprensione: Matteo e il suo viaggio ad Almaty, Unità 3." />
  <title>Unità 3 — Lettura e Comprensione · Esercizio A</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #477755; --primary-light: #edf4ed; --primary-dark: #2f5739;
      --accent: #bd694d; --bg-main: #f5f1e7; --card-bg: #fffefa;
      --text: #292d28; --text-muted: #6b7069; --success: #278253;
      --success-bg: #e1f1e5; --border: #e7e5dc;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid rgba(189,105,77,.55); outline-offset: 3px; }
    body {
      min-height: 100vh; margin: 0; padding: 28px 14px; color: var(--text);
      background: linear-gradient(rgba(250,248,241,.88),rgba(250,248,241,.88)),
        url("img/sfondo.jpg") center calc(50% - var(--background-offset,0px)) / cover fixed,
        radial-gradient(ellipse at 50% 0,rgba(255,255,255,.72),transparent 55%), var(--bg-main);
    }
    main { width: min(100%,880px); margin: 0 auto; }
    .top-menu { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
    .top-menu select, .top-menu a {
      min-height: 40px; max-width: 100%; padding: 7px 12px; border: 1px solid #d8e5d8;
      border-radius: 10px; background: var(--card-bg); color: var(--primary-dark); font: inherit; font-size: .9rem; font-weight: 700;
    }
    .top-menu a { display: inline-flex; align-items: center; text-decoration: none; }
    .top-menu a:hover { border-color: var(--primary); background: var(--primary-light); }
    #user-badge { margin-left: auto; color: var(--accent); font-size: .85rem; font-weight: 700; }
    .hero { margin: 8px 0 20px; padding: 26px 18px; border: 1px solid rgba(71,119,85,.13); border-radius: 24px; background: linear-gradient(135deg,rgba(255,254,250,.96),rgba(242,247,239,.94)); text-align: center; box-shadow: 0 12px 32px rgba(43,69,46,.07); }
    .eyebrow { display: inline-block; margin-bottom: 10px; padding: 8px 15px; border-radius: 20px; background: var(--primary-light); color: var(--primary-dark); font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 4px 0; color: var(--primary-dark); font-size: clamp(1.9rem,5vw,2.65rem); letter-spacing: -.04em; line-height: 1.12; }
    .hero-subtitle { margin: 8px 0 0; color: var(--text-muted); }
    .teacher-controls { display: flex; flex-wrap: wrap; gap: 12px; margin: 0 0 14px; padding: 13px 16px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,254,250,.95); }
    .teacher-controls[hidden] { display: none; }
    .assignment-field { display: grid; flex: 1 1 240px; gap: 6px; color: var(--primary-dark); font-size: .88rem; font-weight: 800; }
    .assignment-select { width: 100%; min-height: 40px; max-width: 100%; padding: 7px 12px; border: 1px solid #d8e5d8; border-radius: 10px; background: #fff; color: var(--text); font: inherit; font-size: .9rem; }
    .card { padding: clamp(16px,4vw,30px); border: 1px solid var(--border); border-radius: 24px; background: var(--card-bg); box-shadow: 0 18px 48px rgba(43,69,46,.1); }
    .overall-progress { display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 9px; margin: 0 0 12px; scrollbar-width: thin; }
    .progress-step, .nav-btn, .send-question, .option-btn, .accent-toolbar button { min-height: 40px; padding: 8px 13px; border: 1px solid #d8e5d8; border-radius: 10px; background: #fff; color: var(--primary-dark); font: inherit; font-weight: 700; cursor: pointer; }
    .progress-step { flex: 0 0 36px; min-height: 36px; padding: 4px; }
    .progress-step:hover, .nav-btn:hover:not(:disabled), .option-btn:hover:not(:disabled), .accent-toolbar button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .progress-step[aria-current="step"] { border-color: var(--primary-dark); background: var(--primary-dark); color: #fff; }
    .question-slide { display: none; flex-direction: column; gap: 15px; min-width: 0; padding: clamp(14px,3vw,22px); border: 1px solid var(--border); border-radius: 18px; background: #fff; }
    .question-slide.active { display: flex; }
    .question-heading { display: flex; align-items: flex-start; gap: 10px; color: var(--primary-dark); font-size: 1.08rem; font-weight: 800; line-height: 1.45; }
    .question-number { display: inline-grid; flex: 0 0 36px; width: 36px; height: 36px; place-items: center; border-radius: 12px; background: var(--primary-light); color: var(--primary-dark); }
    .assignment-row { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; padding: 12px; border-radius: 12px; background: var(--primary-light); }
    .assignment-row[hidden] { display: none; }
    .assignment-field select { min-height: 40px; padding: 7px 10px; border: 1.5px solid #d4e1d5; border-radius: 8px; background: #fff; color: var(--text); font: inherit; }
    .question-form-card { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: #f7faf5; }
    .question-form-card label { color: var(--primary-dark); font-size: .92rem; font-weight: 700; }
    .question-input { width: 100%; min-height: 76px; padding: 10px 12px; border: 1.5px solid #d4e1d5; border-radius: 10px; background: #fff; color: var(--text); font: inherit; line-height: 1.5; resize: vertical; }
    .question-input[readonly] { background: #f2f5f1; color: #475569; }
    .accent-toolbar { display: flex; flex-wrap: wrap; gap: 5px; }
    .accent-toolbar button { min-width: 36px; min-height: 32px; padding: 3px 8px; border-radius: 8px; }
    .accent-toolbar button:disabled { cursor: not-allowed; opacity: .5; }
    .question-actions { display: flex; justify-content: flex-end; }
    .send-question { border: 0; background: var(--primary); color: #fff; }
    .send-question:hover:not(:disabled) { background: var(--primary-dark); }
    .send-question:disabled { opacity: .55; cursor: not-allowed; }
    .contributions { display: grid; gap: 8px; }
    .contributions h3 { margin: 0; color: var(--primary-dark); font-size: .98rem; }
    .contribution { padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fbfaf6; }
    .contribution-meta { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: .82rem; font-weight: 700; }
    .contribution-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    .empty-message { margin: 0; color: var(--text-muted); font-size: .9rem; }
    .section-hint { padding-left: 12px; border-left: 3px solid #d5e2d5; color: var(--text); font-size: 1.05rem; font-weight: 700; }
    .options-grid { display: grid; gap: 9px; }
    .option-btn { min-height: 46px; padding: 11px 14px; border-color: #e1e6dd; background: #faf9f5; color: var(--text); text-align: left; }
    .option-btn.selected { border-color: var(--primary-dark); background: #e2ede3; color: var(--primary-dark); font-weight: 800; }
    .option-btn.selected.correct { border-color: #15803d; background: var(--success-bg); color: #17623c; }
    .option-btn.selected.incorrect { border-color: #dc2626; background: #fde8e7; color: #991b1b; }
    .option-btn:disabled { cursor: default; }
    .answer-feedback { min-height: 1.4em; margin: -7px 0 0; font-size: .92rem; font-weight: 800; }
    .answer-feedback.correct { color: var(--success); }
    .answer-feedback.incorrect { color: #dc2626; }
    .status-message { min-height: 1.2em; margin: 10px 0 0; color: var(--primary-dark); font-size: .9rem; font-weight: 700; }
    .slide-navigation { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
    .slide-progress { color: var(--primary-dark); font-size: .9rem; font-weight: 800; text-align: center; }
    .nav-btn:disabled { opacity: .45; cursor: not-allowed; }
    @media (max-width: 600px) { body { padding: 16px 8px; } .assignment-row { grid-template-columns: 1fr; } .slide-navigation { flex-wrap: wrap; } .nav-btn { flex: 1; } #user-badge { flex-basis: 100%; margin-left: 0; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <nav class="top-menu" aria-label="Navigazione Unità 3">
      <a id="home-link" href="../index.html" aria-label="Torna alla pagina iniziale">⌂ Home</a>
      <select id="exercise-menu" aria-label="Vai alla lettura">
        <option value="003_lettura.html">Lettura</option>
        <option value="003_es_a.html" selected>Esercizio A</option>
      </select>
      <span id="user-badge" aria-live="polite"></span>
    </nav>

    <header class="hero">
      <span class="eyebrow">Unità 3 · Lettura e Comprensione</span>
      <h1>Matteo e il suo viaggio ad Almaty</h1>
      <p class="hero-subtitle">A turno, formulate una domanda e scegliete la risposta corretta.</p>
    </header>

    <section class="card" aria-label="Domande dell’esercizio">
      <nav id="exercise-progress" class="overall-progress" aria-label="Vai direttamente alla domanda"></nav>
      <div id="questions-container"></div>
      <nav class="slide-navigation" aria-label="Navigazione delle domande">
        <button id="previous-question" class="nav-btn" type="button">← Precedente</button>
        <span id="question-progress" class="slide-progress" aria-live="polite"></span>
        <button id="next-question" class="nav-btn" type="button">Successiva →</button>
      </nav>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-group-scope.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };
    const questions = [
      { hint: "Matteo", options: ["è kazako", "è italiano"], correct: 1 },
      { hint: "Matteo", options: ["ha trentatré anni", "ha quarantatré anni"], correct: 1 },
      { hint: "Matteo è", options: ["di Genova", "di Milano"], correct: 0 },
      { hint: "Matteo abita", options: ["a Genova", "a Milano"], correct: 1 },
      { hint: "Matteo", options: ["abita da solo", "abita con la famiglia"], correct: 1 },
      { hint: "Matteo", options: ["è commerciante", "è insegnante"], correct: 0 },
      { hint: "Matteo viaggia spesso", options: ["per turismo", "per lavoro"], correct: 1 },
      { hint: "Matteo di solito viaggia", options: ["in aereo o in macchina", "a cavallo o sul cammello"], correct: 0 },
      { hint: "Matteo parla", options: ["italiano e dialetto genovese", "italiano, un po’ di russo"], correct: 1 },
      { hint: "Ad Almaty Matteo abita", options: ["in albergo", "in una yurta"], correct: 0 },
      { hint: "Ad Almaty Matteo mangia", options: ["gli spaghetti al pesto", "il beshbarmak"], correct: 1 },
      { hint: "Ad Almaty, Matteo beve", options: ["il kumys", "il prosecco"], correct: 0 },
      { hint: "Almaty", options: ["è una città piccola", "è una città bella"], correct: 1 },
      { hint: "Gli almatesi", options: ["sono amichevoli", "sono antipatici"], correct: 0 },
      { hint: "Matteo torna a Milano", options: ["oggi", "domani"], correct: 1 }
    ];

    const session = window.parloUnit3Session || {};
    const group = session.group || "";
    const isTeacher = Boolean(session.isTeacher);
    const teacherName = session.teacherName || "Insegnante";
    const userName = isTeacher ? "" : String(session.name || "").trim();
    const identity = isTeacher ? { role: "teacher", name: teacherName } : userName ? { role: "student", name: userName } : null;
    const teacherIdentity = { role: "teacher", name: teacherName };
    const safe = value => String(value || "").replace(/[.#$\/\[\]]/g, "_");
    const safeGroup = safe(group || "sconosciuto");
    const userId = `presence_${Math.random().toString(36).slice(2, 10)}`;
    const databasePath = "esercizi/unita3-scelta-multipla-a";

    const questionsContainer = document.getElementById("questions-container");
    const progressNav = document.getElementById("exercise-progress");
    const previousButton = document.getElementById("previous-question");
    const nextButton = document.getElementById("next-question");
    const progressText = document.getElementById("question-progress");
    const statusMessage = document.getElementById("status-message");
    const userBadge = document.getElementById("user-badge");

    userBadge.textContent = group && group !== "sconosciuto"
      ? `${isTeacher ? "👩‍🏫" : "👤"} ${group}${userName ? ` · ${userName}` : ""}`
      : "Accedi dalla pagina iniziale per associare l’attività al gruppo.";

    function addLoginParams(url) {
      if (group && group !== "sconosciuto") url.searchParams.set("gruppo", group);
      else url.searchParams.delete("gruppo");
      if (userName && !isTeacher) url.searchParams.set("nome", userName);
      else url.searchParams.delete("nome");
      return url;
    }
    document.getElementById("home-link").href = addLoginParams(new URL("../index.html", location.href)).href;
    document.getElementById("exercise-menu").addEventListener("change", event => {
      if (event.target.value) location.href = addLoginParams(new URL(event.target.value, location.href)).href;
    });

    let answersRef = null;
    let activeQuestion = 0;
    let roster = [];
    let presenceData = {};
    let assignments = {};
    let sharedQuestions = {};
    let choices = {};
    let contributions = {};
    let legacyResponses = {};
    const questionCards = [];
    const saveTimers = new Map();

    function assignmentValue(person) {
      return person?.role && person?.name ? JSON.stringify({ role: person.role, name: person.name }) : "";
    }
    function parseAssignment(value) {
      if (!value) return null;
      try {
        const parsed = JSON.parse(value);
        return parsed && ["student", "teacher"].includes(parsed.role) && parsed.name ? parsed : null;
      } catch (_) { return null; }
    }
    function assignedTo(index, role) {
      const target = assignments[index]?.[role];
      return Boolean(identity && target && target.role === identity.role && target.name === identity.name);
    }
    function onlineNames() {
      const names = new Set();
      Object.values(presenceData).forEach(connections => Object.values(connections || {}).forEach(entry => {
        if (entry?.role === "student" && entry.name) names.add(entry.name);
      }));
      return names;
    }
    function orderedRoster() {
      const people = new Map();
      roster.forEach(student => {
        const name = String(student?.nome || "").trim();
        if (name) people.set(name, { role: "student", name });
      });
      onlineNames().forEach(name => people.set(name, { role: "student", name }));
      const online = onlineNames();
      return [...people.values()].sort((a, b) => Number(online.has(b.name)) - Number(online.has(a.name)) || a.name.localeCompare(b.name, "it"));
    }
    function createAccentToolbar(input) {
      const toolbar = document.createElement("div");
      toolbar.className = "accent-toolbar";
      toolbar.setAttribute("role", "group");
      toolbar.setAttribute("aria-label", "Inserisci un carattere italiano");
      ["'", "à", "è", "ì", "ò", "ù", "È"].forEach(character => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = character;
        button.setAttribute("aria-label", `Inserisci ${character === "'" ? "apostrofo" : character}`);
        button.addEventListener("mousedown", event => event.preventDefault());
        button.addEventListener("click", () => {
          if (input.readOnly) return;
          const start = input.selectionStart ?? input.value.length;
          const end = input.selectionEnd ?? start;
          input.setRangeText(character, start, end, "end");
          input.dispatchEvent(new Event("input", { bubbles: true }));
          input.focus();
        });
        toolbar.appendChild(button);
      });
      return toolbar;
    }
    function setStatus(message, isError = false) {
      statusMessage.textContent = message;
      statusMessage.style.color = isError ? "#991b1b" : "var(--primary-dark)";
    }
    function saveSharedQuestion(index, value) {
      if (!answersRef || !assignedTo(index, "question")) return;
      answersRef.child("sharedQuestions").child(String(index)).set(value)
        .catch(() => setStatus("Impossibile sincronizzare la domanda. Controlla la connessione.", true));
    }
    function scheduleQuestionSave(index, value) {
      clearTimeout(saveTimers.get(index));
      saveTimers.set(index, setTimeout(() => {
        saveTimers.delete(index);
        saveSharedQuestion(index, value);
      }, 250));
    }
    function renderContributions(index) {
      const list = questionCards[index].contributionList;
      list.replaceChildren();
      const entries = Object.entries(contributions[index] || {}).map(([id, entry]) => ({
        id, author: entry?.author || entry?.name || "Partecipante", text: String(entry?.text || ""), timestamp: Number(entry?.timestamp) || 0
      })).filter(entry => entry.text.trim());
      if (!entries.length && legacyResponses[index]?.formulatedQuestion) {
        entries.push({ id: "legacy", author: "Partecipante", text: String(legacyResponses[index].formulatedQuestion), timestamp: 0 });
      }
      entries.sort((a, b) => a.timestamp - b.timestamp || a.id.localeCompare(b.id));
      if (!entries.length) {
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent = "Nessuna domanda inviata per questa scheda.";
        list.appendChild(empty);
        return;
      }
      entries.forEach(entry => {
        const article = document.createElement("article");
        article.className = "contribution";
        const meta = document.createElement("span");
        meta.className = "contribution-meta";
        meta.textContent = `${entry.author} · ${entry.timestamp ? new Date(entry.timestamp).toLocaleString("it-IT") : "Data non disponibile"}`;
        const text = document.createElement("div");
        text.className = "contribution-text";
        text.textContent = entry.text;
        article.append(meta, text);
        list.appendChild(article);
      });
    }
    function renderCardState(index) {
      const card = questionCards[index];
      const canAsk = assignedTo(index, "question");
      const canAnswer = assignedTo(index, "answer");
      const savedText = String(sharedQuestions[index] ?? legacyResponses[index]?.formulatedQuestion ?? "");
      if (document.activeElement !== card.questionInput && card.questionInput.value !== savedText) card.questionInput.value = savedText;
      card.questionInput.readOnly = !canAsk;
      card.accentToolbar.querySelectorAll("button").forEach(button => { button.disabled = !canAsk; });
      card.sendButton.disabled = !canAsk || !card.questionInput.value.trim() || !answersRef;
      card.sendButton.title = canAsk ? "Invia una nuova domanda allo storico" : "Il turno di formulazione non è assegnato a te";

      const legacyChoice = legacyResponses[index]?.selectedOption;
      const choice = choices[index] ?? (legacyChoice !== undefined && legacyChoice !== null
        ? { optionIndex: legacyChoice }
        : null);
      card.optionButtons.forEach((button, optionIndex) => {
        const selected = Number(choice?.optionIndex) === optionIndex;
        button.disabled = !canAnswer || !answersRef;
        button.classList.toggle("selected", selected);
        button.classList.toggle("correct", selected && optionIndex === questions[index].correct);
        button.classList.toggle("incorrect", selected && optionIndex !== questions[index].correct);
        button.setAttribute("aria-pressed", String(selected));
      });
      if (choice && Number.isInteger(Number(choice.optionIndex))) {
        const correct = Number(choice.optionIndex) === questions[index].correct;
        card.feedback.textContent = correct ? "✓ Risposta corretta" : "✕ Risposta non corretta.";
        card.feedback.className = `answer-feedback ${correct ? "correct" : "incorrect"}`;
      } else {
        card.feedback.textContent = "";
        card.feedback.className = "answer-feedback";
      }
      card.card.classList.toggle("active", index === activeQuestion);
      renderContributions(index);
    }
    questions.forEach((question, index) => {
      const card = document.createElement("article");
      card.className = "question-slide";
      card.setAttribute("aria-label", `Scheda ${index + 1}`);
      const heading = document.createElement("div");
      heading.className = "question-heading";
      const number = document.createElement("span");
      number.className = "question-number";
      number.textContent = String(index + 1);
      const prompt = document.createElement("span");
      prompt.textContent = `${question.hint}…`;
      heading.append(number, prompt);

      const assignmentRow = document.createElement("div");
      assignmentRow.className = "assignment-row";
      assignmentRow.hidden = !isTeacher;
      [["question", "✍️ Chi formula la domanda"], ["answer", "☑️ Chi sceglie la risposta"]].forEach(([role, title]) => {
        const field = document.createElement("label");
        field.className = "assignment-field";
        field.textContent = title;
        const select = document.createElement("select");
        select.className = "assignment-select";
        select.setAttribute("aria-label", `${title}, scheda ${index + 1}`);
        select.add(new Option("— Nessuno assegnato —", ""));
        select.addEventListener("change", () => {
          if (!isTeacher || !answersRef) return;
          const target = parseAssignment(select.value);
          answersRef.child("assignments").child(String(index)).child(role).set(target)
            .catch(() => setStatus("Impossibile salvare il turno assegnato.", true));
        });
        field.appendChild(select);
        assignmentRow.appendChild(field);
      });

      const questionCard = document.createElement("div");
      questionCard.className = "question-form-card";
      const label = document.createElement("label");
      label.htmlFor = `question-input-${index}`;
      label.textContent = "✍️ Formula una domanda per il compagno";
      const questionInput = document.createElement("textarea");
      questionInput.id = label.htmlFor;
      questionInput.className = "question-input";
      questionInput.rows = 2;
      questionInput.placeholder = "Scrivi qui la domanda…";
      const accentToolbar = createAccentToolbar(questionInput);
      questionInput.addEventListener("input", () => {
        if (!assignedTo(index, "question")) return;
        scheduleQuestionSave(index, questionInput.value);
        sendButton.disabled = !questionInput.value.trim() || !answersRef;
      });
      questionInput.addEventListener("blur", () => {
        if (!saveTimers.has(index)) return;
        clearTimeout(saveTimers.get(index));
        saveTimers.delete(index);
        saveSharedQuestion(index, questionInput.value);
      });
      const questionActions = document.createElement("div");
      questionActions.className = "question-actions";
      const sendButton = document.createElement("button");
      sendButton.type = "button";
      sendButton.className = "send-question";
      sendButton.textContent = "📤 Invia domanda";
      sendButton.disabled = true;
      sendButton.addEventListener("click", async () => {
        const text = questionInput.value.trim();
        if (!answersRef || !assignedTo(index, "question") || !text) return;
        sendButton.disabled = true;
        try {
          await answersRef.child("questionContributions").child(String(index)).push().set({
            text, author: userName || teacherName, role: isTeacher ? "teacher" : "student",
            timestamp: firebase.database.ServerValue.TIMESTAMP
          });
          questionInput.value = "";
          await answersRef.child("sharedQuestions").child(String(index)).set("");
          setStatus(`Domanda ${index + 1} aggiunta ai contributi.`);
          renderCardState(index);
        } catch (_) {
          setStatus("Impossibile inviare la domanda. Controlla la connessione.", true);
          sendButton.disabled = false;
        }
      });
      questionActions.appendChild(sendButton);
      questionCard.append(label, accentToolbar, questionInput, questionActions);

      const contributionSection = document.createElement("section");
      contributionSection.className = "contributions";
      const contributionTitle = document.createElement("h3");
      contributionTitle.textContent = "Domande inviate";
      const contributionList = document.createElement("div");
      contributionList.setAttribute("aria-live", "polite");
      contributionSection.append(contributionTitle, contributionList);

      const hint = document.createElement("div");
      hint.className = "section-hint";
      hint.textContent = `${question.hint}…`;
      const options = document.createElement("div");
      options.className = "options-grid";
      const optionButtons = question.options.map((text, optionIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option-btn";
        button.textContent = `${String.fromCharCode(97 + optionIndex)}) ${text}`;
        button.disabled = true;
        button.addEventListener("click", async () => {
          if (!answersRef || !assignedTo(index, "answer")) return;
          try {
            await answersRef.child("choices").child(String(index)).set({
              optionIndex, author: userName || teacherName, role: isTeacher ? "teacher" : "student",
              timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            setStatus("");
          } catch (_) { setStatus("Impossibile salvare la risposta scelta.", true); }
        });
        options.appendChild(button);
        return button;
      });
      const feedback = document.createElement("p");
      feedback.className = "answer-feedback";
      feedback.setAttribute("role", "status");
      feedback.setAttribute("aria-live", "polite");
      card.append(heading, assignmentRow, questionCard, contributionSection, hint, options, feedback);
      questionsContainer.appendChild(card);
      questionCards.push({ card, questionInput, accentToolbar, sendButton, contributionList, optionButtons, feedback });

      const step = document.createElement("button");
      step.type = "button";
      step.className = "progress-step";
      step.textContent = String(index + 1);
      step.setAttribute("aria-label", `Vai alla scheda ${index + 1}: ${question.hint}`);
      step.addEventListener("click", () => showQuestion(index));
      progressNav.appendChild(step);
    });

    function updateTeacherAssignmentMenus() {
      if (!isTeacher) return;
      questionCards.forEach((card, cardIndex) => {
        const row = card.card.querySelector(".assignment-row");
        const menus = row.querySelectorAll("select");
        ["question", "answer"].forEach((role, roleIndex) => {
          const menu = menus[roleIndex];
          const selected = assignmentValue(assignments[cardIndex]?.[role]);
          menu.replaceChildren(new Option("— Nessuno assegnato —", ""));
          const namesOnline = onlineNames();
          const people = orderedRoster();
          const online = people.filter(person => namesOnline.has(person.name));
          const offline = people.filter(person => !namesOnline.has(person.name));
          if (online.length) {
            const onlineGroup = document.createElement("optgroup");
            onlineGroup.label = "🟢 Studenti online";
            online.forEach(person => onlineGroup.appendChild(new Option(`🟢 ${person.name}`, assignmentValue(person))));
            menu.appendChild(onlineGroup);
          }
          if (offline.length) {
            const offlineGroup = document.createElement("optgroup");
            offlineGroup.label = "Studenti offline";
            offline.forEach(person => offlineGroup.appendChild(new Option(person.name, assignmentValue(person))));
            menu.appendChild(offlineGroup);
          }
          const teacherGroup = document.createElement("optgroup");
          teacherGroup.label = "👩‍🏫 Insegnante";
          teacherGroup.appendChild(new Option(teacherName, assignmentValue(teacherIdentity)));
          menu.appendChild(teacherGroup);
          menu.value = selected;
        });
      });
    }

    function updateUI() {
      questionCards.forEach((_, index) => renderCardState(index));
      updateTeacherAssignmentMenus();
      progressNav.querySelectorAll("button").forEach((button, index) => button.setAttribute("aria-current", index === activeQuestion ? "step" : "false"));
      progressText.textContent = `Domanda ${activeQuestion + 1} di ${questions.length}`;
      previousButton.disabled = activeQuestion === 0;
      nextButton.disabled = activeQuestion === questions.length - 1;
    }
    function showQuestion(index, scroll = true) {
      const oldIndex = activeQuestion;
      if (saveTimers.has(oldIndex)) {
        clearTimeout(saveTimers.get(oldIndex));
        saveTimers.delete(oldIndex);
        saveSharedQuestion(oldIndex, questionCards[oldIndex].questionInput.value);
      }
      activeQuestion = Math.max(0, Math.min(questions.length - 1, index));
      setStatus("");
      updateUI();
      if (scroll) questionCards[activeQuestion].card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
    previousButton.addEventListener("click", () => showQuestion(activeQuestion - 1));
    nextButton.addEventListener("click", () => showQuestion(activeQuestion + 1));
    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest("input,textarea,select,button,a,[tabindex]")) return;
      if (event.key === "ArrowLeft") showQuestion(activeQuestion - 1);
      if (event.key === "ArrowRight") showQuestion(activeQuestion + 1);
    });

    function loadRoster(database) {
      if (!group || group === "sconosciuto") return;
      database.ref(`configurazioneScuola/gruppi/${safeGroup}`).on("value", snapshot => {
        const data = snapshot.val() || {};
        const active = Object.values(data.studenti || {}).filter(student => student?.nome);
        const inactive = Object.values(data.studentiInattivi || {}).filter(student => student?.nome && Number(student.unitNumber ?? data.unitNumber ?? 0) >= 3);
        roster = [...new Map([...active, ...inactive].map(student => [student.nome, student])).values()];
        updateUI();
      });
    }
    function registerPresence(database) {
      if (!userName || isTeacher || !answersRef) return;
      const presenceRef = answersRef.child("presence").child(safe(userName)).child(userId);
      database.ref(".info/connected").on("value", snapshot => {
        if (snapshot.val() !== true) return;
        presenceRef.onDisconnect().remove().then(() => presenceRef.set({ name: userName, role: "student", connectedAt: Date.now() }))
          .catch(error => console.error("Errore stato presenza:", error));
      });
    }

    if (window.firebase) {
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        answersRef = database.ref(databasePath);
        loadRoster(database);
        registerPresence(database);
        answersRef.on("value", snapshot => {
          const data = snapshot.val() || {};
          assignments = data.assignments || {};
          sharedQuestions = data.sharedQuestions || {};
          choices = data.choices || {};
          contributions = data.questionContributions || {};
          presenceData = data.presence || {};
          legacyResponses = data.responses || {};
          updateUI();
        }, error => {
          console.error("Errore lettura Firebase:", error);
          setStatus("Impossibile leggere i dati condivisi del gruppo.", true);
        });
        if (!identity) setStatus("La sessione non contiene un nome: non potrai ricevere un turno di scrittura.", true);
      } catch (error) {
        console.error("Errore Firebase:", error);
        setStatus("Servizio dati condivisi non disponibile.", true);
      }
    } else setStatus("Servizio dati condivisi non disponibile.", true);

    updateUI();
    let backgroundUpdatePending = false;
    function updateBackgroundParallax() {
      if (backgroundUpdatePending) return;
      backgroundUpdatePending = true;
      requestAnimationFrame(() => {
        const offset = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : Math.min(window.scrollY * .12, 180);
        document.body.style.setProperty("--background-offset", `${offset}px`);
        backgroundUpdatePending = false;
      });
    }
    window.addEventListener("scroll", updateBackgroundParallax, { passive: true });
    updateBackgroundParallax();
  </script>
  <script src="../classroom-notes.js"></script>
</body>
</html>
