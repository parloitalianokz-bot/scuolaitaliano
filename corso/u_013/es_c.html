    function registerPresence(){if(!answersRef||!userName||isTeacher)return;presenceRef=answersRef.child("presence").child(safe(userName)).child(`presence_${Math.random().toString(36).slice(2,10)}`);firebase.database().ref(".info/connected").on("value",snapshot=>{if(snapshot.val()!==true)return;presenceRef.onDisconnect().remove().then(()=>presenceRef.set({name:userName,role:"student",connectedAt:Date.now()})).catch(error=>console.error("Errore presenza:",error))})}
    function createToolbar(slideIndex){const toolbar=document.createElement("div");toolbar.className="character-toolbar";toolbar.setAttribute("role","group");toolbar.setAttribute("aria-label","Inserisci caratteri italiani");const label=document.createElement("span");label.textContent="Caratteri:";toolbar.appendChild(label);["'","à","è","ì","ò","ù","È"].forEach(character=>{const button=document.createElement("button");button.type="button";button.textContent=character;button.disabled=!canWriteFor(slideIndex);button.setAttribute("aria-label",character==="'"?"Inserisci apostrofo":`Inserisci ${character}`);button.addEventListener("mousedown",event=>event.preventDefault());button.addEventListener("click",()=>{const field=toolbar.closest(".paragraph-slide")?.querySelector("input:focus");if(!canWrite()||!field||field.disabled)return;const start=field.selectionStart??field.value.length,end=field.selectionEnd??start;field.setRangeText(character,start,end,"end");field.dispatchEvent(new Event("input",{bubbles:true}));field.focus()});toolbar.appendChild(button)});return toolbar}
    function feedbackFor(slide,index){const inputs=[...slide.querySelectorAll("input.verb-input")],keys=paragraphs[index].keys;let filled=0,valid=0;inputs.forEach((input,i)=>{const value=input.value.trim(),ok=value&&correct(value,keys[i]);if(value)filled++;if(ok)valid++;input.classList.toggle("correct",Boolean(ok));input.classList.toggle("incorrect",Boolean(value)&&!ok)});const feedback=slide.querySelector(".answer-feedback");if(!filled){feedback.textContent="Inserisci le forme verbali: la correzione si aggiorna automaticamente.";feedback.className="answer-feedback"}else if(valid===keys.length){feedback.textContent=`✓ Tutte le forme sono corrette (${valid}/${keys.length}).`;feedback.className="answer-feedback correct"}else{feedback.textContent=`✕ ${valid} forme corrette su ${keys.length}. I campi verdi sono corretti; quelli rossi da rivedere.`;feedback.className="answer-feedback incorrect"}}
    function renderContributions(slide,index){const panel=document.createElement("section");panel.className="contribution-panel";const heading=document.createElement("h4");heading.textContent="Contributi inviati per questa scheda";const list=document.createElement("div");list.className="contribution-list";const entries=Object.entries(contributions[index]||{}).map(([id,item])=>({...item,id})).sort((a,b)=>(Number(a.timestamp)||0)-(Number(b.timestamp)||0)||a.id.localeCompare(b.id));if(!entries.length){const empty=document.createElement("p");empty.className="empty-message";empty.textContent="Nessun contributo inviato per questa scheda.";list.appendChild(empty)}entries.forEach(entry=>{const article=document.createElement("article");article.className="contribution";const meta=document.createElement("span");meta.className="contribution-meta";meta.textContent=`${entry.author||"Partecipante"} · ${Number(entry.timestamp)?new Date(Number(entry.timestamp)).toLocaleString("it-IT"):"Data non disponibile"}`;article.append(meta,document.createTextNode(entry.text||""));list.appendChild(article)});panel.append(heading,list);slide.appendChild(panel)}
    function renderSlides(){track.replaceChildren();paragraphs.forEach((item,index)=>{const slide=document.createElement("article");slide.className=`paragraph-slide${index===activeParagraph?" active":""}`;slide.dataset.index=String(index);const heading=document.createElement("h3");heading.className="paragraph-heading";heading.textContent=`Paragrafo ${index+1} di ${paragraphs.length}`;const source=document.createElement("p");source.className="source-text";const parts=item.text.split(/\{\{\d+\}\}/);parts.forEach((part,inputIndex)=>{source.appendChild(document.createTextNode(part));if(inputIndex<item.keys.length){const input=document.createElement("input");input.type="text";input.className="verb-input";input.autocomplete="off";input.maxLength=30;input.placeholder=item.verbs[inputIndex];input.setAttribute("aria-label",`Forma di ${item.verbs[inputIndex]}, paragrafo ${index+1}`);input.value=answers[index][inputIndex]||"";input.disabled=!canWriteFor(index);input.addEventListener("input",()=>{if(!canWriteFor(index))return;answers[index][inputIndex]=input.value;feedbackFor(slide,index);if(answersRef)answersRef.child(`tokenData/answers/${index}`).set(answers[index]).catch(error=>console.error("Errore salvataggio risposta:",error));const submit=slide.querySelector(".submit-contribution");submit.disabled=!canWrite()||!answers[index].some(value=>String(value).trim())});source.appendChild(input)}});const feedback=document.createElement("p");feedback.className="answer-feedback";feedback.setAttribute("role","status");slide.append(heading,source);if(index===paragraphs.length-1){const image=document.createElement("img");image.className="last-paragraph-image";image.src="img/bea.jpeg";image.alt="Beatrice scrive il romanzo";slide.appendChild(image)}slide.append(createToolbar(index),feedback);const submit=document.createElement("button");submit.type="button";submit.className="submit-contribution";submit.textContent="📤 Invia il contributo";submit.disabled=!canWriteFor(index)||!answers[index].some(value=>String(value).trim());submit.addEventListener("click",()=>submitContribution(index,submit));slide.appendChild(submit);renderContributions(slide,index);const publicHint=document.createElement("details");publicHint.className="suggestion-panel";const publicTitle=document.createElement("summary");publicTitle.textContent="Suggerimenti";const publicText=document.createElement("p");publicText.lang="ru";publicText.textContent=publicSuggestions[index];publicHint.append(publicTitle,publicText);slide.appendChild(publicHint);if(isTeacher){const teacherHint=document.createElement("details");teacherHint.className="suggestion-panel teacher-suggestions";const teacherTitle=document.createElement("summary");teacherTitle.textContent="Suggerimenti per l’insegnante · Think aloud / LAD";const teacherText=document.createElement("p");teacherText.textContent=teacherSuggestions[index];teacherHint.append(teacherTitle,teacherText);slide.appendChild(teacherHint)}track.appendChild(slide);feedbackFor(slide,index)});renderProgress();setStatus();refreshWriterMenu()}
    async function submitContribution(index,button){if(!canWrite()||!answersRef)return;const values=answers[index].map(value=>String(value||"").trim());if(!values.some(Boolean))return;button.disabled=true;const entry={author:userName,role:isTeacher?"teacher":"student",timestamp:Date.now(),answers:values,text:values.map((value,i)=>`${i+1}. ${value||"—"}`).join(" · ")};try{await answersRef.child(`tokenData/contributions/${index}`).push().set(entry);saveStatus.textContent="✅ Contributo inviato e aggiunto allo storico della scheda.";saveStatus.hidden=false}catch(error){console.error("Errore invio contributo:",error);saveStatus.textContent="⚠️ Contributo non inviato. Controlla la connessione e riprova.";saveStatus.hidden=false}finally{button.disabled=!canWrite()||!answers[index].some(value=>String(value).trim())}}
    function renderProgress(){const steps=document.getElementById("progress-steps");steps.replaceChildren();paragraphs.forEach((_,index)=>{const button=document.createElement("button");button.type="button";button.className="progress-step";button.textContent=String(index+1);button.setAttribute("aria-label",`Vai al paragrafo ${index+1}`);button.setAttribute("aria-current",index===activeParagraph?"step":"false");button.addEventListener("click",()=>navigateTo(index));steps.appendChild(button)});document.getElementById("progress-count").textContent=`${activeParagraph+1} / ${paragraphs.length}`;document.getElementById("progress-bar").style.width=`${((activeParagraph+1)/paragraphs.length)*100}%`;document.getElementById("paragraph-progress").textContent=`Paragrafo ${activeParagraph+1} di ${paragraphs.length}`;document.getElementById("prev-paragraph").disabled=activeParagraph===0;const last=activeParagraph===paragraphs.length-1;document.getElementById("next-paragraph").hidden=last}
    function navigateTo(index){activeParagraph=Math.max(0,Math.min(paragraphs.length-1,index));track.querySelectorAll(".paragraph-slide").forEach((slide,i)=>slide.classList.toggle("active",i===activeParagraph));saveStatus.hidden=true;renderProgress();setStatus();refreshWriterMenu()}
    async function assignWriter(value){if(!isTeacher||!answersRef)return;let assignment=null;if(value===teacherId)assignment={name:session.name||"Insegnante",role:"teacher"};else if(value.startsWith("student::"))assignment={name:value.slice("student::".length),role:"student"};assignments[activeParagraph]=assignment;try{await answersRef.child(`controlAssignments/writers/${activeParagraph}`).set(assignment);track.querySelectorAll(".paragraph-slide").forEach((slide,index)=>{slide.querySelectorAll("input.verb-input").forEach(input=>input.disabled=!canWriteFor(index));const submit=slide.querySelector(".submit-contribution");submit.disabled=!canWriteFor(index)||!answers[index].some(answer=>String(answer).trim());slide.querySelectorAll(".character-toolbar button").forEach(button=>button.disabled=!canWriteFor(index))});setStatus()}catch(error){console.error("Errore assegnazione turno:",error)}}
    function canWriteFor(index){const assigned=assignments[index];return Boolean(assigned&&(assigned.role==="teacher"?isTeacher:!isTeacher&&assigned.name===userName&&userName))}
    document.getElementById("prev-paragraph").addEventListener("click",()=>navigateTo(activeParagraph-1));document.getElementById("next-paragraph").addEventListener("click",()=>navigateTo(activeParagraph+1));writerSelect.addEventListener("change",()=>assignWriter(writerSelect.value));document.addEventListener("keydown",event=>{if(event.altKey||event.ctrlKey||event.metaKey||["INPUT","TEXTAREA","SELECT","BUTTON","A"].includes(document.activeElement.tagName))return;if(event.key==="ArrowLeft")navigateTo(activeParagraph-1);else if(event.key==="ArrowRight")navigateTo(activeParagraph+1)});
    let scrollTimer;track.addEventListener("scroll",()=>{clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{const slides=[...track.querySelectorAll(".paragraph-slide")];if(!slides.length)return;const index=slides.reduce((best,slide,i)=>Math.abs(slide.getBoundingClientRect().left-track.getBoundingClientRect().left)<Math.abs(slides[best].getBoundingClientRect().left-track.getBoundingClientRect().left)?i:best,0);if(index!==activeParagraph)navigateTo(index)},80)},{passive:true});
    document.getElementById("user-badge").textContent=`${isTeacher?"👩‍🏫":"👤"} ${userName||"Utente"} · ${groupName}`;teacherAssignment.hidden=!isTeacher;
    if(window.firebase&&groupName!=="sconosciuto"){try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const database=firebase.database();answersRef=database.ref("esercizi/unita13-grande-scrittore-c");groupRef=database.ref(`configurazioneScuola/gruppi/${safe(session.safeGroup||groupName)}`);loadRoster();registerPresence();answersRef.child("presence").on("value",snapshot=>updateOnline(snapshot.val()||{}));answersRef.on("value",snapshot=>{const data=snapshot.val()||{},saved=data.tokenData?.answers||{};paragraphs.forEach((item,index)=>{const values=saved[index]??saved[String(index)];if(Array.isArray(values))item.keys.forEach((_,keyIndex)=>{answers[index][keyIndex]=String(values[keyIndex]||"")})});contributions=data.tokenData?.contributions||{};const writers=data.controlAssignments?.writers||{};const legacyWriter=data.controlAssignments?.writer;assignments=paragraphs.map((_,index)=>normalizeAssignment(writers[index]??writers[String(index)]??legacyWriter));track.querySelectorAll(".paragraph-slide").forEach((slide,index)=>{slide.querySelectorAll("input.verb-input").forEach((input,keyIndex)=>{if(document.activeElement!==input)input.value=answers[index][keyIndex]||""});feedbackFor(slide,index);const submit=slide.querySelector(".submit-contribution");submit.disabled=!canWriteFor(index)||!answers[index].some(value=>String(value).trim());slide.querySelectorAll("input.verb-input").forEach(input=>input.disabled=!canWriteFor(index));slide.querySelectorAll(".character-toolbar button").forEach(button=>button.disabled=!canWriteFor(index))});refreshWriterMenu();setStatus();const active=document.querySelector(`.paragraph-slide[data-index="${activeParagraph}"]`);if(active){const old=active.querySelector(".contribution-panel");old?.remove();renderContributions(active,activeParagraph)}})}catch(error){console.error("Errore Firebase:",error);assignmentStatus.textContent="Connessione all’esercizio non disponibile."}}else{assignmentStatus.textContent="Accedi tramite il gruppo della classe per usare l’esercizio condiviso."}
    renderSlides();
    let backgroundUpdatePending=false;function updateBackgroundParallax(){if(backgroundUpdatePending)return;backgroundUpdatePending=true;requestAnimationFrame(()=>{const offset=window.matchMedia("(prefers-reduced-motion: reduce)").matches?0:Math.min(window.scrollY*.12,180);document.body.style.setProperty("--background-offset",`${offset}px`);backgroundUpdatePending=false})}window.addEventListener("scroll",updateBackgroundParallax,{passive:true});updateBackgroundParallax();
  </script>
