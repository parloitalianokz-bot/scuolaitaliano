  <script>
    const firebaseConfig={apiKey:"INSERISCI_API_KEY",authDomain:"esercizi-parlo-italiano.firebaseapp.com",databaseURL:"https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",projectId:"esercizi-parlo-italiano",appId:"INSERISCI_APP_ID"};

      "Fai ordinare le attività mattutine di Riccardo e chiedi quali verbi descrivono la sua giornata di scrittore.",

      "Invita a elencare le attività serali di Beatrice e a confrontarle con quelle di Riccardo.",

    ];
    const session=window.parloUnit13Session||{};
    const groupName=session.group||"sconosciuto";
    const isTeacher=Boolean(session.isTeacher);
    const userName=isTeacher?(session.name||"Insegnante"):(session.name||"");
    const teacherKey="__teacher__";
    const safe=value=>String(value||"").replace(/[.#$\/\[\]]/g,"_");
    const track=document.getElementById("paragraph-track"),writerSelect=document.getElementById("writer-select"),assignmentControl=document.getElementById("assignment-control"),assignmentStatus=document.getElementById("assignment-status"),saveStatus=document.getElementById("save-status");
    let answers=paragraphs.map(()=>""),contributions={},assignments=paragraphs.map(()=>null),activeParagraph=0,answersRef=null,groupRef=null,groupRoster=[],onlineStudents=new Set(),presenceId=`presence_${Math.random().toString(36).slice(2,10)}`;
    const canWriteFor=index=>{const assignment=assignments[index];return Boolean(assignment&&(assignment.role==="teacher"?isTeacher:!isTeacher&&assignment.name===userName&&userName))};
    function normalizeAssignment(value){if(!value)return null;if(typeof value==="string"){if(value===teacherKey)return{name:userName||"Insegnante",role:"teacher"};return{name:value,role:"student"}}return value.name?{name:value.name,role:value.role||"student"}:null}
    function setStatus(){const assignment=assignments[activeParagraph];if(groupName==="sconosciuto")assignmentStatus.textContent="Accedi tramite il gruppo della classe per usare l’esercizio condiviso.";else if(!answersRef)assignmentStatus.textContent="Connessione all’esercizio non disponibile. Verifica la connessione e ricarica la pagina.";else if(!userName)assignmentStatus.textContent="Accedi dal gruppo della classe con il tuo nome per partecipare.";else if(!assignment)assignmentStatus.textContent=isTeacher?"Assegna il turno di questa domanda dal menu.":"L’insegnante non ha ancora assegnato il turno per questa domanda.";else if(canWriteFor(activeParagraph))assignmentStatus.textContent=`✍️ È il tuo turno, ${userName}: puoi modificare il testo e inviare un contributo.`;else assignmentStatus.textContent=`🔒 Il turno è assegnato a ${assignment.name}. Puoi visualizzare il testo e i contributi, ma non modificarli.`}
    function renderWriterMenu(){if(!isTeacher)return;const options=[new Option("— Nessuno selezionato —","")];options.push(new Option(`👩‍🏫 ${userName||"Insegnante"}`,teacherKey));const students=[...new Map(groupRoster.map(person=>[person.nome,person])).values()].sort((a,b)=>a.nome.localeCompare(b.nome,"it"));const online=students.filter(person=>onlineStudents.has(person.nome)),offline=students.filter(person=>!onlineStudents.has(person.nome));if(online.length){const group=document.createElement("optgroup");group.label="🟢 STUDENTI ONLINE";online.forEach(person=>group.appendChild(new Option(`🟢 ${person.nome} · ONLINE`,person.nome)));options.push(group)}if(offline.length){const group=document.createElement("optgroup");group.label="STUDENTI OFFLINE";offline.forEach(person=>group.appendChild(new Option(person.nome,person.nome)));options.push(group)}const assignment=assignments[activeParagraph];writerSelect.replaceChildren(...options);writerSelect.value=assignment?(assignment.role==="teacher"?teacherKey:assignment.name):""}
    function updateOnline(value){onlineStudents=new Set();Object.values(value||{}).forEach(entry=>{if(entry?.name)onlineStudents.add(entry.name);Object.values(entry||{}).forEach(connection=>{if(connection?.name)onlineStudents.add(connection.name)})});renderWriterMenu()}
    function loadRoster(){if(!groupRef)return;groupRef.on("value",snapshot=>{const data=snapshot.val()||{},unit=Number(data.unitNumber||0),active=Object.values(data.studenti||{}).filter(person=>person?.nome),inactive=Object.values(data.studentiInattivi||{}).filter(person=>person?.nome&&Number(person.unitNumber??unit)>=13);groupRoster=[...new Map([...active,...inactive].map(person=>[person.nome,person])).values()].sort((a,b)=>a.nome.localeCompare(b.nome,"it"));renderWriterMenu()})}
    function registerPresence(){if(!answersRef||!userName||isTeacher)return;const presenceRef=answersRef.child(`presence/${safe(userName)}/${presenceId}`);firebase.database().ref(".info/connected").on("value",snapshot=>{if(snapshot.val()!==true)return;presenceRef.onDisconnect().remove().then(()=>presenceRef.set({name:userName,role:"student",connectedAt:Date.now()})).catch(error=>console.error("Errore presenza:",error))})}
    function renderContributions(index,container){const panel=container.querySelector(".contribution-panel");if(!panel)return;const list=panel.querySelector(".contribution-list");list.replaceChildren();const entries=Object.entries(contributions[index]||{}).map(([id,entry])=>({...entry,id})).sort((a,b)=>(Number(a.timestamp)||0)-(Number(b.timestamp)||0)||a.id.localeCompare(b.id));if(!entries.length){const empty=document.createElement("p");empty.className="empty-message";empty.textContent="Nessun contributo inviato per questa domanda.";list.appendChild(empty);return}entries.forEach(entry=>{const item=document.createElement("article");item.className="contribution";const meta=document.createElement("span");meta.className="contribution-meta";meta.textContent=`${entry.author||"Partecipante"} · ${Number(entry.timestamp)?new Date(Number(entry.timestamp)).toLocaleString("it-IT"):"Data non disponibile"}`;item.append(meta,document.createTextNode(entry.text||""));list.appendChild(item)})}
    function buildSlides(){track.replaceChildren();paragraphs.forEach((text,index)=>{const slide=document.createElement("article");slide.className=`paragraph-slide${index===activeParagraph?" active":""}`;slide.dataset.index=String(index);const heading=document.createElement("h3");heading.className="paragraph-heading";heading.textContent=`Domanda ${index+1} di ${paragraphs.length}`;const source=document.createElement("p");source.className="source-text";source.textContent=text;const label=document.createElement("label");label.className="answer-label";label.htmlFor=`rewrite-${index}`;label.textContent="✍️ La tua risposta:";const input=document.createElement("textarea");input.id=label.htmlFor;input.className="rewrite-input";input.rows=5;input.placeholder="Scrivi una risposta completa in italiano…";input.value=answers[index]||"";input.disabled=!canWriteFor(index);input.setAttribute("aria-label",`Risposta condivisa alla domanda ${index+1}`);input.addEventListener("input",()=>{if(!canWriteFor(index))return;answers[index]=input.value;saveStatus.hidden=true;if(answersRef)answersRef.child(`tokenData/answers/${index}`).set(input.value).catch(error=>showSaveStatus("Risposta non salvata. Controlla la connessione e riprova.",true));const submit=slide.querySelector(".submit-contribution");submit.disabled=!canWriteFor(index)||!input.value.trim()});slide.append(heading,source,label,input);const submit=document.createElement("button");submit.type="button";submit.className="submit-contribution";submit.textContent="📤 Invia il contributo";submit.disabled=!canWriteFor(index)||!input.value.trim();submit.addEventListener("click",()=>submitContribution(index,input,submit));slide.appendChild(submit);const panel=document.createElement("section");panel.className="contribution-panel";const panelHeading=document.createElement("h4");panelHeading.textContent="Contributi inviati per questa domanda";const list=document.createElement("div");list.className="contribution-list";panel.append(panelHeading,list);slide.appendChild(panel);const publicHint=document.createElement("details");publicHint.className="suggestion-panel";const publicSummary=document.createElement("summary");publicSummary.textContent="Suggerimenti";const publicText=document.createElement("p");publicText.lang="ru";publicText.textContent=publicSuggestions[index];publicHint.append(publicSummary,publicText);slide.appendChild(publicHint);if(isTeacher){const teacherHint=document.createElement("details");teacherHint.className="suggestion-panel teacher-suggestions";const teacherSummary=document.createElement("summary");teacherSummary.textContent="Suggerimenti per l’insegnante · Think aloud / LAD";const teacherText=document.createElement("p");teacherText.lang="ru";teacherText.textContent=teacherSuggestions[index];teacherHint.append(teacherSummary,teacherText);slide.appendChild(teacherHint)}track.appendChild(slide);renderContributions(index,slide)});renderProgress();setStatus();renderWriterMenu()}
    function showSaveStatus(message,isError=false){saveStatus.textContent=message;saveStatus.classList.toggle("error",isError);saveStatus.hidden=false}
    async function submitContribution(index,input,button){const text=input.value.trim();if(!text||!canWriteFor(index)||!answersRef)return;button.disabled=true;const contributionRef=answersRef.child(`tokenData/contributions/${index}`).push();try{await contributionRef.set({author:userName,role:isTeacher?"teacher":"student",timestamp:Date.now(),text});showSaveStatus("✅ Contributo inviato e aggiunto allo storico della domanda.");}catch(error){console.error("Errore invio contributo:",error);showSaveStatus("⚠️ Contributo non inviato. Controlla la connessione e riprova.",true)}finally{button.disabled=!canWriteFor(index)||!input.value.trim()}}
    function renderProgress(){const steps=document.getElementById("progress-steps");steps.replaceChildren();paragraphs.forEach((_,index)=>{const button=document.createElement("button");button.type="button";button.className="progress-step";button.textContent=String(index+1);button.setAttribute("aria-label",`Vai alla domanda ${index+1}`);button.setAttribute("aria-current",index===activeParagraph?"step":"false");button.addEventListener("click",()=>navigateTo(index));steps.appendChild(button)});document.getElementById("progress-count").textContent=`${activeParagraph+1} / ${paragraphs.length}`;document.getElementById("progress-bar").style.width=`${((activeParagraph+1)/paragraphs.length)*100}%`;document.getElementById("paragraph-progress").textContent=`Domanda ${activeParagraph+1} di ${paragraphs.length}`;document.getElementById("prev-paragraph").disabled=activeParagraph===0;document.getElementById("next-paragraph").hidden=activeParagraph===paragraphs.length-1;document.getElementById("next-exercise").hidden=activeParagraph!==paragraphs.length-1}
    function navigateTo(index){activeParagraph=Math.max(0,Math.min(paragraphs.length-1,index));track.querySelectorAll(".paragraph-slide").forEach((slide,i)=>slide.classList.toggle("active",i===activeParagraph));saveStatus.hidden=true;renderProgress();setStatus();renderWriterMenu()}
    async function assignWriter(value){if(!isTeacher||!answersRef)return;const assignment=value===teacherKey?{name:userName||"Insegnante",role:"teacher"}:value?{name:value,role:"student"}:null;try{await answersRef.child(`controlAssignments/writers/${activeParagraph}`).set(assignment);assignments[activeParagraph]=assignment;const slide=track.querySelector(`[data-index="${activeParagraph}"]`);const input=slide?.querySelector(".rewrite-input"),submit=slide?.querySelector(".submit-contribution");if(input)input.disabled=!canWriteFor(activeParagraph);if(submit)submit.disabled=!canWriteFor(activeParagraph)||!input?.value.trim();setStatus()}catch(error){console.error("Errore assegnazione turno:",error)}}
    writerSelect.addEventListener("change",()=>assignWriter(writerSelect.value));document.getElementById("prev-paragraph").addEventListener("click",()=>navigateTo(activeParagraph-1));document.getElementById("next-paragraph").addEventListener("click",()=>navigateTo(activeParagraph+1));document.addEventListener("keydown",event=>{if(event.altKey||event.ctrlKey||event.metaKey||event.target.closest("input,textarea,select,button,a,[tabindex]"))return;if(event.key==="ArrowLeft")navigateTo(activeParagraph-1);else if(event.key==="ArrowRight")navigateTo(activeParagraph+1)});
    document.getElementById("user-badge").textContent=`${isTeacher?"👩‍🏫":"👤"} ${userName||"Utente"} · ${groupName}`;assignmentControl.hidden=!isTeacher;
    buildSlides();
    if(window.firebase&&groupName!=="sconosciuto"){try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);const database=firebase.database();answersRef=database.ref("esercizi/unita13-grande-scrittore-d");groupRef=database.ref(`configurazioneScuola/gruppi/${safe(session.safeGroup||groupName)}`);loadRoster();registerPresence();answersRef.child("presence").on("value",snapshot=>updateOnline(snapshot.val()||{}));answersRef.on("value",snapshot=>{const data=snapshot.val()||{},saved=data.tokenData?.answers||{};paragraphs.forEach((_,index)=>{const value=Array.isArray(saved)?saved[index]:saved[index]??saved[String(index)];if(value!==undefined)answers[index]=String(value||"")});contributions=data.tokenData?.contributions||{};const writers=data.controlAssignments?.writers||{},legacyWriter=data.controlAssignments?.writer;assignments=paragraphs.map((_,index)=>normalizeAssignment(writers[index]??writers[String(index)]??legacyWriter));track.querySelectorAll(".paragraph-slide").forEach((slide,index)=>{const input=slide.querySelector(".rewrite-input");if(document.activeElement!==input&&input.value!==answers[index])input.value=answers[index];input.disabled=!canWriteFor(index);const submit=slide.querySelector(".submit-contribution");submit.disabled=!canWriteFor(index)||!input.value.trim();renderContributions(index,slide)});setStatus();renderWriterMenu()},error=>{console.error("Errore Firebase:",error);showSaveStatus("Connessione all’esercizio non disponibile.",true)})}catch(error){console.error("Errore Firebase:",error);showSaveStatus("Connessione all’esercizio non disponibile.",true)}}else setStatus();
    let backgroundUpdatePending=false;function updateBackgroundParallax(){if(backgroundUpdatePending)return;backgroundUpdatePending=true;requestAnimationFrame(()=>{const offset=window.matchMedia("(prefers-reduced-motion: reduce)").matches?0:Math.min(window.scrollY*.12,180);document.body.style.setProperty("--background-offset",`${offset}px`);backgroundUpdatePending=false})}window.addEventListener("scroll",updateBackgroundParallax,{passive:true});updateBackgroundParallax();
  </script>
