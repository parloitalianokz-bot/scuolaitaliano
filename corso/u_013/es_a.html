<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 13 — Il grande scrittore (Esercizio A)</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #477755; --primary-light: #edf4ed; --primary-dark: #2f5739;
      --accent: #bd694d; --bg-main: #f5f1e7; --card-bg: #fffefa;
      --text: #292d28; --text-muted: #6b7069; --success: #278253;
      --success-bg: #e1f1e5; --border: #e7e5dc;
    }
    * { box-sizing: border-box; }
    :focus-visible { outline: 3px solid rgba(189,105,77,.55); outline-offset: 3px; }
    body { min-height: 100vh; margin: 0; padding: 32px 16px; color: var(--text); background: linear-gradient(rgba(250,248,241,.78),rgba(250,248,241,.78)), url("img/sfondo.jpeg") center / cover fixed, radial-gradient(ellipse at 50% -12%,rgba(111,151,116,.18),transparent 42%), var(--bg-main); }
    .container { width: min(100%, 880px); margin: 0 auto; }
    .home-navigation { display: flex; margin: 0 0 12px; }
    .home-navigation a, .slide-navigation button { display: inline-flex; align-items: center; min-height: 42px; padding: 8px 16px; border: 1px solid #d8e5d8; border-radius: 10px; background: rgba(255,254,250,.94); color: var(--primary-dark); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
    .home-navigation a:hover, .slide-navigation button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .hero { margin: 8px 0 22px; padding: 28px 20px 26px; text-align: center; border: 1px solid rgba(71,119,85,.13); border-radius: 24px; background: linear-gradient(135deg,rgba(255,254,250,.94),rgba(242,247,239,.91)); box-shadow: 0 12px 32px rgba(43,69,46,.07); }
    .eyebrow { display: inline-block; margin-bottom: 10px; padding: 8px 15px; border-radius: 20px; background: #eaf1e8; color: var(--primary-dark); font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 4px 0; color: var(--primary-dark); font-size: clamp(1.9rem,5vw,2.65rem); letter-spacing: -.04em; line-height: 1.12; }
    .hero-subtitle { margin: 8px 0 0; color: var(--text-muted); font-size: .98rem; }
    .instruction-box, .teacher-controls { margin-bottom: 20px; padding: 16px 20px; border: 1px solid #d8e5d8; border-radius: 16px; background: rgba(255,254,250,.96); box-shadow: 0 6px 18px rgba(43,69,46,.04); }
    .instruction-box { border-left: 5px solid var(--accent); }
    .instruction-title { margin-bottom: 6px; color: var(--accent); font-size: .85rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .instruction-text { font-size: .98rem; line-height: 1.5; }
    .teacher-controls { display: none; flex-wrap: wrap; gap: 12px; }
    body.teacher-view .teacher-controls { display: flex; }
    .assignment-control { display: grid; flex: 1 1 240px; gap: 6px; color: var(--primary-dark); font-size: .88rem; font-weight: 700; }
    .assignment-control select { min-height: 42px; padding: 8px 10px; border: 1.5px solid #d4e1d5; border-radius: 9px; background: white; color: var(--text); font: inherit; }
    .card { margin-bottom: 28px; padding: clamp(18px,4vw,30px); border: 1px solid var(--border); border-radius: 24px; background: var(--card-bg); box-shadow: 0 22px 60px rgba(43,69,46,.11); }
    .progress-panel { margin: 0 0 16px; }
    .progress-heading { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 9px; color: var(--primary-dark); font-weight: 800; }
    .progress-track { height: 8px; overflow: hidden; margin-bottom: 12px; border-radius: 99px; background: var(--primary-light); }
    .progress-track span { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--primary),#8db68c); transition: width .2s ease; }
    .progress-steps { display: flex; flex-wrap: wrap; gap: 8px; }
    .progress-step { width: 38px; height: 38px; border: 2px solid #d8e5d8; border-radius: 50%; background: white; color: var(--primary-dark); font: inherit; font-weight: 800; cursor: pointer; }
    .progress-step[aria-current="step"] { border-color: var(--primary-dark); background: var(--primary-dark); color: white; }
    .slide-item { display: flex; flex-direction: column; gap: 13px; padding: 20px; border: 1px solid var(--border); border-radius: 18px; background: white; }
    .question-title { margin: 0; color: var(--primary-dark); font-size: 1.15rem; font-weight: 800; }
    .formulated-question-label { color: var(--primary-dark); font-size: .92rem; font-weight: 700; }
    .character-toolbar { display: flex; flex-wrap: wrap; gap: 5px; margin: -7px 0 -5px; }
    .character-toolbar button { min-width: 34px; min-height: 32px; padding: 3px 8px; border: 1px solid #d8e5d8; border-radius: 7px; background: #fffefa; color: var(--primary-dark); font: inherit; font-weight: 700; cursor: pointer; }
    .character-toolbar button:hover { background: var(--primary-light); }
    .formulated-question-input { width: 100%; min-height: 82px; padding: 10px 12px; border: 1.5px solid #d4e1d5; border-radius: 10px; background: #fff; color: var(--text); font: inherit; font-size: .98rem; resize: vertical; }
    .formulated-question-input:disabled { background: #f2f5f1; color: #475569; }
    .submit-contribution { align-self: flex-start; min-height: 42px; padding: 9px 16px; border: 0; border-radius: 10px; background: var(--primary); color: white; font: inherit; font-weight: 700; cursor: pointer; }
    .submit-contribution:hover:not(:disabled) { background: var(--primary-dark); }
    button:disabled { cursor: not-allowed; opacity: .5; }
    .contributions { display: grid; gap: 8px; }
    .contribution { padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px; background: #faf9f5; overflow-wrap: anywhere; line-height: 1.5; }
    .contribution-meta { display: block; margin-bottom: 4px; color: var(--text-muted); font-size: .82rem; font-weight: 700; }
    .contributions-empty { margin: 0; color: var(--text-muted); font-size: .9rem; }
    .options-group { display: flex; flex-direction: column; gap: 9px; }
    .option-btn { display: flex; align-items: center; padding: 12px 15px; border: 1.5px solid #d4e1d5; border-radius: 11px; background: #faf9f5; color: var(--text); font: inherit; font-size: 1rem; font-weight: 600; text-align: left; cursor: pointer; transition: background .2s,border-color .2s; }
    .option-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .option-btn.selected { border-color: var(--primary-dark); background: #e2ede3; font-weight: 800; }
    .option-btn.correct { border-color: var(--success); background: var(--success-bg); color: #17623c; }
    .option-btn.incorrect { border-color: #dc2626; background: #fde8e7; color: #991b1b; }
    .answer-feedback { margin: 0; padding: 10px 12px; border-radius: 9px; font-size: .92rem; font-weight: 800; }
    .answer-feedback.correct { background: var(--success-bg); color: var(--success); }
    .answer-feedback.incorrect { background: #fde8e7; color: #dc2626; }
    .assignment-status { margin: 0; padding: 10px 12px; border-radius: 9px; background: var(--primary-light); color: var(--primary-dark); font-size: .9rem; font-weight: 700; }
    .slide-navigation { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .slide-navigation button:disabled { opacity: .45; }
    .slide-progress { color: var(--primary-dark); font-weight: 800; text-align: center; }
    .status-message { min-height: 1.2em; margin: 10px 0 0; color: var(--primary-dark); font-size: .9rem; font-weight: 700; }
    @media (max-width: 600px) { body { padding: 16px 8px; } .slide-item { padding: 14px; } .slide-navigation { flex-direction: column; gap: 8px; } .slide-navigation button { width: 100%; justify-content: center; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="container">
    <nav class="home-navigation" aria-label="Navigazione principale"><a href="index.html">← Torna alla lettura</a></nav>
    <header class="hero">
      <span class="eyebrow">Unità 13 · Lettura e comprensione</span>
      <h1>Il grande scrittore</h1>
      <p class="hero-subtitle">A turno, formulate una domanda e scegliete la risposta corretta.</p>
      <p id="user-badge" class="hero-subtitle" style="font-size:.85rem;font-weight:700;color:var(--accent)" aria-live="polite"></p>
    </header>
    <div class="instruction-box">
      <div class="instruction-title">💡 Задание · Esercizio A</div>
      <div class="instruction-text">Formulate una domanda nel box e inviatela. Poi il compagno incaricato sceglie la risposta tra le opzioni.</div>
    </div>
    <section class="teacher-controls" aria-label="Assegnazione dei turni">
      <label class="assignment-control" for="question-writer-select">✍️ Turno per formulare la domanda
        <select id="question-writer-select"><option value="">Nessuno selezionato</option></select>
      </label>
      <label class="assignment-control" for="answer-writer-select">☑️ Turno per scegliere la risposta
        <select id="answer-writer-select"><option value="">Nessuno selezionato</option></select>
      </label>
    </section>
    <section class="card" aria-label="Esercizio condiviso">
      <nav class="progress-panel" aria-label="Avanzamento delle domande">
        <div class="progress-heading"><span>Avanzamento</span><span id="progress-count"></span></div>
        <div class="progress-track" aria-hidden="true"><span id="progress-bar"></span></div>
        <div id="progress-steps" class="progress-steps"></div>
      </nav>
      <div id="slide-container"></div>
      <nav class="slide-navigation" aria-label="Navigazione schede">
        <button id="previous-slide" type="button">← Precedente</button>
        <span id="slide-position" class="slide-progress" aria-live="polite"></span>
        <button id="next-slide" type="button">Successiva →</button>
      </nav>
      <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-group-scope.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };
    const questionsData = [
      { id: "a1", num: "1.", question: "Riccardo Ricchi...", options: ["esce spesso.", "sta sempre in casa."], correct: 1 },
      { id: "a2", num: "2.", question: "Lui abita...", options: ["in campagna.", "in montagna."], correct: 1 },
      { id: "a3", num: "3.", question: "In casa...", options: ["il signor Ricchi fa molte cose.", "fa tutto la donna di servizio."], correct: 1 },
      { id: "a4", num: "4.", question: "Gli amici telefonano...", options: ["perché vogliono invitare il signor Ricchi al cinema.", "perché vogliono leggere il suo romanzo."], correct: 0 },
      { id: "a5", num: "5.", question: "La sera il signor Ricchi...", options: ["legge il suo romanzo alla donna di servizio.", "brucia il suo romanzo.", "guarda un po’ la TV."], correct: 1 },
      { id: "a6", num: "6.", question: "Il suo cane abbaia...", options: ["perché vuole uscire.", "perché ha fame.", "perché sente dei rumori strani."], correct: 0 }
    ];
    const params = new URLSearchParams(location.search);
    let session = null;
    try { session = JSON.parse(localStorage.getItem("parlo_session") || "null"); } catch (_) {}
    const groupName = params.get("gruppo") || session?.group || "";
    const studentName = params.get("nome") || (!session?.isTeacher ? session?.name : "") || localStorage.getItem("parlo_student_name") || "";
    const isTeacherView = Boolean(session?.isTeacher || (!studentName && params.has("gruppo")));
    const teacherName = session?.teacher || "Insegnante";
    const clientId = "user_" + Math.random().toString(36).slice(2, 10);
    const teacherKey = "__teacher__";
    const safeGroup = (groupName || "sconosciuto").replace(/[.#$\/\[\]]/g, "_");
    const databasePath = groupName
      ? `esercizi/gruppi/${safeGroup}/unita13-grande-scrittore-a`
      : "esercizi/unita13-grande-scrittore-a";

    let answersRef = null;
    let presenceRef = null;
    let assignmentState = { questionWriter: "", answerWriter: "" };
    let roster = [];
    let onlineStudents = new Set();
    let drafts = {};
    let contributions = {};
    let selectedAnswers = {};
    let activeSlide = 0;
    const draftTimers = new Map();
    const characters = ["'", "à", "è", "ì", "ò", "ù", "È"];
    const questionWriterSelect = document.getElementById("question-writer-select");
    const answerWriterSelect = document.getElementById("answer-writer-select");
    const statusMessage = document.getElementById("status-message");
    document.body.classList.toggle("teacher-view", isTeacherView);
    const badge = document.getElementById("user-badge");
    if (groupName && isTeacherView) badge.textContent = `👩‍🏫 Insegnante · ${groupName}`;
    else if (groupName && studentName) badge.textContent = `👤 ${groupName} · ${studentName}`;
    else badge.hidden = true;
    document.querySelectorAll("a[href]").forEach(link => {
      const href = link.getAttribute("href");
      if (!href || href.startsWith("http") || href.startsWith("#")) return;
      try {
        const target = new URL(href, location.href);
        if (groupName) target.searchParams.set("gruppo", groupName);
        if (studentName) target.searchParams.set("nome", studentName);
        link.href = `${target.pathname}${target.search}${target.hash}`;
      } catch (_) {}
    });

    function canEdit(role) {
      const assigned = assignmentState[role];
      if (!assigned) return false;
      if (assigned === teacherKey) return isTeacherView;
      return !isTeacherView && assigned === studentName;
    }
    function updateAssignmentMenus() {
      [questionWriterSelect, answerWriterSelect].forEach((select, index) => {
        const role = index === 0 ? "questionWriter" : "answerWriter";
        const chosen = assignmentState[role] || "";
        select.replaceChildren(new Option("— Nessuno selezionato —", ""));
        select.add(new Option(`👩‍🏫 ${teacherName}`, teacherKey));
        const online = roster.filter(person => onlineStudents.has(person.nome));
        const offline = roster.filter(person => !onlineStudents.has(person.nome));
        if (online.length) {
          const group = document.createElement("optgroup");
          group.label = "🟢 Studenti online";
          online.forEach(person => group.appendChild(new Option(`🟢 ${person.nome}`, person.nome)));
          select.appendChild(group);
        }
        if (offline.length) {
          const group = document.createElement("optgroup");
          group.label = "Studenti offline";
          offline.forEach(person => group.appendChild(new Option(person.nome, person.nome)));
          select.appendChild(group);
        }
        select.value = chosen;
      });
    }
    function updateOnlineStudents(data) {
      onlineStudents = new Set();
      Object.values(data || {}).forEach(person => Object.values(person || {}).forEach(connection => {
        if (connection?.name) onlineStudents.add(connection.name);
      }));
      updateAssignmentMenus();
      renderSlide();
    }
    function loadRoster() {
      if (!groupName || !window.firebase) return;
      const groupId = groupName.replace(/[.#$\/\[\]]/g, "_");
      firebase.database().ref(`configurazioneScuola/gruppi/${groupId}`).on("value", snapshot => {
        const group = snapshot.val() || {};
        const active = Object.values(group.studenti || {}).filter(student => student?.nome);
        const inactive = Object.values(group.studentiInattivi || {}).filter(student => student?.nome && Number(student.unitNumber ?? group.unitNumber ?? 0) >= 13);
        roster = [...active, ...inactive].filter((person, index, list) => list.findIndex(item => item.nome === person.nome) === index);
        roster.sort((a, b) => a.nome.localeCompare(b.nome, "it"));
        updateAssignmentMenus();
      });
    }
    function registerPresence() {
      if (!answersRef || !studentName) return;
      const safeName = studentName.replace(/[.#$\/\[\]]/g, "_");
      presenceRef = answersRef.child("presence").child(safeName).child(clientId);
      firebase.database().ref(".info/connected").on("value", snapshot => {
        if (snapshot.val() !== true) return;
        presenceRef.onDisconnect().remove().then(() => presenceRef.set({ name: studentName, connectedAt: Date.now() }));
      });
    }
    function formatDate(timestamp) {
      const date = new Date(Number(timestamp) || 0);
      if (Number.isNaN(date.getTime())) return "Data non disponibile";
      return new Intl.DateTimeFormat("it-IT", { dateStyle: "short", timeStyle: "short" }).format(date);
    }
    function makeCharacterToolbar(field) {
      const toolbar = document.createElement("div");
      toolbar.className = "character-toolbar";
      toolbar.setAttribute("role", "group");
      toolbar.setAttribute("aria-label", "Caratteri speciali italiani");
      characters.forEach(character => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = character;
        button.setAttribute("aria-label", `Inserisci ${character === "'" ? "apostrofo" : character}`);
        button.addEventListener("mousedown", event => event.preventDefault());
        button.addEventListener("click", () => {
          if (field.disabled) return;
          const start = field.selectionStart ?? field.value.length;
          const end = field.selectionEnd ?? start;
          field.setRangeText(character, start, end, "end");
          field.dispatchEvent(new Event("input", { bubbles: true }));
          field.focus();
        });
        toolbar.appendChild(button);
      });
      return toolbar;
    }
    function renderContributions(item, parent) {
      const list = document.createElement("div");
      list.className = "contributions";
      const records = Object.entries(contributions[item.id] || {}).map(([id, entry]) => ({ id, ...entry }))
        .sort((a, b) => Number(a.timestamp || 0) - Number(b.timestamp || 0) || a.id.localeCompare(b.id));
      if (!records.length) {
        const empty = document.createElement("p");
        empty.className = "contributions-empty";
        empty.textContent = "Nessuna domanda inviata per questa scheda.";
        list.appendChild(empty);
      } else {
        records.forEach(record => {
          const card = document.createElement("div");
          card.className = "contribution";
          const meta = document.createElement("span");
          meta.className = "contribution-meta";
          meta.textContent = `${record.author || "Partecipante"} · ${formatDate(record.timestamp)}`;
          const text = document.createElement("span");
          text.textContent = record.text || "";
          card.append(meta, text);
          list.appendChild(card);
        });
      }
      parent.appendChild(list);
    }
    function renderSlide() {
      const item = questionsData[activeSlide];
      const container = document.getElementById("slide-container");
      const focusedInput = document.activeElement?.id === `question-draft-${item.id}`;
      const currentValue = focusedInput ? document.activeElement.value : (drafts[item.id] || "");
      container.replaceChildren();
      const box = document.createElement("article");
      box.className = "slide-item";
      const title = document.createElement("h2");
      title.className = "question-title";
      title.textContent = `${item.num} ${item.question}`;
      const questionLabel = document.createElement("label");
      questionLabel.className = "formulated-question-label";
      questionLabel.htmlFor = `question-draft-${item.id}`;
      questionLabel.textContent = "✍️ Formula una domanda corrispondente:";
      const input = document.createElement("textarea");
      input.id = questionLabel.htmlFor;
      input.className = "formulated-question-input";
      input.rows = 3;
      input.placeholder = "Scrivi qui la domanda...";
      input.value = currentValue;
      input.disabled = !canEdit("questionWriter");
      const toolbar = makeCharacterToolbar(input);
      toolbar.hidden = input.disabled;
      input.addEventListener("input", () => {
        drafts[item.id] = input.value;
        submit.disabled = !canEdit("questionWriter") || !input.value.trim();
        clearTimeout(draftTimers.get(item.id));
        draftTimers.set(item.id, setTimeout(() => {
          draftTimers.delete(item.id);
          if (canEdit("questionWriter") && answersRef) answersRef.child(`tokenData/questionDrafts/${item.id}`).set(input.value);
        }, 250));
      });
      const submit = document.createElement("button");
      submit.type = "button";
      submit.className = "submit-contribution";
      submit.textContent = "Invia domanda";
      submit.disabled = !canEdit("questionWriter") || !currentValue.trim();
      submit.addEventListener("click", async () => {
        const text = input.value.trim();
        if (!text || !canEdit("questionWriter") || !answersRef) return;
        submit.disabled = true;
        try {
          const author = isTeacherView ? teacherName : studentName;
          await answersRef.child(`tokenData/contributions/${item.id}`).push({ author, text, timestamp: firebase.database.ServerValue.TIMESTAMP });
          drafts[item.id] = "";
          await answersRef.child(`tokenData/questionDrafts/${item.id}`).set("");
          statusMessage.textContent = "Domanda inviata e aggiunta ai contributi.";
          renderSlide();
        } catch (_) {
          statusMessage.textContent = "Impossibile inviare la domanda. Controlla la connessione.";
          submit.disabled = false;
        }
      });
      const assignment = document.createElement("p");
      assignment.className = "assignment-status";
      const questionTurn = assignmentState.questionWriter === teacherKey ? `Domanda: ${teacherName}` : assignmentState.questionWriter ? `Domanda: ${assignmentState.questionWriter}` : "Domanda: turno non assegnato";
      const answerTurn = assignmentState.answerWriter === teacherKey ? `Risposta: ${teacherName}` : assignmentState.answerWriter ? `Risposta: ${assignmentState.answerWriter}` : "Risposta: turno non assegnato";
      assignment.textContent = `${questionTurn} · ${answerTurn}`;
      box.append(title, questionLabel, toolbar, input, submit);
      renderContributions(item, box);
      const options = document.createElement("div");
      options.className = "options-group";
      const hasAnswer = selectedAnswers[item.id] !== undefined && selectedAnswers[item.id] !== null;
      const selected = hasAnswer ? Number(selectedAnswers[item.id]) : null;
      item.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option-btn";
        button.textContent = `${String.fromCharCode(97 + index)}) ${option}`;
        if (selected === index) {
          button.classList.add("selected", index === item.correct ? "correct" : "incorrect");
        }
        button.disabled = !canEdit("answerWriter");
        button.addEventListener("click", async () => {
          if (!canEdit("answerWriter") || !answersRef) return;
          const previousAnswer = selectedAnswers[item.id];
          selectedAnswers[item.id] = index;
          statusMessage.textContent = "";
          renderSlide();
          try {
            await answersRef.child(`tokenData/answers/${item.id}`).set(index);
          } catch (_) {
            selectedAnswers[item.id] = previousAnswer;
            statusMessage.textContent = "Impossibile salvare la risposta.";
            renderSlide();
          }
        });
        options.appendChild(button);
      });
      if (hasAnswer) {
        const feedback = document.createElement("p");
        const isCorrect = selected === item.correct;
        feedback.className = `answer-feedback ${isCorrect ? "correct" : "incorrect"}`;
        feedback.setAttribute("role", "status");
        feedback.textContent = isCorrect ? "✓ Risposta corretta!" : "✕ Risposta non corretta.";
        options.appendChild(feedback);
      }
      box.append(assignment, options);
      container.appendChild(box);
      renderProgress();
      if (focusedInput) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }
    function renderProgress() {
      const steps = document.getElementById("progress-steps");
      steps.replaceChildren();
      questionsData.forEach((item, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "progress-step";
        button.textContent = String(index + 1);
        button.setAttribute("aria-label", `Vai alla domanda ${index + 1}`);
        button.setAttribute("aria-current", index === activeSlide ? "step" : "false");
        button.addEventListener("click", () => goToSlide(index));
        steps.appendChild(button);
      });
      document.getElementById("progress-count").textContent = `${activeSlide + 1} / ${questionsData.length}`;
      document.getElementById("progress-bar").style.width = `${((activeSlide + 1) / questionsData.length) * 100}%`;
      document.getElementById("slide-position").textContent = `Domanda ${activeSlide + 1} di ${questionsData.length}`;
      document.getElementById("previous-slide").disabled = activeSlide === 0;
      document.getElementById("next-slide").disabled = activeSlide === questionsData.length - 1;
    }
    function goToSlide(index) {
      if (draftTimers.has(questionsData[activeSlide].id)) {
        clearTimeout(draftTimers.get(questionsData[activeSlide].id));
        draftTimers.delete(questionsData[activeSlide].id);
        const oldInput = document.getElementById(`question-draft-${questionsData[activeSlide].id}`);
        if (oldInput && canEdit("questionWriter") && answersRef) answersRef.child(`tokenData/questionDrafts/${questionsData[activeSlide].id}`).set(oldInput.value);
      }
      activeSlide = Math.max(0, Math.min(questionsData.length - 1, index));
      statusMessage.textContent = "";
      renderSlide();
    }
    document.getElementById("previous-slide").addEventListener("click", () => goToSlide(activeSlide - 1));
    document.getElementById("next-slide").addEventListener("click", () => goToSlide(activeSlide + 1));
    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey || ["INPUT", "TEXTAREA", "SELECT", "BUTTON", "A"].includes(document.activeElement.tagName)) return;
      if (event.key === "ArrowRight" && activeSlide < questionsData.length - 1) goToSlide(activeSlide + 1);
      if (event.key === "ArrowLeft" && activeSlide > 0) goToSlide(activeSlide - 1);
    });
    function saveAssignment(role, value) {
      if (!isTeacherView || !answersRef) return;
      assignmentState[role] = value;
      answersRef.child(`controlAssignments/${role}`).set(value || null);
      renderSlide();
    }
    questionWriterSelect.addEventListener("change", event => saveAssignment("questionWriter", event.target.value));
    answerWriterSelect.addEventListener("change", event => saveAssignment("answerWriter", event.target.value));

    if (window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        answersRef = firebase.database().ref(databasePath);
        loadRoster();
        registerPresence();
        answersRef.on("value", snapshot => {
          const data = snapshot.val() || {};
          const previousAssignments = assignmentState;
          assignmentState = {
            questionWriter: data.controlAssignments?.questionWriter || "",
            answerWriter: data.controlAssignments?.answerWriter || ""
          };
          const assignmentsChanged = previousAssignments.questionWriter !== assignmentState.questionWriter
            || previousAssignments.answerWriter !== assignmentState.answerWriter;
          const token = data.tokenData || {};
          drafts = { ...drafts, ...(token.questionDrafts || {}) };
          contributions = token.contributions || {};
          selectedAnswers = token.answers || {};
          updateAssignmentMenus();
          const focusedDraft = document.activeElement?.id === `question-draft-${questionsData[activeSlide].id}`;
          if (!focusedDraft || assignmentsChanged) renderSlide();
        });
        if (groupName) {
          answersRef.child("presence").on("value", snapshot => updateOnlineStudents(snapshot.val() || {}));
        }
      } catch (error) { console.error("Errore Firebase:", error); }
    }
    renderSlide();
  </script>
  <script src="../classroom-notes.js"></script>
</body>
</html>
