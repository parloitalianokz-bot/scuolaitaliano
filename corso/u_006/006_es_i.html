  <link rel="stylesheet" href="../shared/theme.css?v=2" />

<body data-page-key="006_es_i">
  <main class="container">
    <div id="unit-navigation"></div>
    <script src="./006_unit-nav.js?v=2"></script>

    <header class="hero">
      <span class="eyebrow">Unità 6 · Produzione scritta</span>
      <h1>Il mio migliore amico</h1>
      <p class="hero-subtitle">Trasforma le frasi usando essere.</p>
    </header>

    <section class="instruction-box" lang="ru">
      <div class="instruction-title">💡 Задание · Esercizio I</div>
      <div class="instruction-text">
        👉 <strong>Измените предложения по образцу:</strong><br />
        Marco ha i capelli biondi. → Marco è biondo.
        <br /><span lang="it"><strong>Trasforma le frasi come nell’esempio.</strong> Usa «essere» e fai attenzione all’accordo.</span>
      </div>
    </section>
    <p id="mode-note" class="mode-note" role="status" aria-live="polite"></p>

    <section class="card" aria-label="Trasforma le frasi usando essere">
      <div id="connection-banner" class="connection-banner" role="alert" aria-live="assertive" hidden></div>
      <nav id="exercise-progress" class="overall-progress" aria-label="Vai direttamente alla frase"></nav>
      <div id="questions-container"></div>
      <nav class="slide-navigation student-navigation" aria-label="Navigazione delle frasi">
        <button id="previous-question" type="button">← Precedente</button>
        <span id="question-progress" class="slide-progress" aria-live="polite"></span>
        <button id="next-question" type="button">Successiva →</button>
      </nav>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../shared/group-scope.js?v=6"></script>
  <script src="../shared/exercise-core.js?v=8"></script>
  <script src="../shared/exercise-modes.js?v=4"></script>
  <script src="../shared/inbox-exercise.js?v=2"></script>
  <script>
    const session = window.ParloSession || {};
    const modeDescriptions = {
      online: "💬 Modalità online: rispondi durante il tuo turno; domande e risposte sono condivise con il gruppo.",

      individual: "🏋️ Modalità allenamento: esercitati autonomamente nel tuo spazio personale."
    };
    document.getElementById("mode-note").textContent = modeDescriptions[session.activityMode] || modeDescriptions.online;

    const transformationHints = [
      "Перестройте предложение по образцу, используя глагол «essere».",
      "Используйте прилагательное и согласуйте его с подлежащим по роду и числу."
    ];

    ParloInboxExercise.init({
      unitNumber: 6,
      exercisePath: "006_es_i",
      questions: [
        { key: "q1", title: "1) Bernardo ha i capelli neri.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q2", title: "2) Paola ha i capelli castani.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q3", title: "3) Mia sorella ha i capelli biondi.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q4", title: "4) Carla e Anna hanno i capelli neri.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q5", title: "5) Il nonno non ha capelli.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q6", title: "6) Valeria ha i capelli rossi.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q7", title: "7) La signora Paoli e la signora Carli hanno i capelli biondi.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q8", title: "8) Bernardo e Luca hanno i capelli neri.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q9", title: "9) Mio padre ha i capelli castani.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q10", title: "10) Il nonno e lo zio non hanno capelli.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q11", title: "11) Paola e Laura hanno i capelli castani.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints },
        { key: "q12", title: "12) Bruno ha i capelli neri.", placeholder: "Riscrivi la frase usando «essere».", hints: transformationHints }
      ]
    });
  </script>
