<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Accesso insegnanti alle unità di italiano">
  <title>Accesso insegnanti — Italiano</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --green: #2f5739;
      --green-light: #edf4ed;
      --accent: #bd694d;
      --text: #292d28;
      --muted: #6b7069;
      --paper: #fffefa;
    }
    * { box-sizing: border-box; }
    :focus-visible { outline: 3px solid rgba(189, 105, 77, .55); outline-offset: 3px; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      display: grid;
      place-items: center;
      color: var(--text);
      background: #f3f5f1;
    }
    main { width: min(100%, 480px); margin: 0 auto; }
    header { margin: 0 0 24px; text-align: center; }
    .eyebrow {
      display: inline-block;
      margin-bottom: 14px;
      padding: 8px 15px;
      border-radius: 20px;
      background: rgba(255,254,250,.9);
      color: var(--green);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    h1 { margin: 0; color: var(--green); font-size: clamp(2rem,6vw,2.8rem); letter-spacing: -.045em; line-height: 1.1; }
    header p { margin: 14px 0 0; color: var(--muted); font-size: 1.08rem; }
    .login-layout {
      overflow: hidden;
      border: 1px solid #e0e6dd;
      border-radius: 20px;
      background: var(--paper);
      box-shadow: 0 12px 32px rgba(43,69,46,.08);
    }
    .login-form { padding: clamp(24px,6vw,36px); }
    h2 { margin: 0 0 22px; color: var(--green); font-size: 1.3rem; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; color: var(--green); font-size: .9rem; font-weight: 700; }
    select {
      width: 100%;
      min-height: 44px;
      padding: 8px 12px;
      border: 1.5px solid #d4e1d5;
      border-radius: 9px;
      background: #fff;
      font: inherit;
      font-size: .95rem;
    }
    .google-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 10px;
      border: 1px solid #dadce0;
      border-radius: 12px;
      background: #fff;
      color: #3c4043;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .google-button::before { content: "G"; color: #4285f4; font: 800 1.25rem Arial,sans-serif; }
    .google-button:hover { border-color: #c6c9cc; background: #f8f9fa; }
    .google-button:disabled { opacity: .55; cursor: wait; }
    .message { margin: 14px 0 0; padding: 10px 14px; border-radius: 10px; font-size: .9rem; font-weight: 700; }
    .message.error { background: #fde8e7; color: #b42318; }
    .message[hidden] { display: none; }
    .back-link { display: inline-block; margin-top: 20px; color: var(--accent); font-weight: 700; text-decoration: underline; }
    @media (max-width:700px) {
      body { padding:20px 12px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <span class="eyebrow">Area riservata</span>
      <h1>Accesso insegnanti</h1>
      <p>Seleziona il tuo profilo e il gruppo per continuare.</p>
    </header>
    <section class="login-layout" aria-label="Accesso insegnanti">
      <div class="login-form">
        <h2>👩‍🏫 Accedi con Google</h2>
        <div class="form-group">
          <label for="teacher-name">Insegnante</label>
          <select id="teacher-name">
            <option value="">— Seleziona insegnante —</option>
            <option value="Antonio">Antonio</option>
            <option value="Assel">Assel</option>
          </select>
        </div>
        <div class="form-group">
          <label for="teacher-group">Gruppo</label>
          <select id="teacher-group" disabled>
            <option value="">Caricamento gruppi…</option>
          </select>
        </div>
        <div class="form-group">
          <label for="activity-mode">Modalità di accesso</label>
          <select id="activity-mode">
            <option value="online">Lezione online · pagine condivise</option>
            <option value="distance">Controllo lavoro a distanza · revisione per studente</option>
          </select>
        </div>
        <button type="button" id="login-button" class="google-button" disabled>Accedi con Google</button>
        <p id="login-message" class="message" role="alert" hidden></p>
        <a class="back-link" href="index.html">← Torna all’accesso studenti</a>
      </div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBbOOnXPeSgqV_oT7uXdAEioU4Ha9nkbSY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      storageBucket: "esercizi-parlo-italiano.firebasestorage.app",
      messagingSenderId: "499443551452",
      appId: "1:499443551452:web:0e05cb85de9f9ade897819"
    };
    const authorizedEmail = "parloitaliano.kz@gmail.com";
    const teacherSelect = document.getElementById("teacher-name");
    const groupSelect = document.getElementById("teacher-group");
    const activitySelect = document.getElementById("activity-mode");
    const loginButton = document.getElementById("login-button");
    const loginMessage = document.getElementById("login-message");

    function updateButton() {
      loginButton.disabled = !(teacherSelect.value && groupSelect.value);
    }
    function showError(message) {
      loginMessage.textContent = message;
      loginMessage.hidden = false;
    }

    try {
      firebase.initializeApp(firebaseConfig);
      firebase.database().ref("configurazioneScuola/gruppi").once("value").then(snapshot => {
        const cloudGroups = snapshot.val() || {};
        const legacyIds = { Cremona: "Cr01", Roma: "Ro01", Milano: "Mi01", Venezia: "Ve01", Genova: "Ge01" };
        const groups = Object.entries(cloudGroups)
          .filter(([, group]) => group && typeof group === "object" && group.attivo !== false)
          .map(([key, group]) => ({ id: group.id || legacyIds[key] || key, name: group.nome || key }))
          .sort((a, b) => a.name.localeCompare(b.name, "it"));
        groupSelect.replaceChildren(new Option("— Seleziona un gruppo —", ""));
        groups.forEach(group => groupSelect.add(new Option(group.name, group.id)));
        groupSelect.disabled = groups.length === 0;
        if (!groups.length) groupSelect.replaceChildren(new Option("Nessun gruppo disponibile", ""));
        updateButton();
      }).catch(() => {
        groupSelect.replaceChildren(new Option("Impossibile caricare i gruppi", ""));
        showError("Impossibile caricare i gruppi. Controlla la connessione e ricarica la pagina.");
      });
    } catch (_) {
      showError("Servizio di accesso non disponibile. Ricarica la pagina e riprova.");
    }

    teacherSelect.addEventListener("change", updateButton);
    groupSelect.addEventListener("change", updateButton);
    loginButton.addEventListener("click", async () => {
      loginMessage.hidden = true;
      loginButton.disabled = true;
      loginButton.textContent = "Accesso Google…";
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: "select_account" });
        const result = await firebase.auth().signInWithPopup(provider);
        const email = result.user?.email?.trim().toLowerCase();
        if (email !== authorizedEmail) {
          await firebase.auth().signOut();
          showError("Questo account Google non è autorizzato come docente.");
          return;
        }
        localStorage.setItem("parlo_session", JSON.stringify({
          loginVerified: true,
          isTeacher: true,
          teacher: teacherSelect.value,
          group: groupSelect.value,
          name: teacherSelect.value,
          studentPinVerified: false,
          activityMode: activitySelect.value === "distance" ? "distance" : "online"
        }));
        window.location.replace("index.html");
      } catch (error) {
        const message = error?.code === "auth/popup-closed-by-user"
          ? "Accesso Google annullato."
          : "Impossibile accedere con Google. Verifica che Google sia abilitato in Firebase Authentication.";
        showError(message);
      } finally {
        loginButton.textContent = "Accedi con Google";
        updateButton();
      }
    });
  </script>
</body>
</html>
