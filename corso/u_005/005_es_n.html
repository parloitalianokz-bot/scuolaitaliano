<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Guarda il video e rispondi alle domande sull’appartamento di Lorenzo, Unità 5, Esercizio N." />
  <title>Unità 5 — L’appartamento di Lorenzo · Esercizio N</title>
  <link rel="stylesheet" href="../shared/theme.css?v=2" />
  <link rel="stylesheet" href="../shared/inbox-exercise.css?v=1" />
  <link rel="stylesheet" href="fondo.css?v=1" />
  <style>
    .mode-note { margin: 0 0 12px; padding: 11px 14px; border: 1px solid #d8e5d8; border-radius: 11px; background: var(--primary-light); color: var(--primary-dark); line-height: 1.5; }
    .video-card { margin: 0 0 20px; padding: 18px; border: 1px solid #d8e5d8; border-radius: 16px; background: rgba(255, 254, 250, .97); box-shadow: 0 6px 18px rgba(43, 69, 46, .05); }
    .video-card h2 { margin: 0 0 12px; color: var(--primary-dark); font-size: 1.15rem; }
    .video-frame { overflow: hidden; width: 100%; aspect-ratio: 16 / 9; border-radius: 12px; background: #18211a; }
    .video-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
    .unit-gate { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 16px; padding: 14px; border: 1px solid #d8e5d8; border-radius: 14px; background: #f8faf6; }
    .unit-gate[hidden] { display: none; }
    .unit-gate a, .unit-gate button { min-height: 42px; padding: 8px 15px; border: 1px solid #d8e5d8; border-radius: 10px; background: #fff; color: var(--primary-dark); font: inherit; font-weight: 800; text-decoration: none; cursor: pointer; }
    .unit-gate a[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
    .unit-gate button { background: var(--primary); color: #fff; }
    .unit-gate button:disabled { opacity: .5; cursor: wait; }
    #unit-next-status { color: var(--text-muted); font-size: .88rem; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation: none !important; } }
  </style>
</head>
<body data-page-key="005_es_n">
  <main class="container">
    <div id="unit-navigation"></div>
    <script src="./unit-nav.js"></script>

    <header class="hero">
      <span class="eyebrow">Unità 5 · Ascolto e comprensione</span>
      <h1>L’appartamento di Lorenzo</h1>
      <p class="hero-subtitle">Guarda il video e rispondi alle domande.</p>
    </header>

    <section class="instruction-box" lang="ru">
      <div class="instruction-title">💡 Задание · Esercizio N</div>
      <div class="instruction-text">Посмотрите видео, затем ответьте на вопросы полными предложениями.</div>
    </section>
    <p id="mode-note" class="mode-note" role="status" aria-live="polite"></p>

    <section class="video-card" aria-labelledby="video-title">
      <h2 id="video-title">🎬 Guarda il video</h2>
      <div class="video-frame">
        <iframe src="https://www.youtube.com/embed/eemYqyGAH6s?si=GBHfihomeE3Ib40s" title="Video sull’appartamento di Lorenzo" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
    </section>

    <section class="card" aria-label="Domande sul video">
      <div id="connection-banner" class="connection-banner" role="alert" aria-live="assertive" hidden></div>
      <nav id="exercise-progress" class="overall-progress" aria-label="Vai direttamente a una domanda"></nav>
      <div id="questions-container"></div>
      <nav class="slide-navigation student-navigation" aria-label="Navigazione delle domande">
        <button id="previous-question" type="button">← Precedente</button>
        <span id="question-progress" class="slide-progress" aria-live="polite"></span>
        <button id="next-question" type="button">Successiva →</button>
      </nav>
      <section id="unit-gate" class="unit-gate" aria-label="Accesso all’Unità 6" hidden>
        <a id="unit-next-link" href="../u_006/006_lettura.html" aria-disabled="true" tabindex="-1">Vai all’Unità 6 →</a>
        <button id="unlock-unit-next" type="button" hidden>Abilita l’Unità 6</button>
        <span id="unit-next-status" role="status" aria-live="polite">Verifica dell’autorizzazione…</span>
      </section>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../shared/group-scope.js?v=6"></script>
  <script src="../shared/exercise-core.js?v=8"></script>
  <script src="../shared/exercise-modes.js?v=4"></script>
  <script src="../shared/inbox-exercise.js?v=2"></script>
  <script>
    const session = window.ParloSession || {};
    const modeDescriptions = {
      online: "💬 Modalità online: rispondi durante il tuo turno; domande e risposte sono condivise con il gruppo.",
      distance: "🎙️ Modalità a distanza: rispondi individualmente; le risposte sono disponibili per la revisione dell’insegnante.",
      individual: "🏋️ Modalità allenamento: esercitati autonomamente nel tuo spazio personale."
    };
    document.getElementById("mode-note").textContent = modeDescriptions[session.activityMode] || modeDescriptions.online;

    const answerHints = [
      "Посмотрите видео ещё раз и найдите нужную информацию.",
      "Ответьте по-итальянски полным предложением."
    ];

    ParloInboxExercise.init({
      unitNumber: 5,
      exercisePath: "005_es_n",
      questions: [
        { key: "q1", title: "1) Lorenzo abita in centro?", placeholder: "Sì, Lorenzo... / No, Lorenzo...", hints: answerHints },
        { key: "q2", title: "2) A che piano abita?", placeholder: "Abita al... piano.", hints: answerHints },
        { key: "q3", title: "3) Con chi abita?", placeholder: "Abita con...", hints: answerHints },
        { key: "q4", title: "4) In camera c’è molta confusione?", placeholder: "Sì, in camera... / No, in camera...", hints: answerHints },
        { key: "q5", title: "5) In bagno c’è la vasca da bagno?", placeholder: "Sì, in bagno... / No, in bagno...", hints: answerHints },
        { key: "q6", title: "6) Com’è la cucina?", placeholder: "La cucina è...", hints: answerHints },
        { key: "q7", title: "7) Quanti balconi ci sono nel suo appartamento?", placeholder: "Nel suo appartamento ci sono...", hints: answerHints },
        { key: "q8", title: "8) Dove bevono il caffè i due amici?", placeholder: "I due amici bevono il caffè...", hints: answerHints }
      ]
    });

    (() => {
      const session = window.ParloSession || {};
      const safeGroup = session.safeGroup || "";
      const isTeacher = Boolean(session.isTeacher);
      const unitGate = document.getElementById("unit-gate");
      const unlockBtn = document.getElementById("unlock-unit-next");
      const nextLink = document.getElementById("unit-next-link");
      const statusEl = document.getElementById("unit-next-status");
      const progressBar = document.getElementById("exercise-progress");
      const targetUnit = 6;
      let groupUnitNumber = 0;
      let db = null;
      let groupRef = null;

      function syncGateVisibility() {
        const steps = progressBar ? [...progressBar.querySelectorAll(".progress-step")] : [];
        const lastStep = steps[steps.length - 1];
        unitGate.hidden = !lastStep || lastStep.getAttribute("aria-current") !== "step";
      }

      function renderGateState() {
        const unlocked = groupUnitNumber >= targetUnit;
        nextLink.setAttribute("aria-disabled", String(!unlocked));
        nextLink.tabIndex = unlocked ? 0 : -1;
        unlockBtn.hidden = !isTeacher || !safeGroup || safeGroup === "sconosciuto" || unlocked;
        statusEl.textContent = unlocked
          ? "Unità 6 abilitata per il gruppo."
          : isTeacher
            ? "L’Unità 6 è disabilitata per il gruppo."
            : "Unità 6 disabilitata: attendi l’autorizzazione dell’insegnante.";
      }

      nextLink.addEventListener("click", event => {
        if (groupUnitNumber < targetUnit) event.preventDefault();
      });

      if (window.firebase && safeGroup && safeGroup !== "sconosciuto") {
        db = window.ParloModes ? ParloModes.initFirebase() : firebase.database();
        if (db) {
          groupRef = db.ref(`configurazioneScuola/gruppi/${safeGroup}`);
          groupRef.child("unitNumber").on("value", snapshot => {
            groupUnitNumber = Number(snapshot.val()) || 0;
            renderGateState();
          }, () => {
            statusEl.textContent = "Impossibile verificare l’autorizzazione per l’Unità 6.";
          });

          unlockBtn.addEventListener("click", async () => {
            if (!isTeacher || !groupRef || groupUnitNumber >= targetUnit) return;
            unlockBtn.disabled = true;
            statusEl.textContent = "Salvataggio dell’autorizzazione…";
            try {
              const result = await groupRef.child("unitNumber").transaction(current =>
                Math.max(Number(current) || 0, targetUnit)
              );
              if (!result.committed) throw new Error("Aggiornamento non completato");
              const unlockedUnit = Number(result.snapshot.val()) || targetUnit;
              await db.ref(`esercizi/gruppi/${safeGroup}/unitNumber`).transaction(current =>
                Math.max(Number(current) || 0, unlockedUnit)
              );
              groupUnitNumber = unlockedUnit;
              renderGateState();
            } catch (_) {
              statusEl.textContent = "Errore durante l’abilitazione dell’Unità 6.";
            } finally {
              unlockBtn.disabled = false;
            }
          });
        }
      } else {
        statusEl.textContent = "Accedi con un gruppo per verificare l’autorizzazione all’Unità 6.";
      }

      if (progressBar) {
        new MutationObserver(syncGateVisibility).observe(progressBar, {
          subtree: true,
          attributes: true,
          attributeFilter: ["aria-current"]
        });
        syncGateVisibility();
      }
    })();
  </script>
  <script src="../classroom-notes.js"></script>
</body>
</html>
