<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 1 — Completa i dialoghi (Esercizio G)</title>
  <link rel="stylesheet" href="../shared/theme.css?v=2" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      color: var(--text);
      background:
        linear-gradient(rgba(250, 248, 241, .78), rgba(250, 248, 241, .78)),
        url("img/sfondo.jpeg") center calc(50% - var(--background-offset, 0px)) / cover fixed,
        radial-gradient(ellipse at 50% -12%, rgba(111, 151, 116, .18), transparent 42%),
        var(--bg-main);
    }

    .container { width: min(100%, 880px); margin: 0 auto; }

    .hero {
      position: relative; isolation: isolate; overflow: hidden; margin: 8px 0 20px; padding: 24px 20px 22px;
      text-align: center; border: 1px solid rgba(71, 119, 85, .13); border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 254, 250, .94), rgba(242, 247, 239, .91));
      box-shadow: 0 12px 32px rgba(43, 69, 46, .07);
    }
    .eyebrow {
      display: inline-block; color: var(--primary-dark); font-size: .78rem; font-weight: 800;
      letter-spacing: .09em; text-transform: uppercase; background: #eaf1e8; padding: 7px 14px;
      border-radius: 20px; margin-bottom: 8px; box-shadow: inset 0 0 0 1px rgba(71, 119, 85, .11);
    }
    h1 { margin: 4px 0; color: var(--primary-dark); font-size: clamp(1.85rem, 5vw, 2.55rem); letter-spacing: -.04em; line-height: 1.12; }
    .hero-subtitle { margin: 6px 0 0; color: var(--text-muted); font-size: .96rem; }

    .instruction-box {
      background: #fff; border: 1px solid #d8e5d8; border-left: 5px solid var(--accent);
      border-radius: 16px; padding: 14px 18px; margin-bottom: 20px; box-shadow: 0 6px 18px rgba(43, 69, 46, .04);
    }
    .instruction-title { font-size: .82rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 4px; }
    .instruction-text { font-size: .96rem; color: var(--text); line-height: 1.45; }

    .card {
      padding: clamp(18px, 4vw, 30px); border: 1px solid var(--border); border-radius: 26px;
      background: var(--card-bg); box-shadow: 0 22px 60px rgba(43, 69, 46, .11); margin-bottom: 24px;
    }

    .connection-banner {
      margin: 0 0 16px; padding: 11px 15px; border: 1px solid #f5c2c0; border-radius: 12px;
      background: #fde8e7; color: #991b1b; font-size: .9rem; font-weight: 700;
    }
    .connection-banner[hidden] { display: none; }

    .overall-progress {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(38px, 1fr));
      gap: 6px;
      width: 100%;
      margin: 0 0 18px;
    }
    .progress-step {
      min-width: 0; min-height: 40px; padding: 4px; border: 1.5px solid #d8e5d8;
      border-radius: 10px; background: #fff; color: var(--primary-dark);
      font: inherit; font-size: .86rem; font-weight: 800; cursor: pointer;
      transition: background .18s, border-color .18s, color .18s;
    }
    .progress-step:hover { border-color: var(--primary); background: var(--primary-light); }
    .progress-step.done { border-color: #6ab082; background: #e5f5ea; color: #17623c; }
    .progress-step[aria-current="step"] {
      border-color: var(--primary-dark); background: var(--primary); color: #fff;
      box-shadow: 0 3px 10px rgba(71, 119, 85, .25);
    }

    .section-box {
      display: flex; flex-direction: column; gap: 16px; padding: 20px; border: 1px solid var(--border);
      border-radius: 20px; background: #fff; box-shadow: 0 6px 18px rgba(43, 69, 46, .03);
    }
    .section-box[hidden] { display: none; }

    .section-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;
      padding-bottom: 12px; border-bottom: 1px solid #eef2ee;
    }
    .section-title {
      display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1;
      font-size: 1.12rem; font-weight: 800; line-height: 1.4; color: var(--primary-dark);
    }
    .number {
      display: inline-grid; flex-shrink: 0; width: 34px; height: 34px; place-items: center;
      border-radius: 10px; background: var(--primary); color: #fff; font-size: .92rem; font-weight: 800;
    }

    .turn-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px;
      border: 1px solid #dce6dc; border-radius: 999px; background: #f7faf7;
      color: var(--primary-dark); font-size: .82rem; font-weight: 700; white-space: nowrap;
    }
    .turn-pill.is-me {
      border-color: var(--accent); background: #fff3ed; color: #9c4a30;
      box-shadow: 0 0 0 2px rgba(189, 105, 77, .12);
    }

    .turn-assignment-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 12px 14px; border: 1px solid #d5e2d5; border-radius: 14px; background: #f3f8f3;
    }
    .turn-assignment-bar[hidden] { display: none; }
    .turn-assignment-bar label {
      color: var(--primary-dark); font-size: .82rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .turn-assignment-bar select {
      flex: 1; min-width: 210px; max-width: 360px; min-height: 38px; padding: 6px 10px;
      border: 1.5px solid #c7d8c8; border-radius: 10px; background: #fff;
      color: var(--text); font: inherit; font-size: .9rem; font-weight: 700; cursor: pointer;
    }

    .worksheet-card {
      padding: 14px 16px; border: 1.5px solid #dce8dc; border-radius: 16px; background: #f8faf6;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .worksheet-card.active-turn {
      border-color: var(--accent); background: #fffdfb; box-shadow: 0 0 0 3px rgba(189, 105, 77, .14);
    }
    .worksheet-header {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-bottom: 10px; flex-wrap: wrap;
    }
    .worksheet-label { color: var(--primary-dark); font-size: .92rem; font-weight: 800; }
    .turn-hint-tag { font-size: .8rem; font-weight: 700; color: var(--text-muted); }
    .worksheet-card.active-turn .turn-hint-tag { color: var(--accent); }

    .accent-toolbar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
    .accent-toolbar button {
      min-width: 34px; min-height: 32px; padding: 3px 9px; border: 1px solid #d4e1d5; border-radius: 8px;
      background: #fff; color: var(--primary-dark); font: inherit; font-size: .92rem; font-weight: 700; cursor: pointer;
    }
    .accent-toolbar button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .accent-toolbar button:disabled { cursor: not-allowed; opacity: .45; }

    .dialogue-turns-list { display: flex; flex-direction: column; gap: 14px; }
    .dialogue-turn { display: flex; flex-direction: column; gap: 6px; }
    .prompt-question {
      display: flex; align-items: flex-start; gap: 8px;
      color: var(--text); font-size: .97rem; font-weight: 700; line-height: 1.4;
    }
    .prompt-question::before { content: "🗣️"; font-size: .92rem; flex-shrink: 0; }

    textarea.student-reply {
      width: 100%; min-height: 54px; padding: 10px 13px; border: 1.5px solid #d4e1d5; border-radius: 11px;
      background: #fff; color: var(--text); font: inherit; font-size: .96rem; line-height: 1.45; resize: vertical;
    }
    textarea.student-reply:disabled { background: #f1f4f0; color: #475569; cursor: not-allowed; }

    .actions-row {
      display: flex; align-items: center; justify-content: flex-end; gap: 12px;
      flex-wrap: wrap; margin-top: 10px; min-height: 1.3em;
    }
    .sync-feedback { font-size: .84rem; font-weight: 700; color: var(--text-muted); }
    .sync-feedback.saving { color: #9a6700; }
    .sync-feedback.saved { color: #17623c; }
    .sync-feedback.error { color: #991b1b; }

    .slide-navigation {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px;
      padding-top: 14px; border-top: 1px solid var(--border);
    }
    .slide-navigation button, .slide-navigation a {
      min-height: 44px; padding: 8px 18px; border: 1px solid #d8e5d8; border-radius: 10px;
      background: #fff; color: var(--primary-dark); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; transition: all .2s;
    }
    .slide-navigation a { display: inline-flex; align-items: center; }
    .slide-navigation a[hidden] { display: none; }
    .slide-navigation button:hover:not(:disabled), .slide-navigation a:hover { background: var(--primary-light); border-color: var(--primary); }
    .slide-navigation button:disabled { cursor: not-allowed; opacity: .45; }
    .slide-progress { color: var(--primary-dark); font-size: .95rem; font-weight: 800; text-align: center; }

    @media (max-width: 680px) {
      body { padding: 16px 8px; }
      .section-box { padding: 14px; }
      .progress-step { min-height: 44px; }
      .slide-navigation { flex-direction: column; gap: 8px; }
      .slide-navigation button, .slide-navigation a { justify-content: center; width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>

    <nav class="top-exercises" aria-label="Menu dell’unità 1">
      <a id="home-link" class="home-link" href="../index.html" aria-label="Torna alla pagina iniziale" title="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z"/></svg>
      </a>
      <span id="user-badge" aria-live="polite"></span>
      <label class="visually-hidden" for="exercise-menu">Vai a una pagina dell’unità 1</label>
      <select id="exercise-menu">
        <option value="001_lettura.html">Lettura</option>
        <option value="001_es_a.html">Esercizio A</option>
        <option value="001_es_b.html">Esercizio B</option>
        <option value="001_es_c.html">Esercizio C</option>
        <option value="001_es_d.html">Esercizio D</option>

        <option value="001_es_f.html">Esercizio F</option>

    <header class="hero">

      <h1>Un albergo in centro</h1>
      <p class="hero-subtitle">Вставьте недостающие реплики в диалогах!</p>
    </header>

    <div class="instruction-box">
      <div class="instruction-title">💡 Задание · Esercizio G</div>
      <div class="instruction-text" lang="ru">Теперь подумайте и вставьте недостающие реплики в диалогах, используя информацию, которую вы уже изучили.</div>
    </div>

    <section class="card" aria-label="Dialoghi da completare">
      <div id="connection-banner" class="connection-banner" role="alert" aria-live="assertive" hidden></div>

      <nav id="exercise-progress" class="overall-progress" aria-label="Vai direttamente al dialogo"></nav>
      <div id="questions-container"></div>

      <nav class="slide-navigation student-navigation" aria-label="Navigazione dialoghi">
        <button id="previous-question" type="button">← Precedente</button>
        <span id="question-progress" class="slide-progress" aria-live="polite"></span>
        <button id="next-question" type="button">Successiva →</button>
        <a id="next-exercise" href="001_es_h.html" hidden>Vai all’esercizio H →</a>
      </nav>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../shared/group-scope.js?v=1"></script>
  <script src="../shared/exercise-core.js?v=8"></script>
  <script src="../shared/exercise-modes.js?v=2"></script>
  <script>
    (() => {
      "use strict";

      const UNIT_NUMBER = 1;
      const EXERCISE_PATH = "001_es_g";
      const SPECIAL_CHARS = ["à", "è", "é", "ì", "ò", "ù", "È"];

      const dialogues = [
        {
          id: "d1",
          title: "Dialogo 1 — Olga",
          questions: [
            { q: "Ciao Olga! Sei americana?", placeholder: "No, non sono americana; sono russa." },
            { q: "Tu lavori o sei studentessa?", placeholder: "Sono studentessa." },
            { q: "Sei sposata?", placeholder: "No, non sono sposata." },
            { q: "Perché sei in Italia?", placeholder: "Sono in Italia perché la moda italiana è molto bella." }
          ]
        },
        {
          id: "d2",
          title: "Dialogo 2 — Victor",
          questions: [
            { q: "Buongiorno Victor! Lei è straniero?", placeholder: "Sì, sono straniero; sono francese." },
            { q: "Lei lavora?", placeholder: "Sì, sono dentista." },
            { q: "Perché è in Italia?", placeholder: "Sono in Italia per studiare l'italiano." }
          ]
        },
        {
          id: "d3",
          title: "Dialogo 3 — Karl e Klaus",
          questions: [
            { q: "Ciao Karl, ciao Klaus! Voi siete svizzeri?", placeholder: "No, non siamo svizzeri; siamo tedeschi." },
            { q: "Voi lavorate o siete studenti?", placeholder: "Siamo studenti." },
            { q: "Perché siete in Italia?", placeholder: "Siamo qui per insegnare l'inglese." }
          ]
        },
        {
          id: "d4",
          title: "Dialogo 4 — Mary",
          questions: [
            { q: "Buongiorno Mary! Lei è italiana?", placeholder: "No, non sono italiana; sono inglese." },
            { q: "Lei è studentessa?", placeholder: "Sì, sono studentessa." },
            { q: "Perché è in Italia?", placeholder: "Sono in Italia per affari." }
          ]
        },
        {
          id: "d5",
          title: "Dialogo 5 — Signor Rossi",
          questions: [
            { q: "Buongiorno signor Rossi! Lei è italiano?", placeholder: "Sì, sono italiano." },
            { q: "Lei è un cliente dell'albergo?", placeholder: "No, sono il direttore dell'albergo." },
            { q: "Lei è sposato?", placeholder: "Sì, sono sposato." }
          ]
        },
        {
          id: "d6",
          title: "Dialogo 6 — Yoko",
          questions: [
            { q: "Buongiorno Yoko! Lei è cinese?", placeholder: "No, non sono cinese; sono giapponese." },
            { q: "Lei lavora?", placeholder: "Sì, sono avvocatessa." },
            { q: "Perché è in Italia?", placeholder: "Sono in Italia per fare shopping." }
          ]
        }
      ];

      // Aggancia subito i menu e le utilità di pagina
      function bindMenuSafe(selectId) {
        const select = document.getElementById(selectId);
        if (!select) return;
        if (window.ParloExercise && typeof ParloExercise.bindNavigationSelect === "function") {
          ParloExercise.bindNavigationSelect(select);
          return;
        }
        select.addEventListener("change", event => {
          if (!event.target.value) return;
          const target = new URL(event.target.value, location.href);
          const params = new URLSearchParams(location.search);
          let sess = {};
          try { sess = JSON.parse(localStorage.getItem("parlo_session") || "{}"); } catch (_) {}
          const group = params.get("gruppo") || sess.group || "";
          const name = params.get("nome") || (!sess.isTeacher ? sess.name : "") || "";
          if (group) target.searchParams.set("gruppo", group);
          if (name && name !== "Insegnante") target.searchParams.set("nome", name);
          location.href = target.href;
        });
      }

      bindMenuSafe("exercise-menu");
      bindMenuSafe("grammar-menu");
      if (window.ParloExercise) {
        ParloExercise.initBackgroundParallax?.();
        ParloExercise.decorateSessionLinks?.();
      }

      const session = window.ParloSession || {};
      const isTeacherView = Boolean(session.isTeacher);
      const safeGroup = session.safeGroup || "sconosciuto";

      const connectionBanner = document.getElementById("connection-banner");
      const exerciseProgress = document.getElementById("exercise-progress");
      const questionsContainer = document.getElementById("questions-container");
      const previousButton = document.getElementById("previous-question");
      const nextButton = document.getElementById("next-question");
      const progressText = document.getElementById("question-progress");
      const nextExerciseLink = document.getElementById("next-exercise");

      const slots = dialogues.map((dialogue, index) => ({
        id: `card_${index}`,
        label: `${index + 1}. ${dialogue.title}`
      }));

      let sync = null;
      let activeCard = 0;
      const cardUI = [];
      const saveTimers = new Map();
      const feedbackTimers = new Map();
      const dirtyFields = new Set();

      function formatAssigneeLabel(person, onlineSet) {
        if (!person) return "Nessuno";
        if (person.role === "teacher") return `👩‍🏫 ${person.name}`;
        const isOnline = onlineSet instanceof Set && onlineSet.has(person.name);
        return `${isOnline ? "🟢" : "⚪"} ${person.name}`;
      }

      function insertAtCursor(textarea, text) {
        if (!textarea || textarea.disabled) return;
        const start = textarea.selectionStart ?? textarea.value.length;
        const end = textarea.selectionEnd ?? textarea.value.length;
        const value = textarea.value;
        textarea.value = value.slice(0, start) + text + value.slice(end);
        const nextPos = start + text.length;
        textarea.focus();
        textarea.setSelectionRange(nextPos, nextPos);
        textarea.dispatchEvent(new Event("input", { bubbles: true }));
      }

      function setConnectionMessage(message) {
        if (!message) {
          connectionBanner.hidden = true;
          connectionBanner.textContent = "";
        } else {
          connectionBanner.textContent = message;
          connectionBanner.hidden = false;
        }
      }

      function setCardFeedback(index, type, message, autoClearMs = 0) {
        const ui = cardUI[index];
        if (!ui) return;
        clearTimeout(feedbackTimers.get(index));
        feedbackTimers.delete(index);

        ui.syncFeedback.className = `sync-feedback ${type || ""}`.trim();
        ui.syncFeedback.textContent = message || "";

        if (autoClearMs > 0 && message) {
          feedbackTimers.set(index, setTimeout(() => {
            feedbackTimers.delete(index);
            ui.syncFeedback.className = "sync-feedback";
            ui.syncFeedback.textContent = "";
          }, autoClearMs));
        }
      }

      function notifyClassroomNotesScope(index) {
        const dialogue = dialogues[index];
        const scopeKey = String(dialogue?.id || `card_${index}`).replace(/[.#$\/\[\]]/g, "_");
        window.ParloNotesScope = {
          group: safeGroup,
          exercise: EXERCISE_PATH,
          card: scopeKey,
          cardLabel: dialogue?.title || `Scheda ${index + 1}`
        };
        window.dispatchEvent(new CustomEvent("parlo:notes-scope-changed", {
          detail: window.ParloNotesScope
        }));
      }

      function getReplyValue(cardIndex, qIndex) {
        if (!sync) return "";
        const slotId = slots[cardIndex].id;
        const replies = sync.read("replies", slotId);
        if (Array.isArray(replies) && typeof replies[qIndex] === "string") {
          return replies[qIndex];
        }
        if (replies && typeof replies === "object" && typeof replies[String(qIndex)] === "string") {
          return replies[String(qIndex)];
        }
        return "";
      }

      async function persistField(cardIndex, qIndex, value) {
        const slotId = slots[cardIndex].id;
        const fieldKey = `${cardIndex}_${qIndex}`;
        if (!sync || !sync.canWrite(slotId)) {
          dirtyFields.delete(fieldKey);
          return;
        }

        setCardFeedback(cardIndex, "saving", "⏳ Salvataggio in corso...");
        try {
          await sync.write(`replies/${qIndex}`, value, slotId);
          dirtyFields.delete(fieldKey);
          setCardFeedback(cardIndex, "saved", "✓ Salvato", 2000);
        } catch (error) {
          setCardFeedback(cardIndex, "error", `⚠️ Errore di salvataggio: ${error?.message || "riprova"}`);
        }
      }

      function scheduleFieldSave(cardIndex, qIndex, value) {
        const fieldKey = `${cardIndex}_${qIndex}`;
        dirtyFields.add(fieldKey);
        clearTimeout(saveTimers.get(fieldKey));
        setCardFeedback(cardIndex, "saving", "⏳ Salvataggio...");
        saveTimers.set(fieldKey, setTimeout(() => {
          saveTimers.delete(fieldKey);
          persistField(cardIndex, qIndex, value);
        }, 320));
      }

      function flushFieldSave(cardIndex, qIndex, value) {
        const fieldKey = `${cardIndex}_${qIndex}`;
        if (saveTimers.has(fieldKey)) {
          clearTimeout(saveTimers.get(fieldKey));
          saveTimers.delete(fieldKey);
        }
        if (dirtyFields.has(fieldKey)) {
          persistField(cardIndex, qIndex, value);
        }
      }

      dialogues.forEach((dialogue, cardIndex) => {
        const box = document.createElement("div");
        box.className = "section-box";
        box.hidden = cardIndex !== activeCard;

        const header = document.createElement("div");
        header.className = "section-header";

        const title = document.createElement("div");
        title.className = "section-title";
        const numSpan = document.createElement("span");
        numSpan.className = "number";
        numSpan.textContent = String(cardIndex + 1);
        const textSpan = document.createElement("span");
        textSpan.textContent = dialogue.title;
        title.append(numSpan, textSpan);

        const turnPill = document.createElement("span");
        turnPill.className = "turn-pill";
        turnPill.textContent = "✍️ Turno: Nessuno";

        header.append(title, turnPill);

        const assignmentBar = document.createElement("div");
        assignmentBar.className = "turn-assignment-bar";
        assignmentBar.hidden = !isTeacherView;

        const assignLabel = document.createElement("label");
        assignLabel.htmlFor = `assign-turn-${cardIndex}`;
        assignLabel.textContent = "✍️ Assegna turno di lavoro:";

        const assignSelect = document.createElement("select");
        assignSelect.id = `assign-turn-${cardIndex}`;
        if (isTeacherView) {
          assignmentBar.append(assignLabel, assignSelect);
        }

        const worksheetCard = document.createElement("div");
        worksheetCard.className = "worksheet-card";

        const worksheetHeader = document.createElement("div");
        worksheetHeader.className = "worksheet-header";
        const worksheetLabel = document.createElement("span");
        worksheetLabel.className = "worksheet-label";
        worksheetLabel.textContent = "💬 Battute da completare:";
        const turnHintTag = document.createElement("span");
        turnHintTag.className = "turn-hint-tag";
        turnHintTag.textContent = "In attesa di assegnazione";
        worksheetHeader.append(worksheetLabel, turnHintTag);

        const accentToolbar = document.createElement("div");
        accentToolbar.className = "accent-toolbar";
        accentToolbar.setAttribute("aria-label", "Caratteri speciali italiani");

        let lastFocusedTextarea = null;
        const accentButtons = SPECIAL_CHARS.map(ch => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.textContent = ch;
          btn.disabled = true;
          btn.setAttribute("aria-label", `Inserisci carattere ${ch}`);
          btn.addEventListener("mousedown", e => e.preventDefault());
          btn.addEventListener("click", () => {
            const targetTextarea = lastFocusedTextarea || textareas[0];
            insertAtCursor(targetTextarea, ch);
          });
          accentToolbar.appendChild(btn);
          return btn;
        });

        const turnsContainer = document.createElement("div");
        turnsContainer.className = "dialogue-turns-list";

        const textareas = dialogue.questions.map((question, qIndex) => {
          const turnItem = document.createElement("div");
          turnItem.className = "dialogue-turn";

          const promptLabel = document.createElement("label");
          promptLabel.className = "prompt-question";
          const textareaId = `reply-${cardIndex}-${qIndex}`;
          promptLabel.htmlFor = textareaId;
          promptLabel.textContent = question.q;

          const textarea = document.createElement("textarea");
          textarea.id = textareaId;
          textarea.className = "student-reply";
          textarea.rows = 2;
          textarea.disabled = true;
          if (question.placeholder) {
            textarea.placeholder = question.placeholder;
          }
          textarea.setAttribute("aria-label", `${dialogue.title}, risposta ${qIndex + 1}: ${question.q}`);

          textarea.addEventListener("focus", () => {
            lastFocusedTextarea = textarea;
          });
          textarea.addEventListener("input", () => {
            scheduleFieldSave(cardIndex, qIndex, textarea.value);
          });
          textarea.addEventListener("blur", () => {
            flushFieldSave(cardIndex, qIndex, textarea.value);
          });

          turnItem.append(promptLabel, textarea);
          turnsContainer.appendChild(turnItem);
          return textarea;
        });

        const actionsRow = document.createElement("div");
        actionsRow.className = "actions-row";

        const syncFeedback = document.createElement("span");
        syncFeedback.className = "sync-feedback";
        syncFeedback.setAttribute("role", "status");
        syncFeedback.setAttribute("aria-live", "polite");
        actionsRow.appendChild(syncFeedback);

        worksheetCard.append(worksheetHeader, accentToolbar, turnsContainer, actionsRow);

        box.append(header);
        if (isTeacherView) box.append(assignmentBar);
        box.append(worksheetCard);
        questionsContainer.appendChild(box);

        cardUI.push({
          box,
          assignSelect,
          turnPill,
          worksheetCard,
          turnHintTag,
          accentButtons,
          textareas,
          syncFeedback
        });
      });

      dialogues.forEach((dialogue, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "progress-step";
        button.textContent = String(index + 1);
        button.setAttribute("aria-label", `Vai a ${dialogue.title}`);
        button.setAttribute("aria-current", index === activeCard ? "step" : "false");
        button.addEventListener("click", () => showCard(index));
        exerciseProgress.appendChild(button);
      });

      function updateNavigation() {
        const last = activeCard === dialogues.length - 1;
        previousButton.disabled = activeCard === 0;
        nextButton.hidden = last;
        nextExerciseLink.hidden = !last;

        exerciseProgress.querySelectorAll(".progress-step").forEach((button, index) => {
          const count = dialogues[index].questions.length;
          let filledCount = 0;
          for (let q = 0; q < count; q++) {
            if (getReplyValue(index, q).trim().length > 0) filledCount++;
          }
          const isDone = count > 0 && filledCount === count;
          button.classList.toggle("done", isDone);
          button.setAttribute("aria-current", index === activeCard ? "step" : "false");
        });

        progressText.textContent = `Dialogo ${activeCard + 1} di ${dialogues.length}`;
      }

      function showCard(index) {
        activeCard = Math.max(0, Math.min(index, dialogues.length - 1));
        cardUI.forEach((ui, idx) => {
          ui.box.hidden = idx !== activeCard;
        });
        updateNavigation();
        notifyClassroomNotesScope(activeCard);
      }

      previousButton.addEventListener("click", () => showCard(activeCard - 1));
      nextButton.addEventListener("click", () => showCard(activeCard + 1));

      document.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target.closest("input, textarea, select, button, a, [tabindex]")) return;
        if (event.key === "ArrowLeft" && activeCard > 0) showCard(activeCard - 1);
        if (event.key === "ArrowRight" && activeCard < dialogues.length - 1) showCard(activeCard + 1);
      });

      function renderCard(cardIndex, onlineSet) {
        const ui = cardUI[cardIndex];
        const slotId = slots[cardIndex].id;
        const assignee = sync ? sync.assignmentFor(slotId) : null;
        const canEdit = Boolean(sync && sync.canWrite(slotId));

        ui.turnPill.textContent = `✍️ Turno: ${formatAssigneeLabel(assignee, onlineSet)}`;
        ui.turnPill.classList.toggle("is-me", canEdit);

        ui.worksheetCard.classList.toggle("active-turn", canEdit);
        ui.turnHintTag.textContent = canEdit
          ? "È il tuo turno — compila tutte le battute"
          : assignee
            ? `In turno: ${formatAssigneeLabel(assignee, onlineSet)}`
            : "In attesa di assegnazione";

        ui.accentButtons.forEach(btn => {
          btn.disabled = !canEdit;
        });

        ui.textareas.forEach((textarea, qIndex) => {
          const fieldKey = `${cardIndex}_${qIndex}`;
          const remoteVal = getReplyValue(cardIndex, qIndex);
          textarea.disabled = !canEdit;
          if (!dirtyFields.has(fieldKey) && document.activeElement !== textarea && textarea.value !== remoteVal) {
            textarea.value = remoteVal;
          }
        });
      }

      function renderAllCards(onlineSet = new Set()) {
        dialogues.forEach((_, index) => renderCard(index, onlineSet));
        updateNavigation();
      }

      const db = window.ParloModes ? ParloModes.initFirebase() : null;
      if (!db) {
        setConnectionMessage("⚠️ Connessione al database non disponibile: verifica la rete o ricarica la pagina.");
      } else {
        db.ref(".info/connected").on("value", snap => {
          if (snap.val() === false) {
            setConnectionMessage("⚠️ Connessione a Firebase interrotta: i salvataggi potrebbero non riuscire finché non torna la rete.");
          } else {
            setConnectionMessage("");
          }
        });

        const exerciseRef = db.ref(`esercizi/gruppi/${safeGroup}/${EXERCISE_PATH}`);
        sync = ParloModes.createSync({
          mode: "multi-turn",
          ref: exerciseRef,
          database: db,
          session,
          slots,
          onChange(snapshotState) {
            renderAllCards(snapshotState.onlineStudents);
          },
          onError(error) {
            setConnectionMessage(`⚠️ Errore di sincronizzazione: ${error?.message || "controlla la connessione"}`);
            setCardFeedback(activeCard, "error", `⚠️ Errore: ${error?.message || "operazione non riuscita"}`);
          }
        });

        if (isTeacherView) {
          cardUI.forEach((ui, index) => {
            sync.bindAssignmentSelect(ui.assignSelect, slots[index].id);
          });
          ParloModes.loadGroupRoster(db, safeGroup, UNIT_NUMBER, roster => {
            sync.setRoster(roster);
          });
        }
      }

      renderAllCards();
      showCard(0);
    })();
  </script>
  <script src="../classroom-notes.js?v=3"></script>
</body>
</html>
