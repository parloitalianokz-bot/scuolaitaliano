<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Attività interattiva Wordwall dell’Unità 1." />
  <title>Unità 1 — Per giocare un po’ (Esercizio J)</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #477755;
      --primary-light: #edf4ed;
      --primary-dark: #2f5739;
      --accent: #bd694d;
      --bg-main: #f5f1e7;
      --card-bg: #fffefa;
      --text: #292d28;
      --border: #e7e5dc;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid rgba(189, 105, 77, .55); outline-offset: 3px; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      color: var(--text);
      background: linear-gradient(rgba(250,248,241,.88), rgba(250,248,241,.88)),
        url("img/sfondo.jpeg") center / cover fixed,
        radial-gradient(ellipse at 50% -12%, rgba(111,151,116,.18), transparent 42%), var(--bg-main);
    }
    .container { width: min(100%, 880px); margin: 0 auto; }
    .home-navigation { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }
    .home-navigation select {
      min-height: 42px;
      max-width: 100%;
      padding: 8px 14px;
      border: 1px solid #d8e5d8;
      border-radius: 10px;
      background: rgba(255,254,250,.94);
      color: var(--primary-dark);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    .hero {
      margin: 8px 0 22px;
      padding: 28px 20px 26px;
      text-align: center;
      border: 1px solid rgba(71,119,85,.13);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255,254,250,.94), rgba(242,247,239,.91));
      box-shadow: 0 12px 32px rgba(43,69,46,.07);
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      padding: 8px 15px;
      border-radius: 20px;
      background: #eaf1e8;
      color: var(--primary-dark);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    h1 {
      margin: 4px 0;
      color: var(--primary-dark);
      font-size: clamp(1.9rem, 5vw, 2.65rem);
      letter-spacing: -.04em;
      line-height: 1.12;
    }
    .card {
      padding: clamp(18px, 4vw, 30px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--card-bg);
      box-shadow: 0 18px 48px rgba(43,69,46,.1);
    }
    .wordwall-frame { display: flex; justify-content: center; width: 100%; }
    .wordwall-frame iframe {
      display: block;
      width: 500px;
      max-width: 100%;
      height: 380px;
      border: 0;
      border-radius: 12px;
    }
    @media (max-width: 600px) {
      body { padding: 16px 8px; }
      .wordwall-frame iframe { height: min(380px, 75vh); }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="home-navigation" aria-label="Menu dell’unità 001">
      <label class="visually-hidden" for="exercise-menu">Vai a una pagina dell’unità 001</label>
      <select id="exercise-menu" aria-label="Esercizi dell’Unità 1">
        <option value="001_lettura.html">Lettura</option>
        <option value="001_es_a.html">Esercizio A</option>
        <option value="001_es_b.html">Esercizio B</option>
        <option value="001_es_c.html">Esercizio C</option>
        <option value="001_es_d.html">Esercizio D</option>
        <option value="001_es_e.html">Esercizio E</option>
        <option value="001_es_f.html">Esercizio F</option>
        <option value="001_es_g.html">Esercizio G</option>
        <option value="001_es_h.html">Esercizio H</option>
        <option value="001_es_i.html">Esercizio I</option>
        <option value="001_es_j.html" selected>Esercizio J</option>
        <option value="001_es_k.html">Esercizio K</option>
      </select>
      <label class="visually-hidden" for="grammar-menu">Vai a una scheda grammaticale</label>
      <select id="grammar-menu" aria-label="Schede grammaticali">
        <option value="">Grammatica</option>
        <option value="001_verbo_essere.html">Il verbo essere</option>
        <option value="001_genere.html">Il genere del sostantivo</option>
        <option value="001_indeterminativi.html">Articoli indeterminativi</option>
        <option value="001_plurale.html">Il numero del sostantivo · Il plurale</option>
        <option value="001_determinativi.html">Articoli determinativi</option>
      </select>
    </nav>

    <header class="hero">
      <span class="eyebrow">Unità 1 · Esercizio J</span>
      <h1>Per giocare un po’</h1>
    </header>

    <section class="card" aria-label="Attività interattiva">
      <div class="wordwall-frame">
        <iframe
          title="Per giocare un po’ — attività interattiva"
          src="https://wordwall.net/it/embed/6134c2f27e0a449f86dcb57d58c43ec3?themeId=45&amp;templateId=5&amp;fontStackId=0"
          allowfullscreen>
        </iframe>
      </div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    let session = {};
    try { session = JSON.parse(localStorage.getItem("parlo_session") || "{}"); } catch (_) {}
    const group = params.get("gruppo") || session.group || "";
    const name = params.get("nome") || (!session.isTeacher ? session.name : "") || "";

    function navigate(value) {
      if (!value) return;
      const target = new URL(value, location.href);
      if (group) target.searchParams.set("gruppo", group);
      if (name && !session.isTeacher) target.searchParams.set("nome", name);
      location.href = target.href;
    }

    document.getElementById("exercise-menu").addEventListener("change", event => navigate(event.target.value));
    document.getElementById("grammar-menu").addEventListener("change", event => navigate(event.target.value));
  </script>
</body>
</html>
