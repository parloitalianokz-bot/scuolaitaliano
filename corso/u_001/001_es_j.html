<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Attività interattiva Wordwall dell’Unità 1." />
  <title>Unità 1 — Per giocare un po’ (Esercizio J)</title>
  <link rel="stylesheet" href="../shared/theme.css?v=2" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      color: var(--text);
      background:
        linear-gradient(rgba(250, 248, 241, .78), rgba(250, 248, 241, .78)),
        url("img/sfondo.jpeg") center calc(50% - var(--background-offset, 0px)) / cover fixed,
        radial-gradient(ellipse at 50% -12%, rgba(111, 151, 116, .18), transparent 42%),
        var(--bg-main);
    }

    .container { width: min(100%, 880px); margin: 0 auto; }

    .hero {
      position: relative; isolation: isolate; overflow: hidden; margin: 8px 0 20px; padding: 24px 20px 22px;
      text-align: center; border: 1px solid rgba(71, 119, 85, .13); border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 254, 250, .94), rgba(242, 247, 239, .91));
      box-shadow: 0 12px 32px rgba(43, 69, 46, .07);
    }
    .eyebrow {
      display: inline-block; color: var(--primary-dark); font-size: .78rem; font-weight: 800;
      letter-spacing: .09em; text-transform: uppercase; background: #eaf1e8; padding: 7px 14px;
      border-radius: 20px; margin-bottom: 8px; box-shadow: inset 0 0 0 1px rgba(71, 119, 85, .11);
    }
    h1 {
      margin: 4px 0;
      color: var(--primary-dark);
      font-size: clamp(1.85rem, 5vw, 2.55rem);
      letter-spacing: -.04em;
      line-height: 1.12;
    }

    .card {
      padding: clamp(18px, 4vw, 30px);
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card-bg);
      box-shadow: 0 22px 60px rgba(43, 69, 46, .11);
      margin-bottom: 24px;
    }

    .wordwall-frame { display: flex; justify-content: center; width: 100%; }
    .wordwall-frame iframe {
      display: block;
      width: 500px;
      max-width: 100%;
      height: 380px;
      border: 0;
      border-radius: 12px;
    }

    .slide-navigation {
      display: flex; align-items: center; justify-content: flex-end; gap: 12px; margin-top: 20px;
      padding-top: 14px; border-top: 1px solid var(--border);
    }
    .slide-navigation a {
      display: inline-flex; align-items: center; min-height: 44px; padding: 8px 18px;
      border: 1px solid #d8e5d8; border-radius: 10px; background: #fff; color: var(--primary-dark);
      font: inherit; font-weight: 700; text-decoration: none; transition: all .2s;
    }
    .slide-navigation a:hover { background: var(--primary-light); border-color: var(--primary); }

    @media (max-width: 600px) {
      body { padding: 16px 8px; }
      .wordwall-frame iframe { height: min(380px, 75vh); }
      .slide-navigation a { justify-content: center; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="top-exercises" aria-label="Menu dell’unità 1">
      <a id="home-link" class="home-link" href="../index.html" aria-label="Torna alla pagina iniziale" title="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z"/></svg>
      </a>
      <span id="user-badge" aria-live="polite"></span>
      <label class="visually-hidden" for="exercise-menu">Vai a una pagina dell’unità 1</label>
      <select id="exercise-menu" aria-label="Esercizi dell’Unità 1">
        <option value="001_lettura.html">Lettura</option>
        <option value="001_es_a.html">Esercizio A</option>
        <option value="001_es_b.html">Esercizio B</option>
        <option value="001_es_c.html">Esercizio C</option>
        <option value="001_es_d.html">Esercizio D</option>
        <option value="001_es_e.html">Esercizio E</option>
        <option value="001_es_f.html">Esercizio F</option>
        <option value="001_es_g.html">Esercizio G</option>
        <option value="001_es_h.html">Esercizio H</option>
        <option value="001_es_i.html">Esercizio I</option>
        <option value="001_es_j.html" selected>Esercizio J</option>
        <option value="001_es_k.html">Esercizio K</option>
      </select>
      <label class="visually-hidden" for="grammar-menu">Vai a una scheda grammaticale</label>
      <select id="grammar-menu" aria-label="Schede grammaticali">
        <option value="">Grammatica</option>
        <option value="001_verbo_essere.html">Il verbo essere</option>
        <option value="001_genere.html">Il genere del sostantivo</option>
        <option value="001_indeterminativi.html">Articoli indeterminativi</option>
        <option value="001_plurale.html">Il numero del sostantivo · Il plurale</option>
        <option value="001_determinativi.html">Articoli determinativi</option>
      </select>
    </nav>

    <header class="hero">
      <span class="eyebrow">Unità 1 · Esercizio J</span>
      <h1>Per giocare un po’</h1>
    </header>

    <section class="card" aria-label="Attività interattiva">
      <div class="wordwall-frame">
        <iframe
          title="Per giocare un po’ — attività interattiva"
          src="https://wordwall.net/it/embed/6134c2f27e0a449f86dcb57d58c43ec3?themeId=45&amp;templateId=5&amp;fontStackId=0"
          allowfullscreen>
        </iframe>
      </div>

      <nav class="slide-navigation" aria-label="Navigazione esercizi">
        <a id="next-exercise" href="001_es_k.html">Vai all’esercizio K →</a>
      </nav>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../shared/group-scope.js?v=1"></script>
  <script src="../shared/exercise-core.js?v=8"></script>
  <script src="../shared/exercise-modes.js?v=2"></script>
  <script>
    (() => {
      "use strict";

      function bindMenuSafe(selectId) {
        const select = document.getElementById(selectId);
        if (!select) return;
        if (window.ParloExercise && typeof ParloExercise.bindNavigationSelect === "function") {
          ParloExercise.bindNavigationSelect(select);
          return;
        }
        select.addEventListener("change", event => {
          if (!event.target.value) return;
          const target = new URL(event.target.value, location.href);
          const params = new URLSearchParams(location.search);
          let sess = {};
          try { sess = JSON.parse(localStorage.getItem("parlo_session") || "{}"); } catch (_) {}
          const group = params.get("gruppo") || sess.group || "";
          const name = params.get("nome") || (!sess.isTeacher ? sess.name : "") || "";
          if (group) target.searchParams.set("gruppo", group);
          if (name && name !== "Insegnante") target.searchParams.set("nome", name);
          location.href = target.href;
        });
      }

      bindMenuSafe("exercise-menu");
      bindMenuSafe("grammar-menu");

      if (window.ParloExercise) {
        ParloExercise.initBackgroundParallax?.();
        ParloExercise.decorateSessionLinks?.();
      }

      const session = window.ParloSession || {};
      window.ParloNotesScope = {
        group: session.safeGroup || "sconosciuto",
        exercise: "001_es_j",
        card: "scheda_unica",
        cardLabel: "Per giocare un po’"
      };
    })();
  </script>
  <script src="../classroom-notes.js?v=3"></script>
</body>
</html>
