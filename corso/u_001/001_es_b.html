<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 1 — Risposte aperte (Un albergo in centro - Esercizio B)</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #477755; --primary-light: #edf4ed; --primary-dark: #2f5739;
      --accent: #bd694d; --bg-main: #f5f1e7; --card-bg: #fffefa;
      --text: #292d28; --text-muted: #6b7069; --success: #278253;
      --success-bg: #e1f1e5; --border: #e7e5dc;
    }
    * { box-sizing: border-box; }
    :focus-visible { outline: 3px solid rgba(189,105,77,.55); outline-offset: 3px; }
    body {
      min-height: 100vh; margin: 0; padding: 32px 16px; color: var(--text);
      background: linear-gradient(rgba(250,248,241,.88),rgba(250,248,241,.88)),
        url("img/sfondo.jpeg") center / cover fixed,
        radial-gradient(ellipse at 50% -12%,rgba(111,151,116,.18),transparent 42%), var(--bg-main);
    }
    .container { width: min(100%, 880px); margin: 0 auto; }
    .home-navigation { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }
    .home-navigation select {
      min-height: 42px; max-width: 100%; padding: 8px 14px; border: 1px solid #d8e5d8;
      border-radius: 10px; background: #fffefa; color: var(--primary-dark); font: inherit;
      font-weight: 700; cursor: pointer;
    }
    .home-navigation select:hover { background: var(--primary-light); border-color: var(--primary); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .slide-navigation button, .slide-navigation a {
      display: inline-flex; align-items: center; justify-content: center; min-height: 42px;
      padding: 8px 16px; border: 1px solid #d8e5d8; border-radius: 10px;
      background: #fffefa; color: var(--primary-dark); font: inherit; font-weight: 700;
      text-decoration: none; cursor: pointer;
    }
    .slide-navigation button:hover:not(:disabled), .slide-navigation a:hover { background: var(--primary-light); border-color: var(--primary); }
    .hero { margin: 8px 0 22px; padding: 28px 20px 26px; text-align: center; border: 1px solid rgba(71,119,85,.13); border-radius: 24px; background: linear-gradient(135deg,rgba(255,254,250,.94),rgba(242,247,239,.91)); box-shadow: 0 12px 32px rgba(43,69,46,.07); }
    .eyebrow { display: inline-block; margin-bottom: 10px; padding: 8px 15px; border-radius: 20px; background: #eaf1e8; color: var(--primary-dark); font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 4px 0; color: var(--primary-dark); font-size: clamp(1.9rem,5vw,2.65rem); letter-spacing: -.04em; line-height: 1.12; }
    .hero-subtitle { margin: 8px 0 0; color: var(--text-muted); font-size: .98rem; }
    .top-controls, .instruction-box { margin-bottom: 24px; padding: 16px 20px; border: 1px solid #d8e5d8; border-radius: 16px; background: rgba(255,254,250,.96); box-shadow: 0 6px 18px rgba(43,69,46,.04); }
    .instruction-box { border-left: 5px solid var(--accent); background: #fff; }
    .instruction-title { margin-bottom: 6px; color: var(--accent); font-size: .85rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .instruction-text { font-size: .98rem; line-height: 1.5; }
    .teacher-controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
    .mode-select-box { display: flex; align-items: center; gap: 8px; color: var(--primary-dark); font-size: .9rem; font-weight: 700; }
    .mode-select-box select { padding: 7px 10px; border: 1.5px solid #d4e1d5; border-radius: 8px; color: var(--primary-dark); background: #fff; font: inherit; }
    .reset-btn, .btn-token { min-height: 42px; padding: 8px 14px; border: 0; border-radius: 9px; background: var(--primary-dark); color: white; font: inherit; font-size: .88rem; font-weight: 700; cursor: pointer; }
    .reset-btn { border: 1px solid #fca5a5; background: #fff; color: #dc2626; }
    .reset-btn:hover { background: #fef2f2; }
    .btn-token.release { background: var(--accent); }
    .btn-token.busy { background: #e8ebea; color: #5f6863; cursor: not-allowed; }
    .card { margin-bottom: 32px; padding: clamp(20px,4vw,32px); border: 1px solid var(--border); border-radius: 26px; background: var(--card-bg); box-shadow: 0 22px 60px rgba(43,69,46,.11); }
    #token-mode-section, #all-students-mode-section { display: none; }
    #token-mode-section.active-mode, #all-students-mode-section.active-mode { display: block; }
    .token-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; padding: 14px 18px; border-radius: 14px; background: var(--primary-light); color: var(--primary-dark); font-weight: 700; }
    .token-bar[hidden] { display: none; }
    .save-status { margin: 0 0 18px; padding: 11px 14px; border: 1px solid #b7dfc1; border-radius: 12px; background: var(--success-bg); color: #17623c; font-size: .9rem; font-weight: 700; }
    .save-status[hidden], [hidden] { display: none !important; }
    .slide-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: thin; scrollbar-color: #b9cdbb transparent; border-radius: 18px; }
    .question-slide { flex: 0 0 100%; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 22px; scroll-snap-align: start; border: 1px solid var(--border); border-radius: 18px; background: #fff; box-shadow: 0 6px 18px rgba(43,69,46,.04); }
    .question-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; color: var(--primary-dark); font-size: 1.1rem; font-weight: 800; line-height: 1.45; }
    .question-heading span:first-child { display: inline-grid; flex: 0 0 36px; width: 36px; height: 36px; place-items: center; border-radius: 12px; background: var(--primary-light); color: var(--primary); }
    .question-prompt { display: flex; align-items: flex-start; gap: 10px; }
    .question-prompt-text { padding-top: 5px; }
    .question-status { flex-shrink: 0; padding: 5px 9px; border-radius: 8px; background: #f3f4f6; color: #6b7280; font-size: .72rem; font-weight: 800; text-transform: uppercase; }
    .question-status.open { background: var(--primary-light); color: var(--primary-dark); }
    .question-status.writing { background: #fef3c7; color: #a16207; }
    .question-status.approved { background: var(--success-bg); color: #17623c; }
    .question-status.rejected { background: #fde8e7; color: #991b1b; }
    textarea.answer-input { width: 100%; min-height: 112px; padding: 12px 14px; border: 1.5px solid #d4e1d5; border-radius: 12px; background: #fff; color: var(--text); font: inherit; font-size: 1rem; line-height: 1.5; resize: vertical; }
    textarea.answer-input:disabled { background: #f2f5f1; color: #475569; }
    .accent-toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: -8px; }
    .accent-toolbar button { min-width: 38px; min-height: 34px; padding: 4px 9px; border: 1px solid #d4e1d5; border-radius: 8px; background: #f7faf5; color: var(--primary-dark); font: inherit; font-weight: 700; cursor: pointer; }
    .accent-toolbar button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .accent-toolbar button:disabled { cursor: not-allowed; opacity: .5; }
    .teacher-action { display: flex; justify-content: flex-end; }
    .submit-answer { min-height: 42px; padding: 9px 16px; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .btn-approve, .btn-reject { min-height: 40px; padding: 8px 14px; border: 0; border-radius: 9px; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .btn-approve { background: var(--success); }
    .btn-reject { background: #dc2626; }
    .slide-navigation { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .slide-navigation button:disabled { cursor: not-allowed; opacity: .45; }
    .slide-progress { color: var(--primary-dark); font-size: .95rem; font-weight: 800; text-align: center; }
    .overall-progress {
      display: grid;
      grid-template-columns: repeat(14, minmax(28px, 1fr));
      gap: 4px;
      width: 100%;
      margin: 0 0 16px;
      overflow-x: auto;
    }
    .progress-step {
      min-width: 0;
      min-height: 30px;
      padding: 2px;
      border: 1px solid #d8e5d8;
      border-radius: 7px;
      background: #fff;
      color: var(--primary-dark);
      font: inherit;
      font-size: .75rem;
      font-weight: 800;
      cursor: pointer;
      transition: background .2s, border-color .2s, color .2s;
    }
    .progress-step:hover { border-color: var(--primary); background: var(--primary-light); }
    .progress-step[aria-current="step"] {
      border-color: var(--primary);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 3px 9px rgba(71,119,85,.22);
    }
    .results-section h2 { margin: 0 0 16px; color: var(--primary-dark); font-size: 1.3rem; }
    .question-responses details { margin-bottom: 10px; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
    .question-responses summary { padding: 14px 16px; background: var(--primary-light); color: var(--primary-dark); font-weight: 800; cursor: pointer; }
    .answer-list { padding: 4px 16px 12px; }
    .response-card { margin: 10px 0; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
    .response-card.approved { border-color: #a7f3d0; background: #f0fdf4; }
    .response-card.rejected { border-color: #fecaca; background: #fff7f7; }
    .response-header { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; color: var(--primary-dark); font-weight: 800; }
    .response-question { margin-bottom: 8px; color: var(--primary-dark); font-weight: 700; line-height: 1.5; }
    .response-answer { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
    .teacher-comment { width: 100%; min-height: 58px; margin: 12px 0 8px; padding: 9px 10px; border: 1px solid #d4e1d5; border-radius: 8px; font: inherit; resize: vertical; }
    .review-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .review-status { margin-top: 8px; color: var(--text-muted); font-size: .86rem; }
    .review-status.approved { color: var(--success); font-weight: 700; }
    .review-status.rejected { color: #dc2626; font-weight: 700; }
    @media (max-width: 600px) {
      body { padding: 16px 8px; }
      .card { padding: 18px 14px; border-radius: 20px; }
      .question-slide { padding: 15px; }
      .question-heading { font-size: 1rem; }
      .slide-navigation { flex-direction: column; gap: 8px; }
      .slide-navigation button, .slide-navigation a { width: 100%; }
      .mode-select-box { align-items: flex-start; flex-direction: column; }
      .token-bar { align-items: flex-start; flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; scroll-snap-type: x mandatory; } }
  </style>
</head>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    const questionDetails = [
      { key: "ans1", title: "Dov’è l’albergo Ponte Vecchio?" },
      { key: "ans2", title: "Perché è comodo per i turisti?" },
      { key: "ans3", title: "Chi sono i clienti dell’albergo?" },
      { key: "ans4", title: "Chi è Victor?" },
      { key: "ans5", title: "Perché Victor è in Italia?" },
      { key: "ans6", title: "Chi è Yoko?" },
      { key: "ans7", title: "Perché Yoko è in Italia?" },
      { key: "ans8", title: "Chi sono Karl e Klaus?" },
      { key: "ans9", title: "Perché Karl e Klaus sono in Italia?" },
      { key: "ans10", title: "Chi è Olga?" },
      { key: "ans11", title: "Perché Olga è in Italia?" },
      { key: "ans12", title: "Chi è Mary?" },
      { key: "ans13", title: "Perché Mary è in Italia?" },
      { key: "ans14", title: "Chi è il signor Rossi?" }
    ];

    const urlParams = new URLSearchParams(location.search);
    let session = {};
    try { session = JSON.parse(localStorage.getItem("parlo_session") || "{}"); } catch (_) {}
    const gruppoNome = urlParams.get("gruppo") || session.group || "";
    const nomeUtente = urlParams.get("nome") || (!session.isTeacher ? session.name : "") || "";
    const isTeacherView = Boolean(session.isTeacher || (gruppoNome && (!nomeUtente || nomeUtente === "Insegnante")));
    const registeredStudentName = isTeacherView ? "" : (nomeUtente || localStorage.getItem("parlo_student_name") || "");
    const studentId = registeredStudentName.replace(/[.#$\/\[\]]/g, "_");
    const gruppo = (gruppoNome || "sconosciuto").replace(/[.#$\/\[\]]/g, "_");
    const myClientId = "user_" + Math.random().toString(36).substring(2, 9);

    const badge = document.getElementById("user-badge");
    if (gruppoNome && isTeacherView) badge.textContent = `👩‍🏫 Insegnante · ${gruppoNome}`;
    else if (gruppoNome && registeredStudentName) badge.textContent = `👤 ${gruppoNome} · ${registeredStudentName}`;
    else if (registeredStudentName) badge.textContent = `👤 ${registeredStudentName}`;
    else badge.hidden = true;

    document.querySelectorAll('a[href]').forEach(link => {
      const href = link.getAttribute("href");
      if (!href || href.startsWith("http") || href.startsWith("#")) return;
      const target = new URL(href, location.href);
      if (gruppoNome) target.searchParams.set("gruppo", gruppoNome);
      if (!isTeacherView && registeredStudentName) target.searchParams.set("nome", registeredStudentName);
      link.href = `${target.pathname}${target.search}${target.hash}`;
    });

    document.getElementById("exercise-menu").addEventListener("change", event => {
      if (!event.target.value) return;
      const target = new URL(event.target.value, location.href);
      if (gruppoNome) target.searchParams.set("gruppo", gruppoNome);
      if (!isTeacherView && registeredStudentName) target.searchParams.set("nome", registeredStudentName);
      window.location.href = target.href;
    });

    document.body.classList.toggle("teacher-view", isTeacherView);
    const topControls = document.getElementById("top-controls");
    const workModeSelect = document.getElementById("work-mode");
    const resetButton = document.getElementById("reset");
    const releaseButton = document.getElementById("teacher-release-token");
    const tokenSection = document.getElementById("token-mode-section");
    const allSection = document.getElementById("all-students-mode-section");
    const tokenTrack = document.getElementById("token-slides-container");
    const studentTrack = document.getElementById("student-slides-container");
    const tokenStatusText = document.getElementById("token-status-text");
    const takeTokenButton = document.getElementById("btn-take-token");
    const saveStatus = document.getElementById("save-status");
    const responsesList = document.getElementById("responses-list");

    if (isTeacherView) topControls.hidden = false;

    let answersRef = null;
    let currentWorkMode = "token";
    let currentActiveStep = -1;
    let currentWriter = null;
    let tokenResponses = {};
    let allResponses = {};
    let studentAnswers = {};
    let activeTokenSlide = 0;
    let activeStudentSlide = 0;
    let lastResetId = null;
    const tokenSaveTimers = new Map();

    function getAnswer(student, question) {
      return student?.answers?.[question.key] ?? student?.[question.key] ?? "";
    }

    function createAccentToolbar(input) {
      const toolbar = document.createElement("div");
      toolbar.className = "accent-toolbar";
      toolbar.setAttribute("aria-label", "Caratteri accentati");
      ["à", "è", "ì", "ò", "ù", "È"].forEach(character => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = character;
        button.setAttribute("aria-label", `Inserisci ${character}`);
        button.disabled = input.disabled;
        button.addEventListener("mousedown", event => event.preventDefault());
        button.addEventListener("click", () => {
          if (input.disabled) return;
          const start = input.selectionStart;
          const end = input.selectionEnd;
          input.value = input.value.slice(0, start) + character + input.value.slice(end);
          input.focus();
          input.setSelectionRange(start + character.length, start + character.length);
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });
        toolbar.appendChild(button);
      });
      return toolbar;
    }

    function statusLabel(index, review) {
      if (review === "approved") return ["Approvata · Одобрено", "approved"];
      if (review === "rejected") return ["Da rivedere · Не одобрено", "rejected"];
      if (currentWorkMode === "token") return [currentWriter ? "In compilazione · Пишут" : "Disponibile · Доступно", currentWriter ? "writing" : "open"];
      return ["In attesa di revisione · На проверке", ""];
    }

    function makeSlide(question, index, mode) {
      const isToken = mode === "token";
      const slide = document.createElement("article");
      slide.className = "question-slide";
      slide.dataset.index = index;

      const heading = document.createElement("div");
      heading.className = "question-heading";
      const prompt = document.createElement("div");
      prompt.className = "question-prompt";
      const number = document.createElement("span");
      number.textContent = String(index + 1);
      const promptText = document.createElement("span");
      promptText.className = "question-prompt-text";
      promptText.textContent = question.title;
      prompt.append(number, promptText);
      const review = isToken ? null : allResponses.students?.[studentId]?.reviews?.[question.key];
      const [statusText, statusClass] = isToken ? statusLabel(index) : statusLabel(index, review);
      const status = document.createElement("span");
      status.className = `question-status ${statusClass}`.trim();
      status.textContent = statusText;
      heading.append(prompt, status);

      const input = document.createElement("textarea");
      input.className = "answer-input";
      input.rows = 4;
      input.placeholder = "Scrivi la tua risposta completa in italiano...";
      input.setAttribute("aria-label", `Risposta alla domanda ${index + 1}: ${question.title}`);
      input.value = isToken ? (tokenResponses[index] || "") : (studentAnswers[question.key] || "");
      input.disabled = isToken
        ? currentWriter !== myClientId
        : isTeacherView;
      input.addEventListener("input", () => {
        if (isToken) {
          tokenResponses[index] = input.value;
          scheduleTokenSave(index, input.value);
        } else {
          studentAnswers[question.key] = input.value;
          saveStatus.hidden = true;
        }
      });
      if (isToken) input.addEventListener("blur", () => flushTokenSave(index));
      const accentToolbar = createAccentToolbar(input);
      slide.append(heading, accentToolbar, input);

      if (!isToken && !isTeacherView) {
        const submitButton = document.createElement("button");
        submitButton.type = "button";
        submitButton.className = "submit-answer";
        submitButton.textContent = "📤 Invia questa risposta";
        submitButton.addEventListener("click", () => saveAllAnswer(question, input.value, submitButton));
        slide.appendChild(submitButton);
      }

      return slide;
    }

    function updateNavigation(mode) {
      const isToken = mode === "token";
      const index = isToken ? activeTokenSlide : activeStudentSlide;
      const prefix = isToken ? "token" : "student";
      const count = questionDetails.length;
      document.getElementById(`prev-${prefix}-slide`).disabled = index === 0;
      document.getElementById(`next-${prefix}-slide`).hidden = index === count - 1;
      document.getElementById(`next-${prefix}-exercise`).hidden = index !== count - 1;
      document.getElementById(`progress-${prefix}-slide`).textContent = `Domanda ${index + 1} di ${count}`;
      document.getElementById(`${prefix}-progress`).querySelectorAll(".progress-step").forEach((button, step) => {
        button.setAttribute("aria-current", step === index ? "step" : "false");
        button.setAttribute("aria-pressed", String(step === index));
      });
    }

    function initializeProgress(mode) {
      const progress = document.getElementById(`${mode}-progress`);
      questionDetails.forEach((question, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "progress-step";
        button.textContent = String(index + 1);
        button.setAttribute("aria-label", `Vai alla domanda ${index + 1}: ${question.title}`);
        button.setAttribute("aria-current", "false");
        button.setAttribute("aria-pressed", "false");
        button.addEventListener("click", () => showSlide(mode, index));
        progress.appendChild(button);
      });
    }

    function renderTrack(mode) {
      const isToken = mode === "token";
      const track = isToken ? tokenTrack : studentTrack;
      const activeIndex = isToken ? activeTokenSlide : activeStudentSlide;
      if (track.contains(document.activeElement)) return;
      track.replaceChildren();
      questionDetails.forEach((question, index) => track.appendChild(makeSlide(question, index, mode)));
      track.scrollLeft = activeIndex * track.clientWidth;
      updateNavigation(mode);
    }

    function showSlide(mode, index) {
      const isToken = mode === "token";
      const track = isToken ? tokenTrack : studentTrack;
      const active = Math.max(0, Math.min(questionDetails.length - 1, index));
      if (isToken) activeTokenSlide = active;
      else activeStudentSlide = active;
      track.scrollTo({ left: active * track.clientWidth, behavior: "smooth" });
      updateNavigation(mode);
      if (mode === "student" && isTeacherView && currentWorkMode === "all") renderResponses();
    }

    document.getElementById("prev-token-slide").addEventListener("click", () => showSlide("token", activeTokenSlide - 1));
    document.getElementById("next-token-slide").addEventListener("click", () => showSlide("token", activeTokenSlide + 1));
    document.getElementById("prev-student-slide").addEventListener("click", () => showSlide("student", activeStudentSlide - 1));
    document.getElementById("next-student-slide").addEventListener("click", () => showSlide("student", activeStudentSlide + 1));

    function trackScroll(mode, track) {
      const index = Math.round(track.scrollLeft / Math.max(track.clientWidth, 1));
      if (mode === "token") activeTokenSlide = index;
      else activeStudentSlide = index;
      updateNavigation(mode);
      if (mode === "student" && isTeacherView && currentWorkMode === "all") renderResponses();
    }
    tokenTrack.addEventListener("scroll", () => trackScroll("token", tokenTrack), { passive: true });
    studentTrack.addEventListener("scroll", () => trackScroll("student", studentTrack), { passive: true });

    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest("input, textarea, select, button, a, [tabindex]")) return;
      const direction = event.key === "ArrowRight" ? 1 : event.key === "ArrowLeft" ? -1 : 0;
      if (direction) showSlide(currentWorkMode, (currentWorkMode === "token" ? activeTokenSlide : activeStudentSlide) + direction);
    });

    function saveTokenAnswer(index) {
      if (answersRef && currentWriter === myClientId) {
        answersRef.child("tokenData").child("responses").child(String(index)).set(tokenResponses[index] || "");
      }
    }
    function scheduleTokenSave(index, value) {
      tokenResponses[index] = value;
      clearTimeout(tokenSaveTimers.get(index));
      tokenSaveTimers.set(index, setTimeout(() => {
        tokenSaveTimers.delete(index);
        saveTokenAnswer(index);
      }, 300));
    }
    function flushTokenSave(index) {
      if (!tokenSaveTimers.has(index)) return;
      clearTimeout(tokenSaveTimers.get(index));
      tokenSaveTimers.delete(index);
      saveTokenAnswer(index);
    }
    function flushTokenSaves() { [...tokenSaveTimers.keys()].forEach(flushTokenSave); }

    takeTokenButton.addEventListener("click", () => {
      if (!answersRef || currentWorkMode !== "token") return;
      if (currentWriter === myClientId) {
        flushTokenSaves();
        answersRef.child("tokenData").child("currentWriter").set(null);
      } else if (!currentWriter) {
        answersRef.child("tokenData").child("currentWriter").set(myClientId);
      }
    });
    releaseButton.addEventListener("click", () => {
      if (isTeacherView && answersRef && currentWorkMode === "token") answersRef.child("tokenData").child("currentWriter").set(null);
    });
    workModeSelect.addEventListener("change", event => {
      if (isTeacherView && answersRef) answersRef.child("workMode").set(event.target.value);
    });

    function updateUIState() {
      tokenSection.classList.toggle("active-mode", currentWorkMode === "token");
      allSection.classList.toggle("active-mode", currentWorkMode === "all");
      document.getElementById("token-bar").hidden = false;
      releaseButton.hidden = !(isTeacherView && currentWorkMode === "token");

      if (!currentWriter) {
        tokenStatusText.textContent = "";
        takeTokenButton.textContent = "✋ Prendi la parola";
        takeTokenButton.className = "btn-token";
        takeTokenButton.disabled = false;
      } else if (currentWriter === myClientId) {
        tokenStatusText.textContent = "Stai scrivendo";
        takeTokenButton.textContent = "✔ Lascia la parola";
        takeTokenButton.className = "btn-token release";
        takeTokenButton.disabled = false;
      } else {
        tokenStatusText.textContent = "🔒 Un compagno sta scrivendo";
        takeTokenButton.textContent = "🔒 Un compagno sta scrivendo";
        takeTokenButton.className = "btn-token busy";
        takeTokenButton.disabled = true;
      }
      renderTrack("token");
      renderTrack("student");
      renderResponses();
    }

    function saveAllAnswer(question, answer, button) {
      if (!registeredStudentName) {
        alert("Non trovo il nome della sessione. Accedi nuovamente dalla pagina iniziale.");
        return;
      }
      if (!answersRef) {
        alert("Connessione al database non disponibile.");
        return;
      }
      const studentId = registeredStudentName.replace(/[.#$\/\[\]]/g, "_");
      const studentRef = answersRef.child("allStudentsData").child("students").child(studentId);
      button.disabled = true;
      studentRef.update({
        name: registeredStudentName,
        [`answers/${question.key}`]: answer.trim(),
        [`reviews/${question.key}`]: null,
        [`teacherComments/${question.key}`]: null,
        timestamp: Date.now()
      }).then(() => {
        saveStatus.textContent = `✅ Risposta ${questionDetails.indexOf(question) + 1} inviata all’insegnante.`;
        saveStatus.hidden = false;
      }).catch(() => alert("Errore durante l’invio della risposta.")).finally(() => { button.disabled = false; });
    }

    function renderResponses() {
      responsesList.replaceChildren();
      const entries = Object.entries(allResponses.students || {});
      if (!entries.length) {
        const empty = document.createElement("p");
        empty.style.color = "var(--text-muted)";
        empty.textContent = "Пока никто не отправил ответы...";
        responsesList.appendChild(empty);
        return;
      }

      const grouped = document.createElement("div");
      grouped.className = "question-responses";
      const visibleQuestions = isTeacherView && currentWorkMode === "all"
        ? [questionDetails[activeStudentSlide]]
        : questionDetails;
      visibleQuestions.forEach(question => {
        const index = questionDetails.indexOf(question);
        const responses = entries.filter(([, student]) => String(getAnswer(student, question)).trim());
        if (!responses.length) return;
        const details = document.createElement("details");
        if (grouped.children.length === 0) details.open = true;
        const summary = document.createElement("summary");
        summary.textContent = `${index + 1}. ${question.title}`;
        const list = document.createElement("div");
        list.className = "answer-list";
        responses.forEach(([studentId, student]) => {
          const review = student.reviews?.[question.key] || "pending";
          const comment = student.teacherComments?.[question.key] || "";
          const card = document.createElement("article");
          card.className = `response-card ${review === "approved" ? "approved" : review === "rejected" ? "rejected" : ""}`.trim();
          const header = document.createElement("div");
          header.className = "response-header";
          const author = document.createElement("span");
          author.textContent = student.name || "Studente";
          const state = document.createElement("span");
          state.textContent = review === "approved" ? "✓ Approvata" : review === "rejected" ? "✕ Da correggere" : "In attesa";
          header.append(author, state);
          const prompt = document.createElement("div");
          prompt.className = "response-question";
          prompt.textContent = `Domanda: ${question.title}`;
          const answer = document.createElement("div");
          answer.className = "response-answer";
          answer.textContent = getAnswer(student, question);
          card.append(header, prompt, answer);

          if (isTeacherView) {
            const commentInput = document.createElement("textarea");
            commentInput.className = "teacher-comment";
            commentInput.rows = 2;
            commentInput.placeholder = "Correzione o commento dell’insegnante (facoltativo)...";
            commentInput.value = comment;
            commentInput.setAttribute("aria-label", `Correzione per ${student.name || "studente"}, domanda ${index + 1}`);
            const actions = document.createElement("div");
            actions.className = "review-actions";
            const approve = document.createElement("button");
            approve.type = "button";
            approve.className = "btn-approve";
            approve.textContent = "✓ Approva";
            const reject = document.createElement("button");
            reject.type = "button";
            reject.className = "btn-reject";
            reject.textContent = "✕ Non approvare";
            const setReview = async status => {
              if (!answersRef) return;
              const studentRef = answersRef.child("allStudentsData").child("students").child(studentId);
              await studentRef.child("teacherComments").child(question.key).set(commentInput.value.trim() || null);
              await studentRef.child("reviews").child(question.key).set(review === status ? null : status);
            };
            approve.addEventListener("click", () => setReview("approved"));
            reject.addEventListener("click", () => setReview("rejected"));
            actions.append(approve, reject);
            card.append(commentInput, actions);
          } else if (comment) {
            const feedback = document.createElement("p");
            feedback.className = "review-status";
            feedback.textContent = `Commento dell’insegnante: ${comment}`;
            card.appendChild(feedback);
          }
          list.appendChild(card);
        });
        details.append(summary, list);
        grouped.appendChild(details);
      });
      if (!grouped.children.length) {
        const empty = document.createElement("p");
        empty.style.color = "var(--text-muted)";
        empty.textContent = isTeacherView && currentWorkMode === "all"
          ? "Nessuna risposta inviata per questa scheda."
          : "Пока никто не отправил ответы...";
        responsesList.appendChild(empty);
      } else responsesList.appendChild(grouped);
    }

    if (window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        answersRef = firebase.database().ref(`esercizi/gruppi/${gruppo}/unita1-risposte-aperte-b`);
        answersRef.on("value", snapshot => {
          const data = snapshot.val() || {};
          const resetId = data.resetId || null;
          if (resetId && resetId !== lastResetId) {
            studentAnswers = {};
            saveStatus.hidden = true;
          }
          lastResetId = resetId;
          currentWorkMode = data.workMode || "token";
          currentActiveStep = Number.isInteger(data.tokenData?.activeStep) ? data.tokenData.activeStep : -1;
          currentWriter = data.tokenData?.currentWriter || null;
          tokenResponses = data.tokenData?.responses || {};
          allResponses = data.allStudentsData || {};
          workModeSelect.value = currentWorkMode;
          if (registeredStudentName) {
            const ownId = registeredStudentName.replace(/[.#$\/\[\]]/g, "_");
            const own = allResponses.students?.[ownId];
            if (own) questionDetails.forEach(question => {
              studentAnswers[question.key] = getAnswer(own, question);
            });
          }
          updateUIState();
        });
      } catch (error) { console.error("Errore Firebase:", error); }
    }

    resetButton.addEventListener("click", () => {
      if (!answersRef || !confirm(`Vuoi azzerare tutte le risposte del gruppo ${gruppoNome || gruppo}?`)) return;
      answersRef.set({
        resetId: `${Date.now()}_${myClientId}`,
        workMode: currentWorkMode,
        tokenData: { activeStep: -1, currentWriter: null, responses: {} },
        allStudentsData: {}
      });
    });

    function bindNavigation(mode) {
      const track = mode === "token" ? tokenTrack : studentTrack;
      const prev = document.getElementById(`prev-${mode}-slide`);
      const next = document.getElementById(`next-${mode}-slide`);
      prev.addEventListener("click", () => showSlide(mode, (mode === "token" ? activeTokenSlide : activeStudentSlide) - 1));
      next.addEventListener("click", () => showSlide(mode, (mode === "token" ? activeTokenSlide : activeStudentSlide) + 1));
      track.addEventListener("scroll", () => trackScroll(mode, track), { passive: true });
    }
    // Navigation is wired above through the shared handlers; initialize the progress bars and tracks.
    initializeProgress("token");
    initializeProgress("student");
    renderTrack("token");
    renderTrack("student");
    updateNavigation("token");
    updateNavigation("student");
  </script>
  <script>
    document.getElementById("grammar-menu").addEventListener("change", event => {
      if (!event.target.value) return;
      const target = new URL(event.target.value, location.href);
      const params = new URLSearchParams(location.search);
      let session = {};
      try { session = JSON.parse(localStorage.getItem("parlo_session") || "{}"); } catch (_) {}
      const group = params.get("gruppo") || session.group || "";
      const name = params.get("nome") || (!session.isTeacher ? session.name : "") || "";
      if (group) target.searchParams.set("gruppo", group);
      if (name && name !== "Insegnante") target.searchParams.set("nome", name);
      location.href = target.href;
    });
  </script>
</body>
</html>
