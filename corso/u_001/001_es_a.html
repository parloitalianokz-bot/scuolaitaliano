<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 1 — Lettura e Comprensione (Un albergo in centro)</title>
  <link rel="stylesheet" href="../shared/theme.css?v=2" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      background:
        linear-gradient(rgba(250, 248, 241, .78), rgba(250, 248, 241, .78)),
        url("img/sfondo.jpeg") center calc(50% - var(--background-offset, 0px)) / cover fixed,
        radial-gradient(ellipse at 50% -12%, rgba(111, 151, 116, .18), transparent 42%),
        var(--bg-main);
      color: var(--text);
    }

    .container { width: min(100%, 880px); margin: 0 auto; }

    .hero {
      position: relative; isolation: isolate; overflow: hidden; margin: 8px 0 20px; padding: 24px 20px 22px;
      text-align: center; border: 1px solid rgba(71, 119, 85, .13); border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 254, 250, .94), rgba(242, 247, 239, .91));
      box-shadow: 0 12px 32px rgba(43, 69, 46, .07);
    }
    .eyebrow {
      display: inline-block; color: var(--primary-dark); font-size: .78rem; font-weight: 800;
      letter-spacing: .09em; text-transform: uppercase; background: #eaf1e8; padding: 7px 14px;
      border-radius: 20px; margin-bottom: 8px; box-shadow: inset 0 0 0 1px rgba(71, 119, 85, .11);
    }
    h1 { margin: 4px 0; font-size: clamp(1.85rem, 5vw, 2.55rem); letter-spacing: -.04em; color: var(--primary-dark); line-height: 1.12; }
    .hero-subtitle { margin: 6px 0 0; color: var(--text-muted); font-size: .96rem; }

    .instruction-box {
      background: #fff; border: 1px solid #d8e5d8; border-left: 5px solid var(--accent);
      border-radius: 16px; padding: 14px 18px; margin-bottom: 20px; box-shadow: 0 6px 18px rgba(43, 69, 46, .04);
    }
    .instruction-title { font-size: .82rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 4px; }
    .instruction-text { font-size: .96rem; color: var(--text); line-height: 1.45; }

    .card {
      padding: clamp(18px, 4vw, 30px); border: 1px solid var(--border); border-radius: 26px;
      background: var(--card-bg); box-shadow: 0 22px 60px rgba(43, 69, 46, .11); margin-bottom: 32px;
    }

    .student-login {
      display: none; margin-bottom: 18px; padding: 14px 16px; border-radius: 14px;
      background: var(--primary-light); gap: 12px; align-items: center; flex-wrap: wrap;
    }
    .student-login.visible { display: flex; }
    .student-login label { color: var(--primary-dark); font-size: .9rem; font-weight: 700; white-space: nowrap; }
    .student-login input { flex: 1; min-width: 180px; padding: 10px 14px; border: 1.5px solid #d4e1d5; border-radius: 10px; font: inherit; background: #fff; }
    .student-login button {
      min-height: 42px; padding: 8px 16px; border: 0; border-radius: 10px;
      background: var(--primary-dark); color: #fff; font: inherit; font-size: .88rem; font-weight: 700; cursor: pointer;
    }

    /* Barra di avanzamento navigabile */
    .overall-progress {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(38px, 1fr));
      gap: 6px;
      width: 100%;
      margin: 0 0 18px;
    }
    .progress-step {
      min-width: 0;
      min-height: 36px;
      padding: 4px;
      border: 1.5px solid #d8e5d8;
      border-radius: 10px;
      background: #fff;
      color: var(--primary-dark);
      font: inherit;
      font-size: .86rem;
      font-weight: 800;
      cursor: pointer;
      transition: background .18s, border-color .18s, color .18s;
    }
    .progress-step:hover { border-color: var(--primary); background: var(--primary-light); }
    .progress-step.partial { border-color: #eab308; background: #fefce8; color: #854d0e; }
    .progress-step.done { border-color: #6ab082; background: #e5f5ea; color: #17623c; }
    .progress-step[aria-current="step"] {
      border-color: var(--primary-dark);
      background: var(--primary);
      color: #fff;
      box-shadow: 0 3px 10px rgba(71, 119, 85, .25);
    }

    .section-box {
      display: flex; flex-direction: column; gap: 16px; padding: 20px; border: 1px solid var(--border);
      border-radius: 20px; background: #fff; box-shadow: 0 6px 18px rgba(43, 69, 46, .03);
    }
    .section-box[hidden] { display: none; }

    .section-header {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      padding-bottom: 12px; border-bottom: 1px solid #eef2ee;
    }
    .section-title { display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 1.12rem; font-weight: 800; line-height: 1.35; color: var(--primary-dark); }
    .number {
      display: inline-grid; flex-shrink: 0; width: 34px; height: 34px; place-items: center;
      border-radius: 10px; background: var(--primary); color: #fff; font-size: .92rem; font-weight: 800;
    }

    .turn-status-row {
      display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    }
    .turn-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px;
      border: 1px solid #dce6dc; border-radius: 999px; background: #f7faf7;
      color: var(--primary-dark); font-size: .82rem; font-weight: 700;
    }
    .turn-pill.is-me {
      border-color: var(--accent); background: #fff3ed; color: #9c4a30;
      box-shadow: 0 0 0 2px rgba(189, 105, 77, .12);
    }

    /* Controlli assegnazione turni (solo insegnante) */
    .turn-assignment-bar {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      padding: 12px 14px;
      border: 1px solid #d5e2d5;
      border-radius: 14px;
      background: #f3f8f3;
    }
    .turn-assignment-bar[hidden] { display: none; }
    .turn-select-group { display: flex; flex-direction: column; gap: 5px; }
    .turn-select-group label { color: var(--primary-dark); font-size: .78rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
    .turn-select-group select {
      min-height: 38px; padding: 6px 10px; border: 1.5px solid #c7d8c8; border-radius: 10px;
      background: #fff; color: var(--text); font: inherit; font-size: .88rem; font-weight: 700; cursor: pointer;
    }

    /* Box di testo condiviso per formulare la domanda */
    .question-form-card {
      padding: 14px 16px; border: 1.5px solid #dce8dc; border-radius: 16px; background: #f8faf6;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .question-form-card.active-turn {
      border-color: var(--accent); background: #fffdfb; box-shadow: 0 0 0 3px rgba(189, 105, 77, .14);
    }
    .question-form-header { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .question-form-header label { color: var(--primary-dark); font-size: .92rem; font-weight: 800; }
    .turn-hint-tag { font-size: .8rem; font-weight: 700; color: var(--text-muted); }
    .question-form-card.active-turn .turn-hint-tag { color: var(--accent); }

    .accent-toolbar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
    .accent-toolbar button {
      min-width: 34px; min-height: 32px; padding: 3px 9px; border: 1px solid #d4e1d5; border-radius: 8px;
      background: #fff; color: var(--primary-dark); font: inherit; font-size: .92rem; font-weight: 700; cursor: pointer;
    }
    .accent-toolbar button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .accent-toolbar button:disabled { cursor: not-allowed; opacity: .45; }

    textarea.question-input {
      width: 100%; min-height: 66px; padding: 10px 12px; border: 1.5px solid #d4e1d5; border-radius: 10px;
      background: #fff; color: var(--text); font: inherit; font-size: .98rem; resize: vertical;
    }
    textarea.question-input:disabled { background: #f1f4f0; color: #475569; cursor: not-allowed; }

    .question-submit-row { display: flex; justify-content: flex-end; align-items: center; margin-top: 10px; }
    .btn-submit-question {
      min-height: 40px; padding: 8px 18px; border: 0; border-radius: 11px; background: var(--primary);
      color: #fff; font: inherit; font-size: .9rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 12px rgba(71, 119, 85, .2); transition: background .2s, opacity .2s;
    }
    .btn-submit-question:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-submit-question:disabled { background: #cbd5cb; color: #5f6863; box-shadow: none; cursor: not-allowed; opacity: .75; }

    /* Elenco contributi condivisi */
    .contributions-wrapper {
      display: flex; flex-direction: column; gap: 8px;
      padding: 12px 14px; border: 1px solid #e3ebe3; border-radius: 14px; background: #fcfdfb;
    }
    .contributions-title {
      font-size: .8rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--primary-dark);
    }
    .contributions-empty { margin: 0; color: var(--text-muted); font-size: .88rem; font-style: italic; }
    .contributions-list { display: flex; flex-direction: column; gap: 8px; }
    .contribution-item {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border: 1px solid #dce7dc; border-left: 4px solid var(--primary);
      border-radius: 10px; background: #fff;
    }
    .contribution-body { flex: 1; min-width: 0; }
    .contribution-text { margin: 0 0 5px; color: var(--text); font-size: .96rem; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
    .contribution-meta { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; font-weight: 700; color: var(--text-muted); }
    .btn-delete-contribution {
      flex-shrink: 0; width: 28px; height: 28px; border: 1px solid #f2d4d2; border-radius: 7px;
      background: #fff; color: #c8322b; font-size: .85rem; font-weight: 800; cursor: pointer;
    }
    .btn-delete-contribution:hover { background: #fef2f2; }

    /* Opzioni di risposta */
    .options-section {
      display: flex; flex-direction: column; gap: 10px;
      padding: 14px 16px; border: 1.5px solid #e3ebe3; border-radius: 16px; background: #fbfcfa;
      transition: border-color .2s, box-shadow .2s;
    }
    .options-section.active-turn {
      border-color: var(--primary); box-shadow: 0 0 0 3px rgba(71, 119, 85, .13);
    }
    .section-hint {
      padding: 2px 0 2px 12px; border-left: 3px solid var(--primary);
      color: var(--primary-dark); font-size: 1.05rem; font-weight: 800;
    }
    .options-grid { display: flex; flex-direction: column; gap: 9px; }
    .option-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 10px 14px;
      border: 1.5px solid #d4e1d5; border-radius: 12px; background: #fff; font: inherit; font-size: 1rem; font-weight: 600;
      color: var(--text); cursor: pointer; text-align: left; transition: all .18s ease;
    }
    .option-btn:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .option-main { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .option-letter {
      display: inline-grid; place-items: center; flex-shrink: 0; width: 28px; height: 28px;
      border-radius: 8px; background: var(--primary-light); color: var(--primary-dark);
      font-size: .84rem; font-weight: 800; text-transform: uppercase;
    }
    .option-btn.selected { border-color: var(--primary-dark); background: #e2ede3; color: var(--primary-dark); font-weight: 700; }
    .option-btn.selected.correct { border-color: var(--success); background: var(--success-bg); color: #17623c; }
    .option-btn.selected.correct .option-letter { background: var(--success); color: #fff; }
    .option-btn.selected.incorrect { border-color: #dc2626; background: #fde8e7; color: #991b1b; }
    .option-btn.selected.incorrect .option-letter { background: #dc2626; color: #fff; }
    .option-btn:disabled { cursor: not-allowed; }
    .option-feedback-badge { font-size: .82rem; font-weight: 800; white-space: nowrap; }

    .answer-outcome {
      margin: 0; padding: 9px 13px; border-radius: 10px; font-size: .88rem; font-weight: 700;
    }
    .answer-outcome[hidden] { display: none; }
    .answer-outcome.correct { border: 1px solid #b7dfc1; background: var(--success-bg); color: #17623c; }
    .answer-outcome.incorrect { border: 1px solid #f5c2c0; background: #fde8e7; color: #991b1b; }

    .slide-navigation {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px;
      padding-top: 14px; border-top: 1px solid var(--border);
    }
    .slide-navigation button, .slide-navigation a {
      min-height: 42px; padding: 8px 18px; border: 1px solid #d8e5d8; border-radius: 10px;
      background: #fff; color: var(--primary-dark); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; transition: all .2s;
    }
    .slide-navigation a { display: inline-flex; align-items: center; }
    .slide-navigation a[hidden] { display: none; }
    .slide-navigation button:hover:not(:disabled), .slide-navigation a:hover { background: var(--primary-light); border-color: var(--primary); }
    .slide-navigation button:disabled { cursor: not-allowed; opacity: .45; }
    .slide-progress { color: var(--primary-dark); font-size: .95rem; font-weight: 800; text-align: center; }

    @media (max-width: 680px) {
      body { padding: 16px 8px; }
      .section-box { padding: 14px; }
      .turn-assignment-bar { grid-template-columns: 1fr; }
      .overall-progress { grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
      .progress-step { min-height: 36px; font-size: .82rem; }
      .slide-navigation { flex-direction: column; gap: 8px; }
      .slide-navigation button, .slide-navigation a { justify-content: center; width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="top-exercises" aria-label="Menu dell’unità 1">
      <a id="home-link" class="home-link" href="../index.html" aria-label="Torna alla pagina iniziale" title="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z"/></svg>
      </a>
      <span id="user-badge" aria-live="polite"></span>
      <label class="visually-hidden" for="exercise-menu">Vai a una pagina dell’unità 1</label>
      <select id="exercise-menu">

        <option value="001_es_b.html">Esercizio B</option>
        <option value="001_es_c.html">Esercizio C</option>
        <option value="001_es_d.html">Esercizio D</option>
        <option value="001_es_e.html">Esercizio E</option>
        <option value="001_es_f.html">Esercizio F</option>
        <option value="001_es_g.html">Esercizio G</option>
        <option value="001_es_h.html">Esercizio H</option>
        <option value="001_es_i.html">Esercizio I</option>

      <label class="visually-hidden" for="grammar-menu">Seleziona una scheda grammaticale</label>
      <select id="grammar-menu" aria-label="Schede grammaticali">

        <option value="001_verbo_essere.html">Il verbo essere</option>
        <option value="001_genere.html">Il genere del sostantivo</option>
        <option value="001_indeterminativi.html">Articoli indeterminativi</option>
        <option value="001_plurale.html">Il numero del sostantivo · Il plurale</option>
        <option value="001_determinativi.html">Articoli determinativi</option>
      </select>
    </nav>

    <header class="hero">
      <span class="eyebrow">Unità 1 · Lettura e Comprensione</span>
      <h1>Un albergo in centro</h1>
      <p class="hero-subtitle">Formulate una domanda e scegliete la risposta corretta a turno.</p>
    </header>

    <div class="instruction-box">
      <div class="instruction-title">💡 Задание · Esercizio A</div>
      <div class="instruction-text">👉 <strong>Сформулируйте вопрос и выберите правильный вариант ответа:</strong></div>
    </div>

    <section class="card" aria-label="Domande dell’esercizio">
      <div class="student-login" id="student-login">
        <label for="student-name">Ваше имя · Nome e cognome:</label>
        <input id="student-name" type="text" placeholder="Inserisci il tuo nome per partecipare" />
        <button id="confirm-student-name" type="button">Conferma</button>
      </div>

      <nav id="exercise-progress" class="overall-progress" aria-label="Vai direttamente alla scheda"></nav>
      <div id="questions-container"></div>

      <nav class="slide-navigation student-navigation" aria-label="Navigazione schede">
        <button id="previous-question" type="button">← Precedente</button>
        <span id="question-progress" class="slide-progress" aria-live="polite"></span>
        <button id="next-question" type="button">Successiva →</button>
        <a id="next-exercise" href="001_es_b.html" hidden>Vai all’esercizio B →</a>
      </nav>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../shared/group-scope.js?v=1"></script>
  <script src="../shared/exercise-core.js?v=8"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    const sectionsData = [
      { hint: "L’albergo Ponte Vecchio", options: ["è a Roma.", "è a Firenze."], correctOption: 1 },
      { hint: "L’albergo Ponte Vecchio", options: ["è in periferia", "è in centro"], correctOption: 1 },
      { hint: "Victor è", options: ["il direttore dell’albergo.", "avvocato."], correctOption: 1 },
      { hint: "Victor", options: ["è in Italia per turismo", "è in Italia per affari"], correctOption: 1 },
      { hint: "Karl e Klaus", options: ["è studente", "sono studenti"], correctOption: 1 },
      { hint: "Karl e Klaus", options: ["sono in Italia per studiare il tedesco", "sono in Italia per studiare l’italiano"], correctOption: 1 },
      { hint: "Mary è in Italia", options: ["per insegnare l’italiano", "per insegnare l’inglese."], correctOption: 1 },
      { hint: "Mary è", options: ["un’insegnante inglese", "un’insegnante americana"], correctOption: 0 },
      { hint: "Yoko", options: ["è insegnante", "è dentista"], correctOption: 1 },
      { hint: "Yoko è in Italia", options: ["per una conferenza", "per turismo"], correctOption: 0 },
      { hint: "Olga è in Italia", options: ["per conoscere i ragazzi italiani", "per studiare e per fare shopping"], correctOption: 1 },
      { hint: "Olga è", options: ["una studentessa italiana", "una studentessa di italiano"], correctOption: 1 },
      { hint: "Il direttore dell’albergo", options: ["è molto occupato.", "è molto sposato"], correctOption: 0 }
    ];

    const TEACHER_ID = "__teacher__";
    const SPECIAL_CHARS = ["'", "à", "è", "ì", "ò", "ù", "È"];

    const session = window.ParloSession || {};
    const isTeacherView = Boolean(session.isTeacher);
    const gruppo = session.safeGroup || "sconosciuto";
    const exerciseKey = location.pathname.split("/").pop().replace(/\.html$/i, "").replace(/[.#$\/\[\]]/g, "_") || "es_a";

    function sanitizeId(raw) {
      return String(raw || "").trim().replace(/[.#$\/\[\]]/g, "_");
    }

    let currentUserName = isTeacherView
      ? "Insegnante"
      : ((session.name && session.name !== "Insegnante" ? session.name : "") || localStorage.getItem("parlo_student_name") || "").trim();

    let currentUserId = isTeacherView
      ? TEACHER_ID
      : (currentUserName ? `student_${sanitizeId(currentUserName)}` : "");

    const studentLogin = document.getElementById("student-login");
    const studentNameInput = document.getElementById("student-name");
    const confirmStudentNameBtn = document.getElementById("confirm-student-name");
    const questionsContainer = document.getElementById("questions-container");
    const previousButton = document.getElementById("previous-question");
    const nextButton = document.getElementById("next-question");
    const progressText = document.getElementById("question-progress");
    const exerciseProgress = document.getElementById("exercise-progress");
    const nextExerciseLink = document.getElementById("next-exercise");

    let exerciseRef = null;
    let presenceGroupRef = null;
    let cardsState = {};
    let rosterState = {};
    let turnQueue = [];
    let activeQuestion = 0;
    const cardUI = [];
    const draftSyncTimers = new Map();

    function updateLoginVisibility() {
      studentLogin.classList.toggle("visible", !isTeacherView && !currentUserId);
    }
    updateLoginVisibility();

    confirmStudentNameBtn.addEventListener("click", () => {
      const entered = studentNameInput.value.trim();
      if (!entered) {
        studentNameInput.focus();
        return;
      }
      currentUserName = entered;
      currentUserId = `student_${sanitizeId(entered)}`;
      localStorage.setItem("parlo_student_name", entered);
      const badge = document.getElementById("user-badge");
      if (badge && session.group) {
        badge.textContent = `👤 ${session.group} · ${entered}`;
        badge.hidden = false;
      }
      updateLoginVisibility();
      registerPresence();
      renderAllCards();
    });

    studentNameInput.addEventListener("keydown", event => {
      if (event.key === "Enter") {
        event.preventDefault();
        confirmStudentNameBtn.click();
      }
    });

    function createItalianCharToolbar(textarea) {
      const toolbar = document.createElement("div");
      toolbar.className = "accent-toolbar";
      toolbar.setAttribute("aria-label", "Caratteri speciali italiani");
      SPECIAL_CHARS.forEach(char => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.textContent = char;
        btn.setAttribute("aria-label", `Inserisci ${char}`);
        btn.addEventListener("mousedown", e => e.preventDefault());
        btn.addEventListener("click", () => {
          if (textarea.disabled) return;
          const start = textarea.selectionStart ?? textarea.value.length;
          const end = textarea.selectionEnd ?? textarea.value.length;
          textarea.value = textarea.value.slice(0, start) + char + textarea.value.slice(end);
          const nextPos = start + char.length;
          textarea.focus();
          textarea.setSelectionRange(nextPos, nextPos);
          textarea.dispatchEvent(new Event("input", { bubbles: true }));
        });
        toolbar.appendChild(btn);
      });
      return toolbar;
    }

    function formatTimestamp(ts) {
      if (!ts) return "";
      try {
        return new Date(ts).toLocaleString("it-IT", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      } catch (_) {
        return "";
      }
    }

    function getParticipantName(assigneeId) {
      if (!assigneeId) return "Nessuno";
      if (assigneeId === TEACHER_ID) return "Insegnante";
      const entry = rosterState[assigneeId];
      if (entry && entry.name) return entry.name;
      return assigneeId.replace(/^student_/, "").replace(/_/g, " ");
    }

    function getParticipantLabel(assigneeId) {
      if (!assigneeId) return "Nessuno";
      if (assigneeId === TEACHER_ID) return "👩‍🏫 Insegnante";
      const entry = rosterState[assigneeId];
      if (entry && entry.name) {
        return `${entry.online ? "🟢" : "⚪"} ${entry.name}`;
      }
      return assigneeId.replace(/^student_/, "").replace(/_/g, " ");
    }

    function getOnlineStudentIds() {
      return Object.entries(rosterState)
        .filter(([id, data]) => id !== TEACHER_ID && data && data.name && data.online)
        .sort((a, b) => String(a[1].name).localeCompare(String(b[1].name), "it"))
        .map(([id]) => id);
    }

    function syncTurnQueueWithOnline() {
      const onlineIds = getOnlineStudentIds();
      turnQueue = turnQueue.filter(id => onlineIds.includes(id));
      onlineIds.forEach(id => {
        if (!turnQueue.includes(id)) turnQueue.push(id);
      });
    }

    function buildTurnOptions(selectEl, selectedValue) {
      const previous = selectedValue ?? selectEl.value ?? "";
      selectEl.replaceChildren();

      const emptyOpt = document.createElement("option");
      emptyOpt.value = "";
      emptyOpt.textContent = "— Nessuno —";
      selectEl.appendChild(emptyOpt);

      const teacherOpt = document.createElement("option");
      teacherOpt.value = TEACHER_ID;
      teacherOpt.textContent = "👩‍🏫 Insegnante";
      selectEl.appendChild(teacherOpt);

      const students = Object.entries(rosterState)
        .filter(([id, data]) => id !== TEACHER_ID && data && data.name)
        .sort((a, b) => {
          const onlineDiff = Number(Boolean(b[1].online)) - Number(Boolean(a[1].online));
          if (onlineDiff !== 0) return onlineDiff;
          return String(a[1].name).localeCompare(String(b[1].name), "it");
        });

      students.forEach(([id, data]) => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = `${data.online ? "🟢" : "⚪"} ${data.name}`;
        selectEl.appendChild(opt);
      });

      if (previous && !Array.from(selectEl.options).some(o => o.value === previous)) {
        const fallbackOpt = document.createElement("option");
        fallbackOpt.value = previous;
        fallbackOpt.textContent = `⚪ ${previous.replace(/^student_/, "").replace(/_/g, " ")}`;
        selectEl.appendChild(fallbackOpt);
      }

      selectEl.value = previous;
    }

    function syncDraftToFirebase(index, text) {
      if (!exerciseRef) return;
      clearTimeout(draftSyncTimers.get(index));
      draftSyncTimers.set(index, setTimeout(() => {
        draftSyncTimers.delete(index);
        exerciseRef.child("cards").child(String(index)).child("draftQuestion").set(text);
      }, 150));
    }

    function ensureQuestionMark(rawText) {
      const cleaned = rawText.trim().replace(/\s+/g, " ");
      if (!cleaned) return "";
      return /[?!.]$/.test(cleaned) ? cleaned : `${cleaned}?`;
    }

    // Invio automatico della bozza quando l'insegnante chiude o riassegna il turno domanda
    async function commitPendingDraftAndChangeAssignee(index, nextAssigneeId) {
      if (!exerciseRef) return;
      const cardData = cardsState[index] || {};
      const prevAssigneeId = cardData.questionAssignee || "";

      if (prevAssigneeId && prevAssigneeId !== nextAssigneeId) {
        const rawDraft = (cardData.draftQuestion || "").trim();
        const formatted = ensureQuestionMark(rawDraft);
        const cardRef = exerciseRef.child("cards").child(String(index));

        if (formatted) {
          await cardRef.child("contributions").push().set({
            text: formatted,
            authorId: prevAssigneeId,
            authorName: getParticipantName(prevAssigneeId),
            timestamp: firebase.database.ServerValue.TIMESTAMP
          });
        }
        await cardRef.update({
          draftQuestion: "",
          questionAssignee: nextAssigneeId || null
        });
      } else {
        await exerciseRef.child("cards").child(String(index)).child("questionAssignee").set(nextAssigneeId || null);
      }
    }

    // Auto-rotazione a coda quando l'insegnante apre una scheda ancora senza turni
    function autoAssignNextTurnIfNeeded(targetIndex) {
      if (!isTeacherView || !exerciseRef) return;
      const targetData = cardsState[targetIndex] || {};
      if (targetData.questionAssignee || targetData.answerAssignee) return;

      syncTurnQueueWithOnline();
      if (turnQueue.length === 0) return;

      const prevIndex = targetIndex > 0 ? targetIndex - 1 : -1;
      const prevData = prevIndex >= 0 ? (cardsState[prevIndex] || {}) : {};
      const prevAsker = prevData.questionAssignee && turnQueue.includes(prevData.questionAssignee)
        ? prevData.questionAssignee
        : "";
      const prevAnswerer = prevData.answerAssignee && turnQueue.includes(prevData.answerAssignee)
        ? prevData.answerAssignee
        : "";

      // Chi ha fatto la domanda nella scheda precedente va in fondo alla coda
      if (prevAsker) {
        turnQueue = turnQueue.filter(id => id !== prevAsker);
        turnQueue.push(prevAsker);
      }

      // Chi ha risposto nella precedente passa a formulare la domanda
      const nextAsker = prevAnswerer || turnQueue[0];

      // Il primo in coda diverso dal nuovo formulatore viene scelto per rispondere
      let nextAnswerer = "";
      if (turnQueue.length === 1) {
        nextAnswerer = turnQueue[0];
      } else {
        nextAnswerer = turnQueue.find(id => id !== nextAsker) || "";
      }

      exerciseRef.child("cards").child(String(targetIndex)).update({
        questionAssignee: nextAsker || null,
        answerAssignee: nextAnswerer || null
      });
    }

    sectionsData.forEach((question, index) => {
      const box = document.createElement("div");
      box.className = "section-box";
      box.hidden = index !== activeQuestion;

      const header = document.createElement("div");
      header.className = "section-header";

      const title = document.createElement("div");
      title.className = "section-title";
      title.innerHTML = `<span class="number">${index + 1}</span><span>${question.hint}...</span>`;

      const turnStatusRow = document.createElement("div");
      turnStatusRow.className = "turn-status-row";
      const askPill = document.createElement("span");
      askPill.className = "turn-pill";
      const answerPill = document.createElement("span");
      answerPill.className = "turn-pill";
      turnStatusRow.append(askPill, answerPill);

      header.append(title, turnStatusRow);

      // Barra assegnazione turni (solo insegnante)
      const assignmentBar = document.createElement("div");
      assignmentBar.className = "turn-assignment-bar";
      assignmentBar.hidden = !isTeacherView;

      const askGroup = document.createElement("div");
      askGroup.className = "turn-select-group";
      const askLabel = document.createElement("label");
      askLabel.htmlFor = `assign-ask-${index}`;
      askLabel.textContent = "✍️ Turno domanda:";
      const askSelect = document.createElement("select");
      askSelect.id = `assign-ask-${index}`;
      if (isTeacherView) {
        askSelect.addEventListener("change", () => {
          commitPendingDraftAndChangeAssignee(index, askSelect.value);
        });
      }
      askGroup.append(askLabel, askSelect);

      const answerGroup = document.createElement("div");
      answerGroup.className = "turn-select-group";
      const answerLabel = document.createElement("label");
      answerLabel.htmlFor = `assign-answer-${index}`;
      answerLabel.textContent = "✅ Turno risposta:";
      const answerSelect = document.createElement("select");
      answerSelect.id = `assign-answer-${index}`;
      if (isTeacherView) {
        answerSelect.addEventListener("change", () => {
          if (!exerciseRef) return;
          exerciseRef.child("cards").child(String(index)).child("answerAssignee").set(answerSelect.value || null);
        });
      }
      answerGroup.append(answerLabel, answerSelect);

      if (isTeacherView) {
        assignmentBar.append(askGroup, answerGroup);
      }

      // Box di testo condiviso per formulare la domanda
      const questionCard = document.createElement("div");
      questionCard.className = "question-form-card";

      const questionHeader = document.createElement("div");
      questionHeader.className = "question-form-header";
      const questionLabel = document.createElement("label");
      questionLabel.htmlFor = `question-input-${index}`;
      questionLabel.textContent = "✍️ Formula una domanda:";
      const questionTurnHint = document.createElement("span");
      questionTurnHint.className = "turn-hint-tag";
      questionHeader.append(questionLabel, questionTurnHint);

      const questionInput = document.createElement("textarea");
      questionInput.id = `question-input-${index}`;
      questionInput.className = "question-input";
      questionInput.rows = 2;
      questionInput.placeholder = "Scrivi qui la domanda...";
      questionInput.disabled = true;

      const accentToolbar = createItalianCharToolbar(questionInput);

      questionInput.addEventListener("input", () => {
        const cardData = cardsState[index] || {};
        if (!currentUserId || cardData.questionAssignee !== currentUserId) return;
        syncDraftToFirebase(index, questionInput.value);
      });

      const submitRow = document.createElement("div");
      submitRow.className = "question-submit-row";

      const submitBtn = document.createElement("button");
      submitBtn.type = "button";
      submitBtn.className = "btn-submit-question";
      submitBtn.textContent = "📤 Invia domanda";
      submitBtn.disabled = true;

      submitBtn.addEventListener("click", async () => {
        const cardData = cardsState[index] || {};
        if (!exerciseRef || !currentUserId || cardData.questionAssignee !== currentUserId) return;
        const formatted = ensureQuestionMark(questionInput.value);
        if (!formatted) {
          questionInput.focus();
          return;
        }
        clearTimeout(draftSyncTimers.get(index));
        draftSyncTimers.delete(index);

        const cardRef = exerciseRef.child("cards").child(String(index));
        await cardRef.child("contributions").push().set({
          text: formatted,
          authorId: currentUserId,
          authorName: isTeacherView ? "Insegnante" : currentUserName,
          timestamp: firebase.database.ServerValue.TIMESTAMP
        });
        await cardRef.child("draftQuestion").set("");
        questionInput.value = "";
        questionInput.focus();
      });

      submitRow.appendChild(submitBtn);
      questionCard.append(questionHeader, accentToolbar, questionInput, submitRow);

      // Elenco contributi condivisi
      const contributionsWrapper = document.createElement("div");
      contributionsWrapper.className = "contributions-wrapper";
      const contributionsTitle = document.createElement("div");
      contributionsTitle.className = "contributions-title";
      contributionsTitle.textContent = "💬 Domande inviate";
      const contributionsEmpty = document.createElement("p");
      contributionsEmpty.className = "contributions-empty";
      contributionsEmpty.textContent = "Nessuna domanda inviata per questa scheda.";
      const contributionsList = document.createElement("div");
      contributionsList.className = "contributions-list";
      contributionsWrapper.append(contributionsTitle, contributionsEmpty, contributionsList);

      // Opzioni di risposta
      const optionsSection = document.createElement("div");
      optionsSection.className = "options-section";
      const hint = document.createElement("div");
      hint.className = "section-hint";
      hint.textContent = `${question.hint}...`;

      const optionsGrid = document.createElement("div");
      optionsGrid.className = "options-grid";

      const optionButtons = question.options.map((optionText, optionIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option-btn";
        button.disabled = true;

        const mainSpan = document.createElement("span");
        mainSpan.className = "option-main";
        const letterSpan = document.createElement("span");
        letterSpan.className = "option-letter";
        letterSpan.textContent = String.fromCharCode(65 + optionIndex);
        const textSpan = document.createElement("span");
        textSpan.textContent = optionText;
        mainSpan.append(letterSpan, textSpan);

        const badgeSpan = document.createElement("span");
        badgeSpan.className = "option-feedback-badge";
        button.append(mainSpan, badgeSpan);

        button.addEventListener("click", () => {
          const cardData = cardsState[index] || {};
          if (!exerciseRef || !currentUserId || cardData.answerAssignee !== currentUserId) return;
          exerciseRef.child("cards").child(String(index)).update({
            selectedOption: optionIndex,
            answeredBy: isTeacherView ? "Insegnante" : currentUserName,
            answeredAt: firebase.database.ServerValue.TIMESTAMP
          });
        });

        optionsGrid.appendChild(button);
        return { button, badgeSpan };
      });

      const answerOutcome = document.createElement("p");
      answerOutcome.className = "answer-outcome";
      answerOutcome.hidden = true;
      answerOutcome.setAttribute("aria-live", "polite");

      optionsSection.append(hint, optionsGrid, answerOutcome);

      box.append(header);
      if (isTeacherView) box.append(assignmentBar);
      box.append(questionCard, contributionsWrapper, optionsSection);
      questionsContainer.appendChild(box);

      cardUI.push({
        box,
        askSelect,
        answerSelect,
        askPill,
        answerPill,
        questionCard,
        questionTurnHint,
        accentToolbar,
        questionInput,
        submitBtn,
        contributionsEmpty,
        contributionsList,
        optionsSection,
        optionButtons,
        answerOutcome
      });
    });

    // Barra di avanzamento navigabile
    sectionsData.forEach((_, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "progress-step";
      button.textContent = String(index + 1);
      button.setAttribute("aria-label", `Vai alla scheda ${index + 1}`);
      button.setAttribute("aria-current", index === activeQuestion ? "step" : "false");
      button.addEventListener("click", () => showQuestion(index));
      exerciseProgress.appendChild(button);
    });

    function updateNavigation() {
      const last = activeQuestion === sectionsData.length - 1;
      previousButton.disabled = activeQuestion === 0;
      nextButton.hidden = last;
      nextExerciseLink.hidden = !last;

      exerciseProgress.querySelectorAll(".progress-step").forEach((button, index) => {
        const cardData = cardsState[index] || {};
        const hasContribution = Boolean(cardData.contributions && Object.keys(cardData.contributions).length > 0);
        const hasAnswer = cardData.selectedOption !== undefined && cardData.selectedOption !== null;
        const isAnswerCorrect = hasAnswer && Number(cardData.selectedOption) === sectionsData[index].correctOption;

        const isDone = hasContribution && isAnswerCorrect;
        const isPartial = !isDone && (hasContribution || hasAnswer);

        button.classList.toggle("done", isDone);
        button.classList.toggle("partial", isPartial);
        button.setAttribute("aria-current", index === activeQuestion ? "step" : "false");
      });

      progressText.textContent = `Scheda ${activeQuestion + 1} di ${sectionsData.length}`;
    }

    function showQuestion(index) {
      activeQuestion = Math.max(0, Math.min(index, sectionsData.length - 1));
      cardUI.forEach((ui, idx) => {
        ui.box.hidden = idx !== activeQuestion;
      });
      autoAssignNextTurnIfNeeded(activeQuestion);
      updateNavigation();
    }

    previousButton.addEventListener("click", () => showQuestion(activeQuestion - 1));
    nextButton.addEventListener("click", () => showQuestion(activeQuestion + 1));

    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target.closest("input, textarea, select, button, a, [tabindex]")) return;
      if (event.key === "ArrowLeft" && activeQuestion > 0) showQuestion(activeQuestion - 1);
      if (event.key === "ArrowRight" && activeQuestion < sectionsData.length - 1) showQuestion(activeQuestion + 1);
    });

    function renderCard(index) {
      const ui = cardUI[index];
      const question = sectionsData[index];
      const cardData = cardsState[index] || {};

      const questionAssignee = cardData.questionAssignee || "";
      const answerAssignee = cardData.answerAssignee || "";
      const canEditQuestion = Boolean(currentUserId && questionAssignee === currentUserId);
      const canChooseAnswer = Boolean(currentUserId && answerAssignee === currentUserId);

      if (isTeacherView) {
        buildTurnOptions(ui.askSelect, questionAssignee);
        buildTurnOptions(ui.answerSelect, answerAssignee);
      }

      ui.askPill.textContent = `✍️ Domanda: ${getParticipantLabel(questionAssignee)}`;
      ui.askPill.classList.toggle("is-me", canEditQuestion);

      ui.answerPill.textContent = `✅ Risposta: ${getParticipantLabel(answerAssignee)}`;
      ui.answerPill.classList.toggle("is-me", canChooseAnswer);

      ui.questionCard.classList.toggle("active-turn", canEditQuestion);
      ui.optionsSection.classList.toggle("active-turn", canChooseAnswer);

      ui.questionTurnHint.textContent = canEditQuestion
        ? "È il tuo turno di scrivere"
        : questionAssignee
          ? `In turno: ${getParticipantLabel(questionAssignee)}`
          : "In attesa di assegnazione";

      const remoteDraft = cardData.draftQuestion || "";
      if (!canEditQuestion || document.activeElement !== ui.questionInput) {
        if (ui.questionInput.value !== remoteDraft) {
          ui.questionInput.value = remoteDraft;
        }
      }
      ui.questionInput.disabled = !canEditQuestion;
      ui.accentToolbar.querySelectorAll("button").forEach(btn => {
        btn.disabled = !canEditQuestion;
      });
      ui.submitBtn.disabled = !canEditQuestion;

      const rawContributions = cardData.contributions || {};
      const contributions = Object.entries(rawContributions)
        .map(([id, item]) => ({ id, ...(item || {}) }))
        .sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      ui.contributionsList.replaceChildren();
      ui.contributionsEmpty.hidden = contributions.length > 0;

      contributions.forEach(item => {
        const card = document.createElement("div");
        card.className = "contribution-item";

        const body = document.createElement("div");
        body.className = "contribution-body";

        const textEl = document.createElement("p");
        textEl.className = "contribution-text";
        textEl.textContent = item.text || "";

        const metaEl = document.createElement("div");
        metaEl.className = "contribution-meta";
        const authorSpan = document.createElement("span");
        authorSpan.textContent = `👤 ${item.authorName || "Partecipante"}`;
        const timeSpan = document.createElement("span");
        timeSpan.textContent = formatTimestamp(item.timestamp);
        metaEl.append(authorSpan, timeSpan);

        body.append(textEl, metaEl);
        card.appendChild(body);

        if (isTeacherView) {
          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "btn-delete-contribution";
          delBtn.textContent = "✕";
          delBtn.title = "Elimina questa domanda";
          delBtn.setAttribute("aria-label", "Elimina questa domanda");
          delBtn.addEventListener("click", () => {
            if (!exerciseRef) return;
            exerciseRef.child("cards").child(String(index)).child("contributions").child(item.id).remove();
          });
          card.appendChild(delBtn);
        }

        ui.contributionsList.appendChild(card);
      });

      const selectedOption = cardData.selectedOption;
      const hasSelection = selectedOption !== undefined && selectedOption !== null;

      ui.optionButtons.forEach(({ button, badgeSpan }, optIndex) => {
        const isSelected = hasSelection && Number(selectedOption) === optIndex;
        const isCorrect = optIndex === question.correctOption;

        button.disabled = !canChooseAnswer;
        button.classList.toggle("selected", isSelected);
        button.classList.toggle("correct", isSelected && isCorrect);
        button.classList.toggle("incorrect", isSelected && !isCorrect);

        if (isSelected) {
          badgeSpan.textContent = isCorrect ? "✓ Corretta" : "✕ Errata";
        } else {
          badgeSpan.textContent = "";
        }
      });

      if (hasSelection) {
        const isCorrect = Number(selectedOption) === question.correctOption;
        const who = cardData.answeredBy ? ` (${cardData.answeredBy})` : "";
        ui.answerOutcome.hidden = false;
        ui.answerOutcome.className = `answer-outcome ${isCorrect ? "correct" : "incorrect"}`;
        ui.answerOutcome.textContent = isCorrect
          ? `✅ Risposta corretta${who}!`
          : `❌ Risposta non corretta${who}.`;
      } else {
        ui.answerOutcome.hidden = true;
      }
    }

    function renderAllCards() {
      sectionsData.forEach((_, index) => renderCard(index));
      updateNavigation();
    }

    function registerPresence() {
      if (!presenceGroupRef || isTeacherView || !currentUserId || !currentUserName) return;
      const myPresenceRef = presenceGroupRef.child(currentUserId);
      const connectedRef = firebase.database().ref(".info/connected");
      connectedRef.on("value", snap => {
        if (snap.val() === true) {
          myPresenceRef.onDisconnect().update({
            online: false,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
          myPresenceRef.update({
            name: currentUserName,
            online: true,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
          });
        }
      });
    }

    if (window.firebase) {
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        presenceGroupRef = db.ref(`esercizi/gruppi/${gruppo}/presenze`);
        presenceGroupRef.on("value", snapshot => {
          rosterState = snapshot.val() || {};
          syncTurnQueueWithOnline();
          renderAllCards();
        });

        exerciseRef = db.ref(`esercizi/gruppi/${gruppo}/${exerciseKey}`);
        exerciseRef.on("value", snapshot => {
          const data = snapshot.val() || {};
          cardsState = data.cards || {};
          renderAllCards();
        });

        registerPresence();
      } catch (error) {
        console.error("Errore Firebase:", error);
      }
    }

    renderAllCards();
    showQuestion(0);

    ParloExercise.initBackgroundParallax();
    ParloExercise.decorateSessionLinks();
    ParloExercise.bindNavigationSelect(document.getElementById("exercise-menu"));
    ParloExercise.bindNavigationSelect(document.getElementById("grammar-menu"));

    if (!document.querySelector('script[src*="classroom-notes.js"]')) {
      const notesScript = document.createElement("script");
      notesScript.src = "../classroom-notes.js";
      document.body.appendChild(notesScript);
    }
  </script>
</body>
</html>
