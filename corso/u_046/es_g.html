<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 46 — Completate le frasi (Esercizio G)</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #477755;
      --primary-light: #edf4ed;
      --primary-dark: #2f5739;
      --accent: #bd694d;
      --bg-main: #f5f1e7;
      --card-bg: #fffefa;
      --text: #292d28;
      --text-muted: #6b7069;
      --success: #278253;
      --success-bg: #e1f1e5;
      --error: #c43d3d;
      --error-bg: #fae7e5;
      --border: #e7e5dc;
    }
    * { box-sizing: border-box; }
    :focus-visible { outline: 3px solid rgba(189, 105, 77, .55); outline-offset: 3px; }
    body {
      min-height: 100vh; margin: 0; padding: 32px 16px; color: var(--text);
      background: linear-gradient(rgba(250,248,241,.78),rgba(250,248,241,.78)),
        url("img/sfondo-funerale-augusto.jpg") center calc(50% - var(--background-offset, 0px)) / cover fixed,
        radial-gradient(ellipse at 50% -12%,rgba(111,151,116,.18),transparent 42%), var(--bg-main);
    }
    .container { width: min(100%, 880px); margin: 0 auto; }
    .home-navigation { display: flex; justify-content: flex-start; margin: 0 0 12px; }
    .hero { margin: 8px 0 22px; padding: 28px 20px 26px; text-align: center; border: 1px solid rgba(71,119,85,.13); border-radius: 24px; background: linear-gradient(135deg,rgba(255,254,250,.94),rgba(242,247,239,.91)); box-shadow: 0 12px 32px rgba(43,69,46,.07); }
    .eyebrow { display: inline-block; margin-bottom: 10px; padding: 8px 15px; border-radius: 20px; background: #eaf1e8; color: var(--primary-dark); font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 4px 0; color: var(--primary-dark); font-size: clamp(1.9rem,5vw,2.65rem); letter-spacing: -.04em; line-height: 1.12; }
    .hero-subtitle { margin: 8px 0 0; color: var(--text-muted); font-size: .98rem; }
    .instruction-box, .top-controls { margin-bottom: 20px; padding: 16px 20px; border: 1px solid #d8e5d8; border-radius: 16px; background: #fff; box-shadow: 0 6px 18px rgba(43,69,46,.04); }
    .instruction-box { border-left: 5px solid var(--accent); }
    .instruction-title { margin-bottom: 6px; color: var(--accent); font-size: .85rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .instruction-text { font-size: .98rem; line-height: 1.5; }
    .example-box { margin: 12px 0 0; padding: 14px 16px; border-left: 4px solid var(--accent); border-radius: 10px; background: #fffaf0; line-height: 1.6; }
    .top-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; background: rgba(255,254,250,.96); }
    .teacher-controls { display: flex; width: 100%; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .mode-select-box { display: none; align-items: center; gap: 8px; color: var(--primary-dark); font-size: .9rem; font-weight: 700; }
    .mode-select-box.visible { display: flex; }
    .mode-select-box select { min-height: 40px; padding: 7px 10px; border: 1.5px solid #d4e1d5; border-radius: 8px; color: var(--primary-dark); background: #fff; font: inherit; }
    .reset-btn, .release-token-btn { min-height: 42px; padding: 7px 14px; border-radius: 10px; font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; }
    .reset-btn { border: 1px solid #fca5a5; background: #fff; color: #dc2626; }
    .reset-btn:hover { background: #fef2f2; }
    .release-token-btn { border: 1px solid #e8c58a; background: #fffaf0; color: #8a5a12; }
    .release-token-btn:hover { background: #fff1d6; }
    [hidden] { display: none !important; }
    .card { margin-bottom: 28px; padding: clamp(20px,4vw,32px); border: 1px solid var(--border); border-radius: 26px; background: var(--card-bg); box-shadow: 0 22px 60px rgba(43,69,46,.11); }
    #token-mode-section, #all-students-mode-section { display: none; }
    #token-mode-section.active-mode, #all-students-mode-section.active-mode { display: block; }
    .token-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; padding: 14px 18px; border-radius: 14px; background: var(--primary-light); }
    .token-status { color: var(--primary-dark); font-weight: 700; }
    .btn-token { min-height: 42px; padding: 8px 14px; border: 0; border-radius: 8px; background: var(--primary-dark); color: #fff; font-size: .85rem; font-weight: 700; cursor: pointer; }
    .btn-token.release { background: var(--accent); }
    .btn-token.busy { background: #e8ebea; color: #5f6863; cursor: not-allowed; }
    .slide-viewport { overflow: hidden; border: 1px solid #d8e5d8; border-radius: 18px; background: linear-gradient(145deg,#fffefa,#f2f7ef); }
    .slides-track { display: flex; transition: transform .42s ease; will-change: transform; }
    .slide-item { flex: 0 0 100%; min-width: 0; padding: clamp(18px,4vw,26px); }
    .question-box { margin-bottom: 18px; padding: 18px 20px; border: 1px solid #d0e2d2; border-radius: 16px; background: var(--primary-light); color: var(--primary-dark); font-size: 1.05rem; font-weight: 800; line-height: 1.5; }
    .answer-input, .teacher-comment { display: block; width: 100%; min-height: 100px; padding: 13px 15px; border: 1.5px solid #d4e1d5; border-radius: 12px; background: #fff; color: var(--text); font: inherit; line-height: 1.55; resize: vertical; }
    .answer-input:focus, .teacher-comment:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(71,119,85,.15); }
    .answer-input:disabled { background: #f1f5f1; color: #5f6863; }
    .slide-navigation { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .slide-navigation button { min-height: 42px; padding: 8px 18px; border: 1px solid #d8e5d8; border-radius: 10px; background: #fff; color: var(--primary-dark); font: inherit; font-weight: 700; cursor: pointer; }
    .slide-navigation button:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
    .slide-navigation button:disabled { cursor: not-allowed; opacity: .45; }
    .slide-progress { color: var(--primary-dark); font-size: .95rem; font-weight: 800; text-align: center; }
    .slide-index-nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0 0 12px; }
    .slide-index-nav button { width: 34px; min-height: 32px; padding: 4px; border: 1px solid #d8e5d8; border-radius: 8px; background: #fff; color: var(--primary-dark); font: inherit; font-size: .82rem; font-weight: 800; cursor: pointer; }
    .slide-index-nav button:hover, .slide-index-nav button[aria-current="step"] { border-color: var(--primary); background: var(--primary-light); }
    .btn-submit { width: 100%; margin-top: 18px; padding: 14px; border: 0; border-radius: 14px; background: var(--primary); color: #fff; font: inherit; font-size: 1rem; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(71,119,85,.3); }
    .btn-submit:hover { background: var(--primary-dark); }
    .save-status { margin: 0 0 16px; padding: 11px 14px; border: 1px solid #b7dfc1; border-radius: 12px; background: var(--success-bg); color: #17623c; font-size: .9rem; font-weight: 700; }
    .student-answer { margin: 12px 0 0; padding: 13px 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
    .student-answer-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .answer-author { color: var(--primary-dark); font-weight: 800; }
    .answer-text { display: block; overflow-wrap: anywhere; line-height: 1.55; white-space: pre-wrap; }
    .review-status { display: inline-block; padding: 4px 8px; border-radius: 8px; font-size: .78rem; font-weight: 800; }
    .review-status.approved { background: var(--success-bg); color: var(--success); }
    .review-status.rejected { background: var(--error-bg); color: var(--error); }
    .review-status.pending { background: #f1f3ef; color: var(--text-muted); }
    .teacher-comment-label { display: block; margin: 12px 0 6px; color: var(--primary-dark); font-size: .88rem; font-weight: 800; }
    .teacher-comment { min-height: 72px; font-size: .92rem; }
    .review-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
    .review-controls button { min-height: 38px; padding: 7px 11px; border: 1px solid var(--border); border-radius: 9px; background: #fff; font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer; }
    .review-controls button:hover { border-color: var(--primary); background: var(--primary-light); }
    .review-controls .approve.selected { border-color: var(--success); background: var(--success-bg); color: var(--success); }
    .review-controls .reject.selected { border-color: var(--error); background: var(--error-bg); color: var(--error); }
    .empty-message { color: var(--text-muted); font-size: .92rem; }
    @media (max-width: 600px) {
      body { padding: 16px 8px; }
      .token-bar { align-items: stretch; flex-direction: column; }
      .slide-navigation { gap: 8px; }
      .slide-navigation button { padding: 8px 12px; font-size: .88rem; }
      .question-box { padding: 15px; }
      .mode-select-box { align-items: stretch; flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) { .slides-track { transition: none; } }
  </style>
</head>
<body>
  <main class="container">
    <nav class="home-navigation" aria-label="Navigazione dell’Unità 46"></nav>
    <header class="hero">
      <span class="eyebrow">Unità 46 · Grammatica</span>
      <h1>Completate le frasi</h1>
      <p class="hero-subtitle">Usate l’imperfetto e il passato prossimo con il verbo dovere.</p>
    </header>
    <section class="instruction-box" aria-labelledby="instruction-title">
      <div class="instruction-title" id="instruction-title">💡 Задание · Esercizio G</div>
      <div class="instruction-text">👉 <strong>Дополните фразы по образцу:</strong>
        <div class="example-box"><strong>La mia macchina è sporca.</strong><br>→ La mia macchina era sporca e ho dovuto lavarla.</div>
      </div>
    </section>
    <div class="top-controls">
      <div class="teacher-controls">
        <div class="mode-select-box" id="mode-selector-container">
          <label for="work-mode">Режим работы · Modalità:</label>
          <select id="work-mode"><option value="token">Uno alla volta · По одному</option><option value="all">Tutti insieme · Все вместе</option></select>
        </div>
        <button id="teacher-release-token" class="release-token-btn" type="button" hidden>🔓 Libera il turno</button>
        <button id="reset-answers" class="reset-btn" type="button" hidden>⚠️ Сбросить · Azzera</button>
      </div>
    </div>

    <section id="token-mode-section" class="card active-mode" aria-label="Modalità uno alla volta">
      <div class="token-bar"><span id="token-status-text" class="token-status" aria-live="polite"></span><button id="btn-take-token" class="btn-token" type="button">✋ Взять слово · Prendi il turno</button></div>
      <nav id="token-slide-index" class="slide-index-nav" aria-label="Seleziona una frase"></nav>
      <div class="slide-viewport"><div id="token-slides" class="slides-track"></div></div>
      <nav class="slide-navigation" aria-label="Navigazione delle frasi in modalità token">
        <button id="token-prev" type="button">← Precedente</button><span id="token-progress" class="slide-progress" aria-live="polite"></span><button id="token-next" type="button">Successiva →</button>
      </nav>
    </section>

    <section id="all-students-mode-section" class="card" aria-label="Modalità tutti insieme">
      <p id="save-status" class="save-status" role="status" aria-live="polite" hidden></p>
      <nav id="all-slide-index" class="slide-index-nav" aria-label="Seleziona una frase"></nav>
      <div class="slide-viewport"><div id="all-slides" class="slides-track"></div></div>
      <nav class="slide-navigation" aria-label="Navigazione delle frasi">
        <button id="all-prev" type="button">← Precedente</button><span id="all-progress" class="slide-progress" aria-live="polite"></span><button id="all-next" type="button">Successiva →</button>
      </nav>
      <button id="submit-answers" class="btn-submit" type="button">📤 Отправить ответы · Invia le risposte</button>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-group-scope.js"></script>
  <script>
    const firebaseConfig = {
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano"
    };
    const questions = [
      "Le tue scarpe sono sporche.",
      "Il nostro frigorifero non funziona.",
      "Il mio telefonino è scarico.",
      "Il tuo computer è acceso.",
      "La vostra camera è sporca.",
      "La mia macchina non funziona.",
      "I nostri amici arrivano in aereo.",
      "I nostri amici devono andare all’aeroporto.",
      "Mia zia deve andare alla stazione.",
      "La zia mi aspetta alla stazione.",
      "I tuoi amici arrivano in treno.",
      "Il mio gatto è malato.",
      "La tua borsa è sul tavolo.",
      "I nostri vicini sono rumorosi.",
      "Il tuo libro è interessante.",
      "La tua bicicletta è rotta.",
      "La valigia non è pronta per il viaggio.",
      "La tua torta è deliziosa.",
      "La frutta è finita.",
      "I piatti sono sporchi.",
      "La finestra è chiusa.",
      "La porta è aperta.",
      "La televisione è spenta.",
      "La luce è accesa.",
      "Il nonno vuole andare al circo.",
      "Lo struzzo ha mal di denti."
    ].map((text, index) => ({ id: `g${index + 1}`, number: index + 1, text }));

    const session = window.parloUnit46Session || {};
    const isTeacher = !!session.isTeacher;
    const studentName = isTeacher ? "" : (session.name || "");
    const studentId = studentName.replace(/[.#$\/\[\]]/g, "_");
    const myClientId = "user_" + Math.random().toString(36).slice(2, 9);
    const tokenSection = document.getElementById("token-mode-section");
    const allSection = document.getElementById("all-students-mode-section");
    const tokenTrack = document.getElementById("token-slides");
    const allTrack = document.getElementById("all-slides");
    const workModeSelect = document.getElementById("work-mode");
    const modeSelector = document.getElementById("mode-selector-container");
    const tokenStatus = document.getElementById("token-status-text");
    const takeTokenButton = document.getElementById("btn-take-token");
    const releaseTokenButton = document.getElementById("teacher-release-token");
    const resetButton = document.getElementById("reset-answers");
    const saveStatus = document.getElementById("save-status");
    const submitButton = document.getElementById("submit-answers");
    const questionsById = Object.fromEntries(questions.map(question => [question.id, question]));
    let answersRef = null;
    let currentWorkMode = "token";
    let currentWriter = null;
    let currentWriterName = "";
    let tokenAnswers = {};
    let allResponses = {};
    let studentAnswers = Object.fromEntries(questions.map(question => [question.id, ""]));
    let activeTokenSlide = 0;
    let activeAllSlide = 0;
    let hasLoadedStudentAnswers = false;
    const tokenSaveTimers = new Map();
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    if (isTeacher) {
      modeSelector.classList.add("visible");
      resetButton.hidden = false;
      submitButton.hidden = true;
    }

    function makeCard(question) {
      const card = document.createElement("article");
      card.className = "slide-item";
      const heading = document.createElement("div");
      heading.className = "question-box";
      heading.textContent = `${question.number}. ${question.text}`;
      card.appendChild(heading);
      return card;
    }

    function updateSlider(track, index, previous, next, progress, indexNav) {
      track.style.transform = `translateX(-${index * 100}%)`;
      previous.disabled = index === 0;
      next.disabled = index === questions.length - 1;
      progress.textContent = `Frase ${index + 1} di ${questions.length}`;
      [...indexNav.children].forEach((button, buttonIndex) => {
        button.setAttribute("aria-current", buttonIndex === index ? "step" : "false");
      });
    }
    function createSlideIndex(container, onSelect) {
      questions.forEach((question, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = index + 1;
        button.setAttribute("aria-label", `Vai alla frase ${index + 1}`);
        button.setAttribute("aria-current", index === 0 ? "step" : "false");
        button.addEventListener("click", () => onSelect(index));
        container.appendChild(button);
      });
    }
    const tokenSlideIndex = document.getElementById("token-slide-index");
    const allSlideIndex = document.getElementById("all-slide-index");
    function updateTokenSlider() {
      updateSlider(tokenTrack, activeTokenSlide, document.getElementById("token-prev"), document.getElementById("token-next"), document.getElementById("token-progress"), tokenSlideIndex);
    }
    function updateAllSlider() {
      updateSlider(allTrack, activeAllSlide, document.getElementById("all-prev"), document.getElementById("all-next"), document.getElementById("all-progress"), allSlideIndex);
    }
    createSlideIndex(tokenSlideIndex, index => { activeTokenSlide = index; updateTokenSlider(); });
    createSlideIndex(allSlideIndex, index => { activeAllSlide = index; updateAllSlider(); });

    questions.forEach(question => {
      const tokenCard = makeCard(question);
      const tokenInput = document.createElement("textarea");
      tokenInput.className = "answer-input token-answer";
      tokenInput.rows = 4;
      tokenInput.placeholder = "Completa la frase seguendo l’esempio...";
      tokenInput.dataset.questionId = question.id;
      tokenInput.addEventListener("input", () => {
        tokenAnswers[question.id] = tokenInput.value;
        clearTimeout(tokenSaveTimers.get(question.id));
        tokenSaveTimers.set(question.id, setTimeout(() => saveTokenAnswer(question.id, tokenInput.value), 350));
      });
      tokenInput.addEventListener("blur", () => {
        if (tokenSaveTimers.has(question.id)) saveTokenAnswer(question.id, tokenInput.value);
      });
      tokenCard.appendChild(tokenInput);
      tokenTrack.appendChild(tokenCard);

      const allCard = makeCard(question);
      const studentInput = document.createElement("textarea");
      studentInput.className = "answer-input student-answer-input";
      studentInput.rows = 4;
      studentInput.placeholder = "Completa la frase seguendo l’esempio...";
      studentInput.dataset.questionId = question.id;
      studentInput.hidden = isTeacher;
      studentInput.value = studentAnswers[question.id];
      studentInput.addEventListener("input", () => {
        studentAnswers[question.id] = studentInput.value;
        saveStatus.hidden = true;
      });
      allCard.appendChild(studentInput);
      const responseList = document.createElement("div");
      responseList.className = "question-responses";
      responseList.dataset.questionId = question.id;
      allCard.appendChild(responseList);
      allTrack.appendChild(allCard);
    });

    function saveTokenAnswer(questionId, value) {
      clearTimeout(tokenSaveTimers.get(questionId));
      tokenSaveTimers.delete(questionId);
      if (answersRef && currentWriter === myClientId) {
        answersRef.child("tokenData").child("answers").child(questionId).set(value);
      }
    }

    function renderQuestionResponses() {
      if (document.activeElement?.classList.contains("teacher-comment")) return;
      allTrack.querySelectorAll(".question-responses").forEach(container => {
        container.replaceChildren();
        const questionId = container.dataset.questionId;
        const entries = Object.entries(allResponses.students || {}).filter(([, student]) =>
          String(student.answers?.[questionId] || "").trim()
        );
        if (!entries.length) {
          const empty = document.createElement("p");
          empty.className = "empty-message";
          empty.textContent = "Пока никто не отправил ответ... · Nessuna risposta inviata.";
          container.appendChild(empty);
          return;
        }
        entries.forEach(([id, student]) => {
          const review = student.reviews?.[questionId] || {};
          const wrapper = document.createElement("div");
          wrapper.className = "student-answer";
          const head = document.createElement("div");
          head.className = "student-answer-head";
          const author = document.createElement("span");
          author.className = "answer-author";
          author.textContent = student.name || "Studente";
          const status = document.createElement("span");
          status.className = `review-status ${review.status || "pending"}`;
          status.textContent = review.status === "approved" ? "✓ Approvata" : review.status === "rejected" ? "✕ Da correggere" : "⏳ In attesa";
          head.append(author, status);
          const answer = document.createElement("span");
          answer.className = "answer-text";
          answer.textContent = student.answers[questionId];
          wrapper.append(head, answer);

          if (isTeacher) {
            const label = document.createElement("label");
            label.className = "teacher-comment-label";
            label.textContent = "Commento dell’insegnante";
            const comment = document.createElement("textarea");
            comment.className = "teacher-comment";
            comment.rows = 2;
            comment.value = review.comment || "";
            comment.placeholder = "Scrivi un commento o una correzione...";
            comment.setAttribute("aria-label", `Commento per ${student.name || "lo studente"}, frase ${questionsById[questionId].number}`);
            comment.addEventListener("blur", () => {
              if (answersRef) answersRef.child("allStudentsData").child("students").child(id).child("reviews").child(questionId).child("comment").set(comment.value.trim());
            });
            const controls = document.createElement("div");
            controls.className = "review-controls";
            const approve = document.createElement("button");
            approve.type = "button";
            approve.className = `approve${review.status === "approved" ? " selected" : ""}`;
            approve.textContent = "✓ Approva";
            approve.setAttribute("aria-pressed", String(review.status === "approved"));
            approve.addEventListener("click", () => setReview(id, questionId, review.status === "approved" ? null : "approved"));
            const reject = document.createElement("button");
            reject.type = "button";
            reject.className = `reject${review.status === "rejected" ? " selected" : ""}`;
            reject.textContent = "✕ Non approvare";
            reject.setAttribute("aria-pressed", String(review.status === "rejected"));
            reject.addEventListener("click", () => setReview(id, questionId, review.status === "rejected" ? null : "rejected"));
            controls.append(approve, reject);
            wrapper.append(label, comment, controls);
          } else if (review.comment) {
            const feedback = document.createElement("p");
            feedback.className = "empty-message";
            feedback.textContent = `💬 ${review.comment}`;
            wrapper.appendChild(feedback);
          }
          container.appendChild(wrapper);
        });
      });
    }

    function setReview(studentKey, questionId, status) {
      if (!isTeacher || !answersRef) return;
      const statusRef = answersRef.child("allStudentsData").child("students").child(studentKey).child("reviews").child(questionId).child("status");
      if (status) statusRef.set(status);
      else statusRef.remove();
    }

    function updateMode() {
      const allMode = currentWorkMode === "all";
      tokenSection.classList.toggle("active-mode", !allMode);
      allSection.classList.toggle("active-mode", allMode);
      if (isTeacher) workModeSelect.value = currentWorkMode;
      releaseTokenButton.hidden = !(isTeacher && !allMode && currentWriter);
      if (!allMode) {
        if (!currentWriter) {
          tokenStatus.textContent = "";
          takeTokenButton.textContent = "✋ Взять слово · Prendi il turno";
          takeTokenButton.className = "btn-token";
          takeTokenButton.disabled = isTeacher;
        } else if (currentWriter === myClientId) {
          tokenStatus.textContent = "Вы отвечаете · Stai rispondendo";
          takeTokenButton.textContent = "✔ Передать слово · Lascia il turno";
          takeTokenButton.className = "btn-token release";
          takeTokenButton.disabled = false;
        } else {
          tokenStatus.textContent = `🔒 Отвечает ${currentWriterName || "одноклассник"} · ${currentWriterName || "Un compagno"} sta lavorando`;
          takeTokenButton.textContent = "🔒 Turno occupato · Turno occupato";
          takeTokenButton.className = "btn-token busy";
          takeTokenButton.disabled = true;
        }
        tokenTrack.querySelectorAll(".token-answer").forEach(input => {
          input.disabled = isTeacher || currentWriter !== myClientId;
          const value = tokenAnswers[input.dataset.questionId] || "";
          if (input !== document.activeElement && input.value !== value) input.value = value;
        });
      } else {
        renderQuestionResponses();
      }
    }

    document.getElementById("token-prev").addEventListener("click", () => { activeTokenSlide = Math.max(0, activeTokenSlide - 1); updateTokenSlider(); });
    document.getElementById("token-next").addEventListener("click", () => { activeTokenSlide = Math.min(questions.length - 1, activeTokenSlide + 1); updateTokenSlider(); });
    document.getElementById("all-prev").addEventListener("click", () => { activeAllSlide = Math.max(0, activeAllSlide - 1); updateAllSlider(); });
    document.getElementById("all-next").addEventListener("click", () => { activeAllSlide = Math.min(questions.length - 1, activeAllSlide + 1); updateAllSlider(); });

    takeTokenButton.addEventListener("click", () => {
      if (isTeacher || !answersRef) return;
      if (currentWriter === myClientId) {
        tokenSaveTimers.forEach((_, questionId) => saveTokenAnswer(questionId, tokenAnswers[questionId] || ""));
        answersRef.child("tokenData").update({ currentWriter: null, writerName: "" });
      } else if (!currentWriter) {
        answersRef.child("tokenData").update({ currentWriter: myClientId, writerName: studentName, answers: tokenAnswers });
      }
    });
    releaseTokenButton.addEventListener("click", () => {
      if (isTeacher && currentWriter && answersRef && confirm(`Liberare il turno di ${currentWriterName || "questo studente"}?`)) {
        answersRef.child("tokenData").update({ currentWriter: null, writerName: "" });
      }
    });
    workModeSelect.addEventListener("change", () => {
      if (isTeacher && answersRef) answersRef.child("workMode").set(workModeSelect.value);
    });

    submitButton.addEventListener("click", async () => {
      if (!studentName || !studentId) { alert("Sessione studente non disponibile. Torna al login principale."); return; }
      if (!answersRef) { alert("Connessione al database non disponibile."); return; }
      if (!Object.values(studentAnswers).some(answer => answer.trim())) { alert("Completa almeno una frase prima di inviare."); return; }
      try {
        await answersRef.child("allStudentsData").child("students").child(studentId).update({ name: studentName, answers: studentAnswers, timestamp: Date.now() });
        saveStatus.textContent = "✅ Risposte inviate all’insegnante! · Ответы отправлены учителю!";
        saveStatus.hidden = false;
      } catch (error) { alert("Errore durante l’invio delle risposte."); }
    });

    resetButton.addEventListener("click", () => {
      if (!isTeacher || !answersRef || !confirm("Сбросить все ответы? · Azzera tutte le risposte?")) return;
      answersRef.set({ workMode: currentWorkMode, tokenData: { currentWriter: null, writerName: "", answers: {} }, allStudentsData: {} });
      studentAnswers = Object.fromEntries(questions.map(question => [question.id, ""]));
      allTrack.querySelectorAll(".student-answer-input").forEach(input => { input.value = ""; });
      saveStatus.hidden = true;
    });

    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey || /INPUT|TEXTAREA|SELECT|BUTTON|A/.test(document.activeElement?.tagName || "")) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      const direction = event.key === "ArrowRight" ? 1 : -1;
      if (currentWorkMode === "all") { activeAllSlide = Math.max(0, Math.min(questions.length - 1, activeAllSlide + direction)); updateAllSlider(); }
      else { activeTokenSlide = Math.max(0, Math.min(questions.length - 1, activeTokenSlide + direction)); updateTokenSlider(); }
    });

    if (window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        answersRef = firebase.database().ref("esercizi/unita46-completamento-frasi-g");
        answersRef.on("value", snapshot => {
          const data = snapshot.val() || {};
          currentWorkMode = data.workMode === "all" ? "all" : "token";
          const tokenData = data.tokenData || {};
          currentWriter = tokenData.currentWriter || null;
          currentWriterName = tokenData.writerName || "";
          tokenAnswers = { ...Object.fromEntries(questions.map(question => [question.id, ""])), ...(tokenData.answers || {}) };
          allResponses = data.allStudentsData || {};
          if (!isTeacher && !hasLoadedStudentAnswers && studentId && allResponses.students?.[studentId]?.answers) {
            studentAnswers = { ...studentAnswers, ...allResponses.students[studentId].answers };
            allTrack.querySelectorAll(".student-answer-input").forEach(input => { input.value = studentAnswers[input.dataset.questionId] || ""; });
            hasLoadedStudentAnswers = true;
          }
          updateMode();
          updateTokenSlider();
          updateAllSlider();
        });
      } catch (error) { console.error("Errore Firebase:", error); }
    }

    updateTokenSlider();
    updateAllSlider();
    let backgroundUpdatePending = false;
    function updateBackgroundParallax() {
      if (backgroundUpdatePending) return;
      backgroundUpdatePending = true;
      requestAnimationFrame(() => {
        const offset = reducedMotion.matches ? 0 : Math.min(window.scrollY * .025, 60);
        document.body.style.setProperty("--background-offset", `${offset}px`);
        backgroundUpdatePending = false;
      });
    }
    window.addEventListener("scroll", updateBackgroundParallax, { passive: true });
    updateBackgroundParallax();
  </script>
</body>
</html>
