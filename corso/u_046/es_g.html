<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 46 — Completate le frasi (Esercizio G)</title>
  <link rel="stylesheet" href="../shared/theme.css?v=2" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      color: var(--text);
      background:
        linear-gradient(rgba(250, 248, 241, .78), rgba(250, 248, 241, .78)),
        url("img/sfondo-funerale-augusto.jpg") center calc(50% - var(--background-offset, 0px)) / cover fixed,
        radial-gradient(ellipse at 50% -12%, rgba(111, 151, 116, .18), transparent 42%),
        var(--bg-main);
    }

    .container { width: min(100%, 880px); margin: 0 auto; }

    .hero {
      position: relative; isolation: isolate; overflow: hidden; margin: 8px 0 20px; padding: 24px 20px 22px;
      text-align: center; border: 1px solid rgba(71, 119, 85, .13); border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 254, 250, .94), rgba(242, 247, 239, .91));
      box-shadow: 0 12px 32px rgba(43, 69, 46, .07);
    }
    .eyebrow {
      display: inline-block; color: var(--primary-dark); font-size: .78rem; font-weight: 800;
      letter-spacing: .09em; text-transform: uppercase; background: #eaf1e8; padding: 7px 14px;
      border-radius: 20px; margin-bottom: 8px; box-shadow: inset 0 0 0 1px rgba(71, 119, 85, .11);
    }
    h1 { margin: 4px 0; color: var(--primary-dark); font-size: clamp(1.85rem, 5vw, 2.55rem); letter-spacing: -.04em; line-height: 1.12; }
    .hero-subtitle { margin: 6px 0 0; color: var(--text-muted); font-size: .96rem; }

    .instruction-box {
      background: #fff; border: 1px solid #d8e5d8; border-left: 5px solid var(--accent);
      border-radius: 16px; padding: 14px 18px; margin-bottom: 20px; box-shadow: 0 6px 18px rgba(43, 69, 46, .04);
    }
    .instruction-title { font-size: .82rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); margin-bottom: 4px; }
    .instruction-text { font-size: .96rem; color: var(--text); line-height: 1.5; }
    .example-box {
      margin: 10px 0 0; padding: 12px 15px; border-left: 4px solid var(--accent);
      border-radius: 10px; background: #fffaf0; font-size: .94rem; line-height: 1.55;
    }

    .card {
      padding: clamp(18px, 4vw, 30px); border: 1px solid var(--border); border-radius: 26px;
      background: var(--card-bg); box-shadow: 0 22px 60px rgba(43, 69, 46, .11); margin-bottom: 24px;
    }

    .connection-banner {
      margin: 0 0 16px; padding: 11px 15px; border: 1px solid #f5c2c0; border-radius: 12px;
      background: #fde8e7; color: #991b1b; font-size: .9rem; font-weight: 700;
    }
    .connection-banner[hidden] { display: none; }

    .overall-progress {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(38px, 1fr));
      gap: 6px;
      width: 100%;
      margin: 0 0 18px;
    }
    .progress-step {
      min-width: 0; min-height: 40px; padding: 4px; border: 1.5px solid #d8e5d8;
      border-radius: 10px; background: #fff; color: var(--primary-dark);
      font: inherit; font-size: .86rem; font-weight: 800; cursor: pointer;
      transition: background .18s, border-color .18s, color .18s;
    }
    .progress-step:hover { border-color: var(--primary); background: var(--primary-light); }
    .progress-step.done { border-color: #6ab082; background: #e5f5ea; color: #17623c; }
    .progress-step[aria-current="step"] {
      border-color: var(--primary-dark); background: var(--primary); color: #fff;
      box-shadow: 0 3px 10px rgba(71, 119, 85, .25);
    }

    .section-box {
      display: flex; flex-direction: column; gap: 16px; padding: 20px; border: 1px solid var(--border);
      border-radius: 20px; background: #fff; box-shadow: 0 6px 18px rgba(43, 69, 46, .03);
    }
    .section-box[hidden] { display: none; }

    .section-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;
      padding-bottom: 12px; border-bottom: 1px solid #eef2ee;
    }
    .section-title {
      display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1;
      font-size: 1.08rem; font-weight: 800; line-height: 1.4; color: var(--primary-dark);
    }
    .number {
      display: inline-grid; flex-shrink: 0; width: 34px; height: 34px; place-items: center;
      border-radius: 10px; background: var(--primary); color: #fff; font-size: .92rem; font-weight: 800;
    }

    .turn-pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px;
      border: 1px solid #dce6dc; border-radius: 999px; background: #f7faf7;
      color: var(--primary-dark); font-size: .82rem; font-weight: 700; white-space: nowrap;
    }
    .turn-pill.is-me {
      border-color: var(--accent); background: #fff3ed; color: #9c4a30;
      box-shadow: 0 0 0 2px rgba(189, 105, 77, .12);
    }

    .turn-assignment-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 12px 14px; border: 1px solid #d5e2d5; border-radius: 14px; background: #f3f8f3;
    }
    .turn-assignment-bar[hidden] { display: none; }
    .turn-assignment-bar label {
      color: var(--primary-dark); font-size: .82rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .turn-assignment-bar select {
      flex: 1; min-width: 210px; max-width: 360px; min-height: 38px; padding: 6px 10px;
      border: 1.5px solid #c7d8c8; border-radius: 10px; background: #fff;
      color: var(--text); font: inherit; font-size: .9rem; font-weight: 700; cursor: pointer;
    }

    .worksheet-card {
      padding: 16px; border: 1.5px solid #dce8dc; border-radius: 16px; background: #f8faf6;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .worksheet-card.active-turn {
      border-color: var(--accent); background: #fffdfb; box-shadow: 0 0 0 3px rgba(189, 105, 77, .14);
    }
    .worksheet-header {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-bottom: 10px; flex-wrap: wrap;
    }
    .worksheet-label { color: var(--primary-dark); font-size: .92rem; font-weight: 800; }
    .turn-hint-tag { font-size: .8rem; font-weight: 700; color: var(--text-muted); }
    .worksheet-card.active-turn .turn-hint-tag { color: var(--accent); }

    .accent-toolbar { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
    .accent-toolbar button {
      min-width: 34px; min-height: 32px; padding: 3px 9px; border: 1px solid #d4e1d5; border-radius: 8px;
      background: #fff; color: var(--primary-dark); font: inherit; font-size: .92rem; font-weight: 700; cursor: pointer;
    }
    .accent-toolbar button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .accent-toolbar button:disabled { cursor: not-allowed; opacity: .45; }

    textarea.student-reply,
    textarea.answer-input {
      width: 100%; min-height: 110px; padding: 12px 14px; border: 1.5px solid #d4e1d5; border-radius: 12px;
      background: #fff; color: var(--text); font: inherit; font-size: .98rem; line-height: 1.5; resize: vertical;
    }
    textarea.student-reply:disabled,
    textarea.answer-input:disabled { background: #f1f4f0; color: #475569; cursor: not-allowed; }

    .answer-form-card {
      padding: 18px; border: 1px solid #d8e5d8; border-radius: 18px;
      background: linear-gradient(145deg, #f7faf6, #fffefa);
    }
    .answer-form-header {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      flex-wrap: wrap; margin-bottom: 10px;
    }
    .answer-form-header label { color: var(--primary-dark); font-weight: 800; }
    .answer-form-card textarea.answer-input { display: block; min-height: 130px; }
    .answer-form-note { margin: 8px 2px 0; color: var(--text-muted); font-size: .84rem; line-height: 1.45; }
    .answer-submit-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; margin-top: 14px;
    }
    .btn-submit-contribution {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 46px; padding: 10px 20px; border: 0; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff;
      font: inherit; font-size: .94rem; font-weight: 800; cursor: pointer;
      box-shadow: 0 5px 13px rgba(47, 87, 57, .2);
      transition: transform .18s, box-shadow .18s, opacity .18s;
    }
    .btn-submit-contribution::before { content: "↗"; font-size: 1.1rem; }
    .btn-submit-contribution:hover:not(:disabled) {
      transform: translateY(-1px); box-shadow: 0 8px 17px rgba(47, 87, 57, .25);
    }
    .btn-submit-contribution:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }

    .contributions-wrapper {
      padding: 18px; border: 1px solid #e2e9df; border-radius: 18px; background: #fbfcf9;
    }
    .contributions-title { margin-bottom: 12px; color: var(--primary-dark); font-weight: 800; }
    .contributions-empty { margin: 0; padding: 12px; border-radius: 10px; background: #f1f5ef; color: var(--text-muted); font-size: .9rem; }
    .contributions-list { display: flex; flex-direction: column; gap: 10px; }
    .contribution-item {
      padding: 14px 16px; border: 1px solid #dce8dc; border-left: 4px solid var(--accent);
      border-radius: 12px; background: #fff; box-shadow: 0 3px 10px rgba(43, 69, 46, .04);
    }
    .contribution-text { margin: 0 0 10px; color: var(--text); font-size: .97rem; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .contribution-meta {
      display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      padding-top: 8px; border-top: 1px solid #eef2ee; color: var(--text-muted); font-size: .8rem;
    }

    .actions-row {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      flex-wrap: wrap; margin-top: 12px;
    }
    .submit-btn,
    .submit-contribution {
      min-height: 42px; padding: 9px 18px; border: 0; border-radius: 11px;
      background: var(--primary); color: #fff; font: inherit; font-size: .92rem; font-weight: 800;
      cursor: pointer; transition: background .2s, opacity .2s;
    }
    .submit-btn:hover:not(:disabled),
    .submit-contribution:hover:not(:disabled) { background: var(--primary-dark); }
    .submit-btn:disabled,
    .submit-contribution:disabled { opacity: .45; cursor: not-allowed; }

    .sync-feedback { font-size: .84rem; font-weight: 700; color: var(--text-muted); }
    .sync-feedback.saving { color: #9a6700; }
    .sync-feedback.saved { color: #17623c; }
    .sync-feedback.error { color: #991b1b; }

    .hints-box,
    .teacher-hint {
      margin-top: 12px; padding: 10px 14px; border: 1px solid #d8e5d8; border-radius: 12px;
      background: #fff;
    }
    .hints-box summary {
      cursor: pointer; color: var(--primary-dark); font-size: .9rem; font-weight: 800;
      user-select: none;
    }
    .hints-list {
      margin: 8px 0 2px; padding-left: 20px; color: var(--text); font-size: .92rem; line-height: 1.5;
    }

    .history-section {
      padding-top: 14px; border-top: 1px dashed #d8e5d8;
    }
    .history-title {
      margin: 0 0 10px; color: var(--primary-dark); font-size: .96rem; font-weight: 800;
    }
    .history-list { display: flex; flex-direction: column; gap: 9px; }
    .history-item {
      padding: 11px 14px; border: 1px solid #e2ebe2; border-radius: 12px; background: #fafcf9;
    }
    .history-meta {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
      margin-bottom: 6px; font-size: .82rem; color: var(--text-muted);
    }
    .history-meta strong { color: var(--primary-dark); }
    .history-text { margin: 0; font-size: .96rem; line-height: 1.55; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty-message { margin: 0; color: var(--text-muted); font-size: .9rem; }

    .slide-navigation {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 20px;
      padding-top: 14px; border-top: 1px solid var(--border);
    }
    .slide-navigation button, .slide-navigation a {
      min-height: 44px; padding: 8px 18px; border: 1px solid #d8e5d8; border-radius: 10px;
      background: #fff; color: var(--primary-dark); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; transition: all .2s;
    }
    .slide-navigation a { display: inline-flex; align-items: center; }
    .slide-navigation a[hidden] { display: none; }
    .slide-navigation button:hover:not(:disabled), .slide-navigation a:hover { background: var(--primary-light); border-color: var(--primary); }
    .slide-navigation button:disabled { cursor: not-allowed; opacity: .45; }
    .slide-progress { color: var(--primary-dark); font-size: .95rem; font-weight: 800; text-align: center; }

    @media (max-width: 680px) {
      body { padding: 16px 8px; }
      .section-box { padding: 14px; }
      .progress-step { min-height: 44px; }
      .answer-form-card, .contributions-wrapper { padding: 14px; }
      .answer-submit-row { align-items: stretch; }
      .btn-submit-contribution { width: 100%; }
      .slide-navigation { flex-direction: column; gap: 8px; }
      .slide-navigation button, .slide-navigation a { justify-content: center; width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>

    <header class="hero">
      <span class="eyebrow">Unità 46 · Grammatica</span>
      <h1>Completate le frasi</h1>
      <p class="hero-subtitle">Usate l’imperfetto e il passato prossimo con il verbo dovere.</p>
    </header>

    <section class="instruction-box" aria-labelledby="instruction-title">
      <div class="instruction-title" id="instruction-title">💡 Задание · Esercizio G</div>
      <div class="instruction-text">👉 <strong>Дополните фразы по образцу:</strong>
        <div class="example-box">
          <strong>La mia macchina è sporca.</strong><br>
          → La mia macchina era sporca e ho dovuto lavarla.
        </div>
      </div>
    </section>

    <section class="card" aria-label="Frasi con dovere al passato">
      <div id="connection-banner" class="connection-banner" role="alert" aria-live="assertive" hidden></div>

      <nav id="exercise-progress" class="overall-progress" aria-label="Vai direttamente alla frase"></nav>

      <nav class="slide-navigation student-navigation" aria-label="Navigazione delle frasi">
        <button id="previous-question" type="button">← Precedente</button>

        <button id="next-question" type="button">Successiva →</button>
        <a id="next-exercise" href="es_h.html" hidden>Vai all’esercizio H →</a>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../shared/group-scope.js?v=1"></script>
  <script src="../shared/exercise-core.js?v=8"></script>
  <script src="../shared/exercise-modes.js?v=2"></script>
  <script src="../shared/inbox-exercise.js?v=2"></script>
  <script>
    ParloInboxExercise.init({
      unitNumber: 46,
      exercisePath: "es_g",
      submitLabel: "Condividi risposta",
      itemsLabel: "Frase",
      questions: [
        {
          id: "g1",
          prompt: "Le tue scarpe sono sporche.",
          placeholder: "→ Le tue scarpe erano sporche e...",
          hint: "Как изменится фраза в прошлом? Что пришлось сделать?"
        },
        {
          id: "g2",
          prompt: "Il nostro frigorifero non funziona.",
          placeholder: "→ Il nostro frigorifero non funzionava e...",
          hint: "Как сказать, что холодильник не работал? Что пришлось сделать?"
        },
        {
          id: "g3",
          prompt: "Il mio telefonino è scarico.",
          placeholder: "→ Il mio telefonino era scarico e...",
          hint: "Как описать телефон в прошлом? Что пришлось сделать с ним?"
        },
        {
          id: "g4",
          prompt: "Il tuo computer è acceso.",
          placeholder: "→ Il tuo computer era acceso e...",
          hint: "Как изменить состояние компьютера в прошлом? Что пришлось сделать?"
        },
        {
          id: "g5",
          prompt: "La vostra camera è sporca.",
          placeholder: "→ La vostra camera era sporca e...",
          hint: "Как описать комнату в прошлом? Что пришлось сделать?"
        },
        {
          id: "g6",
          prompt: "La mia macchina non funziona.",
          placeholder: "→ La mia macchina non funzionava e...",
          hint: "Как сказать, что машина не работала? Что пришлось сделать?"
        },
        {
          id: "g7",
          prompt: "I nostri amici arrivano in aereo.",
          placeholder: "→ I nostri amici arrivavano in aereo e...",
          hint: "Как рассказать о приезде друзей? Что пришлось сделать?"
        },
        {
          id: "g8",
          prompt: "I nostri amici devono andare all’aeroporto.",
          placeholder: "→ I nostri amici dovevano andare all’aeroporto e...",
          hint: "Как заменить «devono» в прошлом? Какую форму взять для «i nostri amici»?"
        },
        {
          id: "g9",
          prompt: "Mia zia deve andare alla stazione.",
          placeholder: "→ Mia zia doveva andare alla stazione e...",
          hint: "Как заменить «deve» в прошлом? Какую форму взять для «mia zia»?"
        },
        {
          id: "g10",
          prompt: "La zia mi aspetta alla stazione.",
          placeholder: "→ La zia mi aspettava alla stazione e...",
          hint: "Как рассказать об ожидании в прошлом? Что пришлось сделать?"
        },
        {
          id: "g11",
          prompt: "I tuoi amici arrivano in treno.",
          placeholder: "→ I tuoi amici arrivavano in treno e...",
          hint: "Как рассказать о приезде друзей? Что пришлось сделать?"
        },
        {
          id: "g12",
          prompt: "Il mio gatto è malato.",
          placeholder: "→ Il mio gatto era malato e...",
          hint: "Как описать кота в прошлом? Куда пришлось его отвезти?"
        },
        {
          id: "g13",
          prompt: "La tua borsa è sul tavolo.",
          placeholder: "→ La tua borsa era sul tavolo e...",
          hint: "Как описать сумку в прошлом? Что пришлось сделать?"
        },
        {
          id: "g14",
          prompt: "I nostri vicini sono rumorosi.",
          placeholder: "→ I nostri vicini erano rumorosi e...",
          hint: "Как описать соседей в прошлом? Что пришлось сделать?"
        },
        {
          id: "g15",
          prompt: "Il tuo libro è interessante.",
          placeholder: "→ Il tuo libro era interessante e...",
          hint: "Как описать книгу в прошлом? Что пришлось сделать?"
        },
        {
          id: "g16",
          prompt: "La tua bicicletta è rotta.",
          placeholder: "→ La tua bicicletta era rotta e...",
          hint: "Как сказать, что велосипед сломался? Что пришлось сделать?"
        },
        {
          id: "g17",
          prompt: "La valigia non è pronta per il viaggio.",
          placeholder: "→ La valigia non era pronta per il viaggio e...",
          hint: "Как описать чемодан в прошлом? Что пришлось сделать перед поездкой?"
        },
        {
          id: "g18",
          prompt: "La tua torta è deliziosa.",
          placeholder: "→ La tua torta era deliziosa e...",
          hint: "Как описать торт в прошлом? Что пришлось сделать?"
        },
        {
          id: "g19",
          prompt: "La frutta è finita.",
          placeholder: "→ La frutta era finita e...",
          hint: "Как сказать, что фрукты закончились? Что пришлось сделать?"
        },
        {
