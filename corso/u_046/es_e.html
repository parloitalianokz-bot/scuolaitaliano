<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 46 — I pronomi diretti (Esercizio E)</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #477755;
      --primary-light: #edf4ed;
      --primary-dark: #2f5739;
      --accent: #bd694d;
      --bg-main: #f5f1e7;
      --card-bg: #fffefa;
      --text: #292d28;
      --text-muted: #6b7069;
      --success: #278253;
      --success-bg: #e1f1e5;
      --error: #c43d3d;
      --error-bg: #fae7e5;
      --border: #e7e5dc;
    }
    * { box-sizing: border-box; }
    :focus-visible { outline: 3px solid rgba(189,105,77,.55); outline-offset: 3px; }
    body {
      min-height: 100vh; margin: 0; padding: 32px 16px; color: var(--text);
      background: linear-gradient(rgba(250,248,241,.78),rgba(250,248,241,.78)),
        url("img/sfondo-funerale-augusto.jpg") center / cover fixed,
        radial-gradient(ellipse at 50% -12%,rgba(111,151,116,.18),transparent 42%), var(--bg-main);
    }
    .container { width: min(100%,880px); margin: 0 auto; }
    .home-navigation { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }
    .hero { margin: 8px 0 22px; padding: 28px 20px 26px; text-align: center; border: 1px solid rgba(71,119,85,.13); border-radius: 24px; background: linear-gradient(135deg,rgba(255,254,250,.94),rgba(242,247,239,.91)); box-shadow: 0 12px 32px rgba(43,69,46,.07); }
    .eyebrow { display: inline-block; margin-bottom: 10px; padding: 8px 15px; border-radius: 20px; background: #eaf1e8; color: var(--primary-dark); font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 4px 0; color: var(--primary-dark); font-size: clamp(1.9rem,5vw,2.65rem); letter-spacing: -.04em; line-height: 1.12; }
    .hero-subtitle { margin: 8px 0 0; color: var(--text-muted); font-size: .98rem; }
    .instruction-box, .top-controls { margin-bottom: 20px; padding: 16px 20px; border: 1px solid #d8e5d8; border-radius: 16px; background: #fff; box-shadow: 0 6px 18px rgba(43,69,46,.04); }
    .instruction-box { border-left: 5px solid var(--accent); }
    .instruction-title { margin-bottom: 6px; color: var(--accent); font-size: .85rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .instruction-text { font-size: .98rem; line-height: 1.5; }
    .top-controls { display: flex; align-items: center; gap: 12px; background: rgba(255,254,250,.96); }
    .teacher-controls { display: flex; width: 100%; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
    .assignment-control { display: grid; flex: 1 1 260px; gap: 5px; color: var(--primary-dark); font-size: .9rem; font-weight: 700; }
    .assignment-control[hidden], [hidden] { display: none !important; }
    .assignment-control select { min-height: 42px; padding: 8px 12px; border: 1.5px solid #d4e1d5; border-radius: 9px; background: #fff; color: var(--primary-dark); font: inherit; }
    .reset-btn { min-height: 42px; padding: 7px 14px; border: 1px solid #fca5a5; border-radius: 10px; background: #fff; color: #dc2626; font: inherit; font-size: .85rem; font-weight: 700; cursor: pointer; }
    .reset-btn:hover { background: #fef2f2; }
    .card { margin-bottom: 28px; padding: clamp(20px,4vw,32px); border: 1px solid var(--border); border-radius: 26px; background: var(--card-bg); box-shadow: 0 22px 60px rgba(43,69,46,.11); }
    .token-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; padding: 14px 18px; border-radius: 14px; background: var(--primary-light); }
    .assignment-status { flex: 1 1 240px; margin: 0; color: var(--primary-dark); font-size: .92rem; font-weight: 700; line-height: 1.5; }
    .slide-viewport { overflow: hidden; border: 1px solid #d8e5d8; border-radius: 18px; background: linear-gradient(145deg,#fffefa,#f2f7ef); }
    .slides-track { display: flex; transition: transform .35s ease; will-change: transform; }
    .slide-item { display: flex; flex: 0 0 100%; min-width: 0; flex-direction: column; gap: 14px; padding: clamp(18px,4vw,26px); }
    .question-box { margin: 0; padding: 18px 20px; border: 1px solid #d0e2d2; border-radius: 16px; background: var(--primary-light); color: var(--primary-dark); font-size: 1.15rem; font-weight: 800; line-height: 1.45; }
    .field-label { display: block; margin: 0 0 7px; color: var(--primary-dark); font-size: .9rem; font-weight: 700; }
    .answer-input { display: block; width: 100%; min-height: 112px; padding: 13px 15px; border: 1.5px solid #d4e1d5; border-radius: 12px; background: #fff; color: var(--text); font: inherit; line-height: 1.55; resize: vertical; }
    .answer-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(71,119,85,.15); }
    .answer-input:disabled { background: #f1f5f1; color: #5f6863; }
    .teacher-hint { position: relative; align-self: flex-start; }
    .teacher-hint-button { min-width: 34px; min-height: 34px; border: 1px solid #d8e5d8; border-radius: 50%; background: #fff; color: var(--primary-dark); font: inherit; font-weight: 800; cursor: pointer; }
    .teacher-hint-button:hover, .teacher-hint-button[aria-expanded="true"] { border-color: var(--primary); background: var(--primary-light); }
    .teacher-hint-text { position: absolute; z-index: 5; top: calc(100% + 7px); left: 0; width: min(380px,calc(100vw - 48px)); padding: 11px 13px; border: 1px solid #d8e5d8; border-radius: 10px; background: #fffefa; color: var(--text); box-shadow: 0 8px 22px rgba(43,69,46,.16); font-size: .88rem; font-weight: 600; line-height: 1.5; }
    .save-status { margin: 0 0 16px; padding: 11px 14px; border: 1px solid #b7dfc1; border-radius: 12px; background: var(--success-bg); color: #17623c; font-size: .9rem; font-weight: 700; }
    .save-status.error { border-color: #f2b8b5; background: var(--error-bg); color: #a82e2e; }
    .slide-navigation { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .slide-navigation button { min-height: 42px; padding: 8px 18px; border: 1px solid #d8e5d8; border-radius: 10px; background: #fff; color: var(--primary-dark); font: inherit; font-weight: 700; cursor: pointer; }
    .slide-navigation button:hover:not(:disabled) { border-color: var(--primary); background: var(--primary-light); }
    .slide-navigation button:disabled { cursor: not-allowed; opacity: .45; }
    .slide-progress { color: var(--primary-dark); font-size: .95rem; font-weight: 800; text-align: center; }
    .progress-track { height: 8px; margin-top: 14px; overflow: hidden; border-radius: 99px; background: #e8eee6; }
    .progress-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--primary),#a8c49f); transition: width .2s ease; }
    .progress-range { display: block; width: 100%; height: 28px; margin: 4px 0 0; accent-color: var(--primary); cursor: pointer; }
    .results-section h2 { margin: 0 0 16px; color: var(--primary-dark); font-size: 1.25rem; }
    .question-responses details { margin-bottom: 10px; overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
    .question-responses summary { padding: 14px 16px; background: var(--primary-light); color: var(--primary-dark); font-weight: 800; cursor: pointer; }
    .answer-list { padding: 4px 16px 12px; }
    .answer-row { display: grid; grid-template-columns: minmax(120px,.35fr) 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: .92rem; }
    .answer-row:last-child { border-bottom: 0; }
    .answer-author { color: var(--primary-dark); font-weight: 700; }
    .answer-text { display: block; padding: 8px 10px; border-radius: 8px; background: #faf9f5; overflow-wrap: anywhere; white-space: pre-wrap; line-height: 1.5; }
    .empty-message { color: var(--text-muted); font-size: .92rem; }
    @media (max-width: 600px) {
      body { padding: 16px 8px; }
      .slide-item { padding: 14px; }
      .slide-navigation { gap: 8px; }
      .slide-navigation button { padding: 8px 12px; font-size: .88rem; }
      .question-box { padding: 15px; font-size: 1.05rem; }
      .answer-row { grid-template-columns: 1fr; gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="container">
    <nav class="home-navigation" aria-label="Navigazione dell’Unità 46"></nav>
    <header class="hero">
      <span class="eyebrow">Unità 46 · Grammatica</span>
      <h1>I pronomi diretti</h1>
      <p class="hero-subtitle">Rispondi alle domande usando i pronomi diretti.</p>
    </header>
    <section class="instruction-box" aria-labelledby="exercise-instructions">
      <div class="instruction-title" id="exercise-instructions">💡 Задание · Esercizio E</div>
      <div class="instruction-text">👉 <strong>Ответьте на вопросы, используя прямые местоимения.</strong><br><small>Scrivi una risposta completa in italiano nel campo dedicato.</small></div>
    </section>
    <div class="top-controls" id="teacher-controls" hidden>
      <div class="teacher-controls">
        <label class="assignment-control" for="writer-select">✍️ Assegna il turno a
          <select id="writer-select" aria-label="Seleziona chi può rispondere"><option value="">— Nessuno selezionato —</option></select>
        </label>
        <button id="reset-answers" class="reset-btn" type="button">⚠️ Сбросить · Azzera</button>
      </div>
    </div>
    <section class="card" aria-label="Domande sui pronomi diretti">
      <div class="token-bar"><p id="assignment-status" class="assignment-status" role="status" aria-live="polite"></p></div>
      <p id="save-status" class="save-status" role="status" aria-live="polite" hidden></p>
      <div class="slide-viewport"><div id="slides-track" class="slides-track"></div></div>
      <nav class="slide-navigation" aria-label="Navigazione delle domande">
        <button id="previous-slide" type="button">← Precedente</button>
        <span id="slide-counter" class="slide-progress" aria-live="polite"></span>
        <button id="next-slide" type="button">Successiva →</button>
      </nav>
      <div class="progress-track" aria-hidden="true"><div id="progress-fill" class="progress-fill"></div></div>
      <input id="progress-range" class="progress-range" type="range" min="0" max="14" value="0" aria-label="Vai a una domanda">
    </section>
    <section class="results-section card" id="results-section" aria-label="Risposte della classe" hidden>
      <h2>📋 Risposte degli studenti · Risposte della classe</h2>
      <div id="responses-list"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-group-scope.js"></script>
  <script>
    const questions = [
      { text: "Chi ha bevuto il vino?", hint: "Chiedi: «Che cosa sostituisce il pronome lo? Dove si mette rispetto ad avere?». Invita a pensare ad alta voce mentre ricostruisce la risposta al passato prossimo." },
      { text: "Chi di solito guarda la televisione a cena?", hint: "Invita a individuare l’oggetto diretto «la televisione»: quale pronome la sostituisce? Chiedi di spiegare dove collocarlo nella frase e quale persona compie l’azione." },
      { text: "Hai invitato tua suocera per l’anniversario?", hint: "«Tua suocera» è femminile singolare. Chiedi quale pronome diretto la sostituisce e di formulare una risposta completa, motivando la posizione del pronome e l’accordo del participio." },
      { text: "Hai visto Stefano e Silvia al concerto?", hint: "Fai individuare il complemento oggetto e il suo genere e numero. Quale pronome lo sostituisce? Invita a spiegare ad alta voce la forma del participio passato." },
      { text: "Chi ha avvisato il direttore che siamo in ritardo?", hint: "Domanda guida: «Chi è stato avvisato?». Il direttore è maschile singolare: quale pronome diretto serve? Chiedi di ricostruire la frase passo dopo passo." },
      { text: "Hai incontrato le tue amiche al bar?", hint: "Fai notare genere e numero di «le tue amiche». Quale pronome diretto corrisponde? Chiedi allo studente di pensare ad alta voce sulla posizione del pronome e sull’accordo." },
      { text: "Hai invitato i tuoi amici alla cena?", hint: "«I tuoi amici» è maschile plurale. Invita a scegliere il pronome, produrre la risposta completa e spiegare cosa succede al participio passato." },
      { text: "Chi ti ha salutato al matrimonio della cugina di Stefano?", hint: "In questa domanda «ti» è già un pronome diretto: chi compie l’azione? Chiedi di completare la risposta spiegando il ruolo di «ti» nella frase." },
      { text: "Hai portato il cane di Stefano dal veterinario?", hint: "«Il cane» è maschile singolare. Quale pronome lo riprende? Chiedi una risposta completa e di ragionare ad alta voce sulla forma «l’ho portato»." },
      { text: "Chi ha consultato il direttore sul progetto?", hint: "Fai identificare chi viene consultato: è il complemento oggetto maschile singolare. Quale pronome diretto lo sostituisce? Invita a formulare e spiegare la frase." },
      { text: "Hai avvisato i vicini di casa della festa?", hint: "Chiedi di riconoscere genere e numero di «i vicini», poi di scegliere il pronome diretto. Quale forma assume il participio passato? Perché?" },
      { text: "Hai pagato la donna di servizio per il lavoro extra?", hint: "«La donna di servizio» è femminile singolare. Quale pronome diretto la sostituisce? Fai formulare una risposta affermativa e una negativa, spiegando la scelta." },
      { text: "Per tradurre, usi il vocabolario?", hint: "Individua l’oggetto diretto «il vocabolario»: quale pronome lo sostituisce? Chiedi di riformulare tutta la frase e pensare ad alta voce." },
      { text: "La zia Albina frequenta un corso di aerobica?", hint: "L’oggetto diretto è «un corso»: qual è il suo genere e numero? Quale pronome serve e dove va collocato prima del verbo?" },
      { text: "Tieni in ordine la tua stanza?", hint: "«La tua stanza» è femminile singolare. Chiedi quale pronome diretto la sostituisce e invita a spiegare la risposta completa, anche in forma negativa." }
    ].map((question, index) => ({ ...question, id: `e${index + 1}` }));

    const session = window.parloUnit46Session || {};
    const params = new URLSearchParams(location.search);
    const groupName = session.group || params.get("gruppo") || "sconosciuto";
    const isTeacher = Boolean(session.isTeacher);
    const sessionName = session.name || (isTeacher ? "Insegnante" : params.get("nome") || "");
    const safe = value => String(value || "").replace(/[.#$\/[\]]/g, "_");
    const myClientId = `client_${Math.random().toString(36).slice(2, 10)}`;
    const emptyAnswers = () => Object.fromEntries(questions.map(question => [question.id, ""]));

    const teacherControls = document.getElementById("teacher-controls");
    const writerSelect = document.getElementById("writer-select");
    const assignmentStatus = document.getElementById("assignment-status");
    const saveStatus = document.getElementById("save-status");
    const slidesTrack = document.getElementById("slides-track");
    const progressRange = document.getElementById("progress-range");
    const progressFill = document.getElementById("progress-fill");
    const resultsSection = document.getElementById("results-section");
    const responsesList = document.getElementById("responses-list");
    const navPrevious = document.getElementById("previous-slide");
    const navNext = document.getElementById("next-slide");

    teacherControls.hidden = !isTeacher;
    resultsSection.hidden = !isTeacher;
    document.body.classList.toggle("teacher-mode", isTeacher);

    let answersRef = null;
    let groupRoster = [];
    let presenceData = {};
    let allStudentsData = {};
    let currentWriter = "";
    let currentWriterRole = "";
    let currentAnswers = emptyAnswers();
    let activeSlide = 0;
    let snapshotPending = false;
    let writeTimer = null;

    function isAssignedToCurrentUser() {
      return Boolean(sessionName && currentWriter === sessionName && currentWriterRole === (isTeacher ? "teacher" : "student"));
    }

    function createTeacherHint(question, index) {
      if (!isTeacher) return null;
      const wrapper = document.createElement("span");
      wrapper.className = "teacher-hint";
      const button = document.createElement("button");
      button.type = "button";
      button.className = "teacher-hint-button";
      button.textContent = "ⓘ";
      button.setAttribute("aria-label", `Consiglio per stimolare il ragionamento alla domanda ${index + 1}`);
      button.setAttribute("aria-expanded", "false");
      const tooltip = document.createElement("span");
      tooltip.className = "teacher-hint-text";
      tooltip.id = `teacher-hint-${question.id}`;
      tooltip.setAttribute("role", "tooltip");
      tooltip.hidden = true;
      tooltip.textContent = question.hint;
      button.setAttribute("aria-controls", tooltip.id);
      button.addEventListener("click", () => {
        const expanded = button.getAttribute("aria-expanded") === "true";
        button.setAttribute("aria-expanded", String(!expanded));
        tooltip.hidden = expanded;
      });
      wrapper.append(button, tooltip);
      return wrapper;
    }

    questions.forEach((question, index) => {
      const card = document.createElement("article");
      card.className = "slide-item";
      card.setAttribute("aria-label", `Domanda ${index + 1} di ${questions.length}`);
      const prompt = document.createElement("h2");
      prompt.className = "question-box";
      prompt.textContent = `${index + 1}. ${question.text}`;
      const label = document.createElement("label");
      label.className = "field-label";
      label.htmlFor = `answer-${question.id}`;
      label.textContent = "⌨️ La tua risposta";
      const textarea = document.createElement("textarea");
      textarea.id = label.htmlFor;
      textarea.className = "answer-input";
      textarea.rows = 4;
      textarea.placeholder = "Scrivi una risposta completa usando il pronome diretto…";
      textarea.disabled = true;
      textarea.setAttribute("aria-label", `Risposta alla domanda ${index + 1}`);
      textarea.addEventListener("input", () => {
        if (!isAssignedToCurrentUser() || snapshotPending) return;
        currentAnswers[question.id] = textarea.value;
        showSaveStatus("Salvataggio della risposta…");
        clearTimeout(writeTimer);
        writeTimer = setTimeout(() => saveAnswer(question.id, textarea.value), 250);
      });
      card.append(prompt, label, textarea);
      const hint = createTeacherHint(question, index);
      if (hint) card.appendChild(hint);
      slidesTrack.appendChild(card);
    });

    function showSaveStatus(message, isError = false) {
      saveStatus.textContent = message;
      saveStatus.classList.toggle("error", isError);
      saveStatus.hidden = false;
    }

    function updateSlides() {
      slidesTrack.style.transform = `translateX(-${activeSlide * 100}%)`;
      navPrevious.disabled = activeSlide === 0;
      navNext.disabled = activeSlide === questions.length - 1;
      document.getElementById("slide-counter").textContent = `Domanda ${activeSlide + 1} di ${questions.length}`;
      progressRange.value = activeSlide;
      progressFill.style.width = `${((activeSlide + 1) / questions.length) * 100}%`;
    }

    function updateAssignment() {
      if (groupName === "sconosciuto") {
        assignmentStatus.textContent = "Accedi tramite il gruppo della classe per utilizzare l’esercizio condiviso.";
      } else if (!answersRef) {
        assignmentStatus.textContent = "Connessione all’esercizio non disponibile. Verifica la connessione e ricarica la pagina.";
      } else if (!sessionName) {
        assignmentStatus.textContent = "Accedi dal gruppo della classe con il tuo nome per partecipare.";
      } else if (!currentWriter) {
        assignmentStatus.textContent = isTeacher ? "Seleziona uno studente o te stesso/a dal menu per assegnare il turno." : "L’insegnante non ha ancora assegnato il turno.";
      } else if (isAssignedToCurrentUser()) {
        assignmentStatus.textContent = `✍️ È il tuo turno, ${sessionName}: puoi scrivere. Le risposte si salvano automaticamente.`;
      } else {
        assignmentStatus.textContent = `🔒 Il turno è assegnato a ${currentWriter}. Puoi consultare le risposte, ma non modificarle.`;
      }
      slidesTrack.querySelectorAll(".answer-input").forEach((textarea, index) => {
        textarea.disabled = !isAssignedToCurrentUser();
        const value = currentAnswers[questions[index].id] || "";
        if (document.activeElement !== textarea && textarea.value !== value) textarea.value = value;
      });
    }

    function renderWriterMenu() {
      if (!isTeacher) return;
      const onlineNames = new Set();
      Object.values(presenceData).forEach(person => {
        if (person?.name && person.role === "student") onlineNames.add(person.name);
      });
      const uniqueStudents = [...new Map(groupRoster.map(person => [person.nome, person])).values()]
        .sort((a, b) => a.nome.localeCompare(b.nome, "it"));
      const options = [new Option("— Nessuno selezionato —", "")];
      if (sessionName) {
        const teacherGroup = document.createElement("optgroup");
        teacherGroup.label = "👩‍🏫 DOCENTE";
        teacherGroup.appendChild(new Option(`${sessionName} · insegnante`, `teacher::${sessionName}`));
        options.push(teacherGroup);
      }
      const online = uniqueStudents.filter(person => onlineNames.has(person.nome));
      const offline = uniqueStudents.filter(person => !onlineNames.has(person.nome));
      if (online.length) {
        const onlineGroup = document.createElement("optgroup");
        onlineGroup.label = "🟢 STUDENTI ONLINE · UNITÀ 46";
        online.forEach(person => onlineGroup.appendChild(new Option(`${person.nome} · online`, `student::${person.nome}`)));
        options.push(onlineGroup);
      }
      if (offline.length) {
        const offlineGroup = document.createElement("optgroup");
        offlineGroup.label = "ALTRI STUDENTI DEL GRUPPO";
        offline.forEach(person => offlineGroup.appendChild(new Option(person.nome, `student::${person.nome}`)));
        options.push(offlineGroup);
      }
      if (currentWriter && !uniqueStudents.some(person => person.nome === currentWriter) && currentWriter !== sessionName) {
        const otherGroup = document.createElement("optgroup");
        otherGroup.label = "TURNO ATTUALE";
        otherGroup.appendChild(new Option(currentWriter, `${currentWriterRole || "student"}::${currentWriter}`));
        options.push(otherGroup);
      }
      writerSelect.replaceChildren(...options);
      writerSelect.value = currentWriter ? `${currentWriterRole || "student"}::${currentWriter}` : "";
    }

    function restoreAnswersForWriter() {
      const key = safe(currentWriter);
      const saved = currentWriter ? allStudentsData[key]?.answers || {} : {};
      currentAnswers = Object.fromEntries(questions.map(question => [question.id, String(saved[question.id] || "")]));
      updateAssignment();
    }

    function renderResponses() {
      if (!isTeacher) return;
      responsesList.replaceChildren();
      const entries = Object.entries(allStudentsData)
        .filter(([, person]) => person?.answers && Object.values(person.answers).some(value => String(value || "").trim()))
        .sort((a, b) => String(a[1].name || "").localeCompare(String(b[1].name || ""), "it"));
      if (!entries.length) {
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent = "Пока никто не отправил ответы... · Non ci sono ancora risposte.";
        responsesList.appendChild(empty);
        return;
      }
      const grouped = document.createElement("div");
      grouped.className = "question-responses";
      questions.forEach((question, index) => {
        const details = document.createElement("details");
        if (index === 0) details.open = true;
        const summary = document.createElement("summary");
        summary.textContent = `${index + 1}. ${question.text}`;
        const list = document.createElement("div");
        list.className = "answer-list";
        entries.forEach(([, person]) => {
          const answerText = String(person.answers?.[question.id] || "").trim();
          if (!answerText) return;
          const row = document.createElement("div");
          row.className = "answer-row";
          const author = document.createElement("span");
          author.className = "answer-author";
          author.textContent = person.name || "Studente";
          const answer = document.createElement("span");
          answer.className = "answer-text";
          answer.textContent = answerText;
          row.append(author, answer);
          list.appendChild(row);
        });
        details.append(summary, list);
        grouped.appendChild(details);
      });
      responsesList.appendChild(grouped);
    }

    function saveAnswer(questionId, value) {
      if (!answersRef || !isAssignedToCurrentUser()) return;
      const studentKey = safe(sessionName);
      const updates = {
        [`tokenData/answers/${questionId}`]: value,
        [`allStudentsData/students/${studentKey}/name`]: sessionName,
        [`allStudentsData/students/${studentKey}/role`]: isTeacher ? "teacher" : "student",
        [`allStudentsData/students/${studentKey}/answers/${questionId}`]: value,
        [`allStudentsData/students/${studentKey}/timestamp`]: Date.now()
      };
      answersRef.update(updates).then(() => {
        if (isAssignedToCurrentUser()) showSaveStatus("✅ Risposta salvata automaticamente.");
      }).catch(error => {
        console.error("Errore salvataggio risposta:", error);
        showSaveStatus("⚠️ Risposta non salvata. Controlla la connessione e riprova.", true);
      });
    }

    function loadGroupRoster() {
      if (!groupName || groupName === "sconosciuto") return;
      firebase.database().ref(`configurazioneScuola/gruppi/${session.safeGroup || safe(groupName)}`).on("value", snapshot => {
        const group = snapshot.val() || {};
        const unitNumber = Number(group.unitNumber || 0);
        const active = Object.values(group.studenti || {}).filter(person => person?.nome);
        const inactive = Object.values(group.studentiInattivi || {}).filter(person => person?.nome && Number(person.unitNumber ?? unitNumber) >= 46);
        groupRoster = unitNumber >= 46 ? [...active, ...inactive] : inactive;
        groupRoster = [...new Map(groupRoster.map(person => [person.nome, person])).values()]
          .sort((a, b) => a.nome.localeCompare(b.nome, "it"));
        renderWriterMenu();
      });
    }

    function setWriter(role, name) {
      if (!isTeacher || !answersRef) return;
      const priorWriter = currentWriter;
      const priorRole = currentWriterRole;
      currentWriter = name;
      currentWriterRole = role;
      restoreAnswersForWriter();
      const updates = {
        "controlAssignments/writer": name || null,
        "controlAssignments/role": name ? role : null,
        "controlAssignments/writerName": name || "",
        "tokenData/currentWriter": name || null,
        "tokenData/writerName": name || "",
        "tokenData/answers": currentAnswers
      };
      answersRef.update(updates).catch(error => {
        currentWriter = priorWriter;
        currentWriterRole = priorRole;
        renderWriterMenu();
        updateAssignment();
        console.error("Errore assegnazione turno:", error);
      });
      renderWriterMenu();
    }

    navPrevious.addEventListener("click", () => { activeSlide = Math.max(0, activeSlide - 1); updateSlides(); });
    navNext.addEventListener("click", () => { activeSlide = Math.min(questions.length - 1, activeSlide + 1); updateSlides(); });
    progressRange.addEventListener("input", () => { activeSlide = Number(progressRange.value); updateSlides(); });
    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest("input,textarea,select,button,a,[tabindex]")) return;
      if (event.key === "ArrowRight" && activeSlide < questions.length - 1) activeSlide++;
      else if (event.key === "ArrowLeft" && activeSlide > 0) activeSlide--;
      else return;
      updateSlides();
    });

    writerSelect.addEventListener("change", () => {
      const [role, ...nameParts] = writerSelect.value.split("::");
      setWriter(role || "", nameParts.join("::"));
    });

    document.getElementById("reset-answers").addEventListener("click", () => {
      if (!isTeacher || !answersRef || !confirm("Сбросить все ответы? · Vuoi azzerare tutte le risposte?")) return;
      clearTimeout(writeTimer);
      answersRef.set({
        controlAssignments: { writer: null, role: null, writerName: "" },
        tokenData: { currentWriter: null, writerName: "", answers: emptyAnswers() },
        allStudentsData: {}
      }).then(() => {
        currentWriter = "";
        currentWriterRole = "";
        currentAnswers = emptyAnswers();
        saveStatus.hidden = true;
        renderWriterMenu();
        updateAssignment();
      });
    });

    updateSlides();
    updateAssignment();

    if (!groupName || groupName === "sconosciuto") {
      assignmentStatus.textContent = "Accedi tramite il gruppo della classe per utilizzare l’esercizio condiviso.";
    } else if (window.firebase) {
      try {
        if (!firebase.apps.length) firebase.initializeApp({ databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app", projectId: "esercizi-parlo-italiano" });
        answersRef = firebase.database().ref("esercizi/unita46-pronomi-diretti-e");
        loadGroupRoster();
        firebase.database().ref("esercizi/unita46-presence").on("value", snapshot => {
          presenceData = snapshot.val() || {};
          renderWriterMenu();
        });
        answersRef.on("value", snapshot => {
          const data = snapshot.val() || {};
          const assignment = data.controlAssignments || {};
          const nextWriter = assignment.writer || data.tokenData?.currentWriter || "";
          const nextRole = assignment.role || (nextWriter && nextWriter === sessionName && isTeacher ? "teacher" : "student");
          const changed = nextWriter !== currentWriter || nextRole !== currentWriterRole;
          currentWriter = nextWriter;
          currentWriterRole = nextRole;
          allStudentsData = data.allStudentsData?.students || {};
          window.__unit46SharedAnswers = data.tokenData?.answers || {};
          if (changed) {
            clearTimeout(writeTimer);
            restoreAnswersForWriter();
          } else {
            questions.forEach((question, index) => {
              const textarea = slidesTrack.querySelectorAll(".answer-input")[index];
              const stored = String(window.__unit46SharedAnswers[question.id] ?? allStudentsData[safe(currentWriter)]?.answers?.[question.id] ?? "");
              if (document.activeElement !== textarea && currentAnswers[question.id] !== stored) currentAnswers[question.id] = stored;
            });
          }
          snapshotPending = true;
          updateAssignment();
          snapshotPending = false;
          renderWriterMenu();
          renderResponses();
        });
      } catch (error) {
        console.error("Errore Firebase:", error);
        assignmentStatus.textContent = "Connessione all’esercizio non disponibile.";
      }
    }
  </script>
</body>
</html>
