<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Lettura e comprensione: Un bravo ragazzo, Unità 2." />
  <title>Unità 2 — Lettura e comprensione · Esercizio A</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --green: #2f5739; --green-light: #edf4ed; --accent: #bd694d;
      --text: #292d28; --muted: #6b7069; --paper: #fffefa; --border: #d8e5d8;
      --success: #17623c; --success-bg: #e1f1e5; --error: #991b1b; --error-bg: #fde8e7;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid rgba(189,105,77,.55); outline-offset: 3px; }
    body {
      min-height: 100vh; margin: 0; padding: 28px 14px; color: var(--text);
      background: linear-gradient(rgba(250,248,241,.78),rgba(250,248,241,.78)),
        url("img/sfondo.jpeg") center calc(50% - var(--background-offset,0px)) / cover fixed,
        radial-gradient(ellipse at 50% 0,rgba(255,255,255,.72),transparent 55%), #e9e3d6;
    }
    main { width: min(100%,880px); margin: 0 auto; }
    .top-menu { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
    .top-menu select, .top-menu a, .assignment-select {
      min-height: 40px; max-width: 100%; padding: 7px 12px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--paper); color: var(--green); font: inherit; font-size: .9rem; font-weight: 700;
    }
    .top-menu a { display: inline-flex; align-items: center; text-decoration: none; }
    .top-menu a:hover { border-color: var(--green); background: var(--green-light); }
    .top-menu #exercise-menu { margin-left: auto; }
    .hero { margin: 8px 0 20px; padding: 26px 18px; border: 1px solid var(--border); border-radius: 24px; background: linear-gradient(135deg,rgba(255,254,250,.96),rgba(242,247,239,.94)); text-align: center; box-shadow: 0 12px 32px rgba(43,69,46,.07); }
    .eyebrow { display: inline-block; margin-bottom: 10px; padding: 8px 15px; border-radius: 20px; background: var(--green-light); color: var(--green); font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 4px 0; color: var(--green); font-size: clamp(1.9rem,5vw,2.65rem); letter-spacing: -.04em; line-height: 1.12; }
    .hero-subtitle { margin: 8px 0 0; color: var(--muted); }
    #user-badge { color: var(--accent); font-size: .87rem; font-weight: 700; }
    .teacher-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 14px; padding: 13px 16px; border: 1px solid var(--border); border-radius: 14px; background: rgba(255,254,250,.95); }
    .teacher-controls label, .assignment-label { color: var(--green); font-size: .88rem; font-weight: 800; }
    .teacher-controls[hidden] { display: none; }
    .card { padding: clamp(16px,4vw,30px); border: 1px solid #e7e5dc; border-radius: 24px; background: var(--paper); box-shadow: 0 18px 48px rgba(43,69,46,.1); }
    .overall-progress { display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 9px; margin: 0 0 12px; scrollbar-width: thin; }
    .progress-step, .nav-btn, .send-question, .option-btn, .accent-toolbar button {
      min-height: 40px; padding: 8px 13px; border: 1px solid var(--border); border-radius: 10px;
      background: #fff; color: var(--green); font: inherit; font-weight: 700; cursor: pointer;
    }
    .progress-step { flex: 0 0 36px; min-height: 36px; padding: 4px; }
    .progress-step:hover, .nav-btn:hover:not(:disabled), .option-btn:hover:not(:disabled), .accent-toolbar button:hover:not(:disabled) { background: var(--green-light); border-color: var(--green); }
    .progress-step[aria-current="step"] { border-color: var(--green); background: var(--green); color: #fff; }
    .question-slide { display: none; flex-direction: column; gap: 15px; min-width: 0; padding: clamp(14px,3vw,22px); border: 1px solid var(--border); border-radius: 18px; background: #fff; }
    .question-slide.active { display: flex; }
    .question-heading { display: flex; align-items: flex-start; gap: 10px; color: var(--green); font-size: 1.08rem; font-weight: 800; line-height: 1.45; }
    .question-number { display: inline-grid; flex: 0 0 36px; width: 36px; height: 36px; place-items: center; border-radius: 12px; background: var(--green-light); color: var(--green); }
    .assignment-row { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; padding: 12px; border-radius: 12px; background: var(--green-light); }
    .assignment-field { display: grid; gap: 6px; }
    .assignment-select { width: 100%; }
    .question-form-card { padding: 14px; border: 1px solid var(--border); border-radius: 14px; background: #f7faf5; }
    .question-form-card label { display: block; margin-bottom: 7px; color: var(--green); font-size: .92rem; font-weight: 700; }
    .question-input { width: 100%; min-height: 76px; padding: 10px 12px; border: 1.5px solid #d4e1d5; border-radius: 10px; background: #fff; color: var(--text); font: inherit; line-height: 1.5; resize: vertical; }
    .question-input:disabled { background: #f2f5f1; color: #475569; }
    .accent-toolbar { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 0 8px; }
    .accent-toolbar button { min-width: 36px; min-height: 32px; padding: 3px 8px; border-radius: 8px; }
    .accent-toolbar button:disabled { cursor: not-allowed; opacity: .5; }
    .question-actions { display: flex; justify-content: flex-end; margin-top: 9px; }
    .send-question { border: 0; background: var(--green); color: #fff; }
    .send-question:hover:not(:disabled) { background: #24452d; }
    .send-question:disabled { opacity: .55; cursor: not-allowed; }
    .contributions { display: grid; gap: 8px; }
    .contributions h3 { margin: 0; color: var(--green); font-size: .98rem; }
    .contribution { padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fbfaf6; }
    .contribution-meta { display: block; margin-bottom: 5px; color: var(--muted); font-size: .82rem; font-weight: 700; }
    .contribution-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    .section-hint { padding-left: 12px; border-left: 3px solid #d5e2d5; color: var(--text); font-size: 1.05rem; font-weight: 700; }
    .options-grid { display: grid; gap: 9px; }
    .option-btn { min-height: 46px; padding: 11px 14px; border-color: #e1e6dd; background: #faf9f5; color: var(--text); text-align: left; }
    .option-btn.selected { border-color: var(--green); background: #e2ede3; color: var(--green); font-weight: 800; }
    .option-btn.selected.correct { border-color: #15803d; background: var(--success-bg); color: var(--success); }
    .option-btn.selected.incorrect { border-color: #dc2626; background: var(--error-bg); color: var(--error); }
    .option-btn:disabled { cursor: default; }
    .answer-feedback { min-height: 1.4em; margin: -7px 0 0; font-size: .92rem; font-weight: 800; }
    .answer-feedback.correct { color: var(--success); }
    .answer-feedback.incorrect { color: var(--error); }
    .slide-navigation { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #e7e5dc; }
    .slide-progress { color: var(--green); font-size: .9rem; font-weight: 800; text-align: center; }
    .nav-btn:disabled { opacity: .45; cursor: not-allowed; }
    .save-status { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--success-bg); color: var(--success); font-size: .9rem; font-weight: 700; }
    .empty-message { margin: 0; color: var(--muted); font-size: .9rem; }
    @media (max-width: 600px) {
      body { padding: 16px 8px; }
      .top-menu select { flex: 1 1 auto; }
      .assignment-row { grid-template-columns: 1fr; }
      .slide-navigation { flex-wrap: wrap; }
      .nav-btn { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <nav class="top-menu" aria-label="Navigazione Unità 2">
      <select id="exercise-menu" aria-label="Vai a un esercizio">
        <option value="002_lettura.html">Lettura</option><option value="002_es_a.html" selected>Esercizio A</option>
        <option value="002_es_b.html">Esercizio B</option><option value="002_es_c.html">Esercizio C</option>
        <option value="002_es_d.html">Esercizio D</option><option value="002_es_e.html">Esercizio E</option>
        <option value="002_es_f.html">Esercizio F</option><option value="002_es_g.html">Esercizio G</option>
        <option value="002_es_h.html">Esercizio H</option><option value="002_es_i.html">Esercizio I</option>
        <option value="002_es_j.html">Esercizio J</option><option value="002_es_k.html">Esercizio K</option>
        <option value="002_es_l.html">Esercizio L</option><option value="002_es_m.html">Esercizio M</option>
        <option value="002_numeri.html">I numeri</option><option value="002_verbo_essere.html">Il verbo essere</option>
      </select>
      <a id="reading-link" href="002_lettura.html">← Lettura</a>
    </nav>

    <header class="hero">
      <span class="eyebrow">Unità 2 · Lettura e comprensione</span>
      <h1>Un bravo ragazzo</h1>
      <p class="hero-subtitle">Scegli la risposta corretta e formula una domanda per il tuo compagno.</p>
      <p id="user-badge" class="hero-subtitle" aria-live="polite"></p>
    </header>

    <section id="teacher-controls" class="teacher-controls" hidden aria-label="Assegnazione dei turni">
      <label class="assignment-field" for="question-writer-select">✍️ Turno per formulare la domanda
        <select id="question-writer-select" class="assignment-select"><option value="">— Nessuno assegnato —</option></select>
      </label>
      <label class="assignment-field" for="answer-writer-select">☑️ Turno per scegliere la risposta
        <select id="answer-writer-select" class="assignment-select"><option value="">— Nessuno assegnato —</option></select>
      </label>
    </section>

    <section class="card" aria-label="Domande dell’esercizio">
      <nav id="exercise-progress" class="overall-progress" aria-label="Vai direttamente alla domanda"></nav>
      <div id="questions-container"></div>
      <nav class="slide-navigation" aria-label="Navigazione delle domande">
        <button id="previous-question" class="nav-btn" type="button">← Precedente</button>
        <span id="question-progress" class="slide-progress" aria-live="polite"></span>
        <button id="next-question" class="nav-btn" type="button">Successiva →</button>
      </nav>
      <p id="save-status" class="save-status" role="status" aria-live="polite" hidden></p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-group-scope.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    const questions = [
      { hint: "La madre", options: ["è in cucina", "è in camera", "è a letto"], correct: 0 },
      { hint: "Il figlio", options: ["è in cucina", "è a scuola", "è a letto"], correct: 2 },
      { hint: "Quando il figlio ha sete, la madre porta", options: ["un piatto di pasta", "un bicchiere d’acqua", "una coperta"], correct: 1 },
      { hint: "Quando il figlio ha fame, la madre porta", options: ["una coperta", "una finestra", "un piatto di pasta"], correct: 2 },
      { hint: "Quando il figlio ha freddo, la madre porta", options: ["una finestra", "una coperta", "un bicchiere d’acqua"], correct: 1 },
      { hint: "Quando il figlio ha sonno, la madre", options: ["apre la finestra", "chiude la coperta", "spegne la luce"], correct: 2 },
      { hint: "Il figlio", options: ["è piccolo", "è grande"], correct: 1 }
    ];

    const session = window.parloUnit2Session || {};
    const group = session.group === "sconosciuto" ? "" : session.group || "";
    const isTeacher = Boolean(session.isTeacher);
    const userName = String(session.name || "").trim();
    const safe = value => String(value || "").replace(/[.#$\/\[\]]/g, "_");
    const safeGroup = safe(group || "sconosciuto");
    const userRole = isTeacher ? "teacher" : "student";
    const presenceId = `presence_${Math.random().toString(36).slice(2, 10)}`;
    const myIdentity = userName ? { role: userRole, name: userName } : null;

    const teacherControls = document.getElementById("teacher-controls");
    const questionsContainer = document.getElementById("questions-container");
    const progressNav = document.getElementById("exercise-progress");
    const previousButton = document.getElementById("previous-question");
    const nextButton = document.getElementById("next-question");
    const progressText = document.getElementById("question-progress");
    const saveStatus = document.getElementById("save-status");
    const questionWriterSelect = document.getElementById("question-writer-select");
    const answerWriterSelect = document.getElementById("answer-writer-select");
    teacherControls.hidden = !isTeacher;

    function addLoginParams(url) {
      if (group) url.searchParams.set("gruppo", group);
      if (!isTeacher && userName) url.searchParams.set("nome", userName);
      return url;
    }
    document.getElementById("reading-link").href = addLoginParams(new URL("002_lettura.html", location.href)).href;
    document.getElementById("exercise-menu").addEventListener("change", event => {
      if (event.target.value) location.href = addLoginParams(new URL(event.target.value, location.href)).href;
    });

    let answersRef = null;
    let activeQuestion = 0;
    let roster = [];
    let presenceData = {};
    let assignments = {};
    let sharedQuestions = {};
    let choices = {};
    let allContributions = {};
    let legacyStudents = {};
    const questionCards = [];
    const saveTimers = new Map();

    function isOnline(name) {
      return Object.values(presenceData[safe(name)] || {}).some(entry => entry?.role === "student" && entry.name === name);
    }
    function assignedTo(index, role) {
      const target = assignments[index]?.[role];
      return Boolean(myIdentity && target && target.role === myIdentity.role && target.name === myIdentity.name);
    }
    function assignmentValue(identity) {
      return identity?.role && identity?.name ? JSON.stringify({ role: identity.role, name: identity.name }) : "";
    }
    function parseAssignment(value) {
      if (!value) return null;
      try {
        const parsed = JSON.parse(value);
        return parsed && ["student", "teacher"].includes(parsed.role) && parsed.name ? parsed : null;
      } catch (_) { return null; }
    }
    function orderedRoster() {
      const unique = new Map();
      roster.forEach(student => {
        const name = String(student?.nome || "").trim();
        if (name) unique.set(name, { role: "student", name, online: isOnline(name) });
      });
      Object.values(presenceData).forEach(connections => Object.values(connections || {}).forEach(entry => {
        if (entry?.role === "student" && entry.name) unique.set(entry.name, { role: "student", name: entry.name, online: true });
      }));
      return [...unique.values()].sort((a, b) => Number(b.online) - Number(a.online) || a.name.localeCompare(b.name, "it"));
    }
    function refreshAssignmentMenus() {
      const roster = orderedRoster();
      [["question", questionWriterSelect], ["answer", answerWriterSelect]].forEach(([role, select]) => {
        const selected = assignmentValue(assignments[activeQuestion]?.[role]);
        select.replaceChildren(new Option("— Nessuno assegnato —", ""));
        const online = roster.filter(person => person.online);
        const offline = roster.filter(person => !person.online);
        if (online.length) {
          const groupOption = document.createElement("optgroup");
          groupOption.label = "🟢 Studenti online";
          online.forEach(person => groupOption.appendChild(new Option(`🟢 ${person.name}`, assignmentValue(person))));
          select.appendChild(groupOption);
        }
        if (offline.length) {
          const groupOption = document.createElement("optgroup");
          groupOption.label = "Studenti offline";
          offline.forEach(person => groupOption.appendChild(new Option(person.name, assignmentValue(person))));
          select.appendChild(groupOption);
        }
        if (myIdentity?.role === "teacher") {
          const groupOption = document.createElement("optgroup");
          groupOption.label = "👩‍🏫 Insegnante";
          groupOption.appendChild(new Option(myIdentity.name, assignmentValue(myIdentity)));
          select.appendChild(groupOption);
        }
        select.value = selected;
      });
    }
    function createAccentToolbar(input) {
      const toolbar = document.createElement("div");
      toolbar.className = "accent-toolbar";
      toolbar.setAttribute("role", "group");
      toolbar.setAttribute("aria-label", "Inserisci un carattere accentato");
      ["à", "è", "ì", "ò", "ù", "È"].forEach(character => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = character;
        button.setAttribute("aria-label", `Inserisci ${character}`);
        button.addEventListener("mousedown", event => event.preventDefault());
        button.addEventListener("click", () => {
          if (input.disabled) return;
          const start = input.selectionStart;
          const end = input.selectionEnd;
          input.value = input.value.slice(0, start) + character + input.value.slice(end);
          input.focus();
          input.setSelectionRange(start + character.length, start + character.length);
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });
        toolbar.appendChild(button);
      });
      return toolbar;
    }
    function setStatus(message, isError = false) {
      saveStatus.textContent = message;
      saveStatus.hidden = !message;
      saveStatus.style.background = isError ? "var(--error-bg)" : "var(--success-bg)";
      saveStatus.style.color = isError ? "var(--error)" : "var(--success)";
    }
    function saveSharedQuestion(index, value) {
      if (!answersRef || !assignedTo(index, "question")) return;
      answersRef.child("sharedQuestions").child(String(index)).set(value).catch(() => setStatus("Impossibile sincronizzare la domanda. Controlla la connessione.", true));
    }
    function scheduleQuestionSave(index, value) {
      clearTimeout(saveTimers.get(index));
      saveTimers.set(index, setTimeout(() => {
        saveTimers.delete(index);
        saveSharedQuestion(index, value);
      }, 250));
    }
    function renderContributions(index) {
      const list = questionCards[index].contributionList;
      list.replaceChildren();
      const entries = Object.entries(allContributions[index] || {}).map(([id, entry]) => ({
        id, author: entry?.author || entry?.name || "Partecipante", text: String(entry?.text || ""), timestamp: Number(entry?.timestamp) || 0
      })).filter(entry => entry.text.trim());
      Object.entries(legacyStudents).forEach(([id, student]) => {
        if (student?.submittedQuestions?.[index] !== true) return;
        const old = student.answers?.[index] || {};
        const text = String(old.formulatedQuestion || "").trim();
        if (text) entries.push({ id: `legacy-${id}`, author: student.name || "Studente", text, timestamp: Number(student.timestamp) || 0, legacy: true });
      });
      entries.sort((a, b) => a.timestamp - b.timestamp || a.id.localeCompare(b.id));
      if (!entries.length) {
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent = "Nessuna domanda inviata per questa scheda.";
        list.appendChild(empty);
        return;
      }
      entries.forEach(entry => {
        const article = document.createElement("article");
        article.className = "contribution";
        const meta = document.createElement("span");
        meta.className = "contribution-meta";
        meta.textContent = `${entry.author} · ${entry.timestamp ? new Date(entry.timestamp).toLocaleString("it-IT") : "Data non disponibile"}${entry.legacy ? " · invio precedente" : ""}`;
        const text = document.createElement("div");
        text.className = "contribution-text";
        text.textContent = entry.text;
        article.append(meta, text);
        list.appendChild(article);
      });
    }
    function renderCardState(index) {
      const item = questionCards[index];
      const canAsk = assignedTo(index, "question");
      const canAnswer = assignedTo(index, "answer");
      const savedText = String(sharedQuestions[index] || "");
      if (document.activeElement !== item.questionInput && item.questionInput.value !== savedText) item.questionInput.value = savedText;
      item.questionInput.disabled = !canAsk;
      item.accentToolbar.querySelectorAll("button").forEach(button => { button.disabled = !canAsk; });
      item.sendButton.disabled = !canAsk || !answersRef;
      item.sendButton.title = canAsk ? "Invia una nuova domanda allo storico" : "Il turno di formulazione non è assegnato a te";

      const choice = choices[index];
      item.optionButtons.forEach((button, optionIndex) => {
        const selected = Number(choice?.optionIndex) === optionIndex;
        button.disabled = !canAnswer || !answersRef;
        button.classList.toggle("selected", selected);
        button.classList.toggle("correct", selected && optionIndex === questions[index].correct);
        button.classList.toggle("incorrect", selected && optionIndex !== questions[index].correct);
        button.setAttribute("aria-pressed", String(selected));
      });
      item.feedback.className = "answer-feedback";
      if (choice && Number.isInteger(Number(choice.optionIndex))) {
        const isCorrect = Number(choice.optionIndex) === questions[index].correct;
        item.feedback.textContent = isCorrect ? "✓ Risposta corretta" : "✕ Risposta da rivedere";
        item.feedback.classList.add(isCorrect ? "correct" : "incorrect");
      } else item.feedback.textContent = "";
      renderContributions(index);
      item.card.classList.toggle("active", index === activeQuestion);
    }
    function updateUI() {
      questionCards.forEach((_, index) => renderCardState(index));
      refreshAssignmentMenus();
      progressNav.querySelectorAll("button").forEach((button, index) => button.setAttribute("aria-current", index === activeQuestion ? "step" : "false"));
      progressText.textContent = `Domanda ${activeQuestion + 1} di ${questions.length}`;
      previousButton.disabled = activeQuestion === 0;
      nextButton.disabled = activeQuestion === questions.length - 1;
    }
    function showQuestion(index, scroll = true) {
      activeQuestion = Math.max(0, Math.min(questions.length - 1, index));
      if (scroll) questionCards[activeQuestion].card.scrollIntoView({ behavior: "smooth", block: "nearest" });
      updateUI();
    }

    questions.forEach((question, index) => {
      const card = document.createElement("article");
      card.className = "question-slide";
      card.setAttribute("aria-label", `Scheda ${index + 1}`);
      const heading = document.createElement("div");
      heading.className = "question-heading";
      const number = document.createElement("span");
      number.className = "question-number";
      number.textContent = String(index + 1);
      const prompt = document.createElement("span");
      prompt.textContent = `${question.hint}…`;
      heading.append(number, prompt);

      const questionCard = document.createElement("div");
      questionCard.className = "question-form-card";
      const label = document.createElement("label");
      label.htmlFor = `question-input-${index}`;
      label.textContent = "✍️ Formula una domanda per il compagno";
      const questionInput = document.createElement("textarea");
      questionInput.id = label.htmlFor;
      questionInput.className = "question-input";
      questionInput.rows = 2;
      questionInput.placeholder = "Scrivi qui la domanda…";
      const accentToolbar = createAccentToolbar(questionInput);
      questionInput.addEventListener("input", () => {
        if (!assignedTo(index, "question")) return;
        scheduleQuestionSave(index, questionInput.value);
      });
      questionInput.addEventListener("blur", () => {
        if (saveTimers.has(index)) {
          clearTimeout(saveTimers.get(index));
          saveTimers.delete(index);
          saveSharedQuestion(index, questionInput.value);
        }
      });
      const questionActions = document.createElement("div");
      questionActions.className = "question-actions";
      const sendButton = document.createElement("button");
      sendButton.type = "button";
      sendButton.className = "send-question";
      sendButton.textContent = "📤 Invia domanda";
      sendButton.addEventListener("click", async () => {
        const text = questionInput.value.trim();
        if (!answersRef || !assignedTo(index, "question") || !text) {
          setStatus(text ? "Il turno di formulazione non è assegnato a te." : "Scrivi una domanda prima di inviarla.", true);
          return;
        }
        sendButton.disabled = true;
        try {
          await answersRef.child("sharedQuestions").child(String(index)).set(questionInput.value);
          await answersRef.child("questionContributions").child(String(index)).push().set({
            text, author: userName, role: userRole, timestamp: Date.now()
          });
          setStatus(`Domanda ${index + 1} aggiunta ai contributi.`);
        } catch (error) {
          setStatus("Invio non riuscito. Controlla la connessione e riprova.", true);
        } finally {
          renderCardState(index);
        }
      });
      questionActions.appendChild(sendButton);
      questionCard.append(label, accentToolbar, questionInput, questionActions);

      const contributions = document.createElement("section");
      contributions.className = "contributions";
      const contributionsTitle = document.createElement("h3");
      contributionsTitle.textContent = "Domande inviate";
      const contributionList = document.createElement("div");
      contributionList.setAttribute("aria-live", "polite");
      contributions.append(contributionsTitle, contributionList);

      const hint = document.createElement("div");
      hint.className = "section-hint";
      hint.textContent = `${question.hint}…`;
      const options = document.createElement("div");
      options.className = "options-grid";
      const optionButtons = question.options.map((text, optionIndex) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option-btn";
        button.textContent = `${String.fromCharCode(97 + optionIndex)}) ${text}`;
        button.addEventListener("click", () => {
          if (!answersRef || !assignedTo(index, "answer")) return;
          answersRef.child("choices").child(String(index)).set({
            optionIndex, author: userName, role: userRole, timestamp: Date.now()
          }).catch(() => setStatus("Impossibile salvare la risposta scelta.", true));
        });
        options.appendChild(button);
        return button;
      });
      const feedback = document.createElement("p");
      feedback.className = "answer-feedback";
      feedback.setAttribute("role", "status");
      feedback.setAttribute("aria-live", "polite");
      card.append(heading, questionCard, contributions, hint, options, feedback);
      questionsContainer.appendChild(card);
      questionCards.push({ card, questionInput, accentToolbar, sendButton, contributionList, optionButtons, feedback });

      const step = document.createElement("button");
      step.type = "button";
      step.className = "progress-step";
      step.textContent = String(index + 1);
      step.setAttribute("aria-label", `Vai alla scheda ${index + 1}: ${question.hint}`);
      step.addEventListener("click", () => showQuestion(index));
      progressNav.appendChild(step);
    });

    function saveAssignment(role, value) {
      if (!isTeacher || !answersRef) return;
      const identity = parseAssignment(value);
      answersRef.child("assignments").child(String(activeQuestion)).child(role).set(identity)
        .catch(() => setStatus("Impossibile salvare il turno assegnato.", true));
    }
    questionWriterSelect.addEventListener("change", () => saveAssignment("question", questionWriterSelect.value));
    answerWriterSelect.addEventListener("change", () => saveAssignment("answer", answerWriterSelect.value));

    previousButton.addEventListener("click", () => showQuestion(activeQuestion - 1));
    nextButton.addEventListener("click", () => showQuestion(activeQuestion + 1));
    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest("input,textarea,select,button,a,[tabindex]")) return;
      if (event.key === "ArrowLeft") showQuestion(activeQuestion - 1);
      if (event.key === "ArrowRight") showQuestion(activeQuestion + 1);
    });
    window.addEventListener("resize", () => updateUI());

    function registerPresence(database) {
      if (!userName || !answersRef) return;
      const presenceRef = answersRef.child("presence").child(safe(userName)).child(presenceId);
      database.ref(".info/connected").on("value", snapshot => {
        if (snapshot.val() !== true) return;
        presenceRef.onDisconnect().remove().then(() => presenceRef.set({ name: userName, role: userRole, identity: `${userRole}:${userName}` }))
          .catch(error => console.error("Errore stato presenza:", error));
      });
    }
    function loadRoster(database) {
      if (!group) return;
      database.ref(`configurazioneScuola/gruppi/${safeGroup}`).on("value", snapshot => {
        const data = snapshot.val() || {};
        const active = Object.values(data.studenti || {}).filter(student => student?.nome);
        const inactive = Object.values(data.studentiInattivi || {}).filter(student => student?.nome && Number(student.unitNumber ?? data.unitNumber ?? 0) >= 2);
        roster = [...new Map([...active, ...inactive].map(student => [student.nome, student])).values()];
        updateUI();
      });
    }

    if (window.firebase) {
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        if (group) {
          const database = firebase.database();
          answersRef = database.ref("esercizi/unita2-scelta-multipla-a");
          registerPresence(database);
          loadRoster(database);
          answersRef.on("value", snapshot => {
            const data = snapshot.val() || {};
            assignments = data.assignments || {};
            sharedQuestions = data.sharedQuestions || {};
            choices = data.choices || {};
            allContributions = data.questionContributions || {};
            legacyStudents = data.students || {};
            presenceData = data.presence || {};
            updateUI();
          }, error => {
            console.error("Errore lettura Firebase:", error);
            setStatus("Impossibile leggere i dati condivisi del gruppo.", true);
          });
          if (!userName) setStatus("La sessione non contiene un nome: non potrai ricevere un turno di scrittura.", true);
        } else setStatus("Gruppo non trovato: accedi dalla pagina iniziale per usare l’attività condivisa.", true);
      } catch (error) {
        console.error("Errore Firebase:", error);
        setStatus("Servizio dati condivisi non disponibile.", true);
      }
    } else setStatus("Servizio dati condivisi non disponibile.", true);

    updateUI();
    let backgroundUpdatePending = false;
    function updateBackgroundParallax() {
      if (backgroundUpdatePending) return;
      backgroundUpdatePending = true;
      requestAnimationFrame(() => {
        const offset = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : Math.min(window.scrollY * .12, 180);
        document.body.style.setProperty("--background-offset", `${offset}px`);
        backgroundUpdatePending = false;
      });
    }
    window.addEventListener("scroll", updateBackgroundParallax, { passive: true });
    updateBackgroundParallax();
  </script>
</body>
</html>
