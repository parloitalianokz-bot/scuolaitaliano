<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rispondi alle domande sul racconto Un bravo ragazzo, Unità 2." />
  <title>Unità 2 — Un bravo ragazzo · Esercizio B</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #477755; --primary-light: #edf4ed; --primary-dark: #2f5739;
      --accent: #bd694d; --bg-main: #f5f1e7; --card-bg: #fffefa;
      --text: #292d28; --text-muted: #6b7069; --success: #278253;
      --success-bg: #e1f1e5; --border: #e7e5dc; --error: #991b1b;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid rgba(189,105,77,.55); outline-offset: 3px; }
    body {
      min-height: 100vh; margin: 0; padding: 28px 14px; color: var(--text);
      background: linear-gradient(rgba(250,248,241,.78),rgba(250,248,241,.78)),
        url("img/sfondo.jpeg") center calc(50% - var(--background-offset,0px)) / cover fixed,
        radial-gradient(ellipse at 50% 0,rgba(255,255,255,.72),transparent 55%), #e9e3d6;
    }
    main { width: min(100%,880px); margin: 0 auto; }
    .top-menu { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
    .top-menu select, .top-menu a, .assignment-select {
      min-height: 40px; max-width: 100%; padding: 7px 12px; border: 1px solid #d8e5d8;
      border-radius: 10px; background: var(--card-bg); color: var(--primary-dark);
      font: inherit; font-size: .9rem; font-weight: 700;
    }
    .top-menu select { cursor: pointer; }
    .top-menu a { display: inline-flex; align-items: center; text-decoration: none; }
    .top-menu a:hover, .top-menu select:hover { border-color: var(--primary); background: var(--primary-light); }
    #exercise-menu { margin-left: auto; }
    #user-badge { color: var(--accent); font-size: .85rem; font-weight: 700; }
    .hero { margin: 8px 0 20px; padding: 26px 18px; border: 1px solid rgba(71,119,85,.13); border-radius: 24px; background: linear-gradient(135deg,rgba(255,254,250,.96),rgba(242,247,239,.94)); text-align: center; box-shadow: 0 12px 32px rgba(43,69,46,.07); }
    .eyebrow { display: inline-block; margin-bottom: 10px; padding: 8px 15px; border-radius: 20px; background: #eaf1e8; color: var(--primary-dark); font-size: .78rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
    h1 { margin: 4px 0; color: var(--primary-dark); font-size: clamp(1.9rem,5vw,2.65rem); letter-spacing: -.04em; line-height: 1.12; }
    .hero-subtitle { margin: 8px 0 0; color: var(--text-muted); }
    .teacher-controls { display: grid; grid-template-columns: minmax(0,1fr); gap: 6px; margin: 0 0 14px; padding: 13px 16px; border: 1px solid #d8e5d8; border-radius: 14px; background: rgba(255,254,250,.95); }
    .teacher-controls[hidden] { display: none; }
    .teacher-controls label { color: var(--primary-dark); font-size: .88rem; font-weight: 800; }
    .assignment-select { width: 100%; }
    .card { padding: clamp(16px,4vw,30px); border: 1px solid var(--border); border-radius: 24px; background: var(--card-bg); box-shadow: 0 18px 48px rgba(43,69,46,.1); }
    .overall-progress { display: flex; gap: 6px; overflow-x: auto; padding: 2px 1px 9px; margin: 0 0 12px; scrollbar-width: thin; }
    .progress-step, .nav-btn, .submit-answer, .accent-toolbar button {
      min-height: 40px; padding: 8px 13px; border: 1px solid #d8e5d8; border-radius: 10px;
      background: #fff; color: var(--primary-dark); font: inherit; font-weight: 700; cursor: pointer;
    }
    .progress-step { flex: 0 0 36px; min-height: 36px; padding: 4px; }
    .progress-step:hover, .nav-btn:hover:not(:disabled), .accent-toolbar button:hover:not(:disabled) { background: var(--primary-light); border-color: var(--primary); }
    .progress-step[aria-current="step"] { border-color: var(--primary); background: var(--primary); color: #fff; }
    .question-slide { display: none; flex-direction: column; gap: 15px; min-width: 0; padding: clamp(14px,3vw,22px); border: 1px solid var(--border); border-radius: 18px; background: #fff; }
    .question-slide.active { display: flex; }
    .question-heading { display: flex; align-items: flex-start; gap: 10px; color: var(--primary-dark); font-size: 1.08rem; font-weight: 800; line-height: 1.45; }
    .question-number { display: inline-grid; flex: 0 0 36px; width: 36px; height: 36px; place-items: center; border-radius: 12px; background: var(--primary-light); color: var(--primary-dark); }
    .writer-status { margin: 0; padding: 9px 12px; border-radius: 9px; background: var(--primary-light); color: var(--primary-dark); font-size: .9rem; font-weight: 700; }
    .answer-label { color: var(--primary-dark); font-size: .92rem; font-weight: 700; }
    .answer-input { width: 100%; min-height: 112px; padding: 12px 14px; border: 1.5px solid #d4e1d5; border-radius: 12px; background: #fff; color: var(--text); font: inherit; font-size: 1rem; line-height: 1.5; resize: vertical; }
    .answer-input:disabled { background: #f2f5f1; color: #475569; }
    .accent-toolbar { display: flex; flex-wrap: wrap; gap: 5px; margin: -8px 0 -6px; }
    .accent-toolbar button { min-width: 36px; min-height: 32px; padding: 3px 8px; border-radius: 8px; }
    .accent-toolbar button:disabled { cursor: not-allowed; opacity: .5; }
    .submit-answer { align-self: flex-end; border: 0; background: var(--primary); color: #fff; }
    .submit-answer:hover:not(:disabled) { background: var(--primary-dark); }
    .submit-answer:disabled { opacity: .55; cursor: not-allowed; }
    .contributions { display: grid; gap: 8px; }
    .contributions h2 { margin: 0; color: var(--primary-dark); font-size: 1.05rem; }
    .contribution { padding: 11px 12px; border: 1px solid var(--border); border-radius: 10px; background: #fbfaf6; }
    .contribution-meta { display: block; margin-bottom: 5px; color: var(--text-muted); font-size: .82rem; font-weight: 700; }
    .contribution-text { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.5; }
    .empty-message { margin: 0; color: var(--text-muted); font-size: .9rem; }
    .suggestion { padding: 10px 12px; border: 1px solid #d8e5d8; border-radius: 10px; background: #fbfdf9; color: var(--text); line-height: 1.55; }
    .suggestion summary { color: var(--primary-dark); font-weight: 800; cursor: pointer; }
    .suggestion p { margin: 9px 0 0; }
    .teacher-suggestion { border-left: 4px solid var(--accent); }
    .slide-navigation { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
    .nav-btn { cursor: pointer; }
    .nav-btn:disabled { opacity: .45; cursor: not-allowed; }
    .slide-progress { color: var(--primary-dark); font-size: .9rem; font-weight: 800; text-align: center; }
    .save-status { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--success-bg); color: var(--success); font-size: .9rem; font-weight: 700; }
    .save-status.error { background: #fde8e7; color: var(--error); }
    @media (max-width: 600px) {
      body { padding: 16px 8px; }
      .top-menu select { flex: 1 1 auto; }
      .slide-navigation { flex-wrap: wrap; }
      .nav-btn { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <nav class="top-menu" aria-label="Navigazione Unità 2">
      <select id="exercise-menu" aria-label="Vai a un esercizio">
        <option value="002_lettura.html">Lettura</option>
        <option value="002_es_a.html">Esercizio A</option>
        <option value="002_es_b.html" selected>Esercizio B</option>
        <option value="002_es_c.html">Esercizio C</option>
        <option value="002_es_d.html">Esercizio D</option>
        <option value="002_es_e.html">Esercizio E</option>
        <option value="002_es_f.html">Esercizio F</option>
        <option value="002_es_g.html">Esercizio G</option>
        <option value="002_es_h.html">Esercizio H</option>
        <option value="002_es_i.html">Esercizio I</option>
        <option value="002_es_j.html">Esercizio J</option>
        <option value="002_es_k.html">Esercizio K</option>
        <option value="002_es_l.html">Esercizio L</option>
        <option value="002_es_m.html">Esercizio M</option>
        <option value="002_numeri.html">I numeri</option>
        <option value="002_verbo_essere.html">Il verbo essere</option>
      </select>
    </nav>

    <header class="hero">
      <span class="eyebrow">Unità 2 · Lettura e comprensione</span>
      <h1>Un bravo ragazzo</h1>
      <p class="hero-subtitle">Rispondi alle domande con frasi complete.</p>
      <p id="user-badge" class="hero-subtitle" aria-live="polite"></p>
    </header>

    <section id="teacher-controls" class="teacher-controls" hidden aria-label="Assegnazione del turno">
      <label for="writer-select">✍️ Turno per scrivere la risposta della scheda</label>
      <select id="writer-select" class="assignment-select"><option value="">— Nessuno assegnato —</option></select>
    </section>

    <section class="card" aria-label="Domande dell’esercizio">
      <nav id="exercise-progress" class="overall-progress" aria-label="Vai direttamente alla scheda"></nav>
      <div id="questions-container"></div>
      <nav class="slide-navigation" aria-label="Navigazione delle schede">
        <button id="previous-question" class="nav-btn" type="button">← Precedente</button>
        <span id="question-progress" class="slide-progress" aria-live="polite"></span>
        <button id="next-question" class="nav-btn" type="button">Successiva →</button>
      </nav>
      <p id="save-status" class="save-status" role="status" aria-live="polite" hidden></p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-group-scope.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    const questions = [
      { key: "q1", text: "Dov’è Marco?", placeholder: "Marco è in..." },
      { key: "q2", text: "Dov’è la madre di Marco?", placeholder: "La madre di Marco è in..." },
      { key: "q3", text: "Quanti anni ha Marco?", placeholder: "Marco ha ... anni." },
      { key: "q4", text: "Che cosa fa la madre quando Marco ha sete?", placeholder: "Quando Marco ha sete, la madre porta..." },
      { key: "q5", text: "Che cosa fa la madre quando Marco ha fame?", placeholder: "Quando Marco ha fame, la madre porta..." },
      { key: "q6", text: "Che cosa fa la madre quando Marco ha freddo?", placeholder: "Quando Marco ha freddo, la madre porta..." },
      { key: "q7", text: "Che cosa fa la madre quando Marco ha sonno?", placeholder: "Quando Marco ha sonno, la madre..." },
      { key: "q8", text: "Che cosa dice la madre quando Marco ha paura?", placeholder: "La madre dice: «Perché hai paura? ...»" },
      { key: "q9", text: "Che cosa beve Marco?", placeholder: "Marco beve..." },
      { key: "q10", text: "Che cosa mangia Marco?", placeholder: "Marco mangia..." }
    ];

    const session = window.parloUnit2Session || {};
    const group = session.group && session.group !== "sconosciuto" ? session.group : "";
    const isTeacher = Boolean(session.isTeacher);
    const userName = String(session.name || "").trim();
    const safe = value => String(value || "").replace(/[.#$\/\[\]]/g, "_");
    const safeGroup = safe(group || "sconosciuto");
    const myIdentity = userName ? { role: isTeacher ? "teacher" : "student", name: userName } : null;
    const presenceId = `presence_${Math.random().toString(36).slice(2, 10)}`;

    const teacherControls = document.getElementById("teacher-controls");
    const questionsContainer = document.getElementById("questions-container");
    const progressNav = document.getElementById("exercise-progress");
    const previousButton = document.getElementById("previous-question");
    const nextButton = document.getElementById("next-question");
    const progressText = document.getElementById("question-progress");
    const saveStatus = document.getElementById("save-status");
    const writerSelect = document.getElementById("writer-select");
    teacherControls.hidden = !isTeacher;

    function addLoginParams(url) {
      if (group) url.searchParams.set("gruppo", group);
      if (!isTeacher && userName) url.searchParams.set("nome", userName);
      return url;
    }
    document.getElementById("exercise-menu").addEventListener("change", event => {
      if (!event.target.value) return;
      location.href = addLoginParams(new URL(event.target.value, location.href)).href;
    });

    let answersRef = null;
    let activeQuestion = 0;
    let roster = [];
    let presenceData = {};
    let assignments = {};
    let sharedAnswers = {};
    let contributions = {};
    let legacyStudents = {};
    let legacyTokenAnswers = {};
    const questionCards = [];
    const saveTimers = new Map();

    function isOnline(name) {
      return Object.values(presenceData[safe(name)] || {}).some(entry => entry?.role === "student" && entry.name === name);
    }
    function assignedTo(index) {
      const target = assignments[index]?.writer;
      return Boolean(myIdentity && target && target.role === myIdentity.role && target.name === myIdentity.name);
    }
    function identityValue(identity) {
      return identity?.role && identity?.name ? JSON.stringify({ role: identity.role, name: identity.name }) : "";
    }
    function parseIdentity(value) {
      if (!value) return null;
      try {
        const identity = JSON.parse(value);
        return identity && ["student", "teacher"].includes(identity.role) && identity.name ? identity : null;
      } catch (_) { return null; }
    }
    function orderedRoster() {
      const unique = new Map();
      roster.forEach(student => {
        const name = String(student?.nome || "").trim();
        if (name) unique.set(name, { role: "student", name, online: isOnline(name) });
      });
      Object.values(presenceData).forEach(connections => Object.values(connections || {}).forEach(entry => {
        if (entry?.role === "student" && entry.name) unique.set(entry.name, { role: "student", name: entry.name, online: true });
      }));
      return [...unique.values()].sort((a, b) => Number(b.online) - Number(a.online) || a.name.localeCompare(b.name, "it"));
    }
    function refreshWriterMenu() {
      const selected = identityValue(assignments[activeQuestion]?.writer);
      writerSelect.replaceChildren(new Option("— Nessuno assegnato —", ""));
      const people = orderedRoster();
      const online = people.filter(person => person.online);
      const offline = people.filter(person => !person.online);
      if (online.length) {
        const groupOption = document.createElement("optgroup");
        groupOption.label = "🟢 Studenti online";
        online.forEach(person => groupOption.appendChild(new Option(`🟢 ${person.name}`, identityValue(person))));
        writerSelect.appendChild(groupOption);
      }
      if (offline.length) {
        const groupOption = document.createElement("optgroup");
        groupOption.label = "Studenti offline";
        offline.forEach(person => groupOption.appendChild(new Option(person.name, identityValue(person))));
        writerSelect.appendChild(groupOption);
      }
      if (myIdentity?.role === "teacher") {
        const groupOption = document.createElement("optgroup");
        groupOption.label = "👩‍🏫 Insegnante";
        groupOption.appendChild(new Option(myIdentity.name, identityValue(myIdentity)));
        writerSelect.appendChild(groupOption);
      }
      writerSelect.value = selected;
    }
    function formatDate(timestamp) {
      if (!timestamp) return "Data non disponibile";
      return new Intl.DateTimeFormat("it-IT", { dateStyle: "short", timeStyle: "short" }).format(new Date(Number(timestamp)));
    }
    function setStatus(message, isError = false) {
      saveStatus.textContent = message;
      saveStatus.hidden = !message;
      saveStatus.classList.toggle("error", isError);
    }
    function createAccentToolbar(input) {
      const toolbar = document.createElement("div");
      toolbar.className = "accent-toolbar";
      toolbar.setAttribute("role", "group");
      toolbar.setAttribute("aria-label", "Inserisci un carattere accentato");
      ["'", "à", "è", "ì", "ò", "ù", "È"].forEach(character => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = character;
        button.setAttribute("aria-label", `Inserisci ${character === "'" ? "apostrofo" : character}`);
        button.addEventListener("mousedown", event => event.preventDefault());
        button.addEventListener("click", () => {
          if (input.disabled) return;
          const start = input.selectionStart ?? input.value.length;
          const end = input.selectionEnd ?? start;
          input.setRangeText(character, start, end, "end");
          input.focus();
          input.dispatchEvent(new Event("input", { bubbles: true }));
        });
        toolbar.appendChild(button);
      });
      return toolbar;
    }
    function saveSharedAnswer(index, value) {
      if (!answersRef || !assignedTo(index)) return Promise.resolve();
      return answersRef.child("sharedAnswers").child(String(index)).set(value);
    }
    function scheduleAnswerSave(index, value) {
      clearTimeout(saveTimers.get(index));
      saveTimers.set(index, setTimeout(() => {
        saveTimers.delete(index);
        saveSharedAnswer(index, value).catch(() => setStatus("Impossibile sincronizzare la risposta. Controlla la connessione.", true));
      }, 250));
    }
    function flushAnswerSave(index, value) {
      if (!saveTimers.has(index)) return Promise.resolve();
      clearTimeout(saveTimers.get(index));
      saveTimers.delete(index);
      return saveSharedAnswer(index, value);
    }
    function getLegacyContributions(index) {
      const question = questions[index];
      return Object.entries(legacyStudents).flatMap(([id, student]) => {
        const text = String(student?.answers?.[question.key] || "").trim();
        if (!text) return [];
        return [{ id: `legacy-${id}`, author: student.name || "Studente", text,
          timestamp: Number(student.timestamp) || 0, legacy: true }];
      });
    }
    function renderContributions(index) {
      const list = questionCards[index].contributionList;
      list.replaceChildren();
      const current = Object.entries(contributions[index] || {}).map(([id, entry]) => ({
        id, author: entry?.author || "Partecipante", text: String(entry?.text || ""),
        timestamp: Number(entry?.timestamp) || 0, legacy: false
      })).filter(entry => entry.text.trim());
      const entries = [...getLegacyContributions(index), ...current]
        .sort((a, b) => a.timestamp - b.timestamp || a.id.localeCompare(b.id));
      if (!entries.length) {
        const empty = document.createElement("p");
        empty.className = "empty-message";
        empty.textContent = "Nessun contributo inviato per questa scheda.";
        list.appendChild(empty);
        return;
      }
      entries.forEach(entry => {
        const article = document.createElement("article");
        article.className = "contribution";
        const meta = document.createElement("span");
        meta.className = "contribution-meta";
        meta.textContent = `${entry.author} · ${formatDate(entry.timestamp)}${entry.legacy ? " · invio precedente" : ""}`;
        const text = document.createElement("div");
        text.className = "contribution-text";
        text.textContent = entry.text;
        article.append(meta, text);
        list.appendChild(article);
      });
    }
    function renderCardState(index) {
      const item = questionCards[index];
      const canWrite = assignedTo(index) && Boolean(answersRef);
      const serverDraft = sharedAnswers[index];
      const draft = typeof serverDraft === "string" ? serverDraft : String(legacyTokenAnswers[questions[index].key] || "");
      if (document.activeElement !== item.input && item.input.value !== draft) item.input.value = draft;
      item.input.disabled = !canWrite;
      item.toolbar.querySelectorAll("button").forEach(button => { button.disabled = !canWrite; });
      item.submit.disabled = !canWrite || !item.input.value.trim();
      item.submit.title = canWrite ? "Invia un nuovo contributo" : "Il turno di scrittura non è assegnato a te";
      const writer = assignments[index]?.writer;
      item.writerStatus.textContent = writer
        ? (assignedTo(index) ? "✍️ Il turno è tuo: puoi modificare e inviare la risposta." : `Turno assegnato a ${writer.name}.`)
        : "Turno non assegnato: chiedi all’insegnante di scegliere chi scrive.";
      renderContributions(index);
      item.card.classList.toggle("active", index === activeQuestion);
    }
    function updateUI() {
      questionCards.forEach((_, index) => renderCardState(index));
      refreshWriterMenu();
      progressNav.querySelectorAll("button").forEach((button, index) => button.setAttribute("aria-current", index === activeQuestion ? "step" : "false"));
      progressText.textContent = `Scheda ${activeQuestion + 1} di ${questions.length}`;
      previousButton.disabled = activeQuestion === 0;
      nextButton.disabled = activeQuestion === questions.length - 1;
    }
    function showQuestion(index, scroll = true) {
      activeQuestion = Math.max(0, Math.min(questions.length - 1, index));
      if (scroll) questionCards[activeQuestion].card.scrollIntoView({ behavior: "smooth", block: "nearest" });
      updateUI();
    }

    questions.forEach((question, index) => {
      const card = document.createElement("article");
      card.className = "question-slide";
      card.setAttribute("aria-label", `Scheda ${index + 1}`);
      const heading = document.createElement("div");
      heading.className = "question-heading";
      const number = document.createElement("span");
      number.className = "question-number";
      number.textContent = String(index + 1);
      const prompt = document.createElement("span");
      prompt.textContent = question.text;
      heading.append(number, prompt);

      const writerStatus = document.createElement("p");
      writerStatus.className = "writer-status";
      writerStatus.setAttribute("aria-live", "polite");
      const label = document.createElement("label");
      label.className = "answer-label";
      label.htmlFor = `answer-input-${index}`;
      label.textContent = "Risposta condivisa · completa la frase:";
      const input = document.createElement("textarea");
      input.id = label.htmlFor;
      input.className = "answer-input";
      input.rows = 4;
      input.placeholder = question.placeholder;
      input.setAttribute("aria-label", `Risposta alla domanda ${index + 1}: ${question.text}`);
      input.value = typeof sharedAnswers[index] === "string" ? sharedAnswers[index] : String(legacyTokenAnswers[question.key] || "");
      input.addEventListener("input", () => {
        if (!assignedTo(index)) return;
        sharedAnswers[index] = input.value;
        item.submit.disabled = !input.value.trim() || !answersRef;
        scheduleAnswerSave(index, input.value);
      });
      input.addEventListener("blur", () => {
        if (saveTimers.has(index)) flushAnswerSave(index, input.value)
          .catch(() => setStatus("Impossibile sincronizzare la risposta. Controlla la connessione.", true));
      });
      const toolbar = createAccentToolbar(input);
      const submit = document.createElement("button");
      submit.type = "button";
      submit.className = "submit-answer";
      submit.textContent = "📤 Invia il contributo";
      submit.disabled = true;
      submit.addEventListener("click", async () => {
        const text = input.value.trim();
        if (!answersRef || !assignedTo(index) || !text) return;
        submit.disabled = true;
        try {
          await flushAnswerSave(index, input.value);
          await answersRef.child("contributions").child(String(index)).push().set({
            text, author: userName, role: myIdentity.role, timestamp: firebase.database.ServerValue.TIMESTAMP
          });
          setStatus(`Contributo della scheda ${index + 1} aggiunto allo storico.`);
        } catch (_) {
          setStatus("Invio non riuscito. Controlla la connessione e riprova.", true);
        } finally {
          renderCardState(index);
        }
      });

      const contributionSection = document.createElement("section");
      contributionSection.className = "contributions";
      const contributionHeading = document.createElement("h2");
      contributionHeading.textContent = "Contributi della scheda";
      const contributionList = document.createElement("div");
      contributionList.setAttribute("aria-live", "polite");
      contributionSection.append(contributionHeading, contributionList);

      const studentSuggestion = document.createElement("details");
      studentSuggestion.className = "suggestion";
      const studentSummary = document.createElement("summary");
      studentSummary.textContent = "Suggerimenti";
      const studentHint = document.createElement("p");
      studentHint.lang = "ru";
      studentHint.textContent = "Вспомни рассказ: кто или что упоминается в вопросе? Какой фрагмент текста помогает тебе ответить? Составь полное предложение и проверь, соответствует ли ответ вопросу.";
      studentSuggestion.append(studentSummary, studentHint);

      const teacherSuggestion = document.createElement("details");
      teacherSuggestion.className = "suggestion teacher-suggestion";
      teacherSuggestion.hidden = !isTeacher;
      const teacherSummary = document.createElement("summary");
      teacherSummary.textContent = "Spunti per l’insegnante · think aloud e LAD";
      const teacherHint = document.createElement("p");
      teacherHint.textContent = "Invitate lo studente a rileggere la domanda e a richiamare il passaggio pertinente: «Quali parole del testo ti aiutano?», «Che cosa ti fa scegliere questa formulazione?», «La frase completa risponde proprio alla domanda?». Lasciate che osservi e riformuli prima di intervenire.";
      teacherSuggestion.append(teacherSummary, teacherHint);

      const item = { card, input, toolbar, submit, writerStatus, contributionList };
      input.addEventListener("input", () => {
        item.submit.disabled = !assignedTo(index) || !input.value.trim() || !answersRef;
      });
      card.append(heading, writerStatus, label, toolbar, input, submit, contributionSection, studentSuggestion, teacherSuggestion);
      questionsContainer.appendChild(card);
      questionCards.push(item);

      const step = document.createElement("button");
      step.type = "button";
      step.className = "progress-step";
      step.textContent = String(index + 1);
      step.setAttribute("aria-label", `Vai alla scheda ${index + 1}: ${question.text}`);
      step.addEventListener("click", () => showQuestion(index));
      progressNav.appendChild(step);
    });

    function saveAssignment(value) {
      if (!isTeacher || !answersRef) return;
      const identity = parseIdentity(value);
      answersRef.child("assignments").child(String(activeQuestion)).child("writer").set(identity)
        .catch(() => setStatus("Impossibile salvare il turno assegnato.", true));
    }
    writerSelect.addEventListener("change", () => saveAssignment(writerSelect.value));
    previousButton.addEventListener("click", () => showQuestion(activeQuestion - 1));
    nextButton.addEventListener("click", () => showQuestion(activeQuestion + 1));
    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest("input,textarea,select,button,a,[tabindex]")) return;
      if (event.key === "ArrowLeft") showQuestion(activeQuestion - 1);
      if (event.key === "ArrowRight") showQuestion(activeQuestion + 1);
    });
    window.addEventListener("resize", () => updateUI());

    function registerPresence(database) {
      if (!userName || isTeacher || !answersRef) return;
      const presenceRef = answersRef.child("presence").child(safe(userName)).child(presenceId);
      database.ref(".info/connected").on("value", snapshot => {
        if (snapshot.val() !== true) return;
        presenceRef.onDisconnect().remove().then(() => presenceRef.set({ name: userName, role: "student", connectedAt: Date.now() }))
          .catch(error => console.error("Errore stato presenza:", error));
      });
    }
    function loadRoster(database) {
      if (!group) return;
      database.ref(`configurazioneScuola/gruppi/${safeGroup}`).on("value", snapshot => {
        const data = snapshot.val() || {};
        const active = Object.values(data.studenti || {}).filter(student => student?.nome);
        const inactive = Object.values(data.studentiInattivi || {}).filter(student => student?.nome && Number(student.unitNumber ?? data.unitNumber ?? 0) >= 2);
        roster = [...new Map([...active, ...inactive].map(student => [student.nome, student])).values()];
        updateUI();
      });
    }

    if (window.firebase) {
      try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        if (group) {
          const database = firebase.database();
          // Keep the existing group-scoped exercise path; older submissions remain readable below.
          answersRef = database.ref(`esercizi/gruppi/${safeGroup}/unita2-risposte-aperte-b`);
          registerPresence(database);
          loadRoster(database);
          answersRef.on("value", snapshot => {
            const data = snapshot.val() || {};
            assignments = data.assignments || {};
            sharedAnswers = data.sharedAnswers || {};
            contributions = data.contributions || {};
            legacyStudents = data.allStudentsData?.students || {};
            legacyTokenAnswers = data.tokenData?.responses || {};
            presenceData = data.presence || {};
            updateUI();
          }, error => {
            console.error("Errore lettura Firebase:", error);
            setStatus("Impossibile leggere i dati condivisi del gruppo.", true);
          });
          if (!userName) setStatus("La sessione non contiene un nome: non puoi ricevere un turno di scrittura.", true);
        } else setStatus("Gruppo non trovato: accedi dalla pagina iniziale per usare l’attività condivisa.", true);
      } catch (error) {
        console.error("Errore Firebase:", error);
        setStatus("Servizio dati condivisi non disponibile.", true);
      }
    } else setStatus("Servizio dati condivisi non disponibile.", true);

    updateUI();
    let backgroundUpdatePending = false;
    function updateBackgroundParallax() {
      if (backgroundUpdatePending) return;
      backgroundUpdatePending = true;
      requestAnimationFrame(() => {
        const offset = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : Math.min(window.scrollY * .12, 180);
        document.body.style.setProperty("--background-offset", `${offset}px`);
        backgroundUpdatePending = false;
      });
    }
    window.addEventListener("scroll", updateBackgroundParallax, { passive: true });
    updateBackgroundParallax();
  </script>
</body>
</html>
