<!DOCTYPE html>
<html lang="it">
<head>

  <title>Unità 2 — Presente Indicativo (Esercizio K)</title>
  <style>
    :root { color-scheme:light; font-family:'Segoe UI',Inter,system-ui,-apple-system,sans-serif; --primary:#477755; --primary-light:#edf4ed; --primary-dark:#2f5739; --accent:#bd694d; --bg-main:#f5f1e7; --card-bg:#fffefa; --text:#292d28; --muted:#6b7069; --border:#e7e5dc; --success:#278253; --success-bg:#e1f1e5; --error:#c43d3d; --error-bg:#fde8e7; }
    * { box-sizing:border-box; }
    [hidden] { display:none!important; }
    :focus-visible { outline:3px solid rgba(189,105,77,.55); outline-offset:3px; }
    body { min-height:100vh; margin:0; padding:28px 14px; color:var(--text); background:linear-gradient(rgba(250,248,241,.84),rgba(250,248,241,.84)),url("img/sfondo.jpg") center calc(50% - var(--background-offset,0px))/cover fixed,radial-gradient(ellipse at 50% -12%,rgba(111,151,116,.18),transparent 42%),var(--bg-main); }
    .container { width:min(100%,880px); margin:0 auto; }
    .top-menu { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:0 0 14px; }
    .top-menu select,.top-menu a { min-height:42px; padding:8px 13px; border:1px solid #d8e5d8; border-radius:10px; background:rgba(255,254,250,.94); color:var(--primary-dark); font:inherit; font-weight:700; text-decoration:none; }
    .top-menu select { flex:1 1 240px; min-width:0; }
    .top-menu a { display:inline-flex; align-items:center; }
    .top-menu a:hover,.top-menu select:hover { background:var(--primary-light); border-color:var(--primary); }
    .hero { margin:8px 0 18px; padding:26px 18px; text-align:center; border:1px solid rgba(71,119,85,.13); border-radius:24px; background:linear-gradient(135deg,rgba(255,254,250,.96),rgba(242,247,239,.94)); box-shadow:0 12px 32px rgba(43,69,46,.07); }
    .eyebrow { display:inline-block; margin-bottom:10px; padding:8px 15px; border-radius:20px; background:#eaf1e8; color:var(--primary-dark); font-size:.78rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
    h1 { margin:4px 0; color:var(--primary-dark); font-size:clamp(1.9rem,5vw,2.65rem); letter-spacing:-.04em; line-height:1.12; }
    .hero-subtitle { margin:8px 0 0; color:var(--muted); font-size:.98rem; }
    .instruction-box,.teacher-controls { margin-bottom:16px; padding:15px 19px; border:1px solid #d8e5d8; border-radius:16px; background:#fff; box-shadow:0 6px 18px rgba(43,69,46,.04); line-height:1.55; }
    .instruction-box { border-left:5px solid var(--accent); }
    .example-card { margin-top:10px; padding:12px 14px; border:1px solid #d0e2d2; border-radius:10px; background:var(--primary-light); color:var(--primary-dark); }
    .teacher-controls { display:flex; align-items:center; gap:10px; background:rgba(255,254,250,.96); color:var(--primary-dark); font-size:.9rem; font-weight:800; }
    .teacher-controls label { display:grid; flex:1; gap:5px; }
    .teacher-controls select { min-height:40px; padding:7px 10px; border:1px solid #d4e1d5; border-radius:9px; background:#fff; color:var(--primary-dark); font:inherit; }
    .card { padding:clamp(16px,4vw,30px); border:1px solid var(--border); border-radius:24px; background:var(--card-bg); box-shadow:0 18px 48px rgba(43,69,46,.1); }
    .assignment-status,.save-status { margin:0 0 14px; padding:11px 14px; border-radius:11px; background:var(--primary-light); color:var(--primary-dark); font-size:.9rem; font-weight:700; line-height:1.5; }
    .save-status { border:1px solid #b7dfc1; background:var(--success-bg); color:#17623c; }
    .save-status.error { border-color:#f2b8b5; background:var(--error-bg); color:#991b1b; }
    .slide-dots { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin:0 0 16px; }
    .slide-dot { min-width:36px; min-height:36px; padding:5px 8px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--primary-dark); font:inherit; font-size:.84rem; font-weight:800; cursor:pointer; }
    .slide-dot:hover { border-color:var(--primary); background:var(--primary-light); }
    .slide-dot[aria-current="step"] { border-color:var(--primary); background:var(--primary); color:#fff; }
    .slide-dot.correct { border-color:#9ac9a5; background:var(--success-bg); color:var(--success); }
    .slide-dot.incorrect { border-color:#e8a7a2; background:var(--error-bg); color:#a52d2d; }
    .slide-item { padding:clamp(16px,3vw,24px); border:1px solid var(--border); border-radius:18px; background:#fff; box-shadow:0 6px 20px rgba(43,69,46,.04); }
    .slide-item[hidden] { display:none; }
    .prompt-box { display:flex; align-items:flex-start; gap:10px; margin:0 0 16px; padding:14px 16px; border:1px solid #d0e2d2; border-radius:14px; background:var(--primary-light); color:var(--primary-dark); font-size:1.1rem; font-weight:700; line-height:1.9; }
    .prompt-number { flex:none; }
    .has-tooltip { position:relative; border-bottom:2px dashed var(--accent); color:var(--primary-dark); font-weight:800; cursor:help; }
    .has-tooltip::after { position:absolute; z-index:5; bottom:125%; left:50%; padding:6px 10px; border-radius:8px; background:#2d3748; color:#fff; content:attr(data-tooltip); font-size:.8rem; font-weight:500; white-space:nowrap; opacity:0; visibility:hidden; transform:translateX(-50%); transition:opacity .2s,visibility .2s; pointer-events:none; }
    .has-tooltip:hover::after,.has-tooltip:focus::after { opacity:1; visibility:visible; }
    .inline-answer-wrap { display:inline-flex; position:relative; vertical-align:middle; align-items:center; margin:2px 3px; }
    .inline-answer-inner { display:inline-flex; flex-direction:column; align-items:center; }
    .answer-input { width:clamp(82px,13vw,130px); min-height:40px; padding:5px 8px; border:1.5px solid #d4e1d5; border-radius:8px; background:#fff; color:var(--text); font:700 1rem 'Segoe UI',Inter,system-ui,sans-serif; text-align:center; }
    .answer-input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(71,119,85,.15); }
    .answer-input:disabled { background:#f1f5f1; color:#4b554b; cursor:not-allowed; }
    .answer-input.correct { border-color:var(--success); background:var(--success-bg); color:#17623c; }
    .answer-input.incorrect { border-color:var(--error); background:var(--error-bg); color:#991b1b; }
    .character-toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:3px; margin:0 0 5px; }
    .character-toolbar button { min-width:27px; min-height:27px; padding:3px 5px; border:1px solid #d8e5d8; border-radius:7px; background:#fffefa; color:var(--primary-dark); font:inherit; font-size:.82rem; font-weight:700; cursor:pointer; }
    .character-toolbar button:hover:not(:disabled) { border-color:var(--primary); background:var(--primary-light); }
    .character-toolbar button:disabled { cursor:not-allowed; opacity:.45; }
    .answer-feedback { min-height:1.4em; margin:0 0 12px; color:var(--muted); font-size:.9rem; font-weight:800; }
    .answer-feedback.correct { color:var(--success); }
    .answer-feedback.incorrect { color:#b42323; }
    .slide-image { display:block; width:min(100%,420px); max-height:320px; object-fit:contain; margin:0 auto 14px; border:1px solid #d0e2d2; border-radius:14px; background:#fff; }
    .submit-contribution { min-height:42px; padding:9px 16px; border:0; border-radius:10px; background:var(--primary); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
    .submit-contribution:hover:not(:disabled) { background:var(--primary-dark); }
    .submit-contribution:disabled { cursor:not-allowed; opacity:.48; }
    .contributions { margin-top:18px; padding:14px; border:1px solid var(--border); border-radius:13px; background:#faf9f5; }
    .contributions h2 { margin:0 0 10px; color:var(--primary-dark); font-size:1rem; }
    .contribution-list { display:grid; gap:9px; }
    .contribution { padding:11px 12px; border:1px solid var(--border); border-radius:10px; background:#fff; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere; }
    .contribution.correct { border-color:#b7dfc1; background:var(--success-bg); }
    .contribution.incorrect { border-color:#f2b8b5; background:var(--error-bg); }
    .contribution-meta { display:block; margin-bottom:4px; color:var(--primary-dark); font-size:.82rem; font-weight:800; }
    .legacy-answer { margin:0 0 10px; padding:9px 11px; border:1px dashed var(--border); border-radius:9px; color:var(--muted); font-size:.86rem; white-space:pre-wrap; overflow-wrap:anywhere; }
    .empty-message { margin:0; color:var(--muted); font-size:.9rem; }
    .suggestion { margin-top:12px; padding:11px 13px; border-left:4px solid var(--accent); border-radius:10px; background:#fff8f2; line-height:1.5; }
    .suggestion summary { color:var(--primary-dark); font-weight:800; cursor:pointer; }
    .suggestion p { margin:8px 0 0; }
    .teacher-hint { margin-top:10px; padding:11px 13px; border-left:4px solid var(--primary); border-radius:10px; background:#f1f6f0; line-height:1.5; }
    .teacher-hint summary { color:var(--primary-dark); font-weight:800; cursor:pointer; }
    .teacher-hint p { margin:8px 0 0; }
    .slide-navigation { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:17px; padding-top:14px; border-top:1px solid var(--border); }
    .slide-navigation button { min-height:42px; padding:8px 15px; border:1px solid #d8e5d8; border-radius:10px; background:#fff; color:var(--primary-dark); font:inherit; font-weight:700; cursor:pointer; }
    .slide-navigation button:hover:not(:disabled) { border-color:var(--primary); background:var(--primary-light); }
    .slide-navigation button:disabled { cursor:not-allowed; opacity:.45; }
    .slide-counter { color:var(--primary-dark); font-size:.9rem; font-weight:800; text-align:center; }
    @media(max-width:600px) { body{padding:15px 8px}.hero{padding:21px 13px}.prompt-box{font-size:1rem;line-height:2}.slide-navigation{gap:6px}.slide-navigation button{padding:7px 10px;font-size:.86rem}.slide-counter{font-size:.82rem}.slide-dot{min-width:32px;min-height:32px;padding:4px 6px}.answer-input{width:82px}.teacher-controls{align-items:stretch} }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after{scroll-behavior:auto!important;transition-duration:.01ms!important} }
  </style>
</head>

  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    // Testi, immagini e soluzioni accettate dell'esercizio originale.
    const itemsData = [
      { id: "k1", num: "1.", promptHTML: 'Io (<span class="has-tooltip" data-tooltip="знать / быть знакомым">conoscere</span>) _____ bene la letteratura russa.', acceptedAnswers: ['conosco'], img: 'img/k_01.png' },
      { id: "k2", num: "2.", promptHTML: 'La mia famiglia (<span class="has-tooltip" data-tooltip="жить">vivere</span>) _____ in una piccola città.', acceptedAnswers: ['vive'], img: 'img/k_02.png' },
      { id: "k3", num: "3.", promptHTML: 'Il professore (<span class="has-tooltip" data-tooltip="говорить">parlare</span>) _____ molto bene l\'inglese.', acceptedAnswers: ['parla'], img: 'img/k_03.png' },
      { id: "k4", num: "4.", promptHTML: 'La nonna (<span class="has-tooltip" data-tooltip="говорить">parlare</span>) _____ al telefono con una sua amica.', acceptedAnswers: ['parla'], img: 'img/k_04.png' },
      { id: "k5", num: "5.", promptHTML: 'I bambini (<span class="has-tooltip" data-tooltip="играть">giocare</span>) _____ in giardino.', acceptedAnswers: ['giocano'], img: 'img/k_05.png' },
      { id: "k6", num: "6.", promptHTML: 'Voi (<span class="has-tooltip" data-tooltip="есть / кушать">mangiare</span>) _____ spesso la pizza?', acceptedAnswers: ['mangiate'], img: 'img/k_06.png' },
      { id: "k7", num: "7.", promptHTML: 'La mamma (<span class="has-tooltip" data-tooltip="готовить">cucinare</span>) _____ la cena.', acceptedAnswers: ['cucina'], img: 'img/k_07.png' },
      { id: "k8", num: "8.", promptHTML: 'Io non (<span class="has-tooltip" data-tooltip="помнить">ricordare</span>) _____ il tuo nome.', acceptedAnswers: ['ricordo'], img: 'img/k_08.png' },
      { id: "k9", num: "9.", promptHTML: 'Mio papà (<span class="has-tooltip" data-tooltip="работать">lavorare</span>) _____ in banca.', acceptedAnswers: ['lavora'], img: 'img/k_09.png' },
      { id: "k10", num: "10.", promptHTML: 'La domenica noi (<span class="has-tooltip" data-tooltip="спать">dormire</span>) _____ fino a mezzogiorno.', acceptedAnswers: ['dormiamo'], img: 'img/k_10.png' },
      { id: "k11", num: "11.", promptHTML: 'Tu (<span class="has-tooltip" data-tooltip="предпочитать">preferire</span>) _____ il caffè o il tè?', acceptedAnswers: ['preferisci'], img: 'img/k_11.png' },
      { id: "k12", num: "12.", promptHTML: 'Noi di solito (<span class="has-tooltip" data-tooltip="покупать">comprare</span>) _____ il latte al mercato.', acceptedAnswers: ['compriamo'], img: 'img/k_12.png' },
      { id: "k13", num: "13.", promptHTML: 'Tu (<span class="has-tooltip" data-tooltip="знать / быть знакомым">conoscere</span>) _____ mio fratello?', acceptedAnswers: ['conosci'], img: 'img/k_13.png' },
      { id: "k14", num: "14.", promptHTML: 'I tuoi amici (<span class="has-tooltip" data-tooltip="читать">leggere</span>) _____ un libro in russo.', acceptedAnswers: ['leggono'], img: 'img/k_14.png' },
      { id: "k15", num: "15.", promptHTML: 'Tu (<span class="has-tooltip" data-tooltip="учиться">studiare</span>) _____ molto all\'università?', acceptedAnswers: ['studi'], img: 'img/k_15.png' },
      { id: "k16", num: "16.", promptHTML: 'La maestra (<span class="has-tooltip" data-tooltip="преподавать / учить">insegnare</span>) _____ ai bambini a leggere e scrivere.', acceptedAnswers: ['insegna'], img: 'img/k_16.png' },
      { id: "k17", num: "17.", promptHTML: 'La classe (<span class="has-tooltip" data-tooltip="слушать">ascoltare</span>) _____ con attenzione il professore.', acceptedAnswers: ['ascolta'], img: 'img/k_17.png' },
      { id: "k18", num: "18.", promptHTML: 'I miei nonni (<span class="has-tooltip" data-tooltip="жить / проживать">abitare</span>) _____ in un appartamento in centro.', acceptedAnswers: ['abitano'], img: 'img/k_18.png' },
      { id: "k19", num: "19.", promptHTML: 'Noi (<span class="has-tooltip" data-tooltip="учить / изучать">studiare</span>) _____ l’italiano con un bravo insegnante.', acceptedAnswers: ['studiamo'], img: 'img/k_19.png' },
      { id: "k20", num: "20.", promptHTML: 'Dopo la lezione io (<span class="has-tooltip" data-tooltip="смотреть">guardare</span>) _____ la televisione.', acceptedAnswers: ['guardo'], img: 'img/k_20.png' }
    ];
    const studentHints = [
      "Кто говорит в этом предложении? Найди подлежащее и подумай, как оно связано с формой глагола.",
      "Какое слово является подлежащим: один человек или собирательное обозначение? Какую форму оно подсказывает?",
      "Кто выполняет действие и в каком лице нужно поставить глагол? Какие части окончания помогают проверить согласование?",
      "Какое существительное указывает на действующее лицо? Сравни его с местоимениями и вспомни, как меняется окончание глагола.",
      "Слово «bambini» обозначает одного человека или нескольких? Как это влияет на форму глагола?",
      "К кому обращаются словом «voi»? Какое окончание обычно помогает узнать эту форму?",
      "Кто готовит ужин? Замени подлежащее подходящим местоимением и проверь согласование глагола.",
      "Кто говорит о себе? Обрати внимание на местоимение перед пропуском и на отрицание: меняется ли из-за него форма глагола?",
      "Кто обозначен словами «mio papà»? Какую форму настоящего времени выбирают для этого лица?",
      "Какое местоимение соответствует «noi»? Какие особенности окончания инфинитива помогут выбрать форму?",
      "К кому обращён вопрос? Найди местоимение и подумай, какой вид окончания соответствует этому лицу.",
      "Какое выражение показывает привычное действие? Кто выполняет его и какие подсказки даёт местоимение «noi»?",
      "К кому обращён вопрос с «tu»? Сравни глагол в скобках и окончание, необходимое для этого лица.",
      "Слова «i tuoi amici» обозначают одного человека или группу? Как изменится форма глагола для такого подлежащего?",
      "К кому обращён вопрос? Подумай, как глагол на -are меняется в форме для «tu».",
      "Кто выполняет действие: один человек или группа? Найди подлежащее и соотнеси его с окончанием глагола.",
      "Слово «la classe» грамматически единственного или множественного числа? Какую форму подсказывает артикль?",
      "Какое местоимение можно поставить вместо «i miei nonni»? Какие признаки множественного числа заметны в глаголе?",
      "Какое местоимение соответствует «noi»? Сравни его с формой глагола, которую уже встречал в похожих фразах.",
      "Кто говорит о себе после занятия? Какое местоимение подразумевается и какое окончание ему соответствует?"
    ];
    const teacherHints = [
      "Попросите ученика сначала назвать подлежащее, затем лицо и число. Какие части формы глагола дают ему основание для выбора?",
      "Предложите проверить, что «famiglia» — грамматическое подлежащее в единственном числе, несмотря на значение группы. Как ученик обосновывает согласование?",
      "Попросите определить лицо по словосочетанию «il professore», затем объяснить, какая часть инфинитива меняется в presente.",

          const data = snapshot.val() || {};
          const tokenData = data.tokenData || {};
          const storedShared = tokenData.sharedAnswers || {};
          const storedLegacy = tokenData.answers || {};
          sharedAnswers = emptyAnswers();
          legacyTokenAnswers = {};
          itemsData.forEach(item => {
            const saved = storedShared[item.id];
            if (Array.isArray(saved)) sharedAnswers[item.id] = [String(saved[0] || "")];
            else if (saved && typeof saved === "object") sharedAnswers[item.id] = [String(saved[0] || "")];
            const legacy = storedLegacy[item.id];
            if (legacy !== undefined && legacy !== null && legacy !== "") {
              legacyTokenAnswers[item.id] = typeof legacy === "object" ? legacy.answer || "" : legacy;
              if (!sharedAnswers[item.id][0]) sharedAnswers[item.id] = [String(legacyTokenAnswers[item.id])];
            }
          });
          assignments = data.controlAssignments?.writers || {};
          contributions = tokenData.contributions || {};
          legacyStudentAnswers = data.allStudentsData?.students || {};
          presenceData = data.presence || tokenData.presence || {};
          refreshCards();
          updateAssignmentStatus();
        }, error => {
          console.error("Errore lettura Firebase:", error);
          assignmentStatus.textContent = "Impossibile leggere i dati condivisi del gruppo.";
        });
      } catch (error) {
        console.error("Errore Firebase:", error);
        assignmentStatus.textContent = "Impossibile collegarsi al database.";
      }
    }

    let backgroundFramePending = false;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    function updateBackgroundParallax() {
      if (backgroundFramePending) return;
      backgroundFramePending = true;
      requestAnimationFrame(() => {
        const offset = reducedMotion.matches ? 0 : Math.min(window.scrollY * .06, 100);
        document.body.style.setProperty("--background-offset", `${offset}px`);
        backgroundFramePending = false;
      });
    }
    window.addEventListener("scroll", updateBackgroundParallax, { passive:true });
    updateBackgroundParallax();
  </script>
</body>
</html>
