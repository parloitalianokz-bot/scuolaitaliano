<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Completa le frasi al presente indicativo — Unità 2, esercizio K." />
  <title>Unità 2 — Presente indicativo · Esercizio K</title>
  <link rel="stylesheet" href="../shared/theme.css?v=2" />
  <link rel="stylesheet" href="../shared/inbox-exercise.css?v=1" />
  <link rel="stylesheet" href="../shared/inline-fill-exercise.css?v=1" />
  <link rel="stylesheet" href="fondo.css?v=1" />
  <style>
    .mode-note { margin:0 0 12px; padding:11px 14px; border:1px solid #d8e5d8; border-radius:11px; background:var(--primary-light); color:var(--primary-dark); line-height:1.5; }
    .example-card { margin-top:10px; padding:12px 14px; border:1px solid #d0e2d2; border-radius:10px; background:var(--primary-light); color:var(--primary-dark); line-height:1.6; }
    .has-tooltip { position:relative; border-bottom:2px dashed var(--accent); color:var(--primary-dark); font-weight:800; cursor:help; }
    .has-tooltip:hover::after,.has-tooltip:focus::after { position:absolute; z-index:5; bottom:125%; left:50%; padding:6px 10px; border-radius:8px; background:#2d3748; color:#fff; content:attr(data-tooltip); font:500 .8rem 'Segoe UI',Inter,system-ui,sans-serif; white-space:nowrap; transform:translateX(-50%); }
    .sentence-illustration { display:block; width:min(100%,360px); max-height:260px; object-fit:contain; margin:14px auto 4px; border:1px solid #d0e2d2; border-radius:12px; background:#fff; }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; transition-duration:.01ms!important; animation:none!important; } }
  </style>
</head>
<body data-page-key="002_es_k">
  <main class="container">
    <nav class="top-exercises" aria-label="Menu dell’unità 2">
      <a id="home-link" class="home-link" href="../index.html" aria-label="Torna alla pagina iniziale" title="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 10.8 12 3l9 7.8v9.7a.5.5 0 0 1-.5.5H15v-6H9v6H3.5a.5.5 0 0 1-.5-.5z"/></svg>
      </a>
      <span id="user-badge" aria-live="polite"></span>
      <label class="visually-hidden" for="exercise-menu">Vai a una pagina dell’unità 2</label>
      <select id="exercise-menu" aria-label="Vai a una pagina dell’unità 2">
        <option value="002_lettura.html">Lettura</option>
        <option value="002_es_a.html">Esercizio A</option><option value="002_es_b.html">Esercizio B</option>
        <option value="002_es_c.html">Esercizio C</option><option value="002_es_d.html">Esercizio D</option>
        <option value="002_es_e.html">Esercizio E</option><option value="002_es_f.html">Esercizio F</option>
        <option value="002_es_g.html">Esercizio G</option><option value="002_es_h.html">Esercizio H</option>
        <option value="002_es_i.html">Esercizio I</option><option value="002_es_j.html">Esercizio J</option>
        <option value="002_es_k.html" selected>Esercizio K</option><option value="002_es_l.html">Esercizio L</option>
        <option value="002_es_m.html">Esercizio M</option>
      </select>
      <label class="visually-hidden" for="grammar-menu">Seleziona una scheda grammaticale</label>
      <select id="grammar-menu" aria-label="Schede grammaticali">
        <option value="">Grammatica</option>
        <option value="002_numeri.html">I numeri</option>
        <option value="002_verbo_avere.html">Il verbo avere</option>
      </select>
    </nav>

    <header class="hero">
      <span class="eyebrow">Unità 2 · Grammatica</span>
      <h1>Presente indicativo</h1>
      <p class="hero-subtitle">Раскройте скобки и поставьте глаголы в Presente.</p>
    </header>

    <section class="instruction-box" lang="ru">
      <div class="instruction-title">💡 Задание · Esercizio K</div>
      <div class="instruction-text">
        👉 <strong>Раскройте скобки и вставьте правильную форму глагола в Presente.</strong>
        <div class="example-card"><em>Пример:</em> <span lang="it">Io (<span class="has-tooltip" title="знать / быть знакомым" data-tooltip="знать / быть знакомым">conoscere</span>) _____ bene la letteratura russa.</span> → <span lang="it"><strong>conosco</strong></span></div>
      </div>
    </section>
    <p id="mode-note" class="mode-note" role="status" aria-live="polite"></p>

    <section class="card" aria-label="Frasi da completare al presente indicativo">
      <div id="connection-banner" class="connection-banner" role="alert" aria-live="assertive" hidden></div>
      <p class="progress-label">Avanzamento · Seleziona una frase:</p>
      <nav id="exercise-progress" class="overall-progress" aria-label="Avanzamento delle frasi"></nav>
      <div id="questions-container"></div>
      <nav class="slide-navigation" aria-label="Navigazione delle frasi">
        <button id="previous-question" type="button">← Precedente</button>
        <span id="question-progress" class="slide-progress" aria-live="polite"></span>
        <button id="next-question" type="button">Successiva →</button>
      </nav>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../shared/group-scope.js?v=6"></script>
  <script src="../shared/exercise-core.js?v=8"></script>
  <script src="../shared/exercise-modes.js?v=4"></script>
  <script src="../shared/inline-fill-exercise.js?v=1"></script>
  <script>
    const session = window.ParloSession || {};
    const activityMode = ["online", "distance", "individual"].includes(session.activityMode)
      ? session.activityMode
      : "online";
    const teacherView = Boolean(session.isTeacher);
    const modeDescriptions = {
      online: teacherView
        ? "💬 Modalità online: assegna a turno le frasi; risposte e contributi sono condivisi con il gruppo."
        : "💬 Modalità online: completa le frasi durante il tuo turno; risposte e contributi sono condivisi con il gruppo.",
      distance: teacherView
        ? "🎙️ Modalità a distanza: gli studenti completano le frasi individualmente e le risposte sono disponibili per la revisione."
        : "🎙️ Modalità a distanza: completa le frasi individualmente; le risposte vengono salvate per la revisione dell’insegnante.",
      individual: teacherView
        ? "🏋️ Modalità allenamento individuale: lo studente si esercita nel proprio spazio, senza condividere le risposte con la classe."
        : "🏋️ Modalità allenamento: esercitati autonomamente; le risposte restano nel tuo spazio personale."
    };
    document.getElementById("mode-note").textContent = modeDescriptions[activityMode];

    const items = [
      { id:"k1", text:'Io (<span class="has-tooltip" tabindex="0" title="знать / быть знакомым" data-tooltip="знать / быть знакомым">conoscere</span>) {{0}} bene la letteratura russa.', answer:"conosco", hint:"Кто говорит в этом предложении? Найди подлежащее и подумай, как оно связано с формой глагола.", img:"img/k_01.png" },
      { id:"k2", text:'La mia famiglia (<span class="has-tooltip" tabindex="0" title="жить" data-tooltip="жить">vivere</span>) {{0}} in una piccola città.', answer:"vive", hint:"Какое слово является подлежащим: один человек или собирательное обозначение? Какую форму оно подсказывает?", img:"img/k_02.png" },
      { id:"k3", text:'Il professore (<span class="has-tooltip" tabindex="0" title="говорить" data-tooltip="говорить">parlare</span>) {{0}} molto bene l’inglese.', answer:"parla", hint:"Кто выполняет действие и в каком лице нужно поставить глагол? Какие части окончания помогают проверить согласование?", img:"img/k_03.png" },
      { id:"k4", text:'La nonna (<span class="has-tooltip" tabindex="0" title="говорить" data-tooltip="говорить">parlare</span>) {{0}} al telefono con una sua amica.', answer:"parla", hint:"Какое существительное указывает на действующее лицо? Сравни его с местоимениями и вспомни, как меняется окончание глагола.", img:"img/k_04.png" },
      { id:"k5", text:'I bambini (<span class="has-tooltip" tabindex="0" title="играть" data-tooltip="играть">giocare</span>) {{0}} in giardino.', answer:"giocano", hint:"Слово «bambini» обозначает одного человека или нескольких? Как это влияет на форму глагола?", img:"img/k_05.png" },
      { id:"k6", text:'Voi (<span class="has-tooltip" tabindex="0" title="есть / кушать" data-tooltip="есть / кушать">mangiare</span>) {{0}} spesso la pizza?', answer:"mangiate", hint:"К кому обращаются словом «voi»? Какое окончание обычно помогает узнать эту форму?", img:"img/k_06.png" },
      { id:"k7", text:'La mamma (<span class="has-tooltip" tabindex="0" title="готовить" data-tooltip="готовить">cucinare</span>) {{0}} la cena.', answer:"cucina", hint:"Кто готовит ужин? Замени подлежащее подходящим местоимением и проверь согласование глагола.", img:"img/k_07.png" },
      { id:"k8", text:'Io non (<span class="has-tooltip" tabindex="0" title="помнить" data-tooltip="помнить">ricordare</span>) {{0}} il tuo nome.', answer:"ricordo", hint:"Кто говорит о себе? Обрати внимание на местоимение перед пропуском и на отрицание: меняется ли из-за него форма глагола?", img:"img/k_08.png" },
      { id:"k9", text:'Mio papà (<span class="has-tooltip" tabindex="0" title="работать" data-tooltip="работать">lavorare</span>) {{0}} in banca.', answer:"lavora", hint:"Кто обозначен словами «mio papà»? Какую форму настоящего времени выбирают для этого лица?", img:"img/k_09.png" },
      { id:"k10", text:'La domenica noi (<span class="has-tooltip" tabindex="0" title="спать" data-tooltip="спать">dormire</span>) {{0}} fino a mezzogiorno.', answer:"dormiamo", hint:"Какое местоимение соответствует «noi»? Какие особенности окончания инфинитива помогут выбрать форму?", img:"img/k_10.png" },
      { id:"k11", text:'Tu (<span class="has-tooltip" tabindex="0" title="предпочитать" data-tooltip="предпочитать">preferire</span>) {{0}} il caffè o il tè?', answer:"preferisci", hint:"К кому обращён вопрос? Найди местоимение и подумай, какой вид окончания соответствует этому лицу.", img:"img/k_11.png" },
      { id:"k12", text:'Noi di solito (<span class="has-tooltip" tabindex="0" title="покупать" data-tooltip="покупать">comprare</span>) {{0}} il latte al mercato.', answer:"compriamo", hint:"Какое выражение показывает привычное действие? Кто выполняет его и какие подсказки даёт местоимение «noi»?", img:"img/k_12.png" },
      { id:"k13", text:'Tu (<span class="has-tooltip" tabindex="0" title="знать / быть знакомым" data-tooltip="знать / быть знакомым">conoscere</span>) {{0}} mio fratello?', answer:"conosci", hint:"К кому обращён вопрос с «tu»? Сравни глагол в скобках и окончание, необходимое для этого лица.", img:"img/k_13.png" },
      { id:"k14", text:'I tuoi amici (<span class="has-tooltip" tabindex="0" title="читать" data-tooltip="читать">leggere</span>) {{0}} un libro in russo.', answer:"leggono", hint:"Слова «i tuoi amici» обозначают одного человека или группу? Как изменится форма глагола для такого подлежащего?", img:"img/k_14.png" },
      { id:"k15", text:'Tu (<span class="has-tooltip" tabindex="0" title="учиться" data-tooltip="учиться">studiare</span>) {{0}} molto all’università?', answer:"studi", hint:"К кому обращён вопрос? Подумай, как глагол на -are меняется в форме для «tu».", img:"img/k_15.png" },
      { id:"k16", text:'La maestra (<span class="has-tooltip" tabindex="0" title="преподавать / учить" data-tooltip="преподавать / учить">insegnare</span>) {{0}} ai bambini a leggere e scrivere.', answer:"insegna", hint:"Кто выполняет действие: один человек или группа? Найди подлежащее и соотнеси его с окончанием глагола.", img:"img/k_16.png" },
      { id:"k17", text:'La classe (<span class="has-tooltip" tabindex="0" title="слушать" data-tooltip="слушать">ascoltare</span>) {{0}} con attenzione il professore.', answer:"ascolta", hint:"Слово «la classe» грамматически единственного или множественного числа? Какую форму подсказывает артикль?", img:"img/k_17.png" },
      { id:"k18", text:'I miei nonni (<span class="has-tooltip" tabindex="0" title="жить / проживать" data-tooltip="жить / проживать">abitare</span>) {{0}} in un appartamento in centro.', answer:"abitano", hint:"Какое местоимение можно поставить вместо «i miei nonni»? Какие признаки множественного числа заметны в глаголе?", img:"img/k_18.png" },
      { id:"k19", text:'Noi (<span class="has-tooltip" tabindex="0" title="учить / изучать" data-tooltip="учить / изучать">studiare</span>) {{0}} l’italiano con un bravo insegnante.', answer:"studiamo", hint:"Какое местоимение соответствует «noi»? Сравни его с формой глагола, которую уже встречал в похожих фразах.", img:"img/k_19.png" },
      { id:"k20", text:'Dopo la lezione io (<span class="has-tooltip" tabindex="0" title="смотреть" data-tooltip="смотреть">guardare</span>) {{0}} la televisione.', answer:"guardo", hint:"Кто говорит о себе после занятия? Какое местоимение подразумевается и какое окончание ему соответствует?", img:"img/k_20.png" }
    ];

    const sentences = items.map(item => {
      const parts = item.text.split(/(\{\{\d+\}\})/g).map(part => {
        const match = part.match(/^\{\{(\d+)\}\}$/);
        if (!match) return part;
        return {
          id: `${item.id}-${Number(match[1]) + 1}`,
          input: true,
          correct: [item.answer],
          placeholder: "…"
        };
      });
      parts.push(`<img class="sentence-illustration" src="${item.img}" alt="Illustrazione per la frase ${item.id.slice(1)}" loading="lazy">`);
      return { id:item.id, parts, hints:[item.hint], hintsLang:"ru" };
    });

    ParloInlineFillExercise.init({
      unitNumber: 2,
      exercisePath: "002_es_k",
      sentences
    });
  </script>
<script src="002_unit-nav.js?v=1"></script>
</body>
</html>
