<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 10 — I Vestiti e il Negozio (Esercizio H)</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #477755;
      --primary-light: #edf4ed;
      --primary-dark: #2f5739;
      --accent: #bd694d;
      --bg-main: #f5f1e7;
      --card-bg: #fffefa;
      --text: #292d28;
      --text-muted: #6b7069;
      --success: #278253;
      --success-bg: #e1f1e5;
      --border: #e7e5dc;
    }

    * { box-sizing: border-box; }
    :focus-visible { outline: 3px solid rgba(189, 105, 77, .55); outline-offset: 3px; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      color: var(--text);
      background:
        linear-gradient(rgba(250, 248, 241, .78), rgba(250, 248, 241, .78)),
        url("img/sfondo.jpg") center / cover fixed,
        radial-gradient(ellipse at 50% -12%, rgba(111, 151, 116, .18), transparent 42%),
        var(--bg-main);
    }

    .container { width: min(100%, 880px); margin: 0 auto; }
    .home-navigation { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }
    .home-navigation a {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 8px 16px;
      border: 1px solid #d8e5d8;
      border-radius: 10px;
      background: rgba(255, 254, 250, .94);
      color: var(--primary-dark);
      font-weight: 700;
      text-decoration: none;
    }
    .home-navigation a:hover { background: var(--primary-light); border-color: var(--primary); }

    .hero {
      margin: 8px 0 22px;
      padding: 28px 20px 26px;
      text-align: center;
      border: 1px solid rgba(71, 119, 85, .13);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 254, 250, .94), rgba(242, 247, 239, .91));
      box-shadow: 0 12px 32px rgba(43, 69, 46, .07);
    }
    .eyebrow {
      display: inline-block;
      margin-bottom: 10px;
      padding: 8px 15px;
      border-radius: 20px;
      background: #eaf1e8;
      color: var(--primary-dark);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    h1 {
      margin: 4px 0;
      color: var(--primary-dark);
      font-size: clamp(1.9rem, 5vw, 2.65rem);
      letter-spacing: -.04em;
      line-height: 1.12;
    }
    .hero-subtitle { margin: 6px 0 0; color: var(--text-muted); font-size: .95rem; }

    .instruction-box, .top-controls {
      margin-bottom: 24px;
      padding: 16px 20px;
      border: 1px solid #d8e5d8;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(43, 69, 46, .04);
    }
    .instruction-box { border-left: 5px solid var(--accent); }
    .instruction-title {
      margin-bottom: 6px;
      color: var(--accent);
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .instruction-text { font-size: .98rem; line-height: 1.5; }

    .example-box {
      background: var(--primary-light);
      border: 1px solid #d0e2d2;
      border-radius: 12px;
      padding: 12px 16px;
      margin-top: 10px;
      font-size: .92rem;
      color: var(--primary-dark);
    }
    .example-box strong { color: var(--primary-dark); }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px;
      background: rgba(255, 254, 250, .96);
    }
    .teacher-controls { display: flex; align-items: center; gap: 12px; }
    .teacher-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .88rem;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }
    .teacher-toggle input { accent-color: var(--primary); }
    button.reset-btn {
      display: none;
      padding: 6px 12px;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      background: #fff;
      color: #dc2626;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
    }
    button.reset-btn:hover { background: #fef2f2; }

    .card {
      position: relative;
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card-bg);
      box-shadow: 0 22px 60px rgba(43, 69, 46, .11);
    }
    .question-box { display: none; }
    .question-box.current-view { display: block; animation: fadeIn .25s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .number-title { font-weight: 800; font-size: 1.05rem; color: var(--primary-dark); }

    /* Frame Wordwall e Immagini */
    .wordwall-wrapper {
      width: 100%;
      max-width: 780px;
      aspect-ratio: 4 / 3;
      min-height: 380px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #fff;
      margin: 0 auto 16px;
    }
    .wordwall-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    textarea.answer-input {
      width: 100%;
      min-height: 110px;
      padding: 12px 14px;
      border: 1.5px solid #d4e1d5;
      border-radius: 12px;
      font: inherit;
      font-size: 1rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea.answer-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(71, 119, 85, .15);
    }
    textarea.answer-input:disabled {
      background: #f4f5f1;
      border-color: #dfe5dc;
      color: #4b554b;
      cursor: not-allowed;
    }

    .card-footer {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .nav-arrows { display: flex; justify-content: space-between; gap: 8px; width: 100%; }
    .btn-arrow {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #d8e5d8;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: .85rem;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-arrow:hover { background: #e2ede3; border-color: var(--primary); }
    .btn-arrow[hidden] { display: none; }
    .btn-arrow:disabled { opacity: .4; cursor: not-allowed; }
    .btn-token {
      min-height: 42px;
      background: var(--primary-dark);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: .88rem;
      cursor: pointer;
      transition: background .2s;
      flex-shrink: 0;
    }
    .btn-token:hover:not(:disabled) { background: var(--primary); }
    .btn-token:disabled { cursor: not-allowed; opacity: .65; }
    .btn-token.release { background: var(--accent); color: #fff; }

    @media (max-width: 520px) {
      body { padding: 16px 8px; }
      .card { padding: 18px 14px; border-radius: 20px; }
      .question-header { align-items: stretch; flex-direction: column; }
      .card-footer { flex-direction: column; align-items: stretch; }
      .nav-arrows { justify-content: space-between; }
      .btn-token { width: 100%; text-align: center; }
      .wordwall-wrapper { min-height: 320px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <nav class="home-navigation" aria-label="Navigazione principale">
      <a href="index.html">← Torna all’inizio</a>
      <a href="es_g.html">← Esercizio G</a>
    </nav>

    <header class="hero">
      <span class="eyebrow">Unità 10 · Vocabolario e Negozio</span>
      <h1>I Vestiti e il Dialogo in Negozio</h1>
      <p class="hero-subtitle">Esercizi H1, H2 e H3</p>
    </header>

    <div class="top-controls">
      <div class="teacher-controls">
        <label class="teacher-toggle">
          <input type="checkbox" id="teacher-mode">
          Режим учителя · Modalità insegnante
        </label>
      </div>
      <button id="reset" class="reset-btn" type="button">⚠️ Сбросить ответы · Azzera risposte</button>
    </div>

    <section class="card">
      <div id="questions-container"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-group-scope.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    // Struttura delle 3 parti dell'Esercizio H
    const exerciseParts = [
      {
        id: "h1",
        title: "Esercizio H1 · I Vestiti",
        ruInstruction: "👉 <strong>Посмотрите на картинку и выберите правильное название одежды из предложенных вариантов:</strong>",
        type: "wordwall",
        embedUrl: "https://wordwall.net/it/embed/8e903b2115014e029d53ad041083f1e6?themeId=1&templateId=5&fontStackId=0"
      },
      {
        id: "h2",
        title: "Esercizio H2 · Dialogo in negozio (Нет в наличии)",
        ruInstruction: "👉 <strong>Составьте диалог по картинке: Покупатель просит предмет в единственном числе, а продавец отвечает, что этого товара нет (во множественном числе).</strong>",
        example: "<strong>Esempio:</strong><br>— Buongiorno, avete una borsa rossa?<br>— Mi dispiace signora, non abbiamo borse rosse.",
        type: "dialogue_wordwall",
        embedUrl: "https://wordwall.net/it/embed/43ef04145f124eb095de0b690592802f?themeId=41&templateId=70&fontStackId=15"
      },
      {
        id: "h3",
        title: "Esercizio H3 · Dialogo dettagliato in negozio",
        ruInstruction: "👉 <strong>Составьте диалог: Покупатель просит вещь с картинки, а продавец уточняет цвет, материал и размер/номер.</strong>",
        example: "<strong>Esempio:</strong><br>— Avete un maglione?<br>— Di che colore?<br>— Un maglione verde.<br>— Di che tessuto?<br>— Di cotone.<br>— Di che taglia?<br>— Una M (emme) / Una 46.",
        type: "dialogue_wordwall",
        embedUrl: "https://wordwall.net/it/embed/78201ba1aff5471daa0a8cf5702f4c67?themeId=2&templateId=70&fontStackId=15"
      }
    ];

    const myClientId = "user_" + Math.random().toString(36).substring(2, 9);
    const container = document.getElementById("questions-container");
    const teacherToggle = document.getElementById("teacher-mode");
    const resetButton = document.getElementById("reset");

    let answersRef = null;
    let currentlyViewedTab = 0;
    let writersData = {};

    const questionBoxes = [];

    exerciseParts.forEach((partObj, idx) => {
      const row = document.createElement("div");
      row.className = "question-box";
      if (idx === 0) row.classList.add("current-view");

      // Header con Titolo e Pulsante Token
      const header = document.createElement("div");
      header.className = "question-header";

      const numberTitle = document.createElement("div");
      numberTitle.className = "number-title";
      numberTitle.textContent = partObj.title;

      const tokenBtn = document.createElement("button");
      tokenBtn.className = "btn-token";
      tokenBtn.type = "button";
      tokenBtn.textContent = "✋ Взять слово · Prendi la parola";
      tokenBtn.onclick = () => {
        if (answersRef) {
          const currentWriter = writersData[idx] || null;
          if (currentWriter === myClientId) {
            answersRef.child("writers").child(String(idx)).set(null);
          } else if (!currentWriter) {
            answersRef.child("writers").child(String(idx)).set(myClientId);
          }
        }
      };
      header.append(numberTitle, tokenBtn);

      // Box Istruzioni in Russo
      const instrBox = document.createElement("div");
      instrBox.className = "instruction-box";
      let instrHTML = `<div class="instruction-title">💡 Задание · ${partObj.title}</div>`;
      instrHTML += `<div class="instruction-text">${partObj.ruInstruction}</div>`;
      if (partObj.example) {
        instrHTML += `<div class="example-box">${partObj.example}</div>`;
      }
      instrBox.innerHTML = instrHTML;

      // Frame Iframe di Wordwall
      const wordwallFrame = document.createElement("div");
      wordwallFrame.className = "wordwall-wrapper";
      const iframe = document.createElement("iframe");
      iframe.src = partObj.embedUrl;
      iframe.allowAttribute = "fullscreen";
      wordwallFrame.appendChild(iframe);

      row.append(header, instrBox, wordwallFrame);

      // Area di testo per i dialoghi (solo per H2 ed H3)
      if (partObj.type.includes("dialogue")) {
        const input = document.createElement("textarea");
        input.className = "answer-input";
        input.rows = 4;
        input.placeholder = "Напишите диалог здесь · Scrivi il dialogo qui...";
        input.setAttribute("aria-label", `Risposta per ${partObj.title}`);
        input.addEventListener("input", () => {
          if (answersRef && currentlyViewedTab === idx && writersData[idx] === myClientId) {
            answersRef.child("responses").child(String(idx)).set(input.value);
          }
        });
        row.appendChild(input);
      }

      // Card Footer con navigazione
      const footer = document.createElement("div");
      footer.className = "card-footer";
      const arrows = document.createElement("div");
      arrows.className = "nav-arrows";

      const prevBtn = document.createElement("button");
      prevBtn.className = "btn-arrow";
      prevBtn.type = "button";
      prevBtn.textContent = "← Precedente";
      prevBtn.onclick = () => {
        if (currentlyViewedTab > 0) {
          currentlyViewedTab--;
          updateUIState();
        }
      };

      const nextBtn = document.createElement("button");
      nextBtn.className = "btn-arrow";
      nextBtn.type = "button";
      nextBtn.textContent = "Successiva →";
      nextBtn.onclick = () => {
        if (currentlyViewedTab < exerciseParts.length - 1) {
          currentlyViewedTab++;
          updateUIState();
        }
      };

      const indexLink = document.createElement("a");
      indexLink.className = "btn-arrow";
      indexLink.href = "es_i.html";
      indexLink.textContent = "Vai all’esercizio I →";
      indexLink.hidden = true;

      arrows.append(prevBtn, nextBtn, indexLink);
      footer.appendChild(arrows);
      row.appendChild(footer);

      container.appendChild(row);
      questionBoxes.push(row);
    });

    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target.closest("input, textarea, select, button, a, [tabindex]")) return;
      const direction = ["ArrowRight", "ArrowDown"].includes(event.key) ? 1
        : ["ArrowLeft", "ArrowUp"].includes(event.key) ? -1 : 0;
      if (!direction) return;
      event.preventDefault();
      currentlyViewedTab = Math.max(0, Math.min(exerciseParts.length - 1, currentlyViewedTab + direction));
      updateUIState();
    });

    teacherToggle.addEventListener("change", event => {
      resetButton.style.display = event.target.checked ? "inline-block" : "none";
    });

    function updateUIState() {
      questionBoxes.forEach((box, idx) => {
        const input = box.querySelector("textarea.answer-input");
        const tokenBtn = box.querySelector(".btn-token");
        const prevBtn = box.querySelector("button.btn-arrow");
        const nextBtn = box.querySelectorAll("button.btn-arrow")[1];
        const indexLink = box.querySelector("a.btn-arrow");

        box.classList.toggle("current-view", idx === currentlyViewedTab);
        const isLastSlide = idx === exerciseParts.length - 1;
        prevBtn.disabled = idx === 0;
        nextBtn.hidden = isLastSlide;
        nextBtn.disabled = isLastSlide;
        indexLink.hidden = !isLastSlide;

        const currentWriter = writersData[idx] || null;
        if (!currentWriter) {
          if (input) input.disabled = true;
          tokenBtn.textContent = "✋ Взять слово · Prendi la parola";
          tokenBtn.className = "btn-token";
          tokenBtn.disabled = false;
        } else if (currentWriter === myClientId) {
          if (input) input.disabled = false;
          tokenBtn.textContent = "✔ Сдать слово · Lascia la parola";
          tokenBtn.className = "btn-token release";
          tokenBtn.disabled = false;
        } else {
          if (input) input.disabled = true;
          tokenBtn.textContent = "🔒 Пишет одноклассник · Un compagno scrive";
          tokenBtn.className = "btn-token release";
          tokenBtn.disabled = true;
        }
      });
    }

    if (window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        answersRef = firebase.database().ref("esercizi/unita10-domande-h-embed");
        answersRef.on("value", snapshot => {
          const data = snapshot.val() || {};
          const responses = data.responses || {};
          writersData = data.writers || {};

          questionBoxes.forEach((box, idx) => {
            const input = box.querySelector("textarea.answer-input");
            if (input && writersData[idx] !== myClientId) {
              input.value = responses[idx] || "";
            }
          });
          updateUIState();
        });
      } catch (error) {
        console.error("Errore Firebase:", error);
      }
    }

    resetButton.addEventListener("click", () => {
      if (confirm("Сбросить все ответы? · Vuoi azzerare tutte le risposte?")) {
        if (answersRef) answersRef.set({ writers: {}, responses: {} });
      }
    });

    updateUIState();
  </script>
</body>
</html>
