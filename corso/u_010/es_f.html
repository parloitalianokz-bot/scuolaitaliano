<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unità 10 — Completa le frasi a schede</title>
  <style>
    :root {
      color-scheme: light;
      font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
      --primary: #477755;
      --primary-light: #edf4ed;
      --primary-dark: #2f5739;
      --accent: #bd694d;
      --bg-main: #f5f1e7;
      --card-bg: #fffefa;
      --text: #292d28;
      --text-muted: #6b7069;
      --success: #278253;
      --success-bg: #e1f1e5;
      --border: #e7e5dc;
    }

    * { box-sizing: border-box; }
    :focus-visible { outline: 3px solid rgba(189, 105, 77, .55); outline-offset: 3px; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 16px;
      color: var(--text);
      background:
        linear-gradient(rgba(250, 248, 241, .78), rgba(250, 248, 241, .78)),
        url("img/sfondo.jpg") center / cover fixed,
        radial-gradient(ellipse at 50% -12%, rgba(111, 151, 116, .18), transparent 42%),
        var(--bg-main);
    }

    .container { width: min(100%, 880px); margin: 0 auto; }
    .home-navigation { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 12px; }
    .home-navigation a {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 8px 16px;
      border: 1px solid #d8e5d8;
      border-radius: 10px;
      background: rgba(255, 254, 250, .94);
      color: var(--primary-dark);
      font-weight: 700;
      text-decoration: none;
    }
    .home-navigation a:hover { background: var(--primary-light); border-color: var(--primary); }

    .hero {
      margin: 8px 0 22px;
      padding: 28px 20px 26px;
      text-align: center;
      border: 1px solid rgba(71, 119, 85, .13);
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 254, 250, .94), rgba(242, 247, 239, .91));
      box-shadow: 0 12px 32px rgba(43, 69, 46, .07);
    }
    .eyebrow {
      display: inline-block;
      color: var(--primary-dark);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
      background: #eaf1e8;
      padding: 8px 15px;
      border-radius: 20px;
      margin-bottom: 10px;
    }
    h1 {
      margin: 4px 0;
      font-size: clamp(1.9rem, 5vw, 2.65rem);
      letter-spacing: -.04em;
      color: var(--primary-dark);
      line-height: 1.12;
    }
    .hero-subtitle {
      margin: 6px 0 0;
      color: var(--text-muted);
      font-size: .95rem;
    }

    .instruction-box, .top-controls {
      margin-bottom: 24px;
      padding: 16px 20px;
      border: 1px solid #d8e5d8;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(43, 69, 46, .04);
    }
    .instruction-box { border-left: 5px solid var(--accent); }
    .instruction-title {
      margin-bottom: 6px;
      color: var(--accent);
      font-size: .85rem;
      font-weight: 800;
      letter-spacing: .05em;
      text-transform: uppercase;
    }
    .instruction-text { font-size: .98rem; line-height: 1.5; }

    /* Barra controlli superiore (Insegnante & Reset) */
    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
      padding: 16px 20px;
      border: 1px solid #d8e5d8;
      border-radius: 16px;
      background: rgba(255, 254, 250, .96);
      box-shadow: 0 6px 18px rgba(43, 69, 46, .04);
    }
    .teacher-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .teacher-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .88rem;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
      user-select: none;
    }
    .teacher-toggle input { accent-color: var(--primary); }
    
    button.reset-btn {
      padding: 6px 12px;
      border: 1px solid #fca5a5;
      border-radius: 10px;
      background: #fff;
      color: #dc2626;
      font: inherit;
      font-size: .8rem;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }
    button.reset-btn:hover { background: #fef2f2; }

    /* Card della Frase Corrente */
    .card {
      padding: clamp(20px, 4vw, 32px);
      border: 1px solid var(--border);
      border-radius: 26px;
      background: var(--card-bg);
      box-shadow: 0 22px 60px rgba(43, 69, 46, .11);
      position: relative;
    }

    .phrase-box {
      display: none;
    }
    .phrase-box.current-view {
      display: block;
      animation: fadeIn .25s ease-in-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .phrase-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .phrase-header .btn-token { flex-shrink: 0; }
    .number-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Cornice Immagine 16:9 */
    .image-frame {
      width: 80%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: #f6f5ef;
      border: 1px solid var(--border);
      margin: 0 auto 18px;
      position: relative;
    }
    .image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      inset: 0;
      z-index: 2;
    }
    .image-fallback {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text-muted);
      font-size: .85rem;
      font-weight: 600;
    }
    .image-fallback span.icon { font-size: 1.8rem; }

    /* Testo Frase e Textarea */
    .phrase-content {
      font-size: 1.1rem;
      line-height: 1.6;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 14px;
    }
    textarea.answer-input {
      width: 100%;
      min-height: 60px;
      padding: 12px 14px;
      border: 1.5px solid #d4e1d5;
      border-radius: 12px;
      font: inherit;
      font-size: 1rem;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      background: #fff;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea.answer-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(71, 119, 85, .15);
    }
    textarea.answer-input:disabled {
      background: #f4f5f1;
      border-color: #dfe5dc;
      color: #4b554b;
      cursor: not-allowed;
    }

    /* Controlli Token e Frecce */
    .card-footer {
      margin-top: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--border);
      padding-top: 16px;
    }
    .nav-arrows {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }
    .btn-arrow {
      display: inline-flex;
      align-items: center;
      background: var(--primary-light);
      color: var(--primary-dark);
      border: 1px solid #d8e5d8;
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: .85rem;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-arrow:hover { background: #e2ede3; border-color: var(--primary); }
    .btn-arrow[hidden] { display: none; }
    .btn-arrow:disabled { opacity: .4; cursor: not-allowed; }

    .btn-token {
      min-height: 42px;
      background: var(--primary-dark);
      color: #fff;
      border: none;
      padding: 9px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: .88rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-token:hover:not(:disabled) { background: var(--primary); }
    .btn-token:disabled { cursor: not-allowed; opacity: .65; }
    .btn-token.release { background: var(--accent); color: #fff; }

    @media (max-width: 520px) {
      body { padding: 16px 8px; }
      .card { padding: 18px 14px; border-radius: 20px; }
      .phrase-header { align-items: stretch; flex-direction: column; }
      .card-footer { flex-direction: column; align-items: stretch; }
      .nav-arrows { justify-content: space-between; }
      .btn-token { width: 100%; text-align: center; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <main class="container">
    <nav class="home-navigation" aria-label="Navigazione principale">
      <a href="index.html">← Torna all’inizio</a>
      <a href="es_e.html">🎨 Esercizio sui colori</a>
    </nav>

    <header class="hero">
      <span class="eyebrow">Unità 10 · Vocabolario e Colori</span>
      <h1>Дополните фразы</h1>
      <p class="hero-subtitle">Completa le frasi osservando l'immagine</p>
    </header>

    <div class="instruction-box">
      <div class="instruction-title">💡 Задание · Esercizio</div>
      <div class="instruction-text">👉 <strong>Completa la frase in italiano osservando l’immagine. Prendi il turno per scrivere.</strong></div>
    </div>

    <!-- Barra Controlli Superiore (Modalità Insegnante e Reset) -->
    <div class="top-controls">
      <div class="teacher-controls">
        <label class="teacher-toggle">
          <input type="checkbox" id="teacher-mode">
          Режим учителя · Modalità insegnante
        </label>
      </div>
      <button id="reset" class="reset-btn" type="button">⚠️ Сбросить ответы · Azzera risposte</button>
    </div>

    <!-- Scheda interattiva: una frase alla volta -->
    <section class="card">
      <div id="phrases-container"></div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-group-scope.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "INSERISCI_API_KEY",
      authDomain: "esercizi-parlo-italiano.firebaseapp.com",
      databaseURL: "https://esercizi-parlo-italiano-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "esercizi-parlo-italiano",
      appId: "INSERISCI_APP_ID"
    };

    const phrases = [
      "Il latte è bianco, il caffè invece...",
      "La neve è bianca, anche lo zucchero...",
      "Le fragole sono rosse, i limoni invece...",
      "L’erba è verde, il cielo invece...",
      "I kiwi sono verdi, anche l’insalata...",
      "La carta è bianca, anche le nuvole...",
      "Il topo è piccolo, l’elefante invece...",
      "L’oro è giallo, anche le banane...",
      "I pomodori sono rossi, gli zucchini invece...",
      "Il marmo è bianco, il legno invece...",
      "Gli alberi in primavera sono verdi, in autunno invece...",
      "La macchina è piccola, la tua invece..."
    ];

    const myClientId = "user_" + Math.random().toString(36).substring(2, 9);

    const container = document.getElementById("phrases-container");
    const teacherToggle = document.getElementById("teacher-mode");
    const resetButton = document.getElementById("reset");

    let answersRef = null;
    let currentlyViewedTab = 0;
    let writersData = {};
    let isTeacher = false;

    const phraseBoxes = [];

    phrases.forEach((phraseText, idx) => {
      // Box della frase
      const row = document.createElement("div");
      row.className = "phrase-box";
      if (idx === 0) row.classList.add("current-view");

      const header = document.createElement("div");
      header.className = "phrase-header";

      const numTitle = document.createElement("div");
      numTitle.className = "number-title";
      numTitle.innerHTML = `<span>Frase ${idx + 1} di ${phrases.length}</span>`;

      const tokenBtn = document.createElement("button");
      tokenBtn.className = "btn-token";
      tokenBtn.type = "button";
      tokenBtn.textContent = "✋ Взять слово · Prendi la parola";
      tokenBtn.onclick = () => {
        if (answersRef) {
          const currentWriter = writersData[idx] || null;
          if (currentWriter === myClientId) {
            answersRef.child("writers").child(String(idx)).set(null);
          } else if (!currentWriter) {
            answersRef.child("writers").child(String(idx)).set(myClientId);
          }
        }
      };

      header.append(numTitle, tokenBtn);

      // Immagine 16:9
      const imgFrame = document.createElement("div");
      imgFrame.className = "image-frame";

      const fileName = `f${idx + 1}.jpeg`;
      const fallback = document.createElement("div");
      fallback.className = "image-fallback";
      fallback.innerHTML = `<span class="icon">🖼️</span><span>img/${fileName}</span>`;

      const img = document.createElement("img");
      img.src = `img/${fileName}`;
      img.alt = `Immagine ${idx + 1}`;
      img.onerror = () => { img.style.display = "none"; };

      imgFrame.append(fallback, img);

      const phraseDiv = document.createElement("div");
      phraseDiv.className = "phrase-content";
      phraseDiv.textContent = phraseText;

      const input = document.createElement("textarea");
      input.className = "answer-input";
      input.rows = 2;
      input.placeholder = "Напишите ответ · Scrivi la risposta";

      input.addEventListener("input", () => {
        if (answersRef && currentlyViewedTab === idx && writersData[idx] === myClientId) {
          answersRef.child("responses").child(String(idx)).set(input.value);
        }
      });

      // Footer con Frecce e Token indipendente per ogni scheda
      const footer = document.createElement("div");
      footer.className = "card-footer";

      const arrowsDiv = document.createElement("div");
      arrowsDiv.className = "nav-arrows";

      const prevBtn = document.createElement("button");
      prevBtn.className = "btn-arrow";
      prevBtn.type = "button";
      prevBtn.textContent = "← Precedente";
      prevBtn.onclick = () => {
        if (currentlyViewedTab > 0) {
          currentlyViewedTab--;
          updateUIState();
        }
      };

      const nextBtn = document.createElement("button");
      nextBtn.className = "btn-arrow";
      nextBtn.type = "button";
      nextBtn.textContent = "Successiva →";
      nextBtn.onclick = () => {
        if (currentlyViewedTab < phrases.length - 1) {
          currentlyViewedTab++;
          updateUIState();
        }
      };

      const exerciseGLink = document.createElement("a");
      exerciseGLink.className = "btn-arrow";
      exerciseGLink.href = "es_g.html";
      exerciseGLink.textContent = "Vai a esercizio G →";
      exerciseGLink.hidden = true;

      arrowsDiv.append(prevBtn, nextBtn, exerciseGLink);

      footer.append(arrowsDiv);
      row.append(header, imgFrame, phraseDiv, input, footer);
      container.appendChild(row);

      phraseBoxes.push(row);
    });

    document.addEventListener("keydown", event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target.closest("input, textarea, select, button, a, [tabindex]")) return;
      const direction = ["ArrowRight", "ArrowDown"].includes(event.key) ? 1
        : ["ArrowLeft", "ArrowUp"].includes(event.key) ? -1 : 0;
      if (!direction) return;
      event.preventDefault();
      currentlyViewedTab = Math.max(0, Math.min(phrases.length - 1, currentlyViewedTab + direction));
      updateUIState();
    });

    teacherToggle.addEventListener("change", (e) => {
      isTeacher = e.target.checked;
      resetButton.style.display = isTeacher ? "inline-block" : "none";
      updateUIState();
    });

    function updateUIState() {
      phraseBoxes.forEach((box, i) => {
        const input = box.querySelector("textarea.answer-input");
        const tokenBtn = box.querySelector(".btn-token");
        const prevBtn = box.querySelectorAll(".btn-arrow")[0];
        const nextBtn = box.querySelectorAll(".btn-arrow")[1];
        const exerciseGLink = box.querySelector("a.btn-arrow");

        // Scheda visualizzata
        if (i === currentlyViewedTab) {
          box.classList.add("current-view");
        } else {
          box.classList.remove("current-view");
        }

        const isLastSlide = i === phrases.length - 1;
        prevBtn.disabled = (i === 0);
        nextBtn.hidden = isLastSlide;
        nextBtn.disabled = isLastSlide;
        exerciseGLink.hidden = !isLastSlide;

        const cardWriter = writersData[i] || null;

        if (!cardWriter) {
          input.disabled = true;
          tokenBtn.textContent = "✋ Взять слово · Prendi la parola";
          tokenBtn.className = "btn-token";
          tokenBtn.disabled = false;
        } else if (cardWriter === myClientId) {
          input.disabled = false;
          tokenBtn.textContent = "✔ Сдать слово · Lascia la parola";
          tokenBtn.className = "btn-token release";
          tokenBtn.disabled = false;
        } else {
          input.disabled = true;
          tokenBtn.textContent = "🔒 Пишет одноклассник · Un compagno scrive";
          tokenBtn.className = "btn-token release";
          tokenBtn.disabled = true;
        }
      });
    }

    if (window.firebase) {
      try {
        firebase.initializeApp(firebaseConfig);
        answersRef = firebase.database().ref("esercizi/unita10-completa-immagini-schede-libere");

        answersRef.on("value", (snapshot) => {
          const data = snapshot.val() || {};
          const responses = data.responses || {};
          writersData = data.writers || {};

          phraseBoxes.forEach((box, qIdx) => {
            const input = box.querySelector("textarea.answer-input");
            const val = responses[qIdx] || "";
            if (writersData[qIdx] !== myClientId) {
              input.value = val;
            }
          });

          updateUIState();
        });
      } catch (e) {
        console.error("Errore Firebase:", e);
      }
    }

    resetButton.addEventListener("click", () => {
      if (confirm("Сбросить все ответы? · Vuoi azzerare tutte le risposte?")) {
        answersRef.set({
          writers: {},
          responses: {}
        });
      }
    });
  </script>
</body>
</html>
