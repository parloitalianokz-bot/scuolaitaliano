<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Completa le frasi con le preposizioni, Unità 14." />
  <title>Unità 14 — Il nuovo direttore · Esercizio C</title>
  <link rel="stylesheet" href="../shared/theme.css?v=2" />
  <link rel="stylesheet" href="fondo.css" />
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px 16px;
      color: var(--text);
    }
    .container { width: min(100%, 880px); margin: 0 auto; }
    .hero {
      margin: 8px 0 22px; padding: 28px 20px 26px; text-align: center;
      border: 1px solid rgba(71, 119, 85, .13); border-radius: 24px;
      background: linear-gradient(135deg, rgba(255, 254, 250, .94), rgba(242, 247, 239, .91));
      box-shadow: 0 12px 32px rgba(43, 69, 46, .07);
    }
    .eyebrow {
      display: inline-block; margin-bottom: 10px; padding: 8px 15px; border-radius: 20px;
      background: #eaf1e8; color: var(--primary-dark); font-size: .78rem; font-weight: 800;
      letter-spacing: .09em; text-transform: uppercase;
    }
    h1 { margin: 4px 0; color: var(--primary-dark); font-size: clamp(1.9rem, 5vw, 2.65rem); letter-spacing: -.04em; line-height: 1.12; }
    .hero-subtitle { margin: 8px 0 0; color: var(--text-muted); font-size: .98rem; }
    .instruction-box {
      margin-bottom: 20px; padding: 16px 20px; border: 1px solid #d8e5d8;
      border-left: 5px solid var(--accent); border-radius: 16px;
      background: rgba(255, 254, 250, .96); box-shadow: 0 6px 18px rgba(43, 69, 46, .04); line-height: 1.55;
    }
    .instruction-title { margin-bottom: 6px; color: var(--accent); font-size: .85rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
    .card { margin-bottom: 24px; padding: clamp(20px, 4vw, 32px); border: 1px solid var(--border); border-radius: 26px; background: var(--card-bg); box-shadow: 0 22px 60px rgba(43, 69, 46, .11); }
    .connection-banner { margin: 0 0 16px; padding: 11px 15px; border: 1px solid #f5c2c0; border-radius: 12px; background: #fde8e7; color: #991b1b; font-size: .9rem; font-weight: 700; }
    .connection-banner[hidden], .section-box[hidden] { display: none; }
    .overall-progress { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 7px; margin: 0 0 18px; }
    .progress-step { min-height: 40px; border: 1px solid #d8e5d8; border-radius: 9px; background: #fff; color: var(--primary-dark); font: inherit; font-weight: 800; cursor: pointer; }
    .progress-step:hover, .progress-step[aria-current="step"] { border-color: var(--primary); background: var(--primary-light); }
    .progress-step.done { border-color: #9ac9a5; background: var(--success-bg); color: var(--success); }
    .section-box { display: flex; flex-direction: column; gap: 16px; padding: clamp(16px, 4vw, 24px); border: 1px solid var(--border); border-radius: 20px; background: linear-gradient(145deg, #fffefa, #f2f7ef); }
    .section-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid #eef2ee; }
    .section-title { display: flex; align-items: center; gap: 11px; color: var(--primary-dark); font-weight: 800; }
    .number { display: inline-grid; flex: 0 0 34px; width: 34px; height: 34px; place-items: center; border-radius: 10px; background: var(--primary); color: #fff; }
    .turn-pill { padding: 5px 12px; border: 1px solid #dce6dc; border-radius: 999px; background: #f7faf7; color: var(--primary-dark); font-size: .82rem; font-weight: 700; }
    .turn-pill.is-me { border-color: var(--accent); background: #fff3ed; color: #9c4a30; }
    .turn-assignment-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; padding: 12px 14px; border: 1px solid #d5e2d5; border-radius: 14px; background: #f3f8f3; }
    .turn-assignment-bar[hidden] { display: none; }
    .turn-assignment-bar label { color: var(--primary-dark); font-size: .85rem; font-weight: 800; }
    .turn-assignment-bar select { flex: 1; min-width: 210px; min-height: 38px; padding: 6px 10px; border: 1.5px solid #c7d8c8; border-radius: 10px; background: #fff; color: var(--text); font: inherit; }
    .worksheet-card { display: flex; flex-direction: column; gap: 14px; padding: 16px; border: 1.5px solid #dce8dc; border-radius: 16px; background: #f8faf6; }
    .worksheet-card.active-turn { border-color: var(--accent); background: #fffdfb; box-shadow: 0 0 0 3px rgba(189, 105, 77, .12); }
    .worksheet-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .worksheet-label { color: var(--primary-dark); font-weight: 800; }
    .turn-hint-tag { color: var(--text-muted); font-size: .84rem; }
    .accent-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
    .accent-toolbar::before { content: "Caratteri:"; margin-right: 3px; color: var(--text-muted); font-size: .78rem; font-weight: 700; }
    .accent-toolbar button { min-width: 32px; min-height: 32px; padding: 4px 7px; border: 1px solid #d4e1d5; border-radius: 8px; background: #fff; color: var(--primary-dark); font: inherit; font-weight: 700; cursor: pointer; }
    .accent-toolbar button:disabled { opacity: .45; cursor: not-allowed; }
    .sentence-content { display: block; margin: 0; color: var(--primary-dark); font-size: clamp(1.05rem, 2.8vw, 1.22rem); font-weight: 700; line-height: 2.2; }
    .blank-wrap { display: inline-flex; align-items: center; vertical-align: middle; }
    .blank-input { width: clamp(84px, 13vw, 130px); min-height: 42px; margin: 0 4px; padding: 6px 8px; border: 1.5px solid #d4e1d5; border-radius: 9px; background: #fff; color: var(--text); font: inherit; font-size: .9em; text-align: center; }
    .blank-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(71, 119, 85, .15); }
    .blank-input:disabled { background: #f1f4f0; color: #5f6863; cursor: not-allowed; }
    .blank-mark { display: none; }
    .hints-box, .teacher-hint { padding: 12px 14px; border-left: 4px solid var(--accent); border-radius: 10px; background: #fff8f2; line-height: 1.5; }
    .hints-box summary, .teacher-hint summary { color: var(--primary-dark); font-weight: 800; cursor: pointer; }
    .hints-list { margin: 8px 0 0; padding-left: 22px; color: var(--text); }
    .actions-row { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; }
    .btn-check { min-height: 42px; padding: 9px 16px; border: 0; border-radius: 10px; background: var(--primary); color: #fff; font: inherit; font-weight: 800; cursor: pointer; }
    .btn-check:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-check:disabled { cursor: not-allowed; opacity: .5; }
    .sync-feedback { color: var(--text-muted); font-size: .88rem; font-weight: 700; }
    .sync-feedback.saving { color: #9a6700; }
    .sync-feedback.saved { color: #17623c; }
    .sync-feedback.error { color: #991b1b; }
    .history-section { display: grid; gap: 10px; padding: 14px; border-radius: 12px; background: #f8f8f3; }
    .history-title { margin: 0; color: var(--primary-dark); font-size: .98rem; }
    .history-list { display: grid; gap: 8px; }
    .history-item { padding: 10px 12px; border: 1px solid var(--border); border-radius: 9px; background: #fff; }
    .history-meta { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 5px 12px; margin-bottom: 5px; color: var(--text-muted); font-size: .82rem; }
    .history-sentence { margin: 0; color: var(--text); line-height: 1.7; }
    .history-blank { font-weight: 800; }
    .history-blank.ok { color: var(--success); }
    .history-blank.err { color: var(--error); }
    .empty-message { margin: 0; color: var(--text-muted); font-size: .92rem; font-style: italic; }
    .slide-navigation { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
    .slide-navigation button, .slide-navigation a { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 8px 15px; border: 1px solid #d8e5d8; border-radius: 9px; background: #fff; color: var(--primary-dark); font: inherit; font-size: .9rem; font-weight: 700; cursor: pointer; text-decoration: none; }
    .slide-navigation button:disabled { cursor: not-allowed; opacity: .45; }
    .slide-navigation a[hidden] { display: none; }
    .slide-progress { color: var(--primary-dark); font-size: .95rem; font-weight: 800; text-align: center; }
    .progress-label { margin: 0 0 9px; color: var(--primary-dark); font-size: .9rem; font-weight: 800; }
    @media (max-width: 640px) {
      body { padding: 16px 8px; }
      .overall-progress { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
      .progress-step { min-height: 36px; }
      .slide-navigation { flex-wrap: wrap; }
      .slide-navigation > * { flex: 1; }
      .blank-input { width: clamp(72px, 21vw, 105px); margin: 0 2px; padding: 5px; }
      .turn-assignment-bar select { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="container">
    <div id="unit-navigation"></div>

    <header class="hero">
      <span class="eyebrow">Unità 14 · Grammatica</span>
      <h1>Il nuovo direttore</h1>
      <p class="hero-subtitle">Completa le frasi con le preposizioni corrette.</p>
    </header>

    <div class="instruction-box" lang="ru">
      <div class="instruction-title">💡 Задание · Esercizio C</div>
      👉 <strong>Вставьте подходящие предлоги:</strong><br />
      <span lang="it">Completa gli spazi e poi controlla le risposte.</span>
    </div>

    <section class="card" aria-label="Completa le frasi con le preposizioni">
      <div id="connection-banner" class="connection-banner" role="alert" aria-live="assertive" hidden></div>
      <p class="progress-label">Avanzamento · Seleziona una frase:</p>
      <nav id="exercise-progress" class="overall-progress" aria-label="Avanzamento delle frasi"></nav>
      <div id="questions-container"></div>
      <nav class="slide-navigation" aria-label="Navigazione delle frasi">
        <button id="previous-question" type="button">← Precedente</button>
        <span id="question-progress" class="slide-progress" aria-live="polite"></span>
        <button id="next-question" type="button">Successiva →</button>
        <a id="next-exercise" href="014_es_d.html" hidden>Vai all’esercizio D →</a>
      </nav>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="../shared/group-scope.js?v=4"></script>
  <script src="../shared/exercise-core.js?v=8"></script>
  <script src="../shared/exercise-modes.js?v=4"></script>
  <script src="unit-nav.js?v=2"></script>
  <script src="../shared/inline-fill-exercise.js?v=1"></script>
  <script>
    ParloInlineFillExercise.init({
      unitNumber: 14,
      exercisePath: "014_es_c",
      specialChars: ["'", "à", "è", "ì", "ò", "ù", "È"],
      sentences: [
        {
          id: "lavoro",
          parts: [
            "Marcello non lavora ", { id: "da", input: true, correct: "da" },
            " due anni, e ha bisogno ", { id: "di", input: true, correct: "di" }, " un lavoro."
          ]
        },
        {
          id: "appuntamento",
          parts: [
            "Marcello telefona ", { id: "alla-ditta", input: true, correct: "alla" },
            " ditta e prende un appuntamento ", { id: "con", input: true, correct: "con" },
            " il capo ", { id: "del", input: true, correct: "del" }, " personale."
          ]
        },
        {
          id: "colloquio",
          parts: [
            "Lui deve andare ", { id: "alla-ditta", input: true, correct: "alla" },
            " ditta il giorno dopo, ", { id: "per", input: true, correct: "per" }, " un colloquio."
          ]
        },
        {
          id: "festa",
          parts: [
            "La sera Marcello e i suoi amici vanno ", { id: "a", input: true, correct: "a" },
            " festeggiare ", { id: "al", input: true, correct: "al" }, " bar."
          ]
        },
        {
          id: "ritardo",
          parts: [
            "Il giorno dopo lui arriva all’appuntamento ", { id: "in", input: true, correct: "in" },
            " ritardo. Ha anche mal ", { id: "di", input: true, correct: "di" }, " testa."
          ]
        },
        {
          id: "domande",
          parts: [
            "Il capo del personale comincia ", { id: "a", input: true, correct: "a" }, " fare le domande."
          ]
        }
      ]
    });
  </script>
</body>
</html>
